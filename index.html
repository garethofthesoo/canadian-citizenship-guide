ves des pensionnats?"},"options":{"en":["1982","1998","2006","2008"],"fr":["1982","1998","2006","2008"]},"answer":3},{"type":"tf","q":{"en":"The federal government has never apologized for residential schools.","fr":"Le gouvernement fédéral ne s’est jamais excusé pour les pensionnats."},"answer":false}]},{"id":"who-010","topic":"aboriginal-today","importance":1,"en":"In today’s Canada, Aboriginal peoples enjoy renewed pride and confidence, and have made significant achievements in agriculture, the environment, business and the arts.","en_simple":"Today Aboriginal peoples have renewed pride and have achieved a lot in agriculture, the environment, business and the arts.","fr":"Dans le Canada d’aujourd’hui, les peuples autochtones retrouvent leur fierté et leur confiance, et ils ont à leur actif de grandes réalisations dans les domaines de l’agriculture, de l’environnement, des affaires et des arts.","tr":{"ar":"في كندا اليوم، تتمتع الشعوب الأصلية بفخر وثقة متجددين، وحققت إنجازات كبيرة في الزراعة والبيئة والأعمال والفنون."},"questions":[{"type":"tf","q":{"en":"Aboriginal peoples have made significant achievements in agriculture, the environment, business and the arts.","fr":"Les peuples autochtones ont à leur actif de grandes réalisations en agriculture, en environnement, en affaires et dans les arts."},"answer":true}]},{"id":"who-011","topic":"aboriginal-groups","importance":3,"en":"Today, the term Aboriginal peoples refers to three distinct groups: Indian (First Nations), Inuit and Métis.","en_simple":"“Aboriginal peoples” means 3 groups: First Nations (Indian), Inuit and Métis.","fr":"Aujourd’hui, le terme peuples autochtones désigne trois groupes distincts : les Indiens (Premières Nations), les Inuits et les Métis.","tr":{"ar":"اليوم، يشير مصطلح «الشعوب الأصلية» إلى ثلاث مجموعات متمايزة: الهنود (الأمم الأولى) والإنويت والميتيس."},"questions":[{"type":"mc","q":{"en":"What are the three distinct groups of Aboriginal peoples in Canada?","fr":"Quels sont les trois groupes distincts de peuples autochtones au Canada?"},"options":{"en":["Acadians, Quebecers and Métis","First Nations, Inuit and Métis","Inuit, Métis and Loyalists","First Nations, Acadians and Inuit"],"fr":["Les Acadiens, les Québécois et les Métis","Les Premières Nations, les Inuits et les Métis","Les Inuits, les Métis et les loyalistes","Les Premières Nations, les Acadiens et les Inuits"]},"answer":1},{"type":"tf","q":{"en":"The term Aboriginal peoples refers to three distinct groups.","fr":"Le terme peuples autochtones désigne trois groupes distincts."},"answer":true}]},{"id":"who-012","topic":"first-nations","importance":3,"en":"Indian refers to all Aboriginal people who are not Inuit or Métis. In the 1970s, the term First Nations began to be used.","en_simple":"“Indian” means all Aboriginal people who are not Inuit or Métis. Since the 1970s, the term “First Nations” is used.","fr":"Le mot indien désigne tous les peuples autochtones sauf les Inuits et les Métis. Depuis les années 1970, on appelle aussi ces peuples autochtones les Premières Nations.","tr":{"ar":"يشير مصطلح «هندي» إلى جميع أفراد الشعوب الأصلية الذين ليسوا من الإنويت أو الميتيس. وفي سبعينيات القرن العشرين بدأ استخدام مصطلح «الأمم الأولى» (First Nations)."},"questions":[{"type":"mc","q":{"en":"Who does the term “Indian” refer to?","fr":"À qui le mot « indien » fait-il référence?"},"options":{"en":["All Aboriginal people who are not Inuit or Métis","Only the Inuit","Only the Métis","All people born in Canada"],"fr":["Tous les peuples autochtones sauf les Inuits et les Métis","Seulement les Inuits","Seulement les Métis","Toutes les personnes nées au Canada"]},"answer":0},{"type":"mc","q":{"en":"In what decade did the term “First Nations” begin to be used?","fr":"Dans quelle décennie a-t-on commencé à utiliser le terme « Premières Nations »?"},"options":{"en":["The 1920s","The 1950s","The 1970s","The 1990s"],"fr":["Les années 1920","Les années 1950","Les années 1970","Les années 1990"]},"answer":2}]},{"id":"who-013","topic":"first-nations","importance":3,"en":"Today, about half of First Nations people live on reserve land in about 600 communities while the other half live off-reserve, mainly in urban centres.","en_simple":"About half of First Nations people live on reserves in about 600 communities. The other half live off-reserve, mostly in cities.","fr":"Aujourd’hui, près de la moitié des membres des Premières Nations vivent dans environ 600 communautés au sein de réserves, et l’autre moitié habite hors des réserves, surtout dans les centres urbains.","tr":{"ar":"اليوم، يعيش نحو نصف أفراد الأمم الأولى في أراضي المحميات في نحو 600 مجتمع، بينما يعيش النصف الآخر خارج المحميات، في المراكز الحضرية بشكل رئيسي."},"questions":[{"type":"mc","q":{"en":"About how many First Nations communities on reserve land are there?","fr":"Environ combien y a-t-il de communautés des Premières Nations au sein de réserves?"},"options":{"en":["About 60","About 600","About 6,000","About 60,000"],"fr":["Environ 60","Environ 600","Environ 6 000","Environ 60 000"]},"answer":1},{"type":"mc","q":{"en":"What proportion of First Nations people live on reserve land?","fr":"Quelle proportion des membres des Premières Nations vivent dans des réserves?"},"options":{"en":["About one quarter","About half","About three quarters","Almost all"],"fr":["Environ un quart","Environ la moitié","Environ les trois quarts","Presque tous"]},"answer":1}]},{"id":"who-014","topic":"inuit","importance":3,"en":"The Inuit, which means “the people” in the Inuktitut language, live in small, scattered communities across the Arctic. Their knowledge of the land, sea and wildlife enabled them to adapt to one of the harshest environments on earth.","en_simple":"“Inuit” means “the people” in Inuktitut. The Inuit live in small communities across the Arctic.","fr":"Les Inuits, terme signifiant « le peuple » en langue inuktitute, vivent dans de petites communautés réparties un peu partout dans l’Arctique. Leur connaissance de la terre, de la mer et de la faune sauvage leur a permis de s’adapter à l’un des milieux les plus arides de la planète.","tr":{"ar":"الإنويت (Inuit)، وتعني «الناس» بلغة الإنوكتيتوت، يعيشون في مجتمعات صغيرة متناثرة عبر القطب الشمالي. ومكّنتهم معرفتهم بالأرض والبحر والحياة البرية من التكيف مع واحدة من أقسى البيئات على وجه الأرض."},"questions":[{"type":"mc","q":{"en":"What does the word “Inuit” mean?","fr":"Que signifie le mot « Inuit »?"},"options":{"en":["“The hunters”","“The people”","“The north”","“The land”"],"fr":["« Les chasseurs »","« Le peuple »","« Le nord »","« La terre »"]},"answer":1},{"type":"mc","q":{"en":"In which language does “Inuit” mean “the people”?","fr":"Dans quelle langue le mot « Inuit » signifie-t-il « le peuple »?"},"options":{"en":["Michif","Cree","Inuktitut","Ojibwe"],"fr":["Le michif","Le cri","L’inuktitut","L’ojibwé"]},"answer":2},{"type":"mc","q":{"en":"Where do the Inuit live?","fr":"Où vivent les Inuits?"},"options":{"en":["In the Prairie provinces","In small, scattered communities across the Arctic","Mainly in Quebec","In the Maritime provinces"],"fr":["Dans les provinces des Prairies","Dans de petites communautés réparties dans l’Arctique","Surtout au Québec","Dans les provinces maritimes"]},"answer":1}]},{"id":"who-015","topic":"metis","importance":3,"en":"The Métis are a distinct people of mixed Aboriginal and European ancestry, the majority of whom live in the Prairie provinces. They come from both French- and English-speaking backgrounds and speak their own dialect, Michif.","en_simple":"The Métis have mixed Aboriginal and European ancestry. Most live in the Prairie provinces. Their own dialect is Michif.","fr":"Les Métis sont un peuple distinct qui se compose de personnes nées de l’union d’Autochtones et d’Européens. La plupart vivent dans les provinces des Prairies. Ils viennent de milieux à la fois francophones et anglophones et parlent leur propre dialecte, le michif.","tr":{"ar":"الميتيس (Métis) شعب متمايز من أصول مختلطة من الشعوب الأصلية والأوروبيين، ويعيش معظمهم في مقاطعات البراري. ينحدرون من خلفيات ناطقة بالفرنسية والإنجليزية ويتحدثون لهجتهم الخاصة، الميشيف (Michif)."},"questions":[{"type":"mc","q":{"en":"Who are the Métis?","fr":"Qui sont les Métis?"},"options":{"en":["A people of mixed Aboriginal and European ancestry","The people of the Arctic","Descendants of French colonists in the Maritimes","Descendants of black Loyalists"],"fr":["Un peuple né de l’union d’Autochtones et d’Européens","Les habitants de l’Arctique","Les descendants de colons français des Maritimes","Les descendants de loyalistes noirs"]},"answer":0},{"type":"mc","q":{"en":"What is the name of the dialect spoken by the Métis?","fr":"Comment s’appelle le dialecte parlé par les Métis?"},"options":{"en":["Inuktitut","Acadian","Michif","Gaelic"],"fr":["L’inuktitut","L’acadien","Le michif","Le gaélique"]},"answer":2},{"type":"mc","q":{"en":"Where do the majority of Métis live?","fr":"Où vit la majorité des Métis?"},"options":{"en":["In the Arctic","In Quebec","In the Maritime provinces","In the Prairie provinces"],"fr":["Dans l’Arctique","Au Québec","Dans les provinces maritimes","Dans les provinces des Prairies"]},"answer":3}]},{"id":"who-016","topic":"aboriginal-percentages","importance":3,"en":"About 65% of the Aboriginal people are First Nations, while 30% are Métis and 4% Inuit.","en_simple":"Aboriginal people: 65% First Nations, 30% Métis, 4% Inuit.","fr":"Environ 65 pour 100 des peuples autochtones sont des Premières Nations, 30 pour 100 des Métis et 4 pour 100, des Inuits.","tr":{"ar":"نحو 65% من الشعوب الأصلية هم من الأمم الأولى، و30% من الميتيس، و4% من الإنويت."},"questions":[{"type":"mc","q":{"en":"What percentage of Aboriginal people are First Nations?","fr":"Quel pourcentage des peuples autochtones sont des Premières Nations?"},"options":{"en":["4%","30%","50%","65%"],"fr":["4 pour 100","30 pour 100","50 pour 100","65 pour 100"]},"answer":3},{"type":"mc","q":{"en":"What percentage of Aboriginal people are Métis?","fr":"Quel pourcentage des peuples autochtones sont des Métis?"},"options":{"en":["4%","30%","65%","13%"],"fr":["4 pour 100","30 pour 100","65 pour 100","13 pour 100"]},"answer":1},{"type":"mc","q":{"en":"What percentage of Aboriginal people are Inuit?","fr":"Quel pourcentage des peuples autochtones sont des Inuits?"},"options":{"en":["4%","7%","30%","65%"],"fr":["4 pour 100","7 pour 100","30 pour 100","65 pour 100"]},"answer":0}]},{"id":"who-017","topic":"john-buchan","importance":2,"en":"John Buchan, the 1st Baron Tweedsmuir, was a popular Governor General of Canada (1935-40). Immigrant groups, he said, “should retain their individuality and each make its contribution to the national character.”","en_simple":"John Buchan (Lord Tweedsmuir) was Governor General from 1935 to 1940. He said immigrant groups should keep their individuality and each contribute to the national character.","fr":"John Buchan, premier baron Tweedsmuir, a été un gouverneur général du Canada très populaire (1935-1940). Il a déclaré que les communautés immigrantes devraient conserver leur individualité et contribuer chacune à leur façon à l’essence même de la nation.","tr":{"ar":"كان جون بوكان (John Buchan)، البارون الأول تويدزمور، حاكمًا عامًا شعبيًا لكندا (1935-1940). وقال إن جماعات المهاجرين «ينبغي أن تحتفظ بفرديتها وأن تقدم كل منها إسهامها في الطابع الوطني»."},"questions":[{"type":"mc","q":{"en":"Who was John Buchan, 1st Baron Tweedsmuir?","fr":"Qui était John Buchan, premier baron Tweedsmuir?"},"options":{"en":["A Prime Minister of Canada","A popular Governor General of Canada (1935-40)","A Métis leader","The founder of Quebec"],"fr":["Un premier ministre du Canada","Un gouverneur général du Canada très populaire (1935-1940)","Un chef métis","Le fondateur de Québec"]},"answer":1},{"type":"tf","q":{"en":"John Buchan said immigrant groups should give up their individuality to become Canadian.","fr":"John Buchan a déclaré que les communautés immigrantes devraient abandonner leur individualité pour devenir canadiennes."},"answer":false}]},{"id":"who-018","topic":"official-languages","importance":3,"en":"English and French define the reality of day-to-day life for most people and are the country’s official languages. The federal government is required by law to provide services throughout Canada in English and French.","en_simple":"Canada's 2 official languages are English and French. The federal government must provide services in both languages everywhere in Canada.","fr":"Le français et l’anglais définissent la réalité quotidienne de la plupart des gens et sont les deux langues officielles du Canada. Le gouvernement fédéral est tenu par la loi de fournir des services en français et en anglais partout au Canada.","tr":{"ar":"تحدد الإنجليزية والفرنسية واقع الحياة اليومية لمعظم الناس وهما اللغتان الرسميتان للبلاد. والحكومة الفيدرالية ملزمة قانونًا بتقديم الخدمات في جميع أنحاء كندا بالإنجليزية والفرنسية."},"questions":[{"type":"mc","q":{"en":"What are the two official languages of Canada?","fr":"Quelles sont les deux langues officielles du Canada?"},"options":{"en":["English and Inuktitut","French and Michif","English and French","English and Chinese"],"fr":["L’anglais et l’inuktitut","Le français et le michif","L’anglais et le français","L’anglais et le chinois"]},"answer":2},{"type":"tf","q":{"en":"The federal government is required by law to provide services throughout Canada in English and French.","fr":"Le gouvernement fédéral est tenu par la loi de fournir des services en français et en anglais partout au Canada."},"answer":true}]},{"id":"who-019","topic":"anglophones-francophones","importance":3,"en":"Today, there are 18 million Anglophones—people who speak English as a first language—and 7 million Francophones—people who speak French as their first language.","en_simple":"Canada has 18 million Anglophones (English as first language) and 7 million Francophones (French as first language).","fr":"Le Canada compte aujourd’hui 18 millions d’anglophones – personnes dont la langue maternelle est l’anglais – et 7 millions de francophones – personnes dont la langue maternelle est le français.","tr":{"ar":"اليوم، يوجد 18 مليون ناطق بالإنجليزية كلغة أولى (أنجلوفون) و7 ملايين ناطق بالفرنسية كلغة أولى (فرنكوفون)."},"questions":[{"type":"mc","q":{"en":"How many Anglophones are there in Canada?","fr":"Combien y a-t-il d’anglophones au Canada?"},"options":{"en":["7 million","18 million","1 million","30 million"],"fr":["7 millions","18 millions","1 million","30 millions"]},"answer":1},{"type":"mc","q":{"en":"How many Francophones are there in Canada?","fr":"Combien y a-t-il de francophones au Canada?"},"options":{"en":["18 million","1 million","7 million","8,500"],"fr":["18 millions","1 million","7 millions","8 500"]},"answer":2},{"type":"mc","q":{"en":"What is a Francophone?","fr":"Qu’est-ce qu’un francophone?"},"options":{"en":["A person born in France","A person who speaks French as a first language","A person who lives in Quebec","A descendant of Acadians"],"fr":["Une personne née en France","Une personne dont la langue maternelle est le français","Une personne qui vit au Québec","Un descendant des Acadiens"]},"answer":1}]},{"id":"who-020","topic":"francophones-outside-quebec","importance":3,"en":"While the majority of Francophones live in the province of Quebec, one million Francophones live in Ontario, New Brunswick and Manitoba, with a smaller presence in other provinces.","en_simple":"Most Francophones live in Quebec, but 1 million live in Ontario, New Brunswick and Manitoba.","fr":"Bien que la plupart des francophones vivent au Québec, un million de francophones vivent en Ontario, au Nouveau-Brunswick et au Manitoba. Les francophones sont aussi présents, mais de façon plus limitée, dans les autres provinces.","tr":{"ar":"بينما يعيش معظم الفرنكوفونيين في مقاطعة كيبيك، يعيش مليون فرنكوفوني في أونتاريو ونيو برونزويك ومانيتوبا، مع وجود أقل في المقاطعات الأخرى."},"questions":[{"type":"mc","q":{"en":"How many Francophones live in Ontario, New Brunswick and Manitoba?","fr":"Combien de francophones vivent en Ontario, au Nouveau-Brunswick et au Manitoba?"},"options":{"en":["100,000","One million","Seven million","18 million"],"fr":["100 000","Un million","Sept millions","18 millions"]},"answer":1},{"type":"mc","q":{"en":"In which province do the majority of Francophones live?","fr":"Dans quelle province vit la majorité des francophones?"},"options":{"en":["Ontario","New Brunswick","Manitoba","Quebec"],"fr":["L’Ontario","Le Nouveau-Brunswick","Le Manitoba","Le Québec"]},"answer":3}]},{"id":"who-021","topic":"new-brunswick-bilingual","importance":3,"en":"New Brunswick is the only officially bilingual province.","en_simple":"New Brunswick is the only officially bilingual province in Canada.","fr":"Le Nouveau-Brunswick est la seule province officiellement bilingue.","tr":{"ar":"نيو برونزويك (New Brunswick) هي المقاطعة الوحيدة ثنائية اللغة رسميًا."},"questions":[{"type":"mc","q":{"en":"Which is the only officially bilingual province in Canada?","fr":"Quelle est la seule province officiellement bilingue du Canada?"},"options":{"en":["Quebec","Ontario","New Brunswick","Manitoba"],"fr":["Le Québec","L’Ontario","Le Nouveau-Brunswick","Le Manitoba"]},"answer":2},{"type":"tf","q":{"en":"Quebec is the only officially bilingual province.","fr":"Le Québec est la seule province officiellement bilingue."},"answer":false}]},{"id":"who-022","topic":"acadians","importance":3,"en":"The Acadians are the descendants of French colonists who began settling in what are now the Maritime provinces in 1604.","en_simple":"The Acadians are descendants of French colonists who settled in the Maritime provinces starting in 1604.","fr":"Les Acadiens sont les descendants de colons français établis dès 1604 dans ce qu’on appelle aujourd’hui les Maritimes.","tr":{"ar":"الأكاديون (Acadians) هم أحفاد المستعمرين الفرنسيين الذين بدأوا الاستيطان فيما يُعرف الآن بالمقاطعات البحرية (الماريتايم) عام 1604."},"questions":[{"type":"mc","q":{"en":"Who are the Acadians?","fr":"Qui sont les Acadiens?"},"options":{"en":["Descendants of French colonists who settled in the Maritime provinces","A people of mixed Aboriginal and European ancestry","English-speaking people of Quebec","Descendants of black Loyalists"],"fr":["Les descendants de colons français établis dans les Maritimes","Un peuple né de l’union d’Autochtones et d’Européens","Les anglophones du Québec","Les descendants de loyalistes noirs"]},"answer":0},{"type":"mc","q":{"en":"In what year did French colonists begin settling in what are now the Maritime provinces?","fr":"En quelle année les colons français ont-ils commencé à s’établir dans ce qui est aujourd’hui les Maritimes?"},"options":{"en":["1534","1604","1755","1867"],"fr":["1534","1604","1755","1867"]},"answer":1}]},{"id":"who-023","topic":"great-upheaval","importance":3,"en":"Between 1755 and 1763, during the war between Britain and France, more than two-thirds of the Acadians were deported from their homeland. Despite this ordeal, known as the “Great Upheaval,” the Acadians survived and maintained their unique identity.","en_simple":"From 1755 to 1763, during the war between Britain and France, more than two-thirds of Acadians were deported. This is called the “Great Upheaval.”","fr":"De 1755 à 1763, pendant la guerre entre la Grande-Bretagne et la France, plus des deux tiers des Acadiens ont été déportés hors de leur patrie. En dépit de cette épreuve, appelée le « Grand Dérangement », les Acadiens ont survécu et maintenu leur identité propre.","tr":{"ar":"بين عامي 1755 و1763، أثناء الحرب بين بريطانيا وفرنسا، رُحِّل أكثر من ثلثي الأكاديين من وطنهم. ورغم هذه المحنة المعروفة باسم «الاضطراب الكبير» (Great Upheaval)، نجا الأكاديون وحافظوا على هويتهم الفريدة."},"questions":[{"type":"mc","q":{"en":"What is the “Great Upheaval”?","fr":"Qu’est-ce que le « Grand Dérangement »?"},"options":{"en":["The migration of Loyalists to Canada","The deportation of more than two-thirds of the Acadians between 1755 and 1763","The placing of Aboriginal children in residential schools","The 1837 rebellions"],"fr":["La migration des loyalistes vers le Canada","La déportation de plus des deux tiers des Acadiens entre 1755 et 1763","Le placement d’enfants autochtones dans des pensionnats","Les rébellions de 1837"]},"answer":1},{"type":"mc","q":{"en":"During which years were the Acadians deported from their homeland?","fr":"Pendant quelles années les Acadiens ont-ils été déportés de leur patrie?"},"options":{"en":["1604-1610","1755-1763","1763-1783","1812-1814"],"fr":["1604-1610","1755-1763","1763-1783","1812-1814"]},"answer":1},{"type":"tf","q":{"en":"More than two-thirds of the Acadians were deported during the war between Britain and France.","fr":"Plus des deux tiers des Acadiens ont été déportés pendant la guerre entre la Grande-Bretagne et la France."},"answer":true}]},{"id":"who-024","topic":"quebecers","importance":3,"en":"Quebecers are the people of Quebec, the vast majority French-speaking. Most are descendants of 8,500 French settlers from the 1600s and 1700s and maintain a unique identity, culture and language.","en_simple":"Quebecers are the people of Quebec, mostly French-speaking. Most descend from 8,500 French settlers of the 1600s and 1700s.","fr":"Les Québécois sont les habitants du Québec, en grande majorité francophones. La plupart sont les descendants de 8 500 immigrants français arrivés au cours des dix-septième et dix-huitième siècles et conservent une identité, une culture et une langue qui leur sont uniques.","tr":{"ar":"الكيبيكيون (Quebecers) هم سكان كيبيك، والغالبية العظمى منهم ناطقون بالفرنسية. ينحدر معظمهم من 8,500 مستوطن فرنسي من القرنين السابع عشر والثامن عشر، ويحافظون على هوية وثقافة ولغة فريدة."},"questions":[{"type":"mc","q":{"en":"Most Quebecers are descendants of how many French settlers from the 1600s and 1700s?","fr":"La plupart des Québécois sont les descendants de combien d’immigrants français arrivés aux dix-septième et dix-huitième siècles?"},"options":{"en":["850","8,500","85,000","1 million"],"fr":["850","8 500","85 000","1 million"]},"answer":1},{"type":"mc","q":{"en":"Who are Quebecers?","fr":"Qui sont les Québécois?"},"options":{"en":["Only French-born residents of Canada","The people of Quebec, the vast majority French-speaking","English-speaking Canadians in Ontario","Descendants of French colonists in the Maritimes"],"fr":["Seulement les résidents du Canada nés en France","Les habitants du Québec, en grande majorité francophones","Les Canadiens anglophones de l’Ontario","Les descendants de colons français des Maritimes"]},"answer":1}]},{"id":"who-025","topic":"quebecois-nation","importance":3,"en":"The House of Commons recognized in 2006 that the Quebecois form a nation within a united Canada.","en_simple":"In 2006, the House of Commons recognized that the Québécois form a nation within a united Canada.","fr":"En 2006, la Chambre des communes a reconnu que les Québécois forment une nation au sein d’un Canada uni.","tr":{"ar":"اعترف مجلس العموم عام 2006 بأن الكيبيكيين يشكّلون أمة داخل كندا موحّدة."},"questions":[{"type":"mc","q":{"en":"In what year did the House of Commons recognize that the Quebecois form a nation within a united Canada?","fr":"En quelle année la Chambre des communes a-t-elle reconnu que les Québécois forment une nation au sein d’un Canada uni?"},"options":{"en":["1982","1995","2006","2008"],"fr":["1982","1995","2006","2008"]},"answer":2},{"type":"mc","q":{"en":"Which body recognized that the Quebecois form a nation within a united Canada?","fr":"Quel organe a reconnu que les Québécois forment une nation au sein d’un Canada uni?"},"options":{"en":["The Supreme Court","The Senate","The Governor General","The House of Commons"],"fr":["La Cour suprême","Le Sénat","Le gouverneur général","La Chambre des communes"]},"answer":3}]},{"id":"who-026","topic":"anglo-quebecers","importance":2,"en":"One million Anglo-Quebecers have a heritage of 250 years and form a vibrant part of the Quebec fabric.","en_simple":"There are 1 million Anglo-Quebecers (English-speaking people in Quebec), with a 250-year heritage.","fr":"Un million d’Anglo-Québécois ont des origines remontant à 250 ans et forment un élément dynamique du tissu social québécois.","tr":{"ar":"يمتلك مليون كيبيكي ناطق بالإنجليزية (أنجلو-كيبيكي) تراثًا يمتد 250 عامًا ويشكّلون جزءًا حيويًا من نسيج كيبيك."},"questions":[{"type":"mc","q":{"en":"How many Anglo-Quebecers are there?","fr":"Combien y a-t-il d’Anglo-Québécois?"},"options":{"en":["100,000","One million","Seven million","18 million"],"fr":["100 000","Un million","Sept millions","18 millions"]},"answer":1},{"type":"mc","q":{"en":"Anglo-Quebecers have a heritage of how many years?","fr":"Les Anglo-Québécois ont des origines remontant à combien d’années?"},"options":{"en":["50 years","100 years","250 years","400 years"],"fr":["50 ans","100 ans","250 ans","400 ans"]},"answer":2}]},{"id":"who-027","topic":"english-canadians","importance":2,"en":"The basic way of life in English-speaking areas was established by hundreds of thousands of English, Welsh, Scottish and Irish settlers, soldiers and migrants from the 1600s to the 20th century. This helps explain why Anglophones (English speakers) are generally referred to as English Canadians.","en_simple":"English, Welsh, Scottish and Irish settlers built the way of life in English-speaking areas. That is why Anglophones are called English Canadians.","fr":"Le mode de vie dans les régions anglophones a été largement défini par des centaines de milliers de colons, de soldats et d’immigrants anglais, gallois, écossais et irlandais, arrivés entre le dix-septième siècle et le vingtième siècle. Cela explique en partie pourquoi on appelle généralement les anglophones (personnes parlant l’anglais) des Canadiens anglais.","tr":{"ar":"أرسى مئات الآلاف من المستوطنين والجنود والمهاجرين الإنجليز والويلزيين والاسكتلنديين والأيرلنديين، من القرن السابع عشر إلى القرن العشرين، نمط الحياة الأساسي في المناطق الناطقة بالإنجليزية. وهذا يفسر لماذا يُشار عمومًا إلى الناطقين بالإنجليزية (الأنجلوفون) باسم الكنديين الإنجليز."},"questions":[{"type":"mc","q":{"en":"Anglophones are generally referred to as…","fr":"On appelle généralement les anglophones…"},"options":{"en":["Acadians","English Canadians","Loyalists","Quebecers"],"fr":["des Acadiens","des Canadiens anglais","des loyalistes","des Québécois"]},"answer":1},{"type":"mc","q":{"en":"Which settlers established the basic way of life in English-speaking areas of Canada?","fr":"Quels colons ont défini le mode de vie dans les régions anglophones du Canada?"},"options":{"en":["German, Dutch and Scandinavian settlers","English, Welsh, Scottish and Irish settlers","French and Acadian settlers","Chinese and South Asian settlers"],"fr":["Des colons allemands, hollandais et scandinaves","Des colons anglais, gallois, écossais et irlandais","Des colons français et acadiens","Des colons chinois et sud-asiatiques"]},"answer":1}]},{"id":"who-028","topic":"becoming-canadian","importance":2,"en":"Some Canadians immigrate from places where they have experienced warfare or conflict. Such experiences do not justify bringing to Canada violent, extreme or hateful prejudices. In becoming Canadian, newcomers are expected to embrace democratic principles such as the rule of law.","en_simple":"Newcomers are expected to accept democratic principles like the rule of law. Past experience of war does not justify bringing violent or hateful prejudices to Canada.","fr":"Certains nouveaux Canadiens arrivent de régions ravagées par des affrontements ou des conflits armés. Quelles que soient ces expériences, elles ne peuvent aucunement justifier qu’ils transposent au Canada des préjugés violents, extrêmes ou haineux. On s’attend à ce que les nouveaux arrivants adoptent les principes démocratiques lorsqu’ils deviennent des citoyens canadiens, notamment la primauté du droit.","tr":{"ar":"يهاجر بعض الكنديين من أماكن عانوا فيها من الحرب أو النزاع. ولا تبرر هذه التجارب جلب تحيزات عنيفة أو متطرفة أو بغيضة إلى كندا. وعند التحول إلى كنديين، يُتوقع من الوافدين الجدد تبنّي المبادئ الديمقراطية مثل سيادة القانون."},"questions":[{"type":"mc","q":{"en":"In becoming Canadian, newcomers are expected to embrace democratic principles such as…","fr":"En devenant Canadiens, les nouveaux arrivants doivent adopter les principes démocratiques, notamment…"},"options":{"en":["the rule of law","military service","a single religion","speaking only English"],"fr":["la primauté du droit","le service militaire","une seule religion","l’usage exclusif de l’anglais"]},"answer":0},{"type":"tf","q":{"en":"Having experienced warfare justifies bringing violent or hateful prejudices to Canada.","fr":"Avoir vécu la guerre justifie de transposer au Canada des préjugés violents ou haineux."},"answer":false}]},{"id":"who-029","topic":"land-of-immigrants","importance":2,"en":"The majority of Canadians were born in this country and this has been true since the 1800s. However, Canada is often referred to as a land of immigrants because, over the past 200 years, millions of newcomers have helped to build and defend our way of life.","en_simple":"Most Canadians were born in Canada (true since the 1800s). But Canada is called a land of immigrants because millions of newcomers helped build it over 200 years.","fr":"Depuis les années 1800, la majorité des Canadiens sont nés au Canada. Toutefois, le Canada est souvent appelé une terre d’immigration du fait qu’au cours des deux siècles derniers, des millions de nouveaux arrivants ont contribué à construire et à défendre notre mode de vie.","tr":{"ar":"غالبية الكنديين وُلدوا في هذا البلد، وهذا صحيح منذ القرن التاسع عشر. ومع ذلك، كثيرًا ما توصف كندا بأنها أرض المهاجرين لأن ملايين الوافدين الجدد ساعدوا على مدى 200 عام في بناء أسلوب حياتنا والدفاع عنه."},"questions":[{"type":"tf","q":{"en":"The majority of Canadians were born in Canada.","fr":"La majorité des Canadiens sont nés au Canada."},"answer":true},{"type":"mc","q":{"en":"Why is Canada often referred to as a land of immigrants?","fr":"Pourquoi le Canada est-il souvent appelé une terre d’immigration?"},"options":{"en":["Because most Canadians were born abroad","Because over the past 200 years millions of newcomers have helped build and defend our way of life","Because immigration began only in the 1970s","Because Canada has no native-born population"],"fr":["Parce que la plupart des Canadiens sont nés à l’étranger","Parce qu’au cours des deux derniers siècles, des millions de nouveaux arrivants ont contribué à construire et à défendre notre mode de vie","Parce que l’immigration n’a commencé que dans les années 1970","Parce que le Canada n’a pas de population née au pays"]},"answer":1}]},{"id":"who-030","topic":"ethnic-groups","importance":3,"en":"The largest ethnic groups are the English, French, Scottish, Irish, German, Italian, Chinese, Aboriginal, Ukrainian, Dutch, South Asian and Scandinavian. Since the 1970s, most immigrants have come from Asian countries.","en_simple":"The largest ethnic groups: English, French, Scottish, Irish, German, Italian, Chinese, Aboriginal, Ukrainian, Dutch, South Asian, Scandinavian. Since the 1970s, most immigrants come from Asia.","fr":"Les principaux groupes sont les Anglais, les Français, les Écossais, les Irlandais, les Allemands, les Italiens, les Chinois, les Autochtones, les Ukrainiens, les Hollandais, les Sud-Asiatiques et les Scandinaves. Depuis les années 1970, la plupart des immigrants viennent des pays asiatiques.","tr":{"ar":"أكبر المجموعات العرقية هي الإنجليز والفرنسيون والاسكتلنديون والأيرلنديون والألمان والإيطاليون والصينيون والشعوب الأصلية والأوكرانيون والهولنديون وجنوب آسيا والإسكندنافيون. ومنذ سبعينيات القرن العشرين، جاء معظم المهاجرين من الدول الآسيوية."},"questions":[{"type":"mc","q":{"en":"Since the 1970s, most immigrants to Canada have come from…","fr":"Depuis les années 1970, la plupart des immigrants au Canada viennent…"},"options":{"en":["European countries","Asian countries","African countries","South American countries"],"fr":["de pays européens","de pays asiatiques","de pays africains","de pays sud-américains"]},"answer":1},{"type":"mc","q":{"en":"Which of the following is listed among the largest ethnic groups in Canada?","fr":"Lequel des groupes suivants figure parmi les principaux groupes ethniques du Canada?"},"options":{"en":["Ukrainian","Brazilian","Egyptian","Australian"],"fr":["Les Ukrainiens","Les Brésiliens","Les Égyptiens","Les Australiens"]},"answer":0},{"type":"tf","q":{"en":"The English and French are among the largest ethnic groups in Canada.","fr":"Les Anglais et les Français figurent parmi les principaux groupes ethniques du Canada."},"answer":true}]},{"id":"who-031","topic":"chinese-languages","importance":3,"en":"Chinese languages are the second most-spoken at home, after English, in two of Canada’s biggest cities. In Vancouver, 13% of the population speak Chinese languages at home; in Toronto, the number is 7%.","en_simple":"Chinese languages are the 2nd most spoken at home (after English) in Vancouver (13%) and Toronto (7%).","fr":"Les langues chinoises sont au deuxième rang de celles qui sont les plus parlées à la maison, après l’anglais, dans deux des plus grandes villes du Canada. À Vancouver, 13 pour 100 de la population parle l’une des langues chinoises à la maison, et 7 pour 100 à Toronto.","tr":{"ar":"اللغات الصينية هي ثاني أكثر اللغات تحدثًا في المنازل، بعد الإنجليزية، في اثنتين من أكبر مدن كندا. في فانكوفر، يتحدث 13% من السكان اللغات الصينية في المنزل؛ وفي تورونتو النسبة 7%."},"questions":[{"type":"mc","q":{"en":"After English, which languages are the second most-spoken at home in Vancouver and Toronto?","fr":"Après l’anglais, quelles langues sont les plus parlées à la maison à Vancouver et à Toronto?"},"options":{"en":["French","Chinese languages","Punjabi","Italian"],"fr":["Le français","Les langues chinoises","Le pendjabi","L’italien"]},"answer":1},{"type":"mc","q":{"en":"What percentage of Vancouver’s population speak Chinese languages at home?","fr":"Quel pourcentage de la population de Vancouver parle l’une des langues chinoises à la maison?"},"options":{"en":["4%","7%","13%","30%"],"fr":["4 pour 100","7 pour 100","13 pour 100","30 pour 100"]},"answer":2},{"type":"mc","q":{"en":"What percentage of Toronto’s population speak Chinese languages at home?","fr":"Quel pourcentage de la population de Toronto parle l’une des langues chinoises à la maison?"},"options":{"en":["7%","13%","18%","4%"],"fr":["7 pour 100","13 pour 100","18 pour 100","4 pour 100"]},"answer":0}]},{"id":"who-032","topic":"religion","importance":3,"en":"The great majority of Canadians identify as Christians. The largest religious affiliation is Catholic, followed by various Protestant churches. The numbers of Muslims, Jews, Hindus, Sikhs and members of other religions, as well as people who state “no religion” are also growing.","en_simple":"Most Canadians are Christian. The largest religion is Catholic, then Protestant. Muslims, Jews, Hindus, Sikhs and people with no religion are growing in number.","fr":"La grande majorité des Canadiens se disent chrétiens. Le groupe religieux qui compte le plus de fidèles est celui des catholiques. Il est suivi des Églises issues de la réforme protestante. Par ailleurs, le nombre de musulmans, de juifs, d’hindous, de sikhs et de membres d’autres religions ainsi que de personnes qui déclarent n’appartenir à aucune religion ne cesse d’augmenter.","tr":{"ar":"الغالبية العظمى من الكنديين يعرّفون أنفسهم بأنهم مسيحيون. أكبر انتماء ديني هو الكاثوليكية، تليها الكنائس البروتستانتية المختلفة. كما تتزايد أعداد المسلمين واليهود والهندوس والسيخ وأتباع الديانات الأخرى، وكذلك من يعلنون أنهم «بلا دين»."},"questions":[{"type":"mc","q":{"en":"What is the largest religious affiliation in Canada?","fr":"Quel est le groupe religieux qui compte le plus de fidèles au Canada?"},"options":{"en":["Protestant","Catholic","Muslim","Jewish"],"fr":["Protestant","Catholique","Musulman","Juif"]},"answer":1},{"type":"mc","q":{"en":"The largest religious affiliation in Canada is Catholic, followed by…","fr":"Le groupe religieux le plus nombreux au Canada est celui des catholiques, suivi…"},"options":{"en":["Hindu temples","Sikh gurdwaras","various Protestant churches","Muslim mosques"],"fr":["des temples hindous","des gurdwaras sikhs","des Églises protestantes","des mosquées musulmanes"]},"answer":2},{"type":"tf","q":{"en":"The great majority of Canadians identify as Christians.","fr":"La grande majorité des Canadiens se disent chrétiens."},"answer":true}]},{"id":"who-033","topic":"state-and-faith","importance":1,"en":"In Canada the state has traditionally partnered with faith communities to promote social welfare, harmony and mutual respect; to provide schools and health care; to resettle refugees; and to uphold religious freedom, religious expression and freedom of conscience.","en_simple":"The Canadian state has traditionally worked with faith communities to help society, provide schools and health care, resettle refugees, and protect religious freedom.","fr":"Au Canada, l’État s’est traditionnellement allié avec les communautés religieuses afin de promouvoir le bien-être social, l’harmonie et le respect mutuel, d’offrir un enseignement et des soins de santé, de réinstaller les réfugiés et de maintenir la liberté de religion, d’expression religieuse et de conscience.","tr":{"ar":"في كندا، تشاركت الدولة تقليديًا مع الجماعات الدينية لتعزيز الرفاه الاجتماعي والوئام والاحترام المتبادل؛ وتوفير المدارس والرعاية الصحية؛ وإعادة توطين اللاجئين؛ وصون الحرية الدينية والتعبير الديني وحرية الضمير."},"questions":[{"type":"tf","q":{"en":"In Canada, the state has traditionally partnered with faith communities to provide schools and health care and to resettle refugees.","fr":"Au Canada, l’État s’est traditionnellement allié avec les communautés religieuses pour offrir un enseignement et des soins de santé et pour réinstaller les réfugiés."},"answer":true}]},{"id":"who-034","topic":"gay-and-lesbian-canadians","importance":3,"en":"Canada’s diversity includes gay and lesbian Canadians, who enjoy the full protection of and equal treatment under the law, including access to civil marriage.","en_simple":"Gay and lesbian Canadians have full protection and equal treatment under the law, including civil marriage.","fr":"La diversité du Canada s’étend aux Canadiens gais et lesbiennes, qui bénéficient de l’entière protection de la loi et de l’égalité de traitement aux termes de celle-ci, y compris de l’accès au mariage civil.","tr":{"ar":"يشمل تنوع كندا الكنديين المثليين والمثليات، الذين يتمتعون بالحماية الكاملة والمعاملة المتساوية بموجب القانون، بما في ذلك الحق في الزواج المدني."},"questions":[{"type":"tf","q":{"en":"Gay and lesbian Canadians enjoy equal treatment under the law, including access to civil marriage.","fr":"Les Canadiens gais et lesbiennes bénéficient de l’égalité de traitement aux termes de la loi, y compris de l’accès au mariage civil."},"answer":true},{"type":"mc","q":{"en":"Which of the following is true about gay and lesbian Canadians?","fr":"Lequel des énoncés suivants est vrai au sujet des Canadiens gais et lesbiennes?"},"options":{"en":["They cannot marry in Canada","They enjoy full protection and equal treatment under the law, including access to civil marriage","They must live in certain provinces","They are not allowed to vote"],"fr":["Ils ne peuvent pas se marier au Canada","Ils bénéficient de l’entière protection de la loi et de l’égalité de traitement, y compris de l’accès au mariage civil","Ils doivent vivre dans certaines provinces","Ils n’ont pas le droit de voter"]},"answer":1}]},{"id":"who-035","topic":"multicultural-society","importance":2,"en":"Together, these diverse groups, sharing a common Canadian identity, make up today’s multicultural society.","en_simple":"All these diverse groups share a common Canadian identity and form today's multicultural society.","fr":"Ces groupes, qui ont en commun l’identité canadienne, forment la société multiculturelle d’aujourd’hui.","tr":{"ar":"معًا، تشكّل هذه المجموعات المتنوعة، التي تتشارك هوية كندية مشتركة، المجتمع متعدد الثقافات اليوم."},"questions":[{"type":"mc","q":{"en":"Diverse groups sharing a common Canadian identity make up today’s…","fr":"Les divers groupes qui ont en commun l’identité canadienne forment aujourd’hui…"},"options":{"en":["monarchy","multicultural society","federation","republic"],"fr":["la monarchie","la société multiculturelle","la fédération","la république"]},"answer":1}]},{"id":"who-036","topic":"black-loyalists","importance":2,"en":"Black Loyalists, escaped slaves and freed men and women of African origin, fled to Canada from America in the 1780s, where slavery remained legal until 1863.","en_simple":"Black Loyalists (escaped slaves and freed people of African origin) came to Canada from America in the 1780s. Slavery was legal in America until 1863.","fr":"Les loyalistes noirs, esclaves fugitifs ou affranchis d’origine africaine, sont arrivés au Canada dans les années 1780 après avoir fui les États-Unis, où l’esclavage ne fut aboli qu’en 1863.","tr":{"ar":"الموالون السود (Black Loyalists)، وهم عبيد هاربون ورجال ونساء محرَّرون من أصل أفريقي، فرّوا إلى كندا من أمريكا في ثمانينيات القرن الثامن عشر (1780s)، حيث ظل الرق قانونيًا هناك حتى عام 1863."},"questions":[{"type":"mc","q":{"en":"When did black Loyalists flee to Canada from America?","fr":"Quand les loyalistes noirs ont-ils fui les États-Unis pour le Canada?"},"options":{"en":["In the 1680s","In the 1780s","In the 1860s","In the 1980s"],"fr":["Dans les années 1680","Dans les années 1780","Dans les années 1860","Dans les années 1980"]},"answer":1},{"type":"mc","q":{"en":"Who were the black Loyalists?","fr":"Qui étaient les loyalistes noirs?"},"options":{"en":["French colonists in the Maritimes","Escaped slaves and freed men and women of African origin who fled to Canada from America","Settlers from Asia","Métis of the Prairie provinces"],"fr":["Des colons français des Maritimes","Des esclaves fugitifs et des affranchis d’origine africaine qui ont fui les États-Unis pour le Canada","Des colons venus d’Asie","Des Métis des Prairies"]},"answer":1}]}]},{"unit":"history1","order":3,"title":{"en":"History I: First Peoples to Responsible Government","fr":"Histoire I : des premiers peuples au gouvernement responsable"},"title_tr":{"ar":"التاريخ 1: من الشعوب الأولى إلى الحكومة المسؤولة"},"source":{"en":"07-canadas-history","fr":"07-histoire-du-canada"},"cards":[{"id":"history1-001","topic":"aboriginal-peoples","importance":2,"en":"When Europeans explored Canada they found all regions occupied by native peoples they called Indians, because the first explorers thought they had reached the East Indies. The native people lived off the land, some by hunting and gathering, others by raising crops.","en_simple":"Europeans called the native peoples \"Indians\" because the first explorers thought they had reached the East Indies. The native peoples lived off the land by hunting, gathering or farming.","fr":"Lorsque les Européens arrivent au Canada, ils constatent que toutes les régions sont habitées par des peuples autochtones, qu’ils appellent « Indiens », car les premiers explorateurs croyaient avoir atteint les Indes orientales. Ces peuples vivent de la terre, certains de la chasse et de la cueillette, d’autres, de l’agriculture.","tr":{"ar":"عندما استكشف الأوروبيون كندا وجدوا جميع المناطق مأهولة بشعوب أصلية أطلقوا عليها اسم «الهنود»، لأن المستكشفين الأوائل ظنوا أنهم وصلوا إلى جزر الهند الشرقية. عاشت الشعوب الأصلية من الأرض، بعضهم بالصيد وجمع الثمار، وآخرون بزراعة المحاصيل."},"questions":[{"type":"mc","q":{"en":"Why did the first European explorers call the native peoples “Indians”?","fr":"Pourquoi les premiers explorateurs européens ont-ils appelé les peuples autochtones « Indiens »?"},"options":{"en":["Because the natives came from India","Because the explorers thought they had reached the East Indies","Because of the Indian Act","Because the Vikings named them"],"fr":["Parce que les Autochtones venaient de l’Inde","Parce que les explorateurs croyaient avoir atteint les Indes orientales","À cause de la Loi sur les Indiens","Parce que les Vikings les ont nommés ainsi"]},"answer":1}]},{"id":"history1-002","topic":"aboriginal-peoples","importance":3,"en":"The Huron-Wendat of the Great Lakes region, like the Iroquois, were farmers and hunters. The Cree and Dene of the Northwest were hunter-gatherers.","en_simple":"Huron-Wendat (Great Lakes) and Iroquois = farmers and hunters. Cree and Dene (Northwest) = hunter-gatherers.","fr":"Les Hurons-Wendats de la région des Grands Lacs sont, comme les Iroquois, des agriculteurs et des chasseurs. Les Cris et les Dénés du Nord-Ouest sont des chasseurs-cueilleurs.","tr":{"ar":"كان الهورون-ويندات (Huron-Wendat) في منطقة البحيرات العظمى، مثل الإيروكوا (Iroquois)، مزارعين وصيادين. أما الكري (Cree) والدينيه (Dene) في الشمال الغربي فكانوا صيادين وجامعي ثمار."},"questions":[{"type":"mc","q":{"en":"Who were the farmers and hunters of the Great Lakes region?","fr":"Qui étaient les agriculteurs et chasseurs de la région des Grands Lacs?"},"options":{"en":["The Inuit","The Sioux","The Huron-Wendat","The Dene"],"fr":["Les Inuits","Les Sioux","Les Hurons-Wendats","Les Dénés"]},"answer":2},{"type":"mc","q":{"en":"The Cree and Dene of the Northwest were…","fr":"Les Cris et les Dénés du Nord-Ouest étaient…"},"options":{"en":["hunter-gatherers","farmers","fishermen who smoked fish","nomads following the bison"],"fr":["des chasseurs-cueilleurs","des agriculteurs","des pêcheurs qui fumaient le poisson","des nomades suivant les bisons"]},"answer":0},{"type":"tf","q":{"en":"Like the Iroquois, the Huron-Wendat were farmers and hunters.","fr":"Comme les Iroquois, les Hurons-Wendats étaient des agriculteurs et des chasseurs."},"answer":true}]},{"id":"history1-003","topic":"aboriginal-peoples","importance":3,"en":"The Sioux were nomadic, following the bison (buffalo) herd. The Inuit lived off Arctic wildlife.","en_simple":"The Sioux were nomads who followed the bison (buffalo). The Inuit lived off Arctic animals.","fr":"Les Sioux sont des nomades qui suivent les troupeaux de bisons. Les Inuits se nourrissent des animaux sauvages de l’Arctique.","tr":{"ar":"كان السيو (Sioux) رُحّلًا يتبعون قطعان البيسون (الجاموس). أما الإنويت (Inuit) فعاشوا على حيوانات القطب الشمالي البرية."},"questions":[{"type":"mc","q":{"en":"Which Aboriginal people were nomadic, following the bison herd?","fr":"Quel peuple autochtone était nomade et suivait les troupeaux de bisons?"},"options":{"en":["The Iroquois","The Sioux","The Inuit","The Huron-Wendat"],"fr":["Les Iroquois","Les Sioux","Les Inuits","Les Hurons-Wendats"]},"answer":1},{"type":"mc","q":{"en":"The Inuit lived off…","fr":"Les Inuits vivaient…"},"options":{"en":["crops raised in the Great Lakes region","the bison herd","Arctic wildlife","fish dried on the West Coast"],"fr":["des cultures de la région des Grands Lacs","des troupeaux de bisons","des animaux sauvages de l’Arctique","du poisson séché de la côte Ouest"]},"answer":2}]},{"id":"history1-004","topic":"aboriginal-peoples","importance":2,"en":"West Coast natives preserved fish by drying and smoking. Warfare was common among Aboriginal groups as they competed for land, resources and prestige.","en_simple":"West Coast natives kept fish by drying and smoking it. Aboriginal groups often fought each other for land, resources and prestige.","fr":"Les Autochtones de la côte Ouest font sécher et fumer le poisson pour le conserver. Les groupes autochtones se font souvent la guerre pour agrandir leur territoire, maîtriser les ressources et accroître leur prestige.","tr":{"ar":"حفظ سكان الساحل الغربي الأصليون السمك بالتجفيف والتدخين. وكانت الحروب شائعة بين الجماعات الأصلية إذ تنافست على الأرض والموارد والمكانة."},"questions":[{"type":"mc","q":{"en":"How did West Coast natives preserve fish?","fr":"Comment les Autochtones de la côte Ouest conservaient-ils le poisson?"},"options":{"en":["By freezing it","By salting it","By drying and smoking it","By pickling it"],"fr":["En le congelant","En le salant","En le faisant sécher et fumer","En le marinant"]},"answer":2},{"type":"tf","q":{"en":"Warfare was rare among Aboriginal groups before the Europeans arrived.","fr":"La guerre était rare entre les groupes autochtones avant l’arrivée des Européens."},"answer":false}]},{"id":"history1-005","topic":"aboriginal-peoples","importance":2,"en":"The arrival of European traders, missionaries, soldiers and colonists changed the native way of life forever. Large numbers of Aboriginals died of European diseases to which they lacked immunity. However, Aboriginals and Europeans formed strong economic, religious and military bonds in the first 200 years of coexistence which laid the foundations of Canada.","en_simple":"Many Aboriginal people died of European diseases because they had no immunity. But in the first 200 years, Aboriginals and Europeans formed strong economic, religious and military bonds that laid the foundations of Canada.","fr":"L’arrivée des négociants en fourrures, des missionnaires, des soldats et des colons européens modifie à jamais le mode de vie autochtone. Un grand nombre d’Autochtones meurent de maladies transmises par les Européens, contre lesquelles ils ne sont pas immunisés. Malgré tout, durant les 200 premières années de leur coexistence, Autochtones et Européens forment des liens économiques, religieux et militaires solides qui jettent les bases du Canada.","tr":{"ar":"غيّر وصول التجار والمبشرين والجنود والمستعمرين الأوروبيين أسلوب حياة السكان الأصليين إلى الأبد. مات أعداد كبيرة من السكان الأصليين بسبب أمراض أوروبية لم تكن لديهم مناعة ضدها. ومع ذلك، أقام السكان الأصليون والأوروبيون روابط اقتصادية ودينية وعسكرية قوية خلال أول 200 عام من التعايش، وهي روابط أرست أسس كندا."},"questions":[{"type":"mc","q":{"en":"Why did large numbers of Aboriginals die after the Europeans arrived?","fr":"Pourquoi un grand nombre d’Autochtones sont-ils morts après l’arrivée des Européens?"},"options":{"en":["Because of famine","Because of European diseases to which they lacked immunity","Because of wars with the Vikings","Because of the fur trade"],"fr":["À cause de la famine","À cause de maladies européennes contre lesquelles ils n’étaient pas immunisés","À cause de guerres avec les Vikings","À cause de la traite des fourrures"]},"answer":1},{"type":"tf","q":{"en":"Aboriginals and Europeans formed strong economic, religious and military bonds in the first 200 years of coexistence.","fr":"Durant les 200 premières années de leur coexistence, Autochtones et Européens ont formé des liens économiques, religieux et militaires solides."},"answer":true}]},{"id":"history1-006","topic":"first-europeans","importance":3,"en":"The Vikings from Iceland who colonized Greenland 1,000 years ago also reached Labrador and the island of Newfoundland. The remains of their settlement, l’Anse aux Meadows, are a World Heritage site.","en_simple":"The Vikings from Iceland reached Labrador and Newfoundland 1,000 years ago. Their settlement, l'Anse aux Meadows, is a World Heritage site.","fr":"Les Vikings d’Islande, qui ont colonisé le Groenland il y a 1 000 ans, ont aussi atteint le Labrador et l’île de Terre-Neuve. Les vestiges de leur établissement, l’Anse aux Meadows, sont un site du patrimoine mondial.","tr":{"ar":"وصل الفايكنغ القادمون من آيسلندا، الذين استعمروا غرينلاند قبل 1000 عام، إلى لابرادور وجزيرة نيوفاوندلاند أيضًا. وبقايا مستوطنتهم، لانس أو ميدوز (l’Anse aux Meadows)، موقع تراث عالمي."},"questions":[{"type":"mc","q":{"en":"Who reached Labrador and Newfoundland 1,000 years ago?","fr":"Qui a atteint le Labrador et Terre-Neuve il y a 1 000 ans?"},"options":{"en":["The Spanish","The Vikings from Iceland","The French","The Portuguese"],"fr":["Les Espagnols","Les Vikings d’Islande","Les Français","Les Portugais"]},"answer":1},{"type":"mc","q":{"en":"What is l’Anse aux Meadows?","fr":"Qu’est-ce que l’Anse aux Meadows?"},"options":{"en":["A French fortress at Québec","A Hudson’s Bay Company trading post","The remains of a Viking settlement, a World Heritage site","The site of the Battle of the Plains of Abraham"],"fr":["Une forteresse française à Québec","Un poste de traite de la Compagnie de la Baie d’Hudson","Les vestiges d’un établissement viking, site du patrimoine mondial","Le site de la bataille des plaines d’Abraham"]},"answer":2}]},{"id":"history1-007","topic":"first-europeans","importance":3,"en":"European exploration began in earnest in 1497 with the expedition of John Cabot, who was the first to draw a map of Canada’s East Coast. John Cabot, an Italian immigrant to England, set foot on Newfoundland or Cape Breton Island in 1497 and claimed the New Founde Land for England. English settlement did not begin until 1610.","en_simple":"In 1497, John Cabot (an Italian who lived in England) was the first to map Canada's East Coast. He claimed the land for England. English settlement began in 1610.","fr":"L’exploration européenne commence véritablement en 1497, avec l’expédition de Jean Cabot, le premier à dessiner une carte de la côte Est du Canada. Jean Cabot, Italien ayant immigré en Angleterre, est le premier à tracer la carte de la côte Atlantique du Canada. Il débarque à Terre-Neuve ou à l’île du Cap-Breton en 1497 et prend possession de cette nouvelle terre au nom de l’Angleterre. Les Anglais ne commencent à s’y établir qu’en 1610.","tr":{"ar":"بدأ الاستكشاف الأوروبي جديًا عام 1497 مع رحلة جون كابوت (John Cabot)، الذي كان أول من رسم خريطة للساحل الشرقي لكندا. كان جون كابوت مهاجرًا إيطاليًا إلى إنجلترا، ونزل في نيوفاوندلاند أو جزيرة كيب بريتون عام 1497 وادّعى «الأرض المكتشفة حديثًا» لصالح إنجلترا. ولم يبدأ الاستيطان الإنجليزي حتى عام 1610."},"questions":[{"type":"mc","q":{"en":"Who was the first to draw a map of Canada’s East Coast, in 1497?","fr":"Qui a été le premier à dessiner une carte de la côte Est du Canada, en 1497?"},"options":{"en":["Jacques Cartier","Samuel de Champlain","John Cabot","Pierre de Monts"],"fr":["Jacques Cartier","Samuel de Champlain","Jean Cabot","Pierre de Monts"]},"answer":2},{"type":"mc","q":{"en":"In what year did John Cabot’s expedition take place?","fr":"En quelle année a eu lieu l’expédition de Jean Cabot?"},"options":{"en":["1534","1497","1604","1608"],"fr":["1534","1497","1604","1608"]},"answer":1},{"type":"mc","q":{"en":"John Cabot claimed the New Founde Land for which country?","fr":"Jean Cabot a pris possession de la nouvelle terre au nom de quel pays?"},"options":{"en":["France","Italy","Spain","England"],"fr":["La France","L’Italie","L’Espagne","L’Angleterre"]},"answer":3}]},{"id":"history1-008","topic":"cartier","importance":3,"en":"Between 1534 and 1542, Jacques Cartier made three voyages across the Atlantic, claiming the land for King Francis I of France. Jacques Cartier was the first European to explore the St. Lawrence River and to set eyes on present-day Québec City and Montreal.","en_simple":"From 1534 to 1542, Jacques Cartier made 3 voyages and claimed the land for King Francis I of France. He was the first European to explore the St. Lawrence River.","fr":"De 1534 à 1542, Jacques Cartier traverse trois fois l’Atlantique, revendiquant des terres pour le roi de France, François Ier. Jacques Cartier est le premier Européen à explorer le fleuve Saint-Laurent et à voir les emplacements actuels de Québec et de Montréal.","tr":{"ar":"بين عامي 1534 و1542، قام جاك كارتييه (Jacques Cartier) بثلاث رحلات عبر الأطلسي، مدّعيًا الأرض للملك فرانسوا الأول (Francis I) ملك فرنسا. كان جاك كارتييه أول أوروبي يستكشف نهر سانت لورانس ويرى موقعي مدينة كيبيك ومونتريال الحاليين."},"questions":[{"type":"mc","q":{"en":"For which king did Jacques Cartier claim the land?","fr":"Au nom de quel roi Jacques Cartier a-t-il revendiqué les terres?"},"options":{"en":["King Charles II of England","King Francis I of France","King Louis XIV of France","King George III of England"],"fr":["Le roi Charles II d’Angleterre","Le roi François Ier de France","Le roi Louis XIV de France","Le roi George III d’Angleterre"]},"answer":1},{"type":"mc","q":{"en":"Between which years did Jacques Cartier make his three voyages across the Atlantic?","fr":"Entre quelles années Jacques Cartier a-t-il fait ses trois traversées de l’Atlantique?"},"options":{"en":["1497 and 1510","1604 and 1608","1534 and 1542","1670 and 1701"],"fr":["1497 et 1510","1604 et 1608","1534 et 1542","1670 et 1701"]},"answer":2},{"type":"tf","q":{"en":"Jacques Cartier was the first European to explore the St. Lawrence River.","fr":"Jacques Cartier a été le premier Européen à explorer le fleuve Saint-Laurent."},"answer":true}]},{"id":"history1-009","topic":"name-of-canada","importance":3,"en":"Cartier heard two captured guides speak the Iroquoian word kanata, meaning “village.” By the 1550s, the name of Canada began appearing on maps.","en_simple":"The name Canada comes from the Iroquoian word kanata, meaning \"village.\" By the 1550s, Canada appeared on maps.","fr":"Cartier entend deux guides qu’il a capturés prononcer le mot iroquois kanata, qui signifie « village ». Dès les années 1550, on voit apparaître le nom Canada sur les cartes.","tr":{"ar":"سمع كارتييه دليلين أسيرين ينطقان الكلمة الإيروكوية «كاناتا» (kanata) التي تعني «قرية». وبحلول خمسينيات القرن السادس عشر، بدأ اسم كندا يظهر على الخرائط."},"questions":[{"type":"mc","q":{"en":"What does the Iroquoian word kanata mean?","fr":"Que signifie le mot iroquois kanata?"},"options":{"en":["River","Village","Land","Fort"],"fr":["Rivière","Village","Terre","Fort"]},"answer":1},{"type":"mc","q":{"en":"By which decade did the name Canada begin appearing on maps?","fr":"À partir de quelle décennie le nom Canada apparaît-il sur les cartes?"},"options":{"en":["The 1490s","The 1600s","The 1550s","The 1790s"],"fr":["Les années 1490","Les années 1600","Les années 1550","Les années 1790"]},"answer":2}]},{"id":"history1-010","topic":"new-france","importance":3,"en":"In 1604, the first European settlement north of Florida was established by French explorers Pierre de Monts and Samuel de Champlain, first on St. Croix Island (in present-day Maine), then at Port-Royal, in Acadia (present-day Nova Scotia).","en_simple":"In 1604, Pierre de Monts and Samuel de Champlain built the first European settlement north of Florida: first on St. Croix Island (Maine), then at Port-Royal in Acadia (Nova Scotia).","fr":"En 1604, les explorateurs français Pierre de Monts et Samuel de Champlain fondent le premier établissement européen au nord de la Floride – premièrement à l’île Sainte-Croix (aujourd’hui dans le Maine), puis à Port-Royal, en Acadie (aujourd’hui en Nouvelle-Écosse).","tr":{"ar":"في عام 1604، أسس المستكشفان الفرنسيان بيير دو مون (Pierre de Monts) وصامويل دو شامبلان (Samuel de Champlain) أول مستوطنة أوروبية شمال فلوريدا، أولًا في جزيرة سانت كروا (في ولاية مين الحالية)، ثم في بور رويال (Port-Royal) في أكاديا (نوفا سكوشا الحالية)."},"questions":[{"type":"mc","q":{"en":"Who established the first European settlement north of Florida in 1604?","fr":"Qui a fondé le premier établissement européen au nord de la Floride en 1604?"},"options":{"en":["Pierre de Monts and Samuel de Champlain","John Cabot and Jacques Cartier","Jean Talon and Bishop Laval","Wolfe and Montcalm"],"fr":["Pierre de Monts et Samuel de Champlain","Jean Cabot et Jacques Cartier","Jean Talon et Monseigneur de Laval","Wolfe et Montcalm"]},"answer":0},{"type":"mc","q":{"en":"Port-Royal was located in…","fr":"Port-Royal se trouvait en…"},"options":{"en":["Upper Canada","Acadia (present-day Nova Scotia)","Newfoundland","Lower Canada"],"fr":["Haut-Canada","Acadie (aujourd’hui la Nouvelle-Écosse)","Terre-Neuve","Bas-Canada"]},"answer":1}]},{"id":"history1-011","topic":"new-france","importance":3,"en":"In 1608 Champlain built a fortress at what is now Québec City. The colonists struggled against a harsh climate.","en_simple":"In 1608, Champlain built a fortress where Québec City is today.","fr":"En 1608, Champlain bâtit une forteresse sur l’emplacement actuel de la ville de Québec. Les colons doivent résister au climat rigoureux.","tr":{"ar":"في عام 1608 بنى شامبلان حصنًا في موقع مدينة كيبيك الحالية. وكافح المستوطنون ضد المناخ القاسي."},"questions":[{"type":"mc","q":{"en":"In what year did Champlain build a fortress at what is now Québec City?","fr":"En quelle année Champlain a-t-il bâti une forteresse sur l’emplacement actuel de Québec?"},"options":{"en":["1604","1608","1670","1759"],"fr":["1604","1608","1670","1759"]},"answer":1},{"type":"tf","q":{"en":"Jacques Cartier built a fortress at what is now Québec City in 1608.","fr":"Jacques Cartier a bâti une forteresse sur l’emplacement actuel de Québec en 1608."},"answer":false}]},{"id":"history1-012","topic":"new-france","importance":3,"en":"Champlain allied the colony with the Algonquin, Montagnais, and Huron, historic enemies of the Iroquois, a confederation of five (later six) First Nations who battled with the French settlements for a century. The French and the Iroquois made peace in 1701.","en_simple":"Champlain made alliances with the Algonquin, Montagnais and Huron, who were enemies of the Iroquois. The Iroquois were a confederation of 5 (later 6) First Nations. The French and Iroquois made peace in 1701.","fr":"Grâce à Champlain, les colons se sont alliés aux Algonquins, aux Montagnais et aux Hurons, ennemis historiques des Iroquois; ces derniers ont formé une confédération de cinq, puis de six Premières Nations, qui s’est battue contre les Français pendant un siècle. Les Français et les Iroquois ont conclu la paix en 1701.","tr":{"ar":"حالف شامبلان المستعمرة مع الألغونكوين والمونتانييه والهورون، الأعداء التاريخيين للإيروكوا، وهم اتحاد من خمس (لاحقًا ست) أمم أولى حاربت المستوطنات الفرنسية لمدة قرن. وعقد الفرنسيون والإيروكوا السلام عام 1701."},"questions":[{"type":"mc","q":{"en":"With which peoples did Champlain ally the colony?","fr":"Avec quels peuples Champlain a-t-il allié la colonie?"},"options":{"en":["The Iroquois","The Algonquin, Montagnais and Huron","The Sioux and Cree","The Inuit"],"fr":["Les Iroquois","Les Algonquins, les Montagnais et les Hurons","Les Sioux et les Cris","Les Inuits"]},"answer":1},{"type":"mc","q":{"en":"In what year did the French and the Iroquois make peace?","fr":"En quelle année les Français et les Iroquois ont-ils conclu la paix?"},"options":{"en":["1608","1670","1701","1759"],"fr":["1608","1670","1701","1759"]},"answer":2},{"type":"mc","q":{"en":"The Iroquois were a confederation of how many First Nations?","fr":"Les Iroquois formaient une confédération de combien de Premières Nations?"},"options":{"en":["Two (later three)","Five (later six)","Ten (later twelve)","Three (later four)"],"fr":["Deux (puis trois)","Cinq (puis six)","Dix (puis douze)","Trois (puis quatre)"]},"answer":1}]},{"id":"history1-013","topic":"fur-trade","importance":3,"en":"The French and Aboriginal people collaborated in the vast fur-trade economy, driven by the demand for beaver pelts in Europe.","en_simple":"The French and Aboriginal people worked together in the fur trade. It was driven by the demand for beaver pelts in Europe.","fr":"Les Français et les Autochtones collaborent à l’important commerce de la traite des fourrures, stimulé par la forte demande pour les peaux de castor en Europe.","tr":{"ar":"تعاون الفرنسيون والسكان الأصليون في اقتصاد تجارة الفراء الواسع، الذي كان مدفوعًا بالطلب على جلود القندس في أوروبا."},"questions":[{"type":"mc","q":{"en":"What drove the fur-trade economy of New France?","fr":"Qu’est-ce qui stimulait l’économie de la traite des fourrures en Nouvelle-France?"},"options":{"en":["The demand for timber in Britain","The demand for beaver pelts in Europe","The demand for fish in Asia","The demand for gold in Spain"],"fr":["La demande de bois en Grande-Bretagne","La demande de peaux de castor en Europe","La demande de poisson en Asie","La demande d’or en Espagne"]},"answer":1}]},{"id":"history1-014","topic":"new-france","importance":2,"en":"Outstanding leaders like Jean Talon, Bishop Laval, and Count Frontenac built a French Empire in North America that reached from Hudson Bay to the Gulf of Mexico.","en_simple":"Jean Talon, Bishop Laval and Count Frontenac built a French Empire in North America from Hudson Bay to the Gulf of Mexico.","fr":"Des dirigeants exceptionnels, comme Jean Talon, Monseigneur de Laval et le comte de Frontenac, bâtissent en Amérique du Nord un empire français qui s’étend de la baie d’Hudson au golfe du Mexique.","tr":{"ar":"بنى قادة بارزون مثل جان تالون (Jean Talon) والأسقف لافال (Bishop Laval) والكونت فرونتناك (Count Frontenac) إمبراطورية فرنسية في أمريكا الشمالية امتدت من خليج هدسون إلى خليج المكسيك."},"questions":[{"type":"mc","q":{"en":"Which of the following built a French Empire in North America reaching from Hudson Bay to the Gulf of Mexico?","fr":"Lesquels des personnages suivants ont bâti un empire français en Amérique du Nord, de la baie d’Hudson au golfe du Mexique?"},"options":{"en":["Wolfe, Montcalm and Brock","Jean Talon, Bishop Laval and Count Frontenac","Cabot, Cartier and Champlain","La Fontaine, Baldwin and Howe"],"fr":["Wolfe, Montcalm et Brock","Jean Talon, Monseigneur de Laval et le comte de Frontenac","Cabot, Cartier et Champlain","La Fontaine, Baldwin et Howe"]},"answer":1},{"type":"tf","q":{"en":"The French Empire in North America reached from Hudson Bay to the Gulf of Mexico.","fr":"L’empire français en Amérique du Nord s’étendait de la baie d’Hudson au golfe du Mexique."},"answer":true}]},{"id":"history1-015","topic":"new-france","importance":2,"en":"Count Frontenac refused to surrender Quebec to the English in 1690, saying: “My only reply will be from the mouths of my cannons!”","en_simple":"In 1690, Count Frontenac refused to give Quebec to the English. He said: \"My only reply will be from the mouths of my cannons!\"","fr":"Le comte de Frontenac refuse de livrer Québec aux Anglais en 1690, déclarant : « Je n’ai point de réponse à faire à votre général que par la bouche de mes canons… »","tr":{"ar":"رفض الكونت فرونتناك تسليم كيبيك للإنجليز عام 1690 قائلًا: «ردّي الوحيد سيأتي من أفواه مدافعي!»"},"questions":[{"type":"mc","q":{"en":"Who refused to surrender Quebec to the English in 1690, saying “My only reply will be from the mouths of my cannons!”?","fr":"Qui a refusé de livrer Québec aux Anglais en 1690 en déclarant qu’il répondrait « par la bouche de mes canons »?"},"options":{"en":["Samuel de Champlain","The Marquis de Montcalm","Count Frontenac","Sieur d’Iberville"],"fr":["Samuel de Champlain","Le marquis de Montcalm","Le comte de Frontenac","Le sieur d’Iberville"]},"answer":2},{"type":"mc","q":{"en":"In what year did Count Frontenac refuse to surrender Quebec to the English?","fr":"En quelle année le comte de Frontenac a-t-il refusé de livrer Québec aux Anglais?"},"options":{"en":["1608","1690","1701","1759"],"fr":["1608","1690","1701","1759"]},"answer":1}]},{"id":"history1-016","topic":"new-france","importance":2,"en":"Pierre Le Moyne, Sieur d’Iberville, was a great hero of New France, winning many victories over the English, from James Bay in the north to Nevis in the Caribbean, in the late 17th and early 18th centuries.","en_simple":"Pierre Le Moyne, Sieur d'Iberville, was a hero of New France. He won many victories over the English, from James Bay to Nevis in the Caribbean.","fr":"Pierre Le Moyne, sieur d’Iberville, était un héros important de la Nouvelle-France; il a remporté de nombreuses victoires sur les Anglais, de la baie James au nord à Nevis dans les Caraïbes, à la fin du XVIIe siècle et au début du XVIIIe siècle.","tr":{"ar":"كان بيير لو موان، سيور ديبرفيل (Pierre Le Moyne, Sieur d’Iberville)، بطلًا عظيمًا لفرنسا الجديدة، إذ حقق انتصارات كثيرة على الإنجليز من خليج جيمس في الشمال إلى نيفيس في الكاريبي، في أواخر القرن السابع عشر وأوائل القرن الثامن عشر."},"questions":[{"type":"mc","q":{"en":"Who was Pierre Le Moyne, Sieur d’Iberville?","fr":"Qui était Pierre Le Moyne, sieur d’Iberville?"},"options":{"en":["A great hero of New France who won many victories over the English","The first Governor of Quebec","A Father of Confederation","The founder of the Hudson’s Bay Company"],"fr":["Un héros important de la Nouvelle-France qui a remporté de nombreuses victoires sur les Anglais","Le premier gouverneur du Québec","Un Père de la Confédération","Le fondateur de la Compagnie de la Baie d’Hudson"]},"answer":0}]},{"id":"history1-017","topic":"guy-carleton","importance":2,"en":"Sir Guy Carleton (Lord Dorchester), as Governor of Quebec, defended the rights of the Canadiens, defeated an American military invasion of Quebec in 1775, and supervised the Loyalist migration to Nova Scotia and Quebec in 1782-83.","en_simple":"Sir Guy Carleton (Lord Dorchester), Governor of Quebec, defended the Canadiens' rights, defeated an American invasion of Quebec in 1775, and supervised the Loyalist migration in 1782-83.","fr":"Sir Guy Carleton (lord Dorchester) a, en tant que gouverneur du Québec, défendu les droits des Canadiens, repoussé l’invasion américaine de Québec de 1775 et supervisé la migration des loyalistes vers la Nouvelle-Écosse et le Québec en 1782-1783.","tr":{"ar":"دافع السير غاي كارلتون (Sir Guy Carleton)، اللورد دورتشستر، بصفته حاكمًا لكيبيك، عن حقوق الكنديين الفرنسيين، وهزم غزوًا عسكريًا أمريكيًا لكيبيك عام 1775، وأشرف على هجرة الموالين إلى نوفا سكوشا وكيبيك في 1782-1783."},"questions":[{"type":"mc","q":{"en":"Which Governor of Quebec defeated an American military invasion of Quebec in 1775?","fr":"Quel gouverneur du Québec a repoussé l’invasion américaine de Québec en 1775?"},"options":{"en":["Lord Durham","Sir Guy Carleton (Lord Dorchester)","Lord Elgin","Sir Isaac Brock"],"fr":["Lord Durham","Sir Guy Carleton (lord Dorchester)","Lord Elgin","Sir Isaac Brock"]},"answer":1},{"type":"tf","q":{"en":"Sir Guy Carleton supervised the Loyalist migration to Nova Scotia and Quebec in 1782-83.","fr":"Sir Guy Carleton a supervisé la migration des loyalistes vers la Nouvelle-Écosse et le Québec en 1782-1783."},"answer":true}]},{"id":"history1-018","topic":"hudsons-bay-company","importance":3,"en":"In 1670, King Charles II of England granted the Hudson’s Bay Company exclusive trading rights over the watershed draining into Hudson Bay. For the next 100 years the Company competed with Montreal-based traders.","en_simple":"In 1670, King Charles II of England gave the Hudson's Bay Company exclusive trading rights over the land draining into Hudson Bay. For 100 years it competed with Montreal traders.","fr":"En 1670, le roi Charles II d’Angleterre accorde à la Compagnie de la Baie d’Hudson l’exclusivité du commerce dans le bassin hydrographique se déversant dans la baie d’Hudson. Durant les 100 années qui suivent, la Compagnie fait concurrence aux négociants établis à Montréal.","tr":{"ar":"في عام 1670، منح الملك تشارلز الثاني (King Charles II) ملك إنجلترا شركة خليج هدسون (Hudson’s Bay Company) حقوقًا تجارية حصرية على الحوض المائي الذي يصب في خليج هدسون. وعلى مدى 100 عام تالية، نافست الشركة التجار المتمركزين في مونتريال."},"questions":[{"type":"mc","q":{"en":"In what year was the Hudson’s Bay Company granted exclusive trading rights?","fr":"En quelle année la Compagnie de la Baie d’Hudson a-t-elle obtenu l’exclusivité du commerce?"},"options":{"en":["1608","1670","1701","1774"],"fr":["1608","1670","1701","1774"]},"answer":1},{"type":"mc","q":{"en":"Who granted the Hudson’s Bay Company its exclusive trading rights?","fr":"Qui a accordé à la Compagnie de la Baie d’Hudson l’exclusivité du commerce?"},"options":{"en":["King Francis I of France","Queen Victoria","King George III of England","King Charles II of England"],"fr":["Le roi François Ier de France","La reine Victoria","Le roi George III d’Angleterre","Le roi Charles II d’Angleterre"]},"answer":3},{"type":"tf","q":{"en":"For 100 years the Hudson’s Bay Company competed with Montreal-based traders.","fr":"Pendant 100 ans, la Compagnie de la Baie d’Hudson a fait concurrence aux négociants établis à Montréal."},"answer":true}]},{"id":"history1-019","topic":"voyageurs","importance":2,"en":"The skilled and courageous men who travelled by canoe were called voyageurs and coureurs des bois, and formed strong alliances with First Nations.","en_simple":"The brave men who travelled by canoe were called voyageurs and coureurs des bois. They formed strong alliances with First Nations.","fr":"Les hommes habiles et courageux qui se déplacent en canot, appelés voyageurs ou coureurs des bois, forment de solides alliances avec les Premières Nations.","tr":{"ar":"كان الرجال المهرة والشجعان الذين سافروا بالزوارق يُسمّون «الفوياجور» (voyageurs) و«كورور دي بوا» (coureurs des bois)، وأقاموا تحالفات قوية مع الأمم الأولى."},"questions":[{"type":"mc","q":{"en":"What were the skilled and courageous men who travelled by canoe in the fur trade called?","fr":"Comment appelait-on les hommes habiles et courageux qui se déplaçaient en canot pour la traite des fourrures?"},"options":{"en":["Habitants","Loyalists","Voyageurs and coureurs des bois","Métis"],"fr":["Habitants","Loyalistes","Voyageurs et coureurs des bois","Métis"]},"answer":2}]},{"id":"history1-020","topic":"plains-of-abraham","importance":3,"en":"In the 1700s France and Great Britain battled for control of North America. In 1759, the British defeated the French in the Battle of the Plains of Abraham at Québec City — marking the end of France’s empire in America. The commanders of both armies, Brigadier James Wolfe and the Marquis de Montcalm, were killed leading their troops in battle.","en_simple":"In 1759, the British defeated the French at the Battle of the Plains of Abraham in Québec City. This ended France's empire in America. Both commanders, Wolfe (British) and Montcalm (French), were killed.","fr":"Au dix-huitième siècle, la France et la Grande-Bretagne se font la guerre pour devenir maîtres de l’Amérique du Nord. En 1759, les Britanniques gagnent la bataille des plaines d’Abraham à Québec, marquant ainsi la fin de l’Empire français en Amérique. Les commandants des deux armées, le brigadier James Wolfe et le marquis de Montcalm, sont tués tandis qu’ils mènent leurs troupes au combat.","tr":{"ar":"في القرن الثامن عشر تقاتلت فرنسا وبريطانيا العظمى للسيطرة على أمريكا الشمالية. في عام 1759، هزم البريطانيون الفرنسيين في معركة سهول أبراهام (Plains of Abraham) في مدينة كيبيك، وهو ما شكّل نهاية الإمبراطورية الفرنسية في أمريكا. وقُتل قائدا الجيشين، البريغادير جيمس وولف (James Wolfe) والماركيز دو مونكالم (Marquis de Montcalm)، وهما يقودان قواتهما في المعركة."},"questions":[{"type":"mc","q":{"en":"In what year did the Battle of the Plains of Abraham take place?","fr":"En quelle année a eu lieu la bataille des plaines d’Abraham?"},"options":{"en":["1701","1759","1774","1812"],"fr":["1701","1759","1774","1812"]},"answer":1},{"type":"mc","q":{"en":"What did the Battle of the Plains of Abraham mark?","fr":"Que marque la bataille des plaines d’Abraham?"},"options":{"en":["The beginning of New France","The end of the War of 1812","The end of France’s empire in America","The start of Confederation"],"fr":["Le début de la Nouvelle-France","La fin de la guerre de 1812","La fin de l’Empire français en Amérique","Le début de la Confédération"]},"answer":2},{"type":"mc","q":{"en":"Who were the commanders killed at the Battle of the Plains of Abraham?","fr":"Quels commandants ont été tués à la bataille des plaines d’Abraham?"},"options":{"en":["Brock and Tecumseh","James Wolfe and the Marquis de Montcalm","Frontenac and d’Iberville","Carleton and Simcoe"],"fr":["Brock et Tecumseh","James Wolfe et le marquis de Montcalm","Frontenac et d’Iberville","Carleton et Simcoe"]},"answer":1}]},{"id":"history1-021","topic":"province-of-quebec","importance":2,"en":"Following the war, Great Britain renamed the colony the “Province of Quebec.” The French-speaking Catholic people, known as habitants or Canadiens, strove to preserve their way of life in the English-speaking, Protestant-ruled British Empire.","en_simple":"After the war, Britain renamed the colony the \"Province of Quebec.\" The French-speaking Catholics, called habitants or Canadiens, tried to keep their way of life inside the British Empire.","fr":"Après la guerre, la Grande-Bretagne donne à la colonie le nom de « Province de Québec ». Les francophones catholiques, appelés habitants ou Canadiens, cherchent à préserver leur mode de vie au sein de l’Empire britannique anglophone dirigé par des protestants.","tr":{"ar":"بعد الحرب، أعادت بريطانيا العظمى تسمية المستعمرة باسم «مقاطعة كيبيك». وسعى الكاثوليك الناطقون بالفرنسية، المعروفون باسم «الهابيتان» (habitants) أو «الكنديين» (Canadiens)، إلى الحفاظ على أسلوب حياتهم داخل الإمبراطورية البريطانية الناطقة بالإنجليزية والتي يحكمها البروتستانت."},"questions":[{"type":"mc","q":{"en":"What were the French-speaking Catholic people of the Province of Quebec known as?","fr":"Comment appelait-on les francophones catholiques de la Province de Québec?"},"options":{"en":["Loyalists","Habitants or Canadiens","Voyageurs","Acadians"],"fr":["Loyalistes","Habitants ou Canadiens","Voyageurs","Acadiens"]},"answer":1},{"type":"tf","q":{"en":"After the war, Great Britain renamed the colony the “Province of Quebec.”","fr":"Après la guerre, la Grande-Bretagne a donné à la colonie le nom de « Province de Québec »."},"answer":true}]},{"id":"history1-022","topic":"quebec-act","importance":3,"en":"To better govern the French Roman Catholic majority, the British Parliament passed the Quebec Act of 1774. One of the constitutional foundations of Canada, the Quebec Act allowed religious freedom for Catholics and permitted them to hold public office, a practice not then allowed in Britain. The Quebec Act restored French civil law while maintaining British criminal law.","en_simple":"The Quebec Act of 1774: gave Catholics religious freedom, let them hold public office (not allowed in Britain at the time), restored French civil law and kept British criminal law.","fr":"Afin de mieux administrer la majorité catholique romaine francophone, le Parlement britannique adopte l’Acte de Québec en 1774. L’un des fondements constitutionnels du Canada, l’Acte de Québec accorde la liberté religieuse aux catholiques et leur permet d’exercer des fonctions officielles, une pratique non autorisée en Grande-Bretagne à l’époque. L’Acte de Québec prévoit que les règles juridiques françaises seront de nouveau appliquées pour les affaires civiles, et que les règles juridiques anglaises continueront d’être appliquées pour les affaires criminelles.","tr":{"ar":"لحكم الأغلبية الكاثوليكية الفرنسية على نحو أفضل، أقرّ البرلمان البريطاني قانون كيبيك (Quebec Act) عام 1774. وقد سمح قانون كيبيك، وهو أحد الأسس الدستورية لكندا، بالحرية الدينية للكاثوليك وأجاز لهم تولي المناصب العامة، وهي ممارسة لم تكن مسموحة آنذاك في بريطانيا. وأعاد قانون كيبيك القانون المدني الفرنسي مع الإبقاء على القانون الجنائي البريطاني."},"questions":[{"type":"mc","q":{"en":"In what year did the British Parliament pass the Quebec Act?","fr":"En quelle année le Parlement britannique a-t-il adopté l’Acte de Québec?"},"options":{"en":["1759","1774","1791","1840"],"fr":["1759","1774","1791","1840"]},"answer":1},{"type":"mc","q":{"en":"What did the Quebec Act of 1774 do?","fr":"Qu’a fait l’Acte de Québec de 1774?"},"options":{"en":["Divided Quebec into Upper and Lower Canada","United Upper and Lower Canada","Allowed religious freedom for Catholics and restored French civil law","Abolished slavery in the Empire"],"fr":["Il a divisé le Québec en Haut-Canada et Bas-Canada","Il a uni le Haut-Canada et le Bas-Canada","Il a accordé la liberté religieuse aux catholiques et rétabli le droit civil français","Il a aboli l’esclavage dans l’Empire"]},"answer":2},{"type":"mc","q":{"en":"Under the Quebec Act, which legal systems applied in Quebec?","fr":"Selon l’Acte de Québec, quels systèmes juridiques s’appliquaient au Québec?"},"options":{"en":["French civil law and British criminal law","British ci
