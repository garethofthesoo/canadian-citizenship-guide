Aerospace Defence Command (NORAD).","en_simple":"Canada helped form NATO, a military alliance of Western democracies. Canada and the United States formed NORAD to defend North American airspace.","fr":"Le Canada s’unit à d’autres pays démocratiques de l’Occident pour former l’Organisation du traité de l’Atlantique Nord (OTAN), une alliance militaire, et aux États-Unis pour créer le Commandement de la défense aérospatiale de l’Amérique du Nord (NORAD).","tr":{"ar":"انضمت كندا إلى دول الغرب الديمقراطية الأخرى لتأسيس منظمة حلف شمال الأطلسي (NATO)، وهي تحالف عسكري، وانضمت مع الولايات المتحدة إلى قيادة الدفاع الجوي الفضائي لأمريكا الشمالية (NORAD)."},"questions":[{"type":"mc","q":{"en":"What is NATO?","fr":"Qu’est-ce que l’OTAN?"},"options":{"en":["A trade agreement","A military alliance of Western democratic countries","A French-speaking association","A UN peacekeeping mission"],"fr":["Un accord commercial","Une alliance militaire de pays démocratiques de l’Occident","Une association de pays francophones","Une mission de maintien de la paix de l’ONU"]},"answer":1},{"type":"mc","q":{"en":"With which country did Canada form NORAD?","fr":"Avec quel pays le Canada a-t-il créé le NORAD?"},"options":{"en":["The United Kingdom","France","The United States","Australia"],"fr":["Le Royaume-Uni","La France","Les États-Unis","L’Australie"]},"answer":2},{"type":"mc","q":{"en":"What does NORAD stand for?","fr":"Que signifie NORAD?"},"options":{"en":["North American Aerospace Defence Command","North Atlantic Research and Development","National Organization for Refugee Aid","Northern Railway Agreement of Dominion"],"fr":["Commandement de la défense aérospatiale de l’Amérique du Nord","Recherche et développement de l’Atlantique Nord","Organisation nationale d’aide aux réfugiés","Accord ferroviaire du Nord du Dominion"]},"answer":0}]},{"id":"modern-011","topic":"korean-war","importance":3,"en":"Canada joined international organizations such as the United Nations (UN). It participated in the UN operation defending South Korea in the Korean War (1950–53), with 500 dead and 1,000 wounded.","en_simple":"Canada joined the United Nations (UN). In the Korean War (1950–53), Canada helped the UN defend South Korea; 500 Canadians died and 1,000 were wounded.","fr":"Le Canada devient membre d’organisations internationales telles que l’Organisation des Nations Unies (ONU). Il participe à l’opération de l’ONU en vue de défendre la Corée du Sud dans la guerre de Corée (1950-1953), avec un bilan de 500 morts et de 1 000 blessés.","tr":{"ar":"انضمت كندا إلى منظمات دولية مثل الأمم المتحدة (UN). وشاركت في عملية الأمم المتحدة للدفاع عن كوريا الجنوبية في الحرب الكورية (1950–1953)، وبلغت خسائرها 500 قتيل و1,000 جريح."},"questions":[{"type":"mc","q":{"en":"When was the Korean War?","fr":"Quand a eu lieu la guerre de Corée?"},"options":{"en":["1939–45","1950–53","1956–60","1975–80"],"fr":["1939-1945","1950-1953","1956-1960","1975-1980"]},"answer":1},{"type":"mc","q":{"en":"How many Canadians died in the Korean War?","fr":"Combien de Canadiens sont morts pendant la guerre de Corée?"},"options":{"en":["500","1,000","37,000","60,000"],"fr":["500","1 000","37 000","60 000"]},"answer":0},{"type":"tf","q":{"en":"In the Korean War, Canada took part in a UN operation defending South Korea.","fr":"Pendant la guerre de Corée, le Canada a participé à une opération de l’ONU pour défendre la Corée du Sud."},"answer":true}]},{"id":"modern-012","topic":"peacekeeping","importance":3,"en":"Canada has taken part in numerous UN peacekeeping missions in places as varied as Egypt, Cyprus and Haiti, as well as in other international security operations such as those in the former Yugoslavia and Afghanistan.","en_simple":"Canada has done many UN peacekeeping missions, for example in Egypt, Cyprus and Haiti. It also joined security operations in the former Yugoslavia and Afghanistan.","fr":"Il prend aussi part à de nombreuses missions de maintien de la paix de l’ONU dans des pays aussi divers que l’Égypte, Chypre et Haïti, ainsi qu’à d’autres opérations internationales de sécurité, notamment en ex-Yougoslavie et en Afghanistan.","tr":{"ar":"شاركت كندا في العديد من بعثات حفظ السلام التابعة للأمم المتحدة في أماكن متنوعة مثل مصر وقبرص وهايتي، وكذلك في عمليات أمنية دولية أخرى كتلك التي جرت في يوغوسلافيا السابقة وأفغانستان."},"questions":[{"type":"mc","q":{"en":"Which of the following is a place where Canada took part in a UN peacekeeping mission?","fr":"Lequel des pays suivants est un endroit où le Canada a participé à une mission de maintien de la paix de l’ONU?"},"options":{"en":["Cyprus","Mexico","Japan","Brazil"],"fr":["Chypre","Le Mexique","Le Japon","Le Brésil"]},"answer":0},{"type":"mc","q":{"en":"Canada took part in international security operations in the former Yugoslavia and which other country?","fr":"Le Canada a participé à des opérations internationales de sécurité en ex-Yougoslavie et dans quel autre pays?"},"options":{"en":["Vietnam","Hungary","Afghanistan","Korea"],"fr":["Le Vietnam","La Hongrie","L’Afghanistan","La Corée"]},"answer":2}]},{"id":"modern-013","topic":"quiet-revolution","importance":3,"en":"Quebec experienced an era of rapid change in the 1960s known as the Quiet Revolution. Many Quebecers sought to separate from Canada.","en_simple":"In the 1960s, Quebec changed quickly. This time is called the Quiet Revolution. Many Quebecers wanted to separate from Canada.","fr":"Les années 1960 sont au Québec une époque de changements rapides appelée la « Révolution tranquille ». Beaucoup de Québécois cherchent à se séparer du Canada.","tr":{"ar":"شهدت كيبيك (Quebec) في الستينيات حقبة من التغيير السريع تُعرف بـ«الثورة الهادئة». وسعى كثير من سكان كيبيك إلى الانفصال عن كندا."},"questions":[{"type":"mc","q":{"en":"What was the Quiet Revolution?","fr":"Qu’est-ce que la Révolution tranquille?"},"options":{"en":["An era of rapid change in Quebec in the 1960s","A war between Canada and the United States","The discovery of oil in Alberta","The founding of the Group of Seven"],"fr":["Une époque de changements rapides au Québec dans les années 1960","Une guerre entre le Canada et les États-Unis","La découverte du pétrole en Alberta","La fondation du Groupe des sept"]},"answer":0},{"type":"mc","q":{"en":"In which decade did the Quiet Revolution take place?","fr":"Pendant quelle décennie la Révolution tranquille a-t-elle eu lieu?"},"options":{"en":["1940s","1950s","1960s","1980s"],"fr":["Années 1940","Années 1950","Années 1960","Années 1980"]},"answer":2}]},{"id":"modern-014","topic":"official-languages-act","importance":3,"en":"In 1963 Parliament established the Royal Commission on Bilingualism and Biculturalism. This led to the Official Languages Act (1969), which guarantees French and English services in the federal government across Canada.","en_simple":"In 1963, Parliament created the Royal Commission on Bilingualism and Biculturalism. This led to the Official Languages Act in 1969, which guarantees federal government services in French and English across Canada.","fr":"En 1963, le Parlement établit la Commission royale d’enquête sur le bilinguisme et le biculturalisme, qui aboutit à l’adoption de la Loi sur les langues officielles (1969), garantissant des services offerts en français et en anglais par le gouvernement fédéral partout au Canada.","tr":{"ar":"في عام 1963 أنشأ البرلمان اللجنة الملكية للثنائية اللغوية والثقافية. وأدى ذلك إلى قانون اللغات الرسمية (1969) الذي يضمن تقديم خدمات الحكومة الفيدرالية بالفرنسية والإنجليزية في جميع أنحاء كندا."},"questions":[{"type":"mc","q":{"en":"In what year was the Official Languages Act passed?","fr":"En quelle année la Loi sur les langues officielles a-t-elle été adoptée?"},"options":{"en":["1963","1969","1970","1982"],"fr":["1963","1969","1970","1982"]},"answer":1},{"type":"mc","q":{"en":"What does the Official Languages Act guarantee?","fr":"Que garantit la Loi sur les langues officielles?"},"options":{"en":["French and English services in the federal government across Canada","Free language classes for all immigrants","That every province is bilingual","That Quebec can separate from Canada"],"fr":["Des services en français et en anglais offerts par le gouvernement fédéral partout au Canada","Des cours de langue gratuits pour tous les immigrants","Que chaque province est bilingue","Que le Québec peut se séparer du Canada"]},"answer":0},{"type":"mc","q":{"en":"In what year did Parliament establish the Royal Commission on Bilingualism and Biculturalism?","fr":"En quelle année le Parlement a-t-il établi la Commission royale d’enquête sur le bilinguisme et le biculturalisme?"},"options":{"en":["1960","1963","1969","1970"],"fr":["1960","1963","1969","1970"]},"answer":1}]},{"id":"modern-015","topic":"francophonie","importance":3,"en":"In 1970, Canada helped found La Francophonie, an international association of French-speaking countries.","en_simple":"In 1970, Canada helped create La Francophonie, an international group of French-speaking countries.","fr":"En 1970, le Canada participe à la création de la Francophonie, une association internationale de pays francophones.","tr":{"ar":"في عام 1970 ساعدت كندا في تأسيس الفرنكوفونية (La Francophonie)، وهي رابطة دولية للدول الناطقة بالفرنسية."},"questions":[{"type":"mc","q":{"en":"What is La Francophonie?","fr":"Qu’est-ce que la Francophonie?"},"options":{"en":["A military alliance","An international association of French-speaking countries","A Quebec political party","A French-language television network"],"fr":["Une alliance militaire","Une association internationale de pays francophones","Un parti politique québécois","Un réseau de télévision en français"]},"answer":1},{"type":"mc","q":{"en":"In what year did Canada help found La Francophonie?","fr":"En quelle année le Canada a-t-il participé à la création de la Francophonie?"},"options":{"en":["1963","1969","1970","1980"],"fr":["1963","1969","1970","1980"]},"answer":2}]},{"id":"modern-016","topic":"quebec-referendums","importance":3,"en":"The movement for Quebec sovereignty gained strength but was defeated in a referendum in the province in 1980. Though sovereignty was again defeated in a second referendum in 1995, the autonomy of Quebec within Canada remains a lively topic.","en_simple":"Quebec voted on sovereignty (separation) in two referendums: 1980 and 1995. Both times, sovereignty was defeated.","fr":"Le mouvement pour la souveraineté du Québec prend de l’ampleur, mais il est défait lors d’un référendum organisé dans la province en 1980. Même si le mouvement pour la souveraineté est défait une fois de plus lors d’un second référendum en 1995, l’autonomie du Québec dans le Canada suscite encore des débats à l’heure actuelle.","tr":{"ar":"اكتسبت حركة سيادة كيبيك قوة لكنها هُزمت في استفتاء أُجري في المقاطعة عام 1980. ورغم هزيمة السيادة مجددًا في استفتاء ثانٍ عام 1995، لا يزال استقلال كيبيك الذاتي داخل كندا موضوعًا حيًا."},"questions":[{"type":"mc","q":{"en":"In which years were the two referendums on Quebec sovereignty held?","fr":"En quelles années ont eu lieu les deux référendums sur la souveraineté du Québec?"},"options":{"en":["1960 and 1970","1969 and 1982","1980 and 1995","1982 and 1999"],"fr":["1960 et 1970","1969 et 1982","1980 et 1995","1982 et 1999"]},"answer":2},{"type":"tf","q":{"en":"Quebec sovereignty was approved in the 1995 referendum.","fr":"La souveraineté du Québec a été approuvée lors du référendum de 1995."},"answer":false}]},{"id":"modern-017","topic":"constitution-1982","importance":3,"en":"After much negotiation, in 1982 the Constitution was amended without the agreement of Quebec.","en_simple":"In 1982, the Constitution was changed, but Quebec did not agree to it.","fr":"Après beaucoup de négociations, en 1982, la Constitution est modifiée sans l’accord du Québec.","tr":{"ar":"بعد مفاوضات كثيرة، عُدّل الدستور عام 1982 دون موافقة كيبيك."},"questions":[{"type":"mc","q":{"en":"In 1982, the Constitution was amended without the agreement of which province?","fr":"En 1982, la Constitution a été modifiée sans l’accord de quelle province?"},"options":{"en":["Ontario","Alberta","Quebec","Nova Scotia"],"fr":["L’Ontario","L’Alberta","Le Québec","La Nouvelle-Écosse"]},"answer":2},{"type":"mc","q":{"en":"In what year was the Constitution amended without Quebec’s agreement?","fr":"En quelle année la Constitution a-t-elle été modifiée sans l’accord du Québec?"},"options":{"en":["1969","1980","1982","1995"],"fr":["1969","1980","1982","1995"]},"answer":2}]},{"id":"modern-018","topic":"changing-society","importance":1,"en":"As social values changed over more than 50 years, Canada became a more flexible and open society. Many took advantage of expanding secondary and postsecondary educational opportunities and a growing number of women entered the professional work force.","en_simple":"Over 50 years, Canada became a more open society. More people got secondary and postsecondary education, and more women entered professional jobs.","fr":"Avec l’évolution des valeurs sociales pendant plus de cinquante ans, le Canada devient une société plus souple et plus ouverte. Beaucoup profitent de l’élargissement des possibilités d’études secondaires et postsecondaires, et de plus en plus de femmes deviennent des travailleuses professionnelles.","tr":{"ar":"مع تغيّر القيم الاجتماعية على مدى أكثر من 50 عامًا، أصبحت كندا مجتمعًا أكثر مرونة وانفتاحًا. واستفاد كثيرون من توسّع فرص التعليم الثانوي وما بعد الثانوي، ودخل عدد متزايد من النساء سوق العمل المهني."},"questions":[{"type":"tf","q":{"en":"As social values changed, a growing number of women entered the professional work force.","fr":"Avec l’évolution des valeurs sociales, de plus en plus de femmes sont devenues des travailleuses professionnelles."},"answer":true}]},{"id":"modern-019","topic":"japanese-canadians-vote","importance":3,"en":"Most Canadians of Asian descent had in the past been denied the vote in federal and provincial elections. In 1948 the last of these, the Japanese-Canadians, gained the right to vote.","en_simple":"In the past, most Asian Canadians could not vote. In 1948, Japanese-Canadians were the last group to get the right to vote.","fr":"La plupart des Canadiens d’origine asiatique s’étaient vu refuser dans le passé le droit de voter aux élections fédérales et provinciales, mais les derniers d’entre eux à ne pas posséder ce droit, les Canadiens d’origine japonaise, finissent par l’obtenir en 1948.","tr":{"ar":"كان معظم الكنديين من أصل آسيوي محرومين في الماضي من حق التصويت في الانتخابات الفيدرالية والإقليمية. وفي عام 1948 حصل آخر هؤلاء، وهم الكنديون اليابانيون، على حق التصويت."},"questions":[{"type":"mc","q":{"en":"In what year did Japanese-Canadians gain the right to vote?","fr":"En quelle année les Canadiens d’origine japonaise ont-ils obtenu le droit de vote?"},"options":{"en":["1918","1948","1960","1982"],"fr":["1918","1948","1960","1982"]},"answer":1},{"type":"mc","q":{"en":"Which group was the last of the Canadians of Asian descent to gain the right to vote?","fr":"Quel groupe de Canadiens d’origine asiatique a été le dernier à obtenir le droit de vote?"},"options":{"en":["Chinese-Canadians","Japanese-Canadians","Korean-Canadians","Indo-Canadians"],"fr":["Les Canadiens d’origine chinoise","Les Canadiens d’origine japonaise","Les Canadiens d’origine coréenne","Les Canadiens d’origine indienne"]},"answer":1}]},{"id":"modern-020","topic":"aboriginal-vote","importance":3,"en":"Aboriginal people were granted the vote in 1960. Today every citizen over the age of 18 may vote.","en_simple":"Aboriginal people got the right to vote in 1960. Today, every citizen 18 or older can vote.","fr":"Les Autochtones, quant à eux, acquièrent le droit de vote en 1960. Aujourd’hui, tous les citoyens âgés d’au moins 18 ans peuvent voter.","tr":{"ar":"مُنح السكان الأصليون حق التصويت عام 1960. واليوم يحق لكل مواطن تجاوز 18 عامًا التصويت."},"questions":[{"type":"mc","q":{"en":"In what year were Aboriginal people granted the right to vote?","fr":"En quelle année les Autochtones ont-ils acquis le droit de vote?"},"options":{"en":["1948","1951","1960","1970"],"fr":["1948","1951","1960","1970"]},"answer":2},{"type":"mc","q":{"en":"Today, which citizens may vote in Canada?","fr":"Aujourd’hui, quels citoyens peuvent voter au Canada?"},"options":{"en":["Every citizen over the age of 18","Only property owners","Only men over 21","Only citizens born in Canada"],"fr":["Tous les citoyens âgés d’au moins 18 ans","Seulement les propriétaires","Seulement les hommes de plus de 21 ans","Seulement les citoyens nés au Canada"]},"answer":0},{"type":"tf","q":{"en":"Aboriginal people were granted the vote in 1948.","fr":"Les Autochtones ont acquis le droit de vote en 1948."},"answer":false}]},{"id":"modern-021","topic":"hungary-refugees","importance":3,"en":"Canada welcomed thousands of refugees from Communist oppression, including about 37,000 who escaped Soviet tyranny in Hungary in 1956.","en_simple":"Canada welcomed many refugees from Communism, including about 37,000 people who escaped Hungary in 1956.","fr":"Le Canada accueille des milliers de réfugiés fuyant l’oppression communiste, dont environ 37 000 ayant échappé à la tyrannie soviétique en Hongrie en 1956.","tr":{"ar":"استقبلت كندا آلاف اللاجئين الفارّين من القمع الشيوعي، منهم نحو 37,000 شخص هربوا من الطغيان السوفيتي في المجر (Hungary) عام 1956."},"questions":[{"type":"mc","q":{"en":"About how many refugees from Hungary did Canada welcome in 1956?","fr":"Environ combien de réfugiés de Hongrie le Canada a-t-il accueillis en 1956?"},"options":{"en":["500","16,000","37,000","50,000"],"fr":["500","16 000","37 000","50 000"]},"answer":2},{"type":"mc","q":{"en":"From which country did about 37,000 refugees escape Soviet tyranny to Canada in 1956?","fr":"De quel pays environ 37 000 réfugiés ont-ils fui la tyrannie soviétique vers le Canada en 1956?"},"options":{"en":["Vietnam","Hungary","Poland","Korea"],"fr":["Le Vietnam","La Hongrie","La Pologne","La Corée"]},"answer":1}]},{"id":"modern-022","topic":"vietnam-refugees","importance":3,"en":"With the Communist victory in the Vietnam War in 1975, many Vietnamese fled, including over 50,000 who sought refuge in Canada.","en_simple":"After the Communist victory in Vietnam in 1975, more than 50,000 Vietnamese came to Canada as refugees.","fr":"Avec la victoire communiste de 1975 à la fin de la guerre du Vietnam, beaucoup de Vietnamiens fuient et plus de 50 000 d’entre eux cherchent asile au Canada.","tr":{"ar":"مع انتصار الشيوعيين في حرب فيتنام عام 1975، فرّ كثير من الفيتناميين، ومنهم أكثر من 50,000 شخص لجأوا إلى كندا."},"questions":[{"type":"mc","q":{"en":"Over how many Vietnamese refugees sought refuge in Canada after the Communist victory in 1975?","fr":"Plus de combien de réfugiés vietnamiens ont cherché asile au Canada après la victoire communiste de 1975?"},"options":{"en":["1,000","16,000","37,000","50,000"],"fr":["1 000","16 000","37 000","50 000"]},"answer":3},{"type":"mc","q":{"en":"In what year did the Communist victory in the Vietnam War lead many Vietnamese to flee to Canada?","fr":"En quelle année la victoire communiste dans la guerre du Vietnam a-t-elle poussé beaucoup de Vietnamiens à fuir vers le Canada?"},"options":{"en":["1956","1960","1975","1980"],"fr":["1956","1960","1975","1980"]},"answer":2}]},{"id":"modern-023","topic":"multiculturalism","importance":3,"en":"The idea of multiculturalism, as a result of 19th- and 20th-century immigration, gained a new impetus. By the 1960s, one-third of Canadians had origins that were neither British nor French, and took pride in preserving their distinct culture in the Canadian fabric.","en_simple":"By the 1960s, one-third of Canadians had origins that were not British or French. They were proud to keep their own culture. This gave new strength to the idea of multiculturalism.","fr":"L’idée du multiculturalisme, résultat de l’immigration des dix-neuvième et vingtième siècles, prend un nouvel élan. Dès les années 1960, le tiers des Canadiens ont une origine autre que britannique ou française et sont fiers de conserver leur culture distincte dans la mosaïque canadienne.","tr":{"ar":"اكتسبت فكرة التعددية الثقافية، نتيجة هجرة القرنين التاسع عشر والعشرين، زخمًا جديدًا. وبحلول الستينيات كان ثلث الكنديين من أصول ليست بريطانية ولا فرنسية، وكانوا فخورين بالحفاظ على ثقافتهم المميزة ضمن النسيج الكندي."},"questions":[{"type":"mc","q":{"en":"By the 1960s, what fraction of Canadians had origins that were neither British nor French?","fr":"Dès les années 1960, quelle proportion des Canadiens avaient une origine autre que britannique ou française?"},"options":{"en":["One-tenth","One-quarter","One-third","One-half"],"fr":["Un dixième","Un quart","Un tiers","La moitié"]},"answer":2},{"type":"tf","q":{"en":"The idea of multiculturalism gained a new impetus as a result of 19th- and 20th-century immigration.","fr":"L’idée du multiculturalisme a pris un nouvel élan grâce à l’immigration des dix-neuvième et vingtième siècles."},"answer":true}]},{"id":"modern-024","topic":"writers","importance":2,"en":"Canadians have made significant contributions to literature in English and in French. Men and women of letters included Stephen Leacock, Louis Hémon, Sir Charles G.D. Roberts, Pauline Johnson, Émile Nelligan, Robertson Davies, Margaret Laurence and Mordecai Richler.","en_simple":"Famous Canadian writers include Stephen Leacock, Louis Hémon, Sir Charles G.D. Roberts, Pauline Johnson, Émile Nelligan, Robertson Davies, Margaret Laurence and Mordecai Richler.","fr":"Les Canadiens contribuent d’une manière importante à la littérature anglophone et francophone. Parmi les hommes et les femmes de lettres, citons Stephen Leacock, Louis Hémon, sir Charles G. D. Roberts, Pauline Johnson, Émile Nelligan, Robertson Davies, Margaret Laurence et Mordecai Richler.","tr":{"ar":"قدّم الكنديون إسهامات كبيرة في الأدب بالإنجليزية والفرنسية. ومن أعلام الأدب: ستيفن ليكوك (Stephen Leacock)، ولوي إيمون (Louis Hémon)، وسير تشارلز ج. د. روبرتس (Sir Charles G.D. Roberts)، وبولين جونسون (Pauline Johnson)، وإميل نيليغان (Émile Nelligan)، وروبرتسون ديفيز (Robertson Davies)، ومارغريت لورانس (Margaret Laurence)، ومردخاي ريتشلر (Mordecai Richler)."},"questions":[{"type":"mc","q":{"en":"Which of the following is a famous Canadian man or woman of letters?","fr":"Laquelle des personnes suivantes est une femme ou un homme de lettres canadien célèbre?"},"options":{"en":["Wayne Gretzky","Margaret Laurence","Emily Carr","Donovan Bailey"],"fr":["Wayne Gretzky","Margaret Laurence","Emily Carr","Donovan Bailey"]},"answer":1},{"type":"mc","q":{"en":"Which of these people is known as a writer, not a painter or athlete?","fr":"Laquelle de ces personnes est connue comme écrivain, et non comme peintre ou athlète?"},"options":{"en":["Jean-Paul Riopelle","Chantal Petitclerc","Mordecai Richler","Kenojuak Ashevak"],"fr":["Jean-Paul Riopelle","Chantal Petitclerc","Mordecai Richler","Kenojuak Ashevak"]},"answer":2}]},{"id":"modern-025","topic":"musicians-writers","importance":2,"en":"Musicians such as Sir Ernest MacMillan and Healey Willan won renown in Canada and abroad. Writers such as Joy Kogawa, Michael Ondaatje and Rohinton Mistry have diversified Canada’s literary experience.","en_simple":"Sir Ernest MacMillan and Healey Willan were famous Canadian musicians. Writers Joy Kogawa, Michael Ondaatje and Rohinton Mistry made Canadian literature more diverse.","fr":"Des musiciens comme sir Ernest MacMillan et Healey Willan sont connus au Canada et dans le monde entier. Des écrivains comme Joy Kogawa, Michael Ondaatje et Rohinton Mistry diversifient le paysage littéraire canadien.","tr":{"ar":"نال موسيقيون مثل سير إرنست ماكميلان (Sir Ernest MacMillan) وهيلي ويلان (Healey Willan) شهرة في كندا والخارج. وأضاف كتّاب مثل جوي كوغاوا (Joy Kogawa) ومايكل أونداتجي (Michael Ondaatje) وروهينتون ميستري (Rohinton Mistry) تنوعًا إلى التجربة الأدبية الكندية."},"questions":[{"type":"mc","q":{"en":"Sir Ernest MacMillan and Healey Willan were renowned Canadian…","fr":"Sir Ernest MacMillan et Healey Willan étaient des Canadiens célèbres dans le domaine de…"},"options":{"en":["painters","musicians","filmmakers","scientists"],"fr":["la peinture","la musique","le cinéma","les sciences"]},"answer":1},{"type":"mc","q":{"en":"Which of the following writers diversified Canada’s literary experience?","fr":"Lequel des écrivains suivants a diversifié le paysage littéraire canadien?"},"options":{"en":["Michael Ondaatje","Norman Jewison","Harold Innis","Louis-Philippe Hébert"],"fr":["Michael Ondaatje","Norman Jewison","Harold Innis","Louis-Philippe Hébert"]},"answer":0}]},{"id":"modern-026","topic":"group-of-seven","importance":3,"en":"In the visual arts, Canada is historically perhaps best known for the Group of Seven, founded in 1920, who developed a style of painting to capture the rugged wilderness landscapes.","en_simple":"The Group of Seven, founded in 1920, were painters famous for painting Canada's rugged wilderness landscapes.","fr":"Dans les arts visuels, le Canada est peut-être davantage connu historiquement pour le Groupe des sept, fondé en 1920 et à l’origine d’un style de peinture cherchant à reproduire les paysages sauvages accidentés.","tr":{"ar":"في الفنون البصرية، لعل كندا أشهر تاريخيًا بـ«مجموعة السبعة» (Group of Seven) التي تأسست عام 1920 وطوّرت أسلوبًا في الرسم يصوّر المناظر الطبيعية البرية الوعرة."},"questions":[{"type":"mc","q":{"en":"In what year was the Group of Seven founded?","fr":"En quelle année le Groupe des sept a-t-il été fondé?"},"options":{"en":["1891","1909","1920","1950"],"fr":["1891","1909","1920","1950"]},"answer":2},{"type":"mc","q":{"en":"What is the Group of Seven known for?","fr":"Pour quoi le Groupe des sept est-il connu?"},"options":{"en":["A style of painting capturing rugged wilderness landscapes","Modern abstract art in Quebec","Inuit soapstone sculptures","Canadian films"],"fr":["Un style de peinture reproduisant les paysages sauvages accidentés","L’art moderne abstrait au Québec","Les sculptures inuites en pierre de savon","Les films canadiens"]},"answer":0}]},{"id":"modern-027","topic":"emily-carr","importance":2,"en":"Emily Carr painted the forests and Aboriginal artifacts of the West Coast.","en_simple":"Emily Carr was a painter. She painted West Coast forests and Aboriginal artifacts.","fr":"Emily Carr peint les forêts et les vestiges autochtones de la côte Ouest.","tr":{"ar":"رسمت إميلي كار (Emily Carr) غابات الساحل الغربي وآثار السكان الأصليين فيه."},"questions":[{"type":"mc","q":{"en":"What did Emily Carr paint?","fr":"Que peignait Emily Carr?"},"options":{"en":["Historical figures of Quebec","The forests and Aboriginal artifacts of the West Coast","Abstract art","Portraits of prime ministers"],"fr":["Des personnages historiques du Québec","Les forêts et les vestiges autochtones de la côte Ouest","De l’art abstrait","Des portraits de premiers ministres"]},"answer":1}]},{"id":"modern-028","topic":"automatistes","importance":2,"en":"Les Automatistes of Quebec were pioneers of modern abstract art in the 1950s, most notably Jean-Paul Riopelle.","en_simple":"Les Automatistes were Quebec artists who pioneered modern abstract art in the 1950s. The most famous was Jean-Paul Riopelle.","fr":"Les Automatistes du Québec, notamment Jean-Paul Riopelle, sont des pionniers de l’art moderne abstrait dans les années 1950.","tr":{"ar":"كان «الأوتوماتيست» (Les Automatistes) في كيبيك روادًا للفن التجريدي الحديث في الخمسينيات، وأبرزهم جان-بول ريوبيل (Jean-Paul Riopelle)."},"questions":[{"type":"mc","q":{"en":"Who was the most notable member of Les Automatistes, pioneers of modern abstract art in Quebec?","fr":"Qui était le membre le plus connu des Automatistes, pionniers de l’art moderne abstrait au Québec?"},"options":{"en":["Tom Thomson","Emily Carr","Jean-Paul Riopelle","Louis-Philippe Hébert"],"fr":["Tom Thomson","Emily Carr","Jean-Paul Riopelle","Louis-Philippe Hébert"]},"answer":2},{"type":"mc","q":{"en":"In which decade were Les Automatistes pioneers of modern abstract art?","fr":"Pendant quelle décennie les Automatistes ont-ils été des pionniers de l’art moderne abstrait?"},"options":{"en":["1920s","1950s","1960s","1980s"],"fr":["Années 1920","Années 1950","Années 1960","Années 1980"]},"answer":1}]},{"id":"modern-029","topic":"hebert-ashevak","importance":2,"en":"Quebec’s Louis-Philippe Hébert was a celebrated sculptor of historical figures. Kenojuak Ashevak pioneered modern Inuit art with etchings, prints and soapstone sculptures.","en_simple":"Louis-Philippe Hébert of Quebec was a famous sculptor of historical figures. Kenojuak Ashevak was a pioneer of modern Inuit art (etchings, prints and soapstone sculptures).","fr":"Louis-Philippe Hébert, du Québec, est un célèbre sculpteur de grands personnages historiques. Kenojuak Ashevak jette pour sa part les fondations de l’art inuit moderne par ses gravures, ses estampes et ses sculptures en pierre de savon.","tr":{"ar":"كان لوي-فيليب إيبير (Louis-Philippe Hébert) من كيبيك نحّاتًا مشهورًا للشخصيات التاريخية. وكانت كينوجواك آشيفاك (Kenojuak Ashevak) رائدة الفن الإنويتي الحديث بالحفر والطباعة ومنحوتات الحجر الصابوني."},"questions":[{"type":"mc","q":{"en":"Who pioneered modern Inuit art with etchings, prints and soapstone sculptures?","fr":"Qui a jeté les fondations de l’art inuit moderne par des gravures, des estampes et des sculptures en pierre de savon?"},"options":{"en":["Emily Carr","Kenojuak Ashevak","Pauline Johnson","Jean-Paul Riopelle"],"fr":["Emily Carr","Kenojuak Ashevak","Pauline Johnson","Jean-Paul Riopelle"]},"answer":1},{"type":"mc","q":{"en":"Louis-Philippe Hébert of Quebec was a celebrated…","fr":"Louis-Philippe Hébert, du Québec, était un célèbre…"},"options":{"en":["filmmaker","poet","sculptor of historical figures","hockey player"],"fr":["cinéaste","poète","sculpteur de personnages historiques","joueur de hockey"]},"answer":2}]},{"id":"modern-030","topic":"filmmakers","importance":2,"en":"The films of Denys Arcand have been popular in Quebec and across the country, and have won international awards. Other noteworthy Canadian filmmakers include Norman Jewison and Atom Egoyan.","en_simple":"Famous Canadian filmmakers: Denys Arcand (from Quebec, won international awards), Norman Jewison and Atom Egoyan.","fr":"Les films de Denys Arcand connaissent du succès au Québec et à travers le pays, en plus de remporter des prix internationaux. Les réalisateurs Norman Jewison et Atom Egoyan sont d’autres grands noms du cinéma canadien.","tr":{"ar":"حظيت أفلام دوني أركان (Denys Arcand) بشعبية في كيبيك وفي جميع أنحاء البلاد، وفازت بجوائز دولية. ومن المخرجين الكنديين البارزين الآخرين نورمان جويسون (Norman Jewison) وأتوم إيغويان (Atom Egoyan)."},"questions":[{"type":"mc","q":{"en":"Which of the following is a noteworthy Canadian filmmaker?","fr":"Lequel des noms suivants est celui d’un grand réalisateur canadien?"},"options":{"en":["Healey Willan","Atom Egoyan","Marshall McLuhan","Rick Hansen"],"fr":["Healey Willan","Atom Egoyan","Marshall McLuhan","Rick Hansen"]},"answer":1},{"type":"mc","q":{"en":"Whose films have been popular in Quebec and across the country and won international awards?","fr":"Quel réalisateur a connu du succès au Québec et à travers le pays, et a remporté des prix internationaux?"},"options":{"en":["Denys Arcand","Robertson Davies","Émile Nelligan","Harold Innis"],"fr":["Denys Arcand","Robertson Davies","Émile Nelligan","Harold Innis"]},"answer":0}]},{"id":"modern-031","topic":"paul-henderson","importance":3,"en":"In 1972, Paul Henderson scored the winning goal for Canada in the Canada-Soviet Summit Series. This goal is often referred to as “the goal heard around the world” and is still remembered today as an important event in both sports and cultural history.","en_simple":"In 1972, Paul Henderson scored the winning goal for Canada against the Soviet Union in the Summit Series. It is called “the goal heard around the world.”","fr":"En 1972, Paul Henderson a marqué le but gagnant pour le Canada dans le cadre de la Série du siècle Canada-URSS. Aujourd’hui, on surnomme ce but « le but du siècle » et il est resté gravé dans la mémoire collective en tant qu’événement important de l’histoire sportive et culturelle.","tr":{"ar":"في عام 1972 سجّل بول هندرسون (Paul Henderson) هدف الفوز لكندا في سلسلة القمة بين كندا والاتحاد السوفيتي. ويُشار إلى هذا الهدف غالبًا بـ«الهدف الذي سمعه العالم كله»، ولا يزال يُذكر حتى اليوم كحدث مهم في التاريخ الرياضي والثقافي."},"questions":[{"type":"mc","q":{"en":"Who scored the winning goal for Canada in the 1972 Canada-Soviet Summit Series?","fr":"Qui a marqué le but gagnant pour le Canada lors de la Série du siècle Canada-URSS de 1972?"},"options":{"en":["Wayne Gretzky","Paul Henderson","Donovan Bailey","James Naismith"],"fr":["Wayne Gretzky","Paul Henderson","Donovan Bailey","James Naismith"]},"answer":1},{"type":"mc","q":{"en":"In what year did Paul Henderson score “the goal heard around the world”?","fr":"En quelle année Paul Henderson a-t-il marqué « le but du siècle »?"},"options":{"en":["1967","1972","1979","1988"],"fr":["1967","1972","1979","1988"]},"answer":1}]},{"id":"modern-032","topic":"basketball-hockey","importance":3,"en":"Basketball was invented by Canadian James Naismith in 1891. Many major league sports boast Canadian talent and in the national sport of ice hockey, Canadian teams have dominated the world.","en_simple":"Canadian James Naismith invented basketball in 1891. Ice hockey is Canada's national sport, and Canadian teams dominate the world.","fr":"C’est le Canadien James Naismith qui invente le basket-ball en 1891. On trouve des Canadiens talentueux dans beaucoup de ligues majeures et les équipes canadiennes de hockey sur glace – sport national du Canada – dominent le monde.","tr":{"ar":"اخترع الكندي جيمس نايسميث (James Naismith) كرة السلة عام 1891. وتزخر كثير من الدوريات الكبرى بالمواهب الكندية، وفي هوكي الجليد، الرياضة الوطنية، هيمنت الفرق الكندية على العالم."},"questions":[{"type":"mc","q":{"en":"Who invented basketball?","fr":"Qui a inventé le basket-ball?"},"options":{"en":["Paul Henderson","Sir Sandford Fleming","James Naismith","Reginald Fessenden"],"fr":["Paul Henderson","Sir Sandford Fleming","James Naismith","Reginald Fessenden"]},"answer":2},{"type":"mc","q":{"en":"In what year was basketball invented?","fr":"En quelle année le basket-ball a-t-il été inventé?"},"options":{"en":["1867","1891","1909","1920"],"fr":["1867","1891","1909","1920"]},"answer":1},{"type":"mc","q":{"en":"What is Canada’s national sport, according to the guide?","fr":"Quel est le sport national du Canada, selon le guide?"},"options":{"en":["Basketball","Canadian football","Ice hockey","Curling"],"fr":["Le basket-ball","Le football canadien","Le hockey sur glace","Le curling"]},"answer":2}]},{"id":"modern-033","topic":"donovan-bailey","importance":3,"en":"In 1996 at the Olympic Summer Games, Donovan Bailey became a world record sprinter and double Olympic gold medallist.","en_simple":"At the 1996 Summer Olympics, sprinter Donovan Bailey set a world record and won 2 gold medals.","fr":"Donovan Bailey établit un record mondial et obtient deux médailles d’or en course de vitesse aux Jeux olympiques d’été de 1996.","tr":{"ar":"في الألعاب الأولمبية الصيفية عام 1996، أصبح دونوفان بيلي (Donovan Bailey) عدّاءً حاملًا للرقم القياسي العالمي وفائزًا بميداليتين ذهبيتين أولمبيتين."},"questions":[{"type":"mc","q":{"en":"Who became a world record sprinter and double Olympic gold medallist in 1996?","fr":"Qui a établi un record mondial et obtenu deux médailles d’or olympiques en course de vitesse en 1996?"},"options":{"en":["Terry Fox","Rick Hansen","Donovan Bailey","Mark Tewksbury"],"fr":["Terry Fox","Rick Hansen","Donovan Bailey","Mark Tewksbury"]},"answer":2},{"type":"tf","q":{"en":"Donovan Bailey won two Olympic gold medals at the 1996 Summer Games.","fr":"Donovan Bailey a remporté deux médailles d’or aux Jeux olympiques d’été de 1996."},"answer":true}]},{"id":"modern-034","topic":"chantal-petitclerc","importance":2,"en":"Chantal Petitclerc became a world champion wheelchair racer and Paralympic gold medalist.","en_simple":"Chantal Petitclerc is a world champion wheelchair racer and Paralympic gold medalist.","fr":"Chantal Petitclerc devient championne paralympique mondiale à la course en fauteuil roulant.","tr":{"ar":"أصبحت شانتال بوتيكلير (Chantal Petitclerc) بطلة عالمية في سباقات الكراسي المتحركة وحائزة على ذهبية الألعاب البارالمبية."},"questions":[{"type":"mc","q":{"en":"Who became a world champion wheelchair racer and Paralympic gold medalist?","fr":"Qui est devenue championne paralympique mondiale à la course en fauteuil roulant?"},"options":{"en":["Catriona Le May Doan","Chantal Petitclerc","Margaret Laurence","Joy Kogawa"],"fr":["Catriona Le May Doan","Chantal Petitclerc","Margaret Laurence","Joy Kogawa"]},"answer":1}]},{"id":"modern-035","topic":"wayne-gretzky","importance":3,"en":"One of the greatest hockey players of all time, Wayne Gretzky, played for the Edmonton Oilers from 1979 to 1988.","en_simple":"Wayne Gretzky, one of the greatest hockey players ever, played for the Edmonton Oilers from 1979 to 1988.","fr":"L’un des plus grands joueurs de hockey de tous les temps, Wayne Gretzky, joue pour les Oilers d’Edmonton de 1979 à 1988.","tr":{"ar":"لعب واين غريتزكي (Wayne Gretzky)، أحد أعظم لاعبي الهوكي على مر العصور، لفريق إدمونتون أويلرز من 1979 إلى 1988."},"questions":[{"type":"mc","q":{"en":"For which team did Wayne Gretzky play from 1979 to 1988?","fr":"Pour quelle équipe Wayne Gretzky a-t-il joué de 1979 à 1988?"},"options":{"en":["Toronto Maple Leafs","Montreal Canadiens","Edmonton Oilers","Calgary Flames"],"fr":["Les Maple Leafs de Toronto","Les Canadiens de Montréal","Les Oilers d’Edmonton","Les Flames de Calgary"]},"answer":2},{"type":"mc","q":{"en":"Wayne Gretzky is described as one of the greatest players of all time in which sport?","fr":"Wayne Gretzky est décrit comme l’un des plus grands joueurs de tous les temps dans quel sport?"},"options":{"en":["Basketball","Hockey","Canadian football","Speed skating"],"fr":["Le basket-ball","Le hockey","Le football canadien","Le patinage de vitesse"]},"answer":1}]},{"id":"modern-036","topic":"terry-fox","importance":3,"en":"In 1980, Terry Fox, a British Columbian who lost his right leg to cancer at the age of 18, began a cross-country run, the “Marathon of Hope,” to raise money for cancer research. He became a hero to Canadians. While he did not finish the run and ultimately lost his battle with cancer, his legacy continues through yearly fundraising events in his name.","en_simple":"In 1980, Terry Fox from British Columbia, who lost his right leg to cancer at 18, started the “Marathon of Hope,” a run across Canada to raise money for cancer research. He did not finish, but he became a hero and yearly fundraising events still carry his name.","fr":"En 1980, Terry Fox, un Britanno-Colombien qui a perdu sa jambe droite à la suite d’un cancer à l’âge de 18 ans, commence une course à travers le pays, intitulée le « marathon de l’espoir », afin d’amasser des fonds pour la recherche sur le cancer. Il devient un héros pour les Canadiens. Malheureusement, il ne réussit pas à terminer sa traversée et il perd finalement sa bataille contre le cancer, mais son histoire se poursuit grâce à des marathons annuels de collecte de fonds qui portent son nom.","tr":{"ar":"في عام 1980، بدأ تيري فوكس (Terry Fox)، وهو من كولومبيا البريطانية فقد ساقه اليمنى بسبب السرطان في سن 18، جريًا عبر البلاد سُمّي «ماراثون الأمل» لجمع المال لأبحاث السرطان. وأصبح بطلًا لدى الكنديين. ورغم أنه لم يكمل الجري وخسر في النهاية معركته مع السرطان، يستمر إرثه من خلال فعاليات سنوية لجمع التبرعات تحمل اسمه."},"questions":[{"type":"mc","q":{"en":"What was the “Marathon of Hope”?","fr":"Qu’était le « marathon de l’espoir »?"},"options":{"en":["Terry Fox’s cross-country run to raise money for cancer research","Rick Hansen’s trip around the globe in a wheelchair","A hockey series between Canada and the Soviet Union","A UN peacekeeping mission"],"fr":["La course de Terry Fox à travers le pays pour amasser des fonds pour la recherche sur le cancer","Le tour du monde de Rick Hansen en fauteuil roulant","Une série de hockey entre le Canada et l’URSS","Une mission de maintien de la paix de l’ONU"]},"answer":0},{"type":"mc","q":{"en":"In what year did Terry Fox begin the Marathon of Hope?","fr":"En quelle année Terry Fox a-t-il commencé le marathon de l’espoir?"},"options":{"en":["1972","1980","1985","1996"],"fr":["1972","1980","1985","1996"]},"answer":1},{"type":"mc","q":{"en":"Terry Fox was from which province?","fr":"De quelle province Terry Fox était-il originaire?"},"options":{"en":["Ontario","Quebec","Alberta","British Columbia"],"fr":["L’Ontario","Le Québec","L’Alberta","La Colombie-Britannique"]},"answer":3}]},{"id":"modern-037","topic":"rick-hansen","importance":3,"en":"In 1985, fellow British Columbian Rick Hansen circled the globe in a wheelchair to raise funds for spinal cord research.","en_simple":"In 1985, Rick Hansen from British Columbia went around the world in a wheelchair to raise money for spinal cord research.","fr":"En 1985, un autre Britanno-Colombien, Rick Hansen, fait le tour du globe en fauteuil roulant afin de recueillir des fonds pour la recherche sur la moelle épinière.","tr":{"ar":"في عام 1985، طاف ريك هانسن (Rick Hansen)، وهو أيضًا من كولومبيا البريطانية، حول العالم على كرسي متحرك لجمع التبرعات لأبحاث الحبل الشوكي."},"questions":[{"type":"mc","q":{"en":"Who circled the globe in a wheelchair in 1985 to raise funds for spinal cord research?","fr":"Qui a fait le tour du globe en fauteuil roulant en 1985 pour recueillir des fonds pour la recherche sur la moelle épinière?"},"options":{"en":["Terry Fox","Rick Hansen","Chantal Petitclerc","Mark Tewksbury"],"fr":["Terry Fox","Rick Hansen","Chantal Petitclerc","Mark Tewksbury"]},"answer":1},{"type":"tf","q":{"en":"Rick Hansen circled the globe in a wheelchair to raise funds for cancer research.","fr":"Rick Hansen a fait le tour du globe en fauteuil roulant pour recueillir des fonds pour la recherche sur le cancer."},"answer":false}]},{"id":"modern-038","topic":"mark-tewksbury","importance":1,"en":"Mark Tewksbury, Olympic gold medallist and prominent activist for gay and lesbian Canadians.","en_simple":"Mark Tewksbury is an Olympic gold medallist and a well-known activist for gay and lesbian Canadians.","fr":"Mark Tewksbury, médaillé olympique d’or et militant de premier plan pour les gais et lesbiennes du Canada.","tr":{"ar":"مارك توكسبري (Mark Tewksbury)، حائز على ذهبية أولمبية وناشط بارز من أجل المثليين والمثليات في كندا."},"questions":[{"type":"mc","q":{"en":"Mark Tewksbury is an Olympic gold medallist and a prominent activist for…","fr":"Mark Tewksbury est un médaillé olympique d’or et un militant de premier plan pour…"},"options":{"en":["cancer research","gay and lesbian Canadians","Quebec sovereignty","Aboriginal voting rights"],"fr":["la recherche sur le cancer","les gais et lesbiennes du Canada","la souveraineté du Québec","le droit de vote des Autochtones"]},"answer":1}]},{"id":"modern-039","topic":"mcluhan-innis","importance":2,"en":"Canadian advances in science and technology are world renowned and have changed the way the world communicates and does business. Marshall McLuhan and Harold Innis were pioneer thinkers.","en_simple":"Canadian science and technology have changed how the world communicates and does business. Marshall McLuhan and Harold Innis were pioneer thinkers.","fr":"Les découvertes scientifiques et technologiques du Canada sont réputées internationalement et changent la façon dont le monde communique et fait des affaires. Marshall McLuhan et Harold Innis sont des penseurs avant-gardistes.","tr":{"ar":"تحظى إنجازات كندا في العلوم والتكنولوجيا بشهرة عالمية وقد غيّرت طريقة تواصل العالم وإدارته للأعمال. وكان مارشال ماكلوهان (Marshall McLuhan) وهارولد إينيس (Harold Innis) مفكرَين رائدَين."},"questions":[{"type":"mc","q":{"en":"Marshall McLuhan and Harold Innis were Canadian…","fr":"Marshall McLuhan et Harold Innis étaient des Canadiens…"},"options":{"en":["pioneer thinkers","hockey players","painters","filmmakers"],"fr":["penseurs avant-gardistes","joueurs de hockey","peintres","cinéastes"]},"answer":0}]},{"id":"modern-040","topic":"space-agency","importance":3,"en":"Since 1989, the Canadian Space Agency and Canadian astronauts have participated in space exploration, often using the Canadian-designed and built Canadarm.","en_simple":"Since 1989, the Canadian Space Agency and Canadian astronauts have taken part in space exploration, often using the Canadarm, a robotic arm designed and built in Canada.","fr":"Depuis 1989, l’Agence spatiale canadienne et les astronautes canadiens participent à l’exploration spatiale, utilisant souvent le bras robotique conçu et construit par des Canadiens.","tr":{"ar":"منذ عام 1989، تشارك وكالة الفضاء الكندية ورواد الفضاء الكنديون في استكشاف الفضاء، مستخدمين غالبًا الذراع الكندية (Canadarm) المصممة والمصنوعة في كندا."},"questions":[{"type":"mc","q":{"en":"Since what year have the Canadian Space Agency and Canadian astronauts participated in space exploration?","fr":"Depuis quelle année l’Agence spatiale canadienne et les astronautes canadiens participent-ils à l’exploration spatiale?"},"options":{"en":["1969","1979","1989","1999"],"fr":["1969","1979","1989","1999"]},"answer":2},{"type":"mc","q":{"en":"What is the Canadarm?","fr":"Qu’est-ce que le Canadarm?"},"options":{"en":["A Canadian-designed robotic arm used in space","A cardiac pacemaker","A light-weight winter vehicle","A wireless telephone"],"fr":["Un bras robotique conçu au Canada et utilisé dans l’espace","Un stimulateur cardiaque","Un véhicule léger pour l’hiver","Un téléphone sans fil"]},"answer":0}]},{"id":"modern-041","topic":"nobel-scientists","importance":2,"en":"Gerhard Herzberg, a refugee from Nazi Germany, John Polanyi, Sidney Altman, Richard E. Taylor, Michael Smith and Bertram Brockhouse were Nobel Prize-winning scientists.","en_simple":"Canadian Nobel Prize-winning scientists: Gerhard Herzberg (a refugee from Nazi Germany), John Polanyi, Sidney Altman, Richard E. Taylor, Michael Smith and Bertram Brockhouse.","fr":"Gerhard Herzberg (un réfugié de l’Allemagne nazie), John Polanyi, Sidney Altman, Richard E. Taylor, Michael Smith et Bertram Brockhouse, des scientifiques canadiens, remportent le prix Nobel.","tr":{"ar":"كان غيرهارد هرتسبرغ (Gerhard Herzberg)، وهو لاجئ من ألمانيا النازية، وجون بولاني (John Polanyi)، وسيدني ألتمان (Sidney Altman)، وريتشارد إ. تايلور (Richard E. Taylor)، ومايكل سميث (Michael Smith)، وبرترام بروكهاوس (Bertram Brockhouse) علماء حائزين على جائزة نوبل."},"questions":[{"type":"mc","q":{"en":"Which of the following was a Nobel Prize-winning Canadian scientist?","fr":"Lequel des noms suivants est celui d’un scientifique canadien lauréat du prix Nobel?"},"options":{"en":["John Polanyi","Atom Egoyan","Stephen Leacock","Healey Willan"],"fr":["John Polanyi","Atom Egoyan","Stephen Leacock","Healey Willan"]},"answer":0},{"type":"mc","q":{"en":"Which Nobel Prize-winning scientist was a refugee from Nazi Germany?","fr":"Quel scientifique lauréat du prix Nobel était un réfugié de l’Allemagne nazie?"},"options":{"en":["Sidney Altman","Gerhard Herzberg","Michael Smith","Bertram Brockhouse"],"fr":["Sidney Altman","Gerhard Herzberg","Michael Smith","Bertram Brockhouse"]},"answer":1}]},{"id":"modern-042","topic":"le-may-doan","importance":2,"en":"Catriona Le May Doan carries the flag after winning a gold medal in speed skating at the 2002 Olympic Winter Games.","en_simple":"Catriona Le May Doan won a gold medal in speed skating at the 2002 Winter Olympics.","fr":"Catriona Le May Doan porte le drapeau après avoir gagné une médaille d’or en patinage de vitesse aux Jeux olympiques d’hiver de 2002.","tr":{"ar":"تحمل كاتريونا لو ماي دون (Catriona Le May Doan) العلم بعد فوزها بميدالية ذهبية في التزلج السريع في الألعاب الأولمبية الشتوية عام 2002."},"questions":[{"type":"mc","q":{"en":"In which sport did Catriona Le May Doan win a gold medal at the 2002 Olympic Winter Games?","fr":"Dans quel sport Catriona Le May Doan a-t-elle gagné une médaille d’or aux Jeux olympiques d’hiver de 2002?"},"options":{"en":["Ice hockey","Figure skating","Speed skating","Skiing"],"fr":["Le hockey sur glace","Le patinage artistique","Le patinage de vitesse","Le ski"]},"answer":2}]},{"id":"modern-043","topic":"grey-cup","importance":3,"en":"Canadian football is a popular game that differs in a number of ways from American football. Professional teams in the Canadian Football League (CFL) compete for the championship Grey Cup, donated by Lord Grey, the Governor General, in 1909.","en_simple":"Teams in the Canadian Football League (CFL) play for the Grey Cup. Lord Grey, the Governor General, donated the cup in 1909.","fr":"Le football canadien est un jeu populaire qui diffère à plusieurs égards du football américain. Les équipes professionnelles de la Ligue canadienne de football (LCF) s’affrontent dans le cadre d’un championnat pour remporter la Coupe Grey, offerte par le gouverneur général lord Grey en 1909.","tr":{"ar":"كرة القدم الكندية لعبة شعبية تختلف في عدة جوانب عن كرة القدم الأمريكية. وتتنافس الفرق المحترفة في دوري كرة القدم الكندي (CFL) على بطولة كأس غراي (Grey Cup)، التي تبرّع بها اللورد غراي، الحاكم العام، عام 1909."},"questions":[{"type":"mc","q":{"en":"Who donated the Grey Cup?","fr":"Qui a offert la Coupe Grey?"},"options":{"en":["Lord Grey, the Governor General","Sir John A. Macdonald","Lord Stanley","Wayne Gretzky"],"fr":["Lord Grey, le gouverneur général","Sir John A. Macdonald","Lord Stanley","Wayne Gretzky"]},"answer":0},{"type":"mc","q":{"en":"In what year was the Grey Cup donated?","fr":"En quelle année la Coupe Grey a-t-elle été offerte?"},"options":{"en":["1891","1909","1920","1972"],"fr":["1891","1909","1920","1972"]},"answer":1},{"type":"mc","q":{"en":"Teams in which league compete for the Grey Cup?","fr":"Les équipes de quelle ligue s’affrontent pour remporter la Coupe Grey?"},"options":{"en":["The National Hockey League","The Canadian Football League (CFL)","The National Basketball Association","Major League Baseball"],"fr":["La Ligue nationale de hockey","La Ligue canadienne de football (LCF)","La National Basketball Association","La Ligue majeure de baseball"]},"answer":1}]},{"id":"modern-044","topic":"insulin","importance":3,"en":"Sir Frederick Banting of Toronto and Charles Best discovered insulin, a hormone to treat diabetes that has saved 16 million lives worldwide.","en_simple":"Sir Frederick Banting (from Toronto) and Charles Best discovered insulin, a hormone that treats diabetes. It has saved 16 million lives around the world.","fr":"Sir Frederick Banting, de Toronto, et Charles Best découvrent l’insuline, une hormone permettant de traiter le diabète, et sauvent ainsi 16 millions de personnes dans le monde.","tr":{"ar":"اكتشف سير فريدريك بانتينغ (Sir Frederick Banting) من تورونتو وتشارلز بست (Charles Best) الإنسولين، وهو هرمون لعلاج السكري أنقذ 16 مليون شخص في العالم."},"questions":[{"type":"mc","q":{"en":"What is the significance of the discovery of insulin by Sir Frederick Banting and Charles Best?","fr":"Quelle est l’importance de la découverte de l’insuline par sir Frederick Banting et Charles Best?"},"options":{"en":["It is a hormone to treat diabetes that has saved 16 million lives","It was the first cardiac pacemaker","It made the first wireless voice message possible","It created the world system of time zones"],"fr":["C’est une hormone permettant de traiter le diabète qui a sauvé 16 millions de personnes","C’était le premier stimulateur cardiaque","Elle a rendu possible le premier message vocal sans fil","Elle a créé le système mondial des fuseaux horaires"]},"answer":0},{"type":"mc","q":{"en":"Who discovered insulin?","fr":"Qui a découvert l’insuline?"},"options":{"en":["Wilder Penfield and John Hopps","Sir Frederick Banting and Charles Best","Mathew Evans and Henry Woodward","Mike Lazaridis and Jim Balsillie"],"fr":["Wilder Penfield et John Hopps","Sir Frederick Banting et Charles Best","Mathew Evans et Henry Woodward","Mike Lazaridis et Jim Balsillie"]},"answer":1},{"type":"mc","q":{"en":"How many lives has insulin saved worldwide, according to the guide?","fr":"Selon le guide, combien de personnes l’insuline a-t-elle sauvées dans le monde?"},"options":{"en":["1 million","5 million","16 million","50 million"],"fr":["1 million","5 millions","16 millions","50 millions"]},"answer":2}]},{"id":"modern-045","topic":"inventions-bell","importance":3,"en":"Alexander Graham Bell — hit on the idea of the telephone at his summer house in Canada.","en_simple":"Alexander Graham Bell got the idea of the telephone at his summer house in Canada.","fr":"Alexander Graham Bell — a l’idée du téléphone dans sa maison d’été au Canada.","tr":{"ar":"ألكسندر غراهام بيل (Alexander Graham Bell) — خطرت له فكرة الهاتف في منزله الصيفي في كندا."},"questions":[{"type":"mc","q":{"en":"Who hit on the idea of the telephone at his summer house in Canada?","fr":"Qui a eu l’idée du téléphone dans sa maison d’été au Canada?"},"options":{"en":["Reginald Fessenden","Alexander Graham Bell","Sir Sandford Fleming","Thomas Edison"],"fr":["Reginald Fessenden","Alexander Graham Bell","Sir Sandford Fleming","Thomas Edison"]},"answer":1}]},{"id":"modern-046","topic":"inventions-bombardier","importance":3,"en":"Joseph-Armand Bombardier — invented the snowmobile, a light-weight winter vehicle.","en_simple":"Joseph-Armand Bombardier invented the snowmobile, a light winter vehicle.","fr":"Joseph-Armand Bombardier — invente la motoneige, un véhicule léger pour l’hiver.","tr":{"ar":"جوزيف-أرمان بومباردييه (Joseph-Armand Bombardier) — اخترع عربة الثلج (الموتوسيكل الثلجي)، وهي مركبة شتوية خفيفة الوزن."},"questions":[{"type":"mc","q":{"en":"What did Joseph-Armand Bombardier invent?","fr":"Qu’a inventé Joseph-Armand Bombardier?"},"options":{"en":["The telephone","The electric light bulb","The snowmobile","The cardiac pacemaker"],"fr":["Le téléphone","L’ampoule électrique","La motoneige","Le stimulateur cardiaque"]},"answer":2}]},{"id":"modern-047","topic":"inventions-fleming","importance":3,"en":"Sir Sandford Fleming — invented the world system of standard time zones.","en_simple":"Sir Sandford Fleming invented the world system of standard time zones.","fr":"Sir Sandford Fleming — invente le système mondial des fuseaux horaires.","tr":{"ar":"سير ساندفورد فليمنغ (Sir Sandford Fleming) — اخترع النظام العالمي للمناطق الزمنية الموحدة."},"questions":[{"type":"mc","q":{"en":"Who invented the world system of standard time zones?","fr":"Qui a inventé le système mondial des fuseaux horaires?"},"options":{"en":["Sir Sandford Fleming","Alexander Graham Bell","Dr. John A. Hopps","Harold Innis"],"fr":["Sir Sandford Fleming","Alexander Graham Bell","Dr John A. Hopps","Harold Innis"]},"answer":0}]},{"id":"modern-048","topic":"inventions-light-bulb","importance":3,"en":"Mathew Evans and Henry Woodward — together invented the first electric light bulb and later sold the patent to Thomas Edison who, more famously, commercialized the light bulb.","en_simple":"Mathew Evans and Henry Woodward invented the first electric light bulb. They sold the patent to Thomas Edison, who made it famous.","fr":"Mathew Evans et Henry Woodward — inventent ensemble la première ampoule électrique et vendent le brevet à Thomas Edison, qui la commercialise et passe à l’histoire.","tr":{"ar":"ماثيو إيفانز (Mathew Evans) وهنري وودوارد (Henry Woodward) — اخترعا معًا أول مصباح كهربائي، ثم باعا براءة الاختراع لتوماس إديسون الذي اشتهر أكثر بتسويق المصباح تجاريًا."},"questions":[{"type":"mc","q":{"en":"Who invented the first electric light bulb?","fr":"Qui a inventé la première ampoule électrique?"},"options":{"en":["Thomas Edison","Mathew Evans and Henry Woodward","Mike Lazaridis and Jim Balsillie","Sir Frederick Banting and Charles Best"],"fr":["Thomas Edison","Mathew Evans et Henry Woodward","Mike Lazaridis et Jim Balsillie","Sir Frederick Banting et Charles Best"]},"answer":1},{"type":"tf","q":{"en":"Evans and Woodward sold their light bulb patent to Thomas Edison.","fr":"Evans et Woodward ont vendu leur brevet d’ampoule électrique à Thomas Edison."},"answer":true}]},{"id":"modern-049","topic":"inventions-fessenden","importance":3,"en":"Reginald Fessenden — contributed to the invention of radio, sending the first wireless voice message in the world.","en_simple":"Reginald Fessenden helped invent radio. He sent the world's first wireless voice message.","fr":"Reginald Fessenden — contribue à l’invention de la radio, en envoyant le premier message vocal sans fil dans le monde.","tr":{"ar":"ريجينالد فيسندن (Reginald Fessenden) — أسهم في اختراع الراديو، وأرسل أول رسالة صوتية لاسلكية في العالم."},"questions":[{"type":"mc","q":{"en":"Who sent the first wireless voice message in the world?","fr":"Qui a envoyé le premier message vocal sans fil dans le monde?"},"options":{"en":["Alexander Graham Bell","Marshall McLuhan","Reginald Fessenden","Mike Lazaridis"],"fr":["Alexander Graham Bell","Marshall McLuhan","Reginald Fessenden","Mike Lazaridis"]},"answer":2}]},{"id":"modern-050","topic":"inventions-penfield","importance":2,"en":"Dr. Wilder Penfield — was a pioneering brain surgeon at McGill University in Montreal, and was known as “the greatest living Canadian.”","en_simple":"Dr. Wilder Penfield was a pioneering brain surgeon at McGill University in Montreal. He was called “the greatest living Canadian.”","fr":"Le Dr Wilder Penfield — était un neurochirurgien d’avant-garde à l’Université McGill à Montréal, et on l’appelait « le plus grand Canadien vivant ».","tr":{"ar":"الدكتور وايلدر بنفيلد (Dr. Wilder Penfield) — كان جرّاح دماغ رائدًا في جامعة ماكغيل في مونتريال، وعُرف بـ«أعظم كندي على قيد الحياة»."},"questions":[{"type":"mc","q":{"en":"Who was the pioneering brain surgeon at McGill University known as “the greatest living Canadian”?","fr":"Qui était le neurochirurgien d’avant-garde de l’Université McGill qu’on appelait « le plus grand Canadien vivant »?"},"options":{"en":["Dr. John A. Hopps","Sir Frederick Banting","Dr. Wilder Penfield","Gerhard Herzberg"],"fr":["Dr John A. Hopps","Sir Frederick Banting","Dr Wilder Penfield","Gerhard Herzberg"]},"answer":2}]},{"id":"modern-051","topic":"inventions-pacemaker","importance":3,"en":"Dr. John A. Hopps — invented the first cardiac pacemaker, used today to save the lives of people with heart disorders.","en_simple":"Dr. John A. Hopps invented the first cardiac pacemaker, which saves the lives of people with heart problems.","fr":"Dr John A. Hopps — invente le premier stimulateur cardiaque, utilisé aujourd’hui pour sauver la vie de personnes atteintes de problèmes cardiaques.","tr":{"ar":"الدكتور جون أ. هوبس (Dr. John A. Hopps) — اخترع أول منظّم لضربات القلب، الذي يُستخدم اليوم لإنقاذ حياة المصابين باضطرابات القلب."},"questions":[{"type":"mc","q":{"en":"Who invented the first cardiac pacemaker?","fr":"Qui a inventé le premier stimulateur cardiaque?"},"options":{"en":["Dr. Wilder Penfield","Charles Best","Dr. John A. Hopps","Joseph-Armand Bombardier"],"fr":["Dr Wilder Penfield","Charles Best","Dr John A. Hopps","Joseph-Armand Bombardier"]},"answer":2}]},{"id":"modern-052","topic":"inventions-canadarm","importance":2,"en":"SPAR Aerospace / National Research Council — invented the Canadarm, a robotic arm used in outer space.","en_simple":"SPAR Aerospace and the National Research Council invented the Canadarm, a robotic arm used in space.","fr":"SPAR Aérospatiale / Conseil national de recherches — inventent le bras robotique utilisé dans l’espace par la navette spatiale américaine.","tr":{"ar":"سبار للفضاء / المجلس الوطني للبحوث (SPAR Aerospace / National Research Council) — اخترعا الذراع الكندية (Canadarm)، وهي ذراع آلية تُستخدم في الفضاء الخارجي."},"questions":[{"type":"mc","q":{"en":"Who invented the Canadarm?","fr":"Qui a inventé le bras robotique Canadarm?"},"options":{"en":["Research in Motion (RIM)","SPAR Aerospace / National Research Council","McGill University","The Canadian Football League"],"fr":["Research In Motion (RIM)","SPAR Aérospatiale / Conseil national de recherches","L’Université McGill","La Ligue canadienne de football"]},"answer":1}]},{"id":"modern-053","topic":"inventions-blackberry","importance":3,"en":"Mike Lazaridis and Jim Balsillie — of Research in Motion (RIM) — a wireless communications company known for its most famous invention, the BlackBerry.","en_simple":"Mike Lazaridis and Jim Balsillie of Research in Motion (RIM) are known for the BlackBerry, a wireless communications device.","fr":"Mike Lazaridis et Jim Balsillie — de Research In Motion (RIM), une société de communication sans fil reconnue pour son invention la plus célèbre, l’appareil BlackBerry.","tr":{"ar":"مايك لازاريديس (Mike Lazaridis) وجيم بالسيلي (Jim Balsillie) — من شركة ريسيرش إن موشن (RIM)، وهي شركة اتصالات لاسلكية اشتهرت بأشهر اختراعاتها، جهاز بلاك بيري (BlackBerry)."},"questions":[{"type":"mc","q":{"en":"Mike Lazaridis and Jim Balsillie of Research in Motion (RIM) are known for which invention?","fr":"Mike Lazaridis et Jim Balsillie, de Research In Motion (RIM), sont reconnus pour quelle invention?"},"options":{"en":["The Canadarm","The snowmobile","The telephone","The BlackBerry"],"fr":["Le Canadarm","La motoneige","Le téléphone","Le BlackBerry"]},"answer":3},{"type":"tf","q":{"en":"Research in Motion (RIM) is a wireless communications company.","fr":"Research In Motion (RIM) est une société de communication sans fil."},"answer":true}]}]},{"unit":"government","order":6,"title":{"en":"How Canadians Govern Themselves","fr":"Le système de gouvernement"},"title_tr":{"ar":"كيف يحكم الكنديون أنفسهم"},"source":{"en":"09-how-canadians-govern-themselves","fr":"09-systeme-de-gouvernement"},"cards":[{"id":"government-001","topic":"three-key-facts","importance":3,"en":"There are three key facts about Canada’s system of government: our country is a federal state, a parliamentary democracy and a constitutional monarchy.","en_simple":"3 key facts about Canada's government: it is a federal state, a parliamentary democracy, and a constitutional monarchy.","fr":"Trois faits principaux caractérisent le système de gouvernement du Canada : notre pays est un État fédéral, une démocratie parlementaire et une monarchie constitutionnelle.","tr":{"ar":"هناك ثلاث حقائق أساسية عن نظام الحكم في كندا: بلدنا دولة اتحادية (فيدرالية)، وديمقراطية برلمانية، وملكية دستورية."},"questions":[{"type":"mc","q":{"en":"What are the three key facts about Canada’s system of government?","fr":"Quels sont les trois faits principaux qui caractérisent le système de gouvernement du Canada?"},"options":{"en":["A republic, a direct democracy and a federation","A federal state, a parliamentary democracy and a constitutional monarchy","A unitary state, a presidential system and a monarchy","A confederation, a dictatorship and a republic"],"fr":["Une république, une démocratie directe et une fédération","Un État fédéral, une démocratie parlementaire et une monarchie constitutionnelle","Un État unitaire, un régime présidentiel et une monarchie","Une confédération, une dictature et une république"]},"answer":1},{"type":"tf","q":{"en":"Canada is a republic.","fr":"Le Canada est une république."},"answer":false},{"type":"mc","q":{"en":"Which of the following describes Canada’s system of government?","fr":"Lequel des énoncés suivants décrit le système de gouvernement du Canada?"},"options":{"en":["A presidential republic","A military dictatorship","A constitutional monarchy","An absolute monarchy"],"fr":["Une république présidentielle","Une dictature militaire","Une monarchie constitutionnelle","Une monarchie absolue"]},"answer":2}]},{"id":"government-002","topic":"levels-of-government","importance":3,"en":"There are federal, provincial, territorial and municipal governments in Canada.","en_simple":"Canada has 4 kinds of government: federal, provincial, territorial, and municipal (city/town).","fr":"Il y a un gouvernement fédéral, des gouvernements provinciaux et territoriaux et des administrations municipales au Canada.","tr":{"ar":"توجد في كندا حكومات اتحادية (فيدرالية) وإقليمية (مقاطعات) وحكومات أقاليم وبلدية."},"questions":[{"type":"mc","q":{"en":"What are the three levels of government in Canada?","fr":"Quels sont les trois ordres de gouvernement au Canada?"},"options":{"en":["Federal, provincial/territorial and municipal","Royal, noble and common","Executive, legislative and judicial","National, regional and international"],"fr":["Fédéral, provincial ou territorial et municipal","Royal, noble et populaire","Exécutif, législatif et judiciaire","National, régional et international"]},"answer":0},{"type":"tf","q":{"en":"Municipal governments are one of the levels of government in Canada.","fr":"Les administrations municipales sont l’un des ordres de gouvernement au Canada."},"answer":true}]},{"id":"government-003","topic":"constitution-act-1867","importance":3,"en":"The responsibilities of the federal and provincial governments were defined in 1867 in the British North America Act, now known as the Constitution Act, 1867.","en_simple":"In 1867, the British North America Act set out what the federal and provincial governments do. Today it is called the Constitution Act, 1867.","fr":"Les responsabilités du gouvernement fédéral et des gouvernements provinciaux ont été définies en 1867 dans l’Acte de l’Amérique du Nord britannique, maintenant connu sous le nom de Loi constitutionnelle de 1867.","tr":{"ar":"حُدِّدت مسؤوليات الحكومة الاتحادية وحكومات المقاطعات عام 1867 في قانون أمريكا الشمالية البريطانية (British North America Act)، المعروف الآن باسم القانون الدستوري لعام 1867."},"questions":[{"type":"mc","q":{"en":"In what year were the responsibilities of the federal and provincial governments defined?","fr":"En quelle année les responsabilités du gouvernement fédéral et des gouvernements provinciaux ont-elles été définies?"},"options":{"en":["1763","1867","1931","1982"],"fr":["1763","1867","1931","1982"]},"answer":1},{"type":"mc","q":{"en":"What is the British North America Act now known as?","fr":"Sous quel nom l’Acte de l’Amérique du Nord britannique est-il maintenant connu?"},"options":{"en":["The Canadian Charter of Rights and Freedoms","The Quebec Act","The Statute of Westminster","The Constitution Act, 1867"],"fr":["La Charte canadienne des droits et libertés","L’Acte de Québec","Le Statut de Westminster","La Loi constitutionnelle de 1867"]},"answer":3},{"type":"tf","q":{"en":"The British North America Act defined the responsibilities of the federal and provincial governments.","fr":"L’Acte de l’Amérique du Nord britannique a défini les responsabilités du gouvernement fédéral et des gouvernements provinciaux."},"answer":true}]},{"id":"government-004","topic":"federal-responsibilities","importance":3,"en":"In our federal state, the federal government takes responsibility for matters of national and international concern. These include defence, foreign policy, interprovincial trade and communications, currency, navigation, criminal law and citizenship.","en_simple":"The federal government handles national and international matters: defence, foreign policy, trade and communications between provinces, money (currency), navigation, criminal law, and citizenship.","fr":"Dans notre État fédéral, le gouvernement fédéral assume la responsabilité des affaires de portée nationale et internationale, entre autres de la défense, de la politique étrangère, du commerce et des communications entre les provinces, de la monnaie, de la navigation, du droit criminel et de la citoyenneté.","tr":{"ar":"في دولتنا الاتحادية، تتولى الحكومة الاتحادية المسؤولية عن الشؤون ذات الطابع الوطني والدولي، ومنها الدفاع، والسياسة الخارجية، والتجارة والاتصالات بين المقاطعات، والعملة، والملاحة، والقانون الجنائي، والجنسية (المواطنة)."},"questions":[{"type":"mc","q":{"en":"Which of the following is a responsibility of the federal government?","fr":"Laquelle des responsabilités suivantes relève du gouvernement fédéral?"},"options":{"en":["Education","National defence","Highways","Natural resources"],"fr":["L’éducation","La défense nationale","Les autoroutes","Les ressources naturelles"]},"answer":1},{"type":"mc","q":{"en":"Which level of government is responsible for citizenship and criminal law?","fr":"Quel ordre de gouvernement est responsable de la citoyenneté et du droit criminel?"},"options":{"en":["Municipal","Provincial","Federal","Territorial"],"fr":["Municipal","Provincial","Fédéral","Territorial"]},"answer":2},{"type":"tf","q":{"en":"Currency and foreign policy are responsibilities of the provinces.","fr":"La monnaie et la politique étrangère sont des responsabilités des provinces."},"answer":false},{"type":"mc","q":{"en":"Name three responsibilities of the federal government.","fr":"Nommez trois responsabilités du gouvernement fédéral."},"options":{"en":["Education, health and highways","Municipal government, property and civil rights","Defence, foreign policy and currency","Natural resources, education and health"],"fr":["L’éducation, la santé et les autoroutes","Les municipalités, la propriété et les droits civils","La défense, la politique étrangère et la monnaie","Les ressources naturelles, l’éducation et la santé"]},"answer":2}]},{"id":"government-005","topic":"provincial-responsibilities","importance":3,"en":"The provinces are responsible for municipal government, education, health, natural resources, property and civil rights, and highways.","en_simple":"The provinces handle municipal (city) government, education, health, natural resources, property and civil rights, and highways.","fr":"Les provinces sont responsables des municipalités, de l’éducation, de la santé, des ressources naturelles, de la propriété et des droits civils ainsi que des autoroutes.","tr":{"ar":"المقاطعات مسؤولة عن الحكومات البلدية، والتعليم، والصحة، والموارد الطبيعية، والملكية والحقوق المدنية، والطرق السريعة."},"questions":[{"type":"mc","q":{"en":"Which of the following is a responsibility of the provinces?","fr":"Laquelle des responsabilités suivantes relève des provinces?"},"options":{"en":["Foreign policy","Currency","Education","Citizenship"],"fr":["La politique étrangère","La monnaie","L’éducation","La citoyenneté"]},"answer":2},{"type":"mc","q":{"en":"Which level of government is responsible for health and highways?","fr":"Quel ordre de gouvernement est responsable de la santé et des autoroutes?"},"options":{"en":["Provincial","Federal","Municipal","International"],"fr":["Provincial","Fédéral","Municipal","International"]},"answer":0},{"type":"tf","q":{"en":"Natural resources are a provincial responsibility.","fr":"Les ressources naturelles sont une responsabilité provinciale."},"answer":true},{"type":"mc","q":{"en":"Name three responsibilities of the provinces.","fr":"Nommez trois responsabilités des provinces."},"options":{"en":["Defence, navigation and currency","Education, health and natural resources","Foreign policy, criminal law and citizenship","Interprovincial trade, communications and defence"],"fr":["La défense, la navigation et la monnaie","L’éducation, la santé et les ressources naturelles","La politique étrangère, le droit criminel et la citoyenneté","Le commerce entre les provinces, les communications et la défense"]},"answer":1}]},{"id":"government-006","topic":"shared-responsibilities","importance":3,"en":"The federal government and the provinces share jurisdiction over agriculture and immigration. Federalism allows different provinces to adopt policies tailored to their own populations, and gives provinces the flexibility to experiment with new ideas and policies.","en_simple":"The federal government and the provinces share 2 areas: agriculture and immigration. Federalism lets each province make policies that fit its own people.","fr":"Le gouvernement fédéral et les provinces se partagent la responsabilité de l’agriculture et de l’immigration. Le fédéralisme permet aux différentes provinces d’adopter des politiques adaptées à leurs populations et de mettre à l’essai de nouvelles idées et politiques.","tr":{"ar":"تتقاسم الحكومة الاتحادية والمقاطعات الاختصاص في مجالي الزراعة والهجرة. ويتيح النظام الاتحادي للمقاطعات المختلفة اعتماد سياسات ملائمة لسكانها، ويمنحها المرونة لتجربة أفكار وسياسات جديدة."},"questions":[{"type":"mc","q":{"en":"Over which two areas do the federal government and the provinces share jurisdiction?","fr":"Dans quels deux domaines le gouvernement fédéral et les provinces se partagent-ils la responsabilité?"},"options":{"en":["Defence and education","Agriculture and immigration","Health and currency","Highways and navigation"],"fr":["La défense et l’éducation","L’agriculture et l’immigration","La santé et la monnaie","Les autoroutes et la navigation"]},"answer":1},{"type":"tf","q":{"en":"Immigration is a shared responsibility of the federal government and the provinces.","fr":"L’immigration est une responsabilité partagée entre le gouvernement fédéral et les provinces."},"answer":true},{"type":"mc","q":{"en":"What does federalism allow the provinces to do?","fr":"Que permet le fédéralisme aux provinces?"},"options":{"en":["Print their own currency","Declare war","Adopt policies tailored to their own populations","Appoint the Governor General"],"fr":["Imprimer leur propre monnaie","Déclarer la guerre","Adopter des politiques adaptées à leurs populations","Nommer le gouverneur général"]},"answer":2}]},{"id":"government-007","topic":"provincial-assemblies","importance":2,"en":"Every province has its own elected Legislative Assembly, like the House of Commons in Ottawa.","en_simple":"Each province has its own elected Legislative Assembly. It is like the House of Commons in Ottawa.","fr":"Chaque province a sa propre assemblée législative élue, comme la Chambre des communes à Ottawa.","tr":{"ar":"لكل مقاطعة جمعيتها التشريعية المنتخبة، على غرار مجلس العموم في أوتاوا."},"questions":[{"type":"tf","q":{"en":"Every province has its own elected Legislative Assembly.","fr":"Chaque province a sa propre assemblée législative élue."},"answer":true},{"type":"mc","q":{"en":"A provincial Legislative Assembly is compared to which federal body?","fr":"À quel organe fédéral une assemblée législative provinciale est-elle comparée?"},"options":{"en":["The Senate","The Supreme Court","The Cabinet","The House of Commons"],"fr":["Le Sénat","La Cour suprême","Le Cabinet","La Chambre des communes"]},"answer":3}]},{"id":"government-008","topic":"territories","importance":2,"en":"The three northern territories, which have small populations, do not have the status of provinces, but their governments and assemblies carry out many of the same functions.","en_simple":"The 3 northern territories have small populations and are not provinces, but their governments do many of the same jobs.","fr":"Les trois territoires du Nord, qui ont de petites populations, n’ont pas le statut de province, mais leurs gouvernements et leurs assemblées exécutent bon nombre des mêmes fonctions.","tr":{"ar":"الأقاليم الشمالية الثلاثة، ذات الأعداد السكانية الصغيرة، لا تتمتع بوضع المقاطعات، لكن حكوماتها وجمعياتها تؤدي كثيرًا من الوظائف نفسها."},"questions":[{"type":"mc","q":{"en":"How many northern territories does Canada have?","fr":"Combien de territoires du Nord le Canada compte-t-il?"},"options":{"en":["2","3","4","10"],"fr":["2","3","4","10"]},"answer":1},{"type":"tf","q":{"en":"The three northern territories have the same status as provinces.","fr":"Les trois territoires du Nord ont le même statut que les provinces."},"answer":false}]},{"id":"government-009","topic":"parliamentary-democracy","importance":3,"en":"In Canada’s parliamentary democracy, the people elect members to the House of Commons in Ottawa and to the provincial and territorial legislatures. These representatives are responsible for passing laws, approving and monitoring expenditures, and keeping the government accountable.","en_simple":"In a parliamentary democracy, the people elect members to the House of Commons and to provincial and territorial legislatures. These members pass laws, approve and watch spending, and keep the government accountable.","fr":"Dans la démocratie parlementaire du Canada, la population élit les députés de la Chambre des communes à Ottawa ainsi que des assemblées législatives provinciales et territoriales. Ces représentants sont chargés d’adopter les lois, d’approuver et de surveiller les dépenses et de veiller à ce que le gouvernement soit responsable.","tr":{"ar":"في الديمقراطية البرلمانية الكندية، ينتخب الشعب أعضاء مجلس العموم في أوتاوا وأعضاء المجالس التشريعية للمقاطعات والأقاليم. ويتولى هؤلاء الممثلون سن القوانين، والموافقة على النفقات ومراقبتها، ومحاسبة الحكومة."},"questions":[{"type":"mc","q":{"en":"How are Members of Parliament chosen?","fr":"Comment les députés sont-ils choisis?"},"options":{"en":["They are appointed by the Sovereign","They are chosen by the provincial premiers","They are elected by voters in their electoral district","They are appointed by the Governor General"],"fr":["Ils sont nommés par le souverain","Ils sont choisis par les premiers ministres provinciaux","Ils sont élus par les électeurs de leur circonscription","Ils sont nommés par le gouverneur général"]},"answer":2},{"type":"mc","q":{"en":"What are the responsibilities of elected representatives in Parliament?","fr":"Quelles sont les responsabilités des représentants élus au Parlement?"},"options":{"en":["Passing laws, approving and monitoring expenditures, and keeping the government accountable","Appointing judges and senators","Granting royal assent to bills","Representing the Sovereign in the provinces"],"fr":["Adopter les lois, approuver et surveiller les dépenses et veiller à ce que le gouvernement soit responsable","Nommer les juges et les sénateurs","Accorder la sanction royale aux projets de loi","Représenter le souverain dans les provinces"]},"answer":0},{"type":"tf","q":{"en":"In Canada’s parliamentary democracy, the people elect members to the House of Commons.","fr":"Dans la démocratie parlementaire du Canada, la population élit les députés de la Chambre des communes."},"answer":true}]},{"id":"government-010","topic":"confidence-of-the-house","importance":3,"en":"Cabinet ministers are responsible to the elected representatives, which means they must retain the “confidence of the House” and have to resign if they are defeated in a non-confidence vote.","en_simple":"Cabinet ministers must keep the “confidence of the House” (the support of the elected members). If they lose a non-confidence vote, they must resign.","fr":"Les ministres du Cabinet sont responsables devant les représentants élus, c’est-à-dire qu’ils doivent conserver la « confiance de la Chambre » et doivent démissionner s’ils sont défaits à l’issue d’un vote de censure.","tr":{"ar":"وزراء مجلس الوزراء مسؤولون أمام الممثلين المنتخبين، أي أن عليهم الاحتفاظ بـ«ثقة المجلس»، ويتعين عليهم الاستقالة إذا هُزموا في تصويت بحجب الثقة."},"questions":[{"type":"mc","q":{"en":"What must Cabinet ministers do if they are defeated in a non-confidence vote?","fr":"Que doivent faire les ministres du Cabinet s’ils sont défaits à l’issue d’un vote de censure?"},"options":{"en":["Appeal to the Supreme Court","Resign","Ask the Senate to overrule the vote","Appoint new senators"],"fr":["Faire appel à la Cour suprême","Démissionner","Demander au Sénat d’annuler le vote","Nommer de nouveaux sénateurs"]},"answer":1},{"type":"mc","q":{"en":"To whom are Cabinet ministers responsible?","fr":"Devant qui les ministres du Cabinet sont-ils responsables?"},"options":{"en":["The Supreme Court","The Commonwealth","The elected representatives","The Lieutenant Governors"],"fr":["La Cour suprême","Le Commonwealth","Les représentants élus","Les lieutenants-gouverneurs"]},"answer":2},{"type":"tf","q":{"en":"Cabinet ministers must retain the “confidence of the House”.","fr":"Les ministres du Cabinet doivent conserver la « confi
