ould you bring to the polling station on election day?","fr":"Que devez-vous apporter au bureau de vote le jour de l’élection?"},"options":{"en":["Your passport only","Your voter information card and proof of your identity and address","A letter from your employer","Your birth certificate and a photo of your house"],"fr":["Votre passeport seulement","Votre carte d’information de l’électeur et une preuve de votre identité et de votre adresse","Une lettre de votre employeur","Votre certificat de naissance et une photo de votre maison"]},"answer":1},{"type":"tf","q":{"en":"On election day you can vote at any polling station in Canada.","fr":"Le jour de l’élection, vous pouvez voter à n’importe quel bureau de vote au Canada."},"answer":false}]},{"id":"elections-025","topic":"voting-procedure","importance":3,"en":"Voting procedure, steps 5 and 6: Mark an “X” in the circle next to the name of the candidate of your choice. Your vote is secret. You will be invited to go behind the screen to mark your ballot. Once marked, fold it and present it to the poll officials.","en_simple":"Step 5: mark an X in the circle next to the candidate you choose. Step 6: you go behind a screen to mark the ballot, then fold it and give it to the poll officials.","fr":"5. Remplir le bulletin de vote — Inscrivez un « X » dans le cercle à côté du nom du candidat de votre choix. 6. Le vote est secret — Votre vote est secret. On vous invitera à vous rendre derrière l’isoloir pour remplir votre bulletin de vote. Une fois le bulletin rempli, pliez-le et présentez-le au personnel de scrutin.","tr":{"ar":"إجراءات التصويت، الخطوتان 5 و6: ضع علامة «X» في الدائرة المجاورة لاسم المرشح الذي تختاره. تصويتك سري. ستُدعى إلى الذهاب خلف الساتر لتعليم بطاقة الاقتراع. وبعد تعليمها، اطوِها وقدّمها إلى موظفي الاقتراع."},"questions":[{"type":"mc","q":{"en":"When you go to vote on election day, what do you do?","fr":"Lorsque vous allez voter le jour de l’élection, que faites-vous?"},"options":{"en":["Mark an “X” in the circle next to the name of the candidate of your choice","Write the name of your favourite party on a blank sheet","Sign your name next to the candidate","Tell the poll official who you support"],"fr":["Inscrire un « X » dans le cercle à côté du nom du candidat de votre choix","Écrire le nom de votre parti préféré sur une feuille blanche","Signer votre nom à côté du candidat","Dire au personnel de scrutin qui vous appuyez"]},"answer":0},{"type":"mc","q":{"en":"What do you do with your ballot once it is marked?","fr":"Que faites-vous de votre bulletin de vote une fois rempli?"},"options":{"en":["Mail it to Ottawa","Fold it and present it to the poll officials","Show it to the other voters","Keep it as a receipt"],"fr":["L’envoyer par la poste à Ottawa","Le plier et le présenter au personnel de scrutin","Le montrer aux autres électeurs","Le garder comme reçu"]},"answer":1},{"type":"tf","q":{"en":"You mark your ballot behind a screen so that your vote stays secret.","fr":"Vous remplissez votre bulletin derrière l’isoloir pour que votre vote reste secret."},"answer":true}]},{"id":"elections-026","topic":"voting-procedure","importance":2,"en":"Voting procedure, steps 7 and 8: The poll official will tear off the ballot number and give your ballot back to you to deposit in the ballot box. When the polls close, every ballot is counted and the results are made public. You can see the results on television or on the Elections Canada website.","en_simple":"Step 7: the poll official tears off the ballot number and gives the ballot back to you to put in the ballot box. Step 8: when polls close, every ballot is counted; results are on TV or the Elections Canada website.","fr":"7. L’urne — Le personnel de scrutin détachera le numéro du bulletin de vote et vous remettra votre bulletin pour que vous le déposiez dans l’urne. 8. Les résultats de l’élection — Quand les bureaux de vote ferment, chaque bulletin de vote est compté et les résultats sont rendus publics. Vous pouvez voir les résultats à la télévision ou sur le site Web d’Élections Canada.","tr":{"ar":"إجراءات التصويت، الخطوتان 7 و8: ينزع موظف الاقتراع رقم بطاقة الاقتراع ويعيد إليك البطاقة لتضعها في صندوق الاقتراع. وعند إغلاق مراكز الاقتراع، تُعدّ كل بطاقة وتُعلن النتائج. ويمكنك مشاهدة النتائج على التلفزيون أو على موقع «انتخابات كندا» الإلكتروني."},"questions":[{"type":"mc","q":{"en":"What does the poll official do before you deposit your ballot in the ballot box?","fr":"Que fait le personnel de scrutin avant que vous déposiez votre bulletin dans l’urne?"},"options":{"en":["Reads your vote aloud","Signs the ballot","Tears off the ballot number","Photocopies the ballot"],"fr":["Lit votre vote à voix haute","Signe le bulletin","Détache le numéro du bulletin de vote","Photocopie le bulletin"]},"answer":2},{"type":"mc","q":{"en":"Where can you see the election results?","fr":"Où pouvez-vous voir les résultats de l’élection?"},"options":{"en":["Only at your polling station","On television or on the Elections Canada website","Only in a letter from your MP","At the Senate"],"fr":["Seulement à votre bureau de vote","À la télévision ou sur le site Web d’Élections Canada","Seulement dans une lettre de votre député","Au Sénat"]},"answer":1}]},{"id":"elections-027","topic":"municipal-government","importance":3,"en":"Municipal governments usually have a council that passes laws called “by-laws” that affect only the local community. The council usually includes a mayor (or a reeve) and councillors or aldermen.","en_simple":"Municipal (local) governments have a council. The council passes local laws called by-laws. The council has a mayor (or reeve) and councillors (or aldermen).","fr":"Les administrations municipales ont habituellement un conseil qui adopte des lois – appelées « règlements » – touchant seulement la communauté locale. Le conseil est habituellement composé d’un maire (ou d’un préfet) et de conseillers municipaux ou échevins.","tr":{"ar":"عادةً ما يكون للحكومات البلدية مجلس يسنّ قوانين تُسمى «اللوائح البلدية» (by-laws) لا تؤثر إلا في المجتمع المحلي. ويضم المجلس عادةً رئيس البلدية (العمدة) أو الريف (reeve) وأعضاء المجلس أو المستشارين (aldermen)."},"questions":[{"type":"mc","q":{"en":"What are the laws passed by a municipal council called?","fr":"Comment appelle-t-on les lois adoptées par un conseil municipal?"},"options":{"en":["Statutes","By-laws","Bills","Treaties"],"fr":["Statuts","Règlements","Projets de loi","Traités"]},"answer":1},{"type":"mc","q":{"en":"Who is the head of a municipal government?","fr":"Qui est le chef d’une administration municipale?"},"options":{"en":["The Premier","The Lieutenant Governor","The mayor or reeve","The Commissioner"],"fr":["Le premier ministre provincial","Le lieutenant-gouverneur","Le maire ou le préfet","Le commissaire"]},"answer":2},{"type":"mc","q":{"en":"Besides the mayor, who sits on a municipal council?","fr":"Outre le maire, qui siège au conseil municipal?"},"options":{"en":["Senators","Councillors or aldermen","Members of the Legislative Assembly","Band chiefs"],"fr":["Des sénateurs","Des conseillers municipaux ou échevins","Des députés de l’Assemblée législative","Des chefs de bande"]},"answer":1}]},{"id":"elections-028","topic":"municipal-government","importance":2,"en":"Municipalities are normally responsible for urban or regional planning, streets and roads, sanitation (such as garbage removal), snow removal, firefighting, ambulance and other emergency services, recreation facilities, public transit and some local health and social services. Most major urban centres have municipal police forces.","en_simple":"Municipalities look after: planning, streets and roads, garbage removal, snow removal, firefighting, ambulance and emergency services, recreation, public transit, and some local health and social services. Most big cities have their own police.","fr":"Les municipalités sont normalement responsables de la planification urbaine ou régionale, des rues et des routes, de l’assainissement (comme la collecte des ordures), du déneigement, de la lutte contre les incendies, des services ambulanciers et autres services d’urgence, des installations récréatives, du transport en commun et de certains services sociaux et de santé locaux. La plupart des grands centres urbains ont des services de police municipaux.","tr":{"ar":"تتولى البلديات عادةً مسؤولية التخطيط الحضري أو الإقليمي، والشوارع والطرق، والنظافة (مثل جمع القمامة)، وإزالة الثلوج، وإطفاء الحرائق، وخدمات الإسعاف وغيرها من خدمات الطوارئ، والمرافق الترفيهية، والنقل العام، وبعض الخدمات الصحية والاجتماعية المحلية. ولدى معظم المراكز الحضرية الكبرى قوات شرطة بلدية."},"questions":[{"type":"mc","q":{"en":"Which of the following is normally a municipal responsibility?","fr":"Laquelle des responsabilités suivantes relève normalement de la municipalité?"},"options":{"en":["National defence","Snow removal","Foreign policy","Citizenship"],"fr":["La défense nationale","Le déneigement","La politique étrangère","La citoyenneté"]},"answer":1},{"type":"tf","q":{"en":"Most major urban centres have municipal police forces.","fr":"La plupart des grands centres urbains ont des services de police municipaux."},"answer":true}]},{"id":"elections-029","topic":"other-elections","importance":2,"en":"Provincial, territorial and municipal elections are held by secret ballot, but the rules are not the same as those for federal elections. It is important to find out the rules for voting in provincial, territorial and local elections so that you can exercise your right to vote.","en_simple":"Provincial, territorial and municipal elections also use a secret ballot, but their rules are different from federal elections. Find out the local rules so you can vote.","fr":"Les élections provinciales, territoriales et municipales se tiennent par vote secret, mais ne suivent pas les mêmes règles que les élections fédérales. Il est important de vous renseigner sur les règles électorales de votre province ou territoire et de votre municipalité afin de pouvoir exercer votre droit de vote.","tr":{"ar":"تُجرى الانتخابات في المقاطعات والأقاليم والبلديات بالاقتراع السري، لكن قواعدها تختلف عن قواعد الانتخابات الفيدرالية. ومن المهم أن تتعرف على قواعد التصويت في انتخابات مقاطعتك أو إقليمك وبلديتك حتى تتمكن من ممارسة حقك في التصويت."},"questions":[{"type":"tf","q":{"en":"Provincial and municipal elections follow exactly the same rules as federal elections.","fr":"Les élections provinciales et municipales suivent exactement les mêmes règles que les élections fédérales."},"answer":false},{"type":"tf","q":{"en":"Provincial, territorial and municipal elections are held by secret ballot.","fr":"Les élections provinciales, territoriales et municipales se tiennent par vote secret."},"answer":true}]},{"id":"elections-030","topic":"three-levels","importance":3,"en":"Canada has three levels of government: federal, provincial and territorial, and municipal (local). Federal elected officials are Members of Parliament (MPs). Federal responsibilities include National Defence, Foreign Policy, Citizenship, Policing, Criminal Justice, International Trade and Aboriginal Affairs.","en_simple":"The 3 levels of government: federal, provincial/territorial, and municipal. Federal (MPs) is responsible for: national defence, foreign policy, citizenship, policing, criminal justice, international trade, Aboriginal affairs.","fr":"Gouvernement fédéral — Députés ou membres du Parlement — Défense nationale; Politique étrangère; Citoyenneté; Maintien de l’ordre; Justice criminelle; Commerce international; Affaires autochtones.","tr":{"ar":"في كندا ثلاثة مستويات من الحكومة: الفيدرالية، والمقاطعات والأقاليم، والبلدية (المحلية). المسؤولون المنتخبون على المستوى الفيدرالي هم أعضاء البرلمان (النواب). وتشمل المسؤوليات الفيدرالية: الدفاع الوطني، والسياسة الخارجية، والمواطنة، والشرطة، والعدالة الجنائية، والتجارة الدولية، وشؤون السكان الأصليين."},"questions":[{"type":"mc","q":{"en":"What are the three levels of government in Canada?","fr":"Quels sont les trois ordres de gouvernement au Canada?"},"options":{"en":["Federal, provincial/territorial, and municipal","Royal, federal, and local","Executive, legislative, and judicial","Senate, House of Commons, and Cabinet"],"fr":["Fédéral, provincial/territorial et municipal","Royal, fédéral et local","Exécutif, législatif et judiciaire","Sénat, Chambre des communes et Cabinet"]},"answer":0},{"type":"mc","q":{"en":"Which of the following is a federal responsibility?","fr":"Laquelle des responsabilités suivantes relève du gouvernement fédéral?"},"options":{"en":["Education","Snow removal","National defence","Highways"],"fr":["L’éducation","Le déneigement","La défense nationale","Les autoroutes"]},"answer":2},{"type":"mc","q":{"en":"Which level of government is responsible for citizenship and foreign policy?","fr":"Quel ordre de gouvernement est responsable de la citoyenneté et de la politique étrangère?"},"options":{"en":["Municipal","Provincial","Federal","Territorial"],"fr":["Municipal","Provincial","Fédéral","Territorial"]},"answer":2}]},{"id":"elections-031","topic":"three-levels","importance":3,"en":"Provincial and territorial elected officials are Members of the Legislative Assembly (MLAs), Members of the National Assembly (MNAs), Members of the Provincial Parliament (MPPs) or Members of the House of Assembly (MHAs). Their responsibilities include Education, Health Care, Natural Resources, Highways, Policing (Ontario, Quebec) and Property and Civil Rights.","en_simple":"Provincial/territorial representatives are called MLAs, MNAs, MPPs or MHAs. Provinces are responsible for: education, health care, natural resources, highways, policing (in Ontario and Quebec), property and civil rights.","fr":"Gouvernement provincial et territorial — Députés ou membres de l’Assemblée législative, de l’Assemblée nationale, du Parlement provincial ou de la Chambre d’assemblée — Éducation; Soins de santé; Ressources naturelles; Autoroutes; Maintien de l’ordre (Ontario et Québec); Propriété et droits civils.","tr":{"ar":"المسؤولون المنتخبون في المقاطعات والأقاليم هم أعضاء الجمعية التشريعية (MLAs) أو أعضاء الجمعية الوطنية (MNAs) أو أعضاء البرلمان الإقليمي (MPPs) أو أعضاء مجلس النواب (MHAs). وتشمل مسؤولياتهم: التعليم، والرعاية الصحية، والموارد الطبيعية، والطرق السريعة، والشرطة (في أونتاريو وكيبيك)، والملكية والحقوق المدنية."},"questions":[{"type":"mc","q":{"en":"Which level of government is responsible for education and health care?","fr":"Quel ordre de gouvernement est responsable de l’éducation et des soins de santé?"},"options":{"en":["Federal","Provincial and territorial","Municipal","First Nations band councils"],"fr":["Fédéral","Provincial et territorial","Municipal","Les conseils de bande des Premières Nations"]},"answer":1},{"type":"mc","q":{"en":"Which of the following is a provincial responsibility?","fr":"Laquelle des responsabilités suivantes relève de la province?"},"options":{"en":["International trade","Criminal justice","Natural resources","National defence"],"fr":["Le commerce international","La justice criminelle","Les ressources naturelles","La défense nationale"]},"answer":2},{"type":"mc","q":{"en":"In which two provinces is policing listed as a provincial responsibility?","fr":"Dans quelles deux provinces le maintien de l’ordre est-il une responsabilité provinciale?"},"options":{"en":["Alberta and Manitoba","Ontario and Quebec","Nova Scotia and New Brunswick","British Columbia and Saskatchewan"],"fr":["L’Alberta et le Manitoba","L’Ontario et le Québec","La Nouvelle-Écosse et le Nouveau-Brunswick","La Colombie-Britannique et la Saskatchewan"]},"answer":1}]},{"id":"elections-032","topic":"three-levels","importance":3,"en":"Immigration, Agriculture and the Environment are responsibilities shared between the federal government and the provincial and territorial governments.","en_simple":"3 shared responsibilities (federal + provincial/territorial): immigration, agriculture, environment.","fr":"Immigration (partagée); Agriculture (partagée); Environnement (partagée).","tr":{"ar":"الهجرة والزراعة والبيئة مسؤوليات مشتركة بين الحكومة الفيدرالية وحكومات المقاطعات والأقاليم."},"questions":[{"type":"mc","q":{"en":"Which responsibility is shared between the federal and provincial governments?","fr":"Quelle responsabilité est partagée entre le gouvernement fédéral et les gouvernements provinciaux?"},"options":{"en":["National defence","Immigration","Snow removal","Citizenship"],"fr":["La défense nationale","L’immigration","Le déneigement","La citoyenneté"]},"answer":1},{"type":"mc","q":{"en":"Name the three shared federal-provincial responsibilities listed in the guide.","fr":"Nommez les trois responsabilités partagées fédérales-provinciales indiquées dans le guide."},"options":{"en":["Immigration, agriculture, environment","Education, health care, highways","Defence, foreign policy, trade","Policing, firefighting, recycling"],"fr":["Immigration, agriculture, environnement","Éducation, soins de santé, autoroutes","Défense, politique étrangère, commerce","Maintien de l’ordre, lutte contre les incendies, recyclage"]},"answer":0}]},{"id":"elections-033","topic":"three-levels","importance":2,"en":"Municipal (local) elected officials are the Mayor or Reeve and the Councillors or Aldermen. Municipal responsibilities include Social and Community Health, Recycling Programs, Transportation and Utilities, Snow Removal, Policing, Firefighting and Emergency Services.","en_simple":"Municipal elected officials: mayor or reeve, councillors or aldermen. Municipal responsibilities: social and community health, recycling, transportation and utilities, snow removal, policing, firefighting, emergency services.","fr":"Administration municipale (locale) — Maire ou préfet; Conseillers municipaux ou échevins — Services sociaux et de santé communautaires; Programmes de recyclage; Transport et services publics; Déneigement; Maintien de l’ordre; Lutte contre les incendies; Services d’urgence.","tr":{"ar":"المسؤولون المنتخبون على المستوى البلدي (المحلي) هم رئيس البلدية أو الريف، وأعضاء المجلس أو المستشارون. وتشمل المسؤوليات البلدية: الصحة الاجتماعية والمجتمعية، وبرامج إعادة التدوير، والنقل والمرافق العامة، وإزالة الثلوج، والشرطة، وإطفاء الحرائق، وخدمات الطوارئ."},"questions":[{"type":"mc","q":{"en":"Which level of government is responsible for recycling programs and firefighting?","fr":"Quel ordre de gouvernement est responsable des programmes de recyclage et de la lutte contre les incendies?"},"options":{"en":["Federal","Provincial","Municipal","Territorial"],"fr":["Fédéral","Provincial","Municipal","Territorial"]},"answer":2},{"type":"tf","q":{"en":"International trade is a municipal responsibility.","fr":"Le commerce international est une responsabilité municipale."},"answer":false}]},{"id":"elections-034","topic":"first-nations","importance":2,"en":"The First Nations have band chiefs and councillors who have major responsibilities on First Nations reserves, including housing, schools and other services. There are a number of provincial, regional and national Aboriginal organizations that are a voice for First Nations, Métis and Inuit people in their relationships with the federal, provincial and territorial governments.","en_simple":"First Nations have band chiefs and councillors. They are responsible for housing, schools and other services on reserves. Aboriginal organizations speak for First Nations, Métis and Inuit people to governments.","fr":"Les Premières Nations ont des chefs de bande et des conseillers, qui ont de grandes responsabilités dans les réserves des Premières Nations, notamment au sujet du logement, des écoles et d’autres services. Il existe plusieurs organismes autochtones provinciaux, régionaux et nationaux qui représentent les Premières Nations, les Métis et les Inuits dans leurs relations avec le gouvernement fédéral et les gouvernements provinciaux et territoriaux.","tr":{"ar":"لدى الأمم الأولى رؤساء عصابات (band chiefs) وأعضاء مجالس يتحملون مسؤوليات كبيرة في محميات الأمم الأولى، بما في ذلك الإسكان والمدارس والخدمات الأخرى. وهناك عدد من منظمات السكان الأصليين على مستوى المقاطعات والمناطق والمستوى الوطني تمثّل صوت الأمم الأولى والميتيس والإنويت في علاقاتهم مع الحكومة الفيدرالية وحكومات المقاطعات والأقاليم."},"questions":[{"type":"mc","q":{"en":"Who has major responsibilities on First Nations reserves, including housing and schools?","fr":"Qui a de grandes responsabilités dans les réserves des Premières Nations, notamment pour le logement et les écoles?"},"options":{"en":["The Lieutenant Governor","Band chiefs and councillors","The mayor and aldermen","Members of the Legislative Assembly"],"fr":["Le lieutenant-gouverneur","Les chefs de bande et les conseillers","Le maire et les échevins","Les députés de l’Assemblée législative"]},"answer":1},{"type":"tf","q":{"en":"Aboriginal organizations are a voice for First Nations, Métis and Inuit people in their relationships with governments.","fr":"Les organismes autochtones représentent les Premières Nations, les Métis et les Inuits dans leurs relations avec les gouvernements."},"answer":true}]},{"id":"elections-035","topic":"know-your-government","importance":3,"en":"Federal Government — Head of State: the Sovereign (King of Canada). The representative of the King of Canada is the Governor General.","en_simple":"Canada's Head of State is the Sovereign (the King of Canada). The Governor General is the King's representative in Canada.","fr":"Gouvernement fédéral — Chef d’État : le souverain (le roi du Canada). Le nom du représentant du roi du Canada, le gouverneur général, est …","tr":{"ar":"الحكومة الفيدرالية — رئيس الدولة: الملك (ملك كندا). وممثل ملك كندا هو الحاكم العام."},"questions":[{"type":"mc","q":{"en":"Who is Canada’s Head of State?","fr":"Qui est le chef d’État du Canada?"},"options":{"en":["The Prime Minister","The Governor General","The Sovereign (King of Canada)","The Chief Justice"],"fr":["Le premier ministre","Le gouverneur général","Le souverain (le roi du Canada)","Le juge en chef"]},"answer":2},{"type":"mc","q":{"en":"Who is the representative of the King of Canada at the federal level?","fr":"Qui est le représentant du roi du Canada au niveau fédéral?"},"options":{"en":["The Governor General","The Premier","The Lieutenant Governor","The Commissioner"],"fr":["Le gouverneur général","Le premier ministre provincial","Le lieutenant-gouverneur","Le commissaire"]},"answer":0}]},{"id":"elections-036","topic":"know-your-government","importance":3,"en":"The Head of Government is the Prime Minister. The political party in power is the party that forms the government. My Member of Parliament (MP) represents my federal electoral district in Ottawa.","en_simple":"The Prime Minister is the Head of Government. The party in power is the party that forms the government. Your MP represents your federal electoral district (riding) in Ottawa.","fr":"Le chef du gouvernement, le premier ministre, est … Le nom du parti politique au pouvoir est … Mon député à Ottawa est … Ma circonscription fédérale s’appelle …","tr":{"ar":"رئيس الحكومة هو رئيس الوزراء. والحزب الحاكم هو الحزب الذي يشكّل الحكومة. ويمثّل نائبي في البرلمان دائرتي الانتخابية الفيدرالية في أوتاوا."},"questions":[{"type":"mc","q":{"en":"Who is the Head of Government in Canada?","fr":"Qui est le chef du gouvernement au Canada?"},"options":{"en":["The King","The Governor General","The Prime Minister","The Speaker of the House"],"fr":["Le roi","Le gouverneur général","Le premier ministre","Le président de la Chambre"]},"answer":2},{"type":"mc","q":{"en":"Who is your member of Parliament?","fr":"Qui est votre député?"},"options":{"en":["The person elected to represent your federal electoral district in Ottawa","The person who represents the King in your province","The head of your municipal council","The leader of the party in power"],"fr":["La personne élue pour représenter votre circonscription fédérale à Ottawa","La personne qui représente le roi dans votre province","Le chef de votre conseil municipal","Le chef du parti au pouvoir"]},"answer":0}]},{"id":"elections-037","topic":"know-your-government","importance":2,"en":"The Leader of the Opposition leads the party representing His Majesty’s Loyal Opposition. There may be other opposition parties and leaders.","en_simple":"The Leader of the Opposition is the leader of the Official Opposition (His Majesty's Loyal Opposition). Other opposition parties have their own leaders.","fr":"Le nom du chef de l’opposition est … Le nom du parti représentant La loyale Opposition de Sa Majesté est … Les noms des autres partis d’opposition et de leurs chefs sont …","tr":{"ar":"زعيم المعارضة هو من يقود الحزب الذي يمثّل «معارضة جلالة الملك الموالية». وقد توجد أحزاب معارضة أخرى ولها زعماؤها."},"questions":[{"type":"mc","q":{"en":"Who is the Leader of the Opposition?","fr":"Qui est le chef de l’opposition?"},"options":{"en":["The leader of the party in power","The leader of the party forming His Majesty’s Loyal Opposition","The Speaker of the House of Commons","The Governor General"],"fr":["Le chef du parti au pouvoir","Le chef du parti qui forme La loyale Opposition de Sa Majesté","Le président de la Chambre des communes","Le gouverneur général"]},"answer":1}]},{"id":"elections-038","topic":"know-your-government","importance":3,"en":"Provincial Government — The representative of the King in my province is the Lieutenant Governor. The Head of Government is the Premier. My provincial representative sits in the provincial legislature.","en_simple":"In each province: the Lieutenant Governor represents the King; the Premier is the head of the provincial government; your provincial representative sits in the provincial legislature.","fr":"Gouvernement provincial — Le nom du représentant du roi dans ma province, le lieutenant-gouverneur, est … Le chef du gouvernement (le premier ministre) est … Mon député provincial est …","tr":{"ar":"حكومة المقاطعة — ممثل الملك في مقاطعتي هو نائب الحاكم (Lieutenant Governor). ورئيس الحكومة هو رئيس وزراء المقاطعة (Premier). ويجلس ممثلي الإقليمي في المجلس التشريعي للمقاطعة."},"questions":[{"type":"mc","q":{"en":"Who represents the King in each province?","fr":"Qui représente le roi dans chaque province?"},"options":{"en":["The Premier","The Governor General","The Commissioner","The Lieutenant Governor"],"fr":["Le premier ministre provincial","Le gouverneur général","Le commissaire","Le lieutenant-gouverneur"]},"answer":3},{"type":"mc","q":{"en":"What is the Head of Government of a province called?","fr":"Comment appelle-t-on le chef du gouvernement d’une province?"},"options":{"en":["The Premier","The Mayor","The Lieutenant Governor","The Reeve"],"fr":["Le premier ministre","Le maire","Le lieutenant-gouverneur","Le préfet"]},"answer":0},{"type":"tf","q":{"en":"The Lieutenant Governor is the head of the provincial government.","fr":"Le lieutenant-gouverneur est le chef du gouvernement provincial."},"answer":false}]},{"id":"elections-039","topic":"know-your-government","importance":3,"en":"Territorial Government — The Commissioner represents the federal government in my territory. The Head of Government of a territory is the Premier.","en_simple":"In each territory: the Commissioner represents the federal government; the Premier is the head of the territorial government.","fr":"Gouvernement territorial — Le nom du commissaire, qui représente le gouvernement fédéral dans mon territoire, est … Le nom du premier ministre est … Le nom de mon député territorial est …","tr":{"ar":"حكومة الإقليم — المفوّض (Commissioner) يمثّل الحكومة الفيدرالية في إقليمي. ورئيس حكومة الإقليم هو رئيس الوزراء (Premier)."},"questions":[{"type":"mc","q":{"en":"Who represents the federal government in each territory?","fr":"Qui représente le gouvernement fédéral dans chaque territoire?"},"options":{"en":["The Lieutenant Governor","The Commissioner","The Governor General","The Mayor"],"fr":["Le lieutenant-gouverneur","Le commissaire","Le gouverneur général","Le maire"]},"answer":1},{"type":"tf","q":{"en":"In a territory, the Commissioner represents the King.","fr":"Dans un territoire, le commissaire représente le roi."},"answer":false}]},{"id":"elections-040","topic":"know-your-government","importance":2,"en":"Municipal Government — The head of the municipal government is the mayor or reeve of the municipality where I live.","en_simple":"The head of your municipal (local) government is the mayor or reeve.","fr":"Administration municipale — Le nom de la municipalité où je vis est … Le nom du chef de l’administration municipale (maire ou préfet) est …","tr":{"ar":"الحكومة البلدية — رئيس الحكومة البلدية هو رئيس البلدية (العمدة) أو الريف (reeve) في البلدية التي أعيش فيها."},"questions":[{"type":"mc","q":{"en":"What is the head of a municipal government called?","fr":"Comment appelle-t-on le chef d’une administration municipale?"},"options":{"en":["The Premier","The Commissioner","The Governor General","The mayor or reeve"],"fr":["Le premier ministre","Le commissaire","Le gouverneur général","Le maire ou le préfet"]},"answer":3}]}]},{"unit":"justice","order":8,"title":{"en":"The Justice System","fr":"Le système de justice"},"title_tr":{"ar":"نظام العدالة"},"source":{"en":"11-justice-system","fr":"11-systeme-de-justice"},"cards":[{"id":"justice-001","topic":"presumption-of-innocence","importance":3,"en":"The Canadian justice system guarantees everyone due process under the law. Our judicial system is founded on the presumption of innocence in criminal matters, meaning everyone is innocent until proven guilty.","en_simple":"Everyone gets due process under the law. In criminal cases, a person is innocent until proven guilty (presumption of innocence).","fr":"Le système de justice du Canada garantit à chacun l’application régulière de la loi. Notre système judiciaire est fondé sur la présomption d’innocence dans les affaires criminelles, ce qui veut dire que chacun est innocent jusqu’à preuve du contraire.","tr":{"ar":"يضمن نظام العدالة الكندي لكل شخص الإجراءات القانونية الواجبة بموجب القانون. ويقوم نظامنا القضائي على قرينة البراءة في المسائل الجنائية، أي أن كل شخص بريء حتى تثبت إدانته."},"questions":[{"type":"mc","q":{"en":"What is the presumption of innocence?","fr":"Qu’est-ce que la présomption d’innocence?"},"options":{"en":["The police decide who is guilty","Everyone is innocent until proven guilty","Judges are above the law","Only citizens can be tried in court"],"fr":["La police décide qui est coupable","Chacun est innocent jusqu’à preuve du contraire","Les juges sont au-dessus des lois","Seuls les citoyens peuvent être jugés par un tribunal"]},"answer":1},{"type":"tf","q":{"en":"In Canada, a person accused of a crime is presumed guilty until proven innocent.","fr":"Au Canada, une personne accusée d’un crime est présumée coupable jusqu’à preuve du contraire."},"answer":false},{"type":"mc","q":{"en":"The Canadian judicial system is founded on which principle in criminal matters?","fr":"Sur quel principe le système judiciaire canadien est-il fondé dans les affaires criminelles?"},"options":{"en":["Trial by the Governor General","Majority vote of the community","The presumption of innocence","Compulsory military service"],"fr":["Le procès par le gouverneur général","Le vote majoritaire de la communauté","La présomption d’innocence","Le service militaire obligatoire"]},"answer":2}]},{"id":"justice-002","topic":"legal-heritage","importance":3,"en":"Canada’s legal system is based on a heritage that includes the rule of law, freedom under the law, democratic principles and due process. Due process is the principle that the government must respect all of the legal rights a person is entitled to under the law.","en_simple":"Canada's legal system has 4 foundations: the rule of law, freedom under the law, democratic principles, and due process. Due process = the government must respect all of a person's legal rights.","fr":"Le système juridique du Canada se fonde sur un héritage qui comprend la primauté du droit, la liberté prévue par la loi, les principes démocratiques et l’application régulière de la loi. L’application régulière de la loi est le principe selon lequel le gouvernement doit respecter toutes les garanties juridiques auxquelles a droit une personne en vertu de la loi.","tr":{"ar":"يستند النظام القانوني الكندي إلى إرث يشمل سيادة القانون، والحرية في ظل القانون، والمبادئ الديمقراطية، والإجراءات القانونية الواجبة. والإجراءات القانونية الواجبة هي المبدأ القائل بأن على الحكومة احترام جميع الحقوق القانونية التي يستحقها الشخص بموجب القانون."},"questions":[{"type":"mc","q":{"en":"What is due process?","fr":"Qu’est-ce que l’application régulière de la loi?"},"options":{"en":["The right to vote in every election","The way a bill becomes law in Parliament","The process for choosing judges","The principle that the government must respect all the legal rights a person is entitled to under the law"],"fr":["Le droit de voter à toutes les élections","La façon dont un projet de loi devient une loi au Parlement","Le processus de nomination des juges","Le principe selon lequel le gouvernement doit respecter toutes les garanties juridiques auxquelles a droit une personne"]},"answer":3},{"type":"mc","q":{"en":"Which of the following is part of the heritage on which Canada’s legal system is based?","fr":"Lequel des éléments suivants fait partie de l’héritage sur lequel se fonde le système juridique du Canada?"},"options":{"en":["Freedom under the law","Compulsory military service","The supremacy of the police","Trial by combat"],"fr":["La liberté prévue par la loi","Le service militaire obligatoire","La suprématie de la police","Le procès par combat"]},"answer":0},{"type":"mc","q":{"en":"Name the four elements of the heritage on which Canada’s legal system is based.","fr":"Nommez les quatre éléments de l’héritage sur lequel se fonde le système juridique du Canada."},"options":{"en":["Common law, civil law, the Charter and Magna Carta","The rule of law, freedom under the law, democratic principles and due process","The monarchy, Parliament, the Senate and the courts","Mobility rights, language rights, equality rights and voting rights"],"fr":["La common law, le droit civil, la Charte et la Magna Carta","La primauté du droit, la liberté prévue par la loi, les principes démocratiques et l’application régulière de la loi","La monarchie, le Parlement, le Sénat et les tribunaux","La liberté de circulation, les droits linguistiques, les droits à l’égalité et le droit de vote"]},"answer":1}]},{"id":"justice-003","topic":"lady-justice","importance":2,"en":"The blindfolded Lady Justice symbolizes the impartial manner in which our laws are administered: blind to all considerations but the facts.","en_simple":"Lady Justice wears a blindfold. It means the law is applied impartially, looking only at the facts.","fr":"Les yeux bandés de la statue représentant la Justice symbolisent l’impartialité avec laquelle nos lois sont appliquées : aveugles à toutes les considérations sauf les faits.","tr":{"ar":"ترمز سيدة العدالة المعصوبة العينين إلى الطريقة المحايدة التي تُطبَّق بها قوانيننا: عمياء عن كل الاعتبارات ما عدا الحقائق."},"questions":[{"type":"mc","q":{"en":"What does the blindfold on Lady Justice symbolize?","fr":"Que symbolisent les yeux bandés de la statue de la Justice?"},"options":{"en":["That the laws are secret","That laws are administered impartially, blind to all considerations but the facts","That judges cannot see the accused","That justice is slow"],"fr":["Que les lois sont secrètes","Que les lois sont appliquées avec impartialité, aveugles à toutes les considérations sauf les faits","Que les juges ne peuvent pas voir l’accusé","Que la justice est lente"]},"answer":1}]},{"id":"justice-004","topic":"system-of-laws","importance":3,"en":"Canada is governed by an organized system of laws. These laws are the written rules intended to guide people in our society. They are made by elected representatives. The courts settle disputes and the police enforce the laws.","en_simple":"Laws are written rules made by elected representatives. Courts settle disputes. Police enforce the laws.","fr":"Le Canada est régi par un système organisé de lois. Ces lois sont des règles écrites ayant pour but de guider les individus dans notre société. Elles sont rédigées par des représentants élus. Les tribunaux règlent les conflits et la police fait respecter les lois.","tr":{"ar":"تُحكم كندا بنظام منظّم من القوانين. وهذه القوانين قواعد مكتوبة تهدف إلى توجيه الناس في مجتمعنا. ويضعها ممثلون منتخبون. وتفصل المحاكم في النزاعات، وتفرض الشرطة تطبيق القوانين."},"questions":[{"type":"mc","q":{"en":"Who makes the laws in Canada?","fr":"Qui rédige les lois au Canada?"},"options":{"en":["The police","Elected representatives","The courts","The Royal Canadian Mounted Police"],"fr":["La police","Des représentants élus","Les tribunaux","La Gendarmerie royale du Canada"]},"answer":1},{"type":"mc","q":{"en":"What is the role of the courts in Canada?","fr":"Quel est le rôle des tribunaux au Canada?"},"options":{"en":["To make the laws","To enforce the laws","To settle disputes","To elect the Prime Minister"],"fr":["Rédiger les lois","Faire respecter les lois","Régler les conflits","Élire le premier ministre"]},"answer":2},{"type":"tf","q":{"en":"In Canada, the courts enforce the laws and the police settle disputes.","fr":"Au Canada, les tribunaux font respecter les lois et la police règle les conflits."},"answer":false}]},{"id":"justice-005","topic":"law-applies-to-all","importance":3,"en":"The law in Canada applies to everyone, including judges, politicians and the police. Our laws are intended to provide order in society and a peaceful way to settle disputes, and to express the values and beliefs of Canadians.","en_simple":"The law applies to everyone, including judges, politicians and police. Laws have 3 purposes: order in society, a peaceful way to settle disputes, and expressing Canadian values and beliefs.","fr":"Au Canada, la loi s’applique à tous, y compris aux juges, aux politiciens et à la police. Nos lois ont pour objectifs de maintenir l’ordre dans la société, de fournir un moyen pacifique de régler les conflits et d’exprimer les valeurs et les croyances des Canadiens.","tr":{"ar":"ينطبق القانون في كندا على الجميع، بمن فيهم القضاة والسياسيون والشرطة. وتهدف قوانيننا إلى توفير النظام في المجتمع، وطريقة سلمية لتسوية النزاعات، والتعبير عن قيم الكنديين ومعتقداتهم."},"questions":[{"type":"tf","q":{"en":"In Canada, the law applies to everyone, including judges, politicians and the police.","fr":"Au Canada, la loi s’applique à tous, y compris aux juges, aux politiciens et à la police."},"answer":true},{"type":"mc","q":{"en":"Who is exempt from the law in Canada?","fr":"Qui est exempté de la loi au Canada?"},"options":{"en":["Judges","Politicians","The police","No one"],"fr":["Les juges","Les politiciens","La police","Personne"]},"answer":3},{"type":"mc","q":{"en":"What is one purpose of Canada’s laws?","fr":"Quel est l’un des objectifs des lois canadiennes?"},"options":{"en":["To provide a peaceful way to settle disputes","To limit the number of immigrants","To choose the Governor General","To set the price of goods"],"fr":["Fournir un moyen pacifique de régler les conflits","Limiter le nombre d’immigrants","Choisir le gouverneur général","Fixer le prix des biens"]},"answer":0}]},{"id":"justice-006","topic":"courts","importance":3,"en":"The Supreme Court of Canada is our country’s highest court. The Federal Court of Canada deals with matters concerning the federal government.","en_simple":"The Supreme Court of Canada is the highest court. The Federal Court of Canada handles matters about the federal government.","fr":"La Cour suprême du Canada est le plus haut tribunal de notre pays. La Cour fédérale du Canada s’occupe des questions concernant le gouvernement fédéral.","tr":{"ar":"المحكمة العليا لكندا (Supreme Court of Canada) هي أعلى محكمة في بلدنا. وتتولى المحكمة الفدرالية لكندا (Federal Court of Canada) المسائل المتعلقة بالحكومة الفدرالية."},"questions":[{"type":"mc","q":{"en":"What is the highest court in Canada?","fr":"Quel est le plus haut tribunal au Canada?"},"options":{"en":["The Federal Court of Canada","The Court of King’s Bench","The Supreme Court of Canada","The Court of Appeal"],"fr":["La Cour fédérale du Canada","La Cour du Banc du Roi","La Cour suprême du Canada","La Cour d’appel"]},"answer":2},{"type":"mc","q":{"en":"Which court deals with matters concerning the federal government?","fr":"Quel tribunal s’occupe des questions concernant le gouvernement fédéral?"},"options":{"en":["The Federal Court of Canada","Small claims court","Traffic court","Family court"],"fr":["La Cour fédérale du Canada","Le tribunal des petites créances","La cour des infractions routières","Le tribunal de la famille"]},"answer":0},{"type":"tf","q":{"en":"The Federal Court of Canada is the highest court in the country.","fr":"La Cour fédérale du Canada est le plus haut tribunal du pays."},"answer":false}]},{"id":"justice-007","topic":"courts","importance":2,"en":"In most provinces there is an appeal court and a trial court, sometimes called the Court of Queen’s Bench (now Court of King’s Bench) or the Supreme Court.","en_simple":"Most provinces have an appeal court and a trial court. The trial court is sometimes called the Court of King's Bench or the Supreme Court.","fr":"Dans la plupart des provinces, il y a une cour d’appel et une cour de première instance, qu’on appelle parfois Cour du Banc de la Reine (aujourd’hui Cour du Banc du Roi) ou Cour suprême.","tr":{"ar":"في معظم المقاطعات توجد محكمة استئناف ومحكمة ابتدائية، تُسمى أحيانًا محكمة مقعد الملكة (الآن محكمة مقعد الملك، Court of King’s Bench) أو المحكمة العليا."},"questions":[{"type":"mc","q":{"en":"What two kinds of courts exist in most provinces?","fr":"Quels deux types de tribunaux existent dans la plupart des provinces?"},"options":{"en":["A federal court and a military court","An appeal court and a trial court","A Senate court and a House court","A tax court and a labour court"],"fr":["Une cour fédérale et un tribunal militaire","Une cour d’appel et une cour de première instance","Un tribunal du Sénat et un tribunal de la Chambre","Une cour de l’impôt et un tribunal du travail"]},"answer":1},{"type":"mc","q":{"en":"A provincial trial court is sometimes called the…","fr":"Une cour provinciale de première instance est parfois appelée…"},"options":{"en":["Federal Court","Court of King’s Bench","Small claims court","Traffic court"],"fr":["Cour fédérale","Cour du Banc du Roi","Tribunal des petites créances","Cour des infractions routières"]},"answer":1}]},{"id":"justice-008","topic":"courts","importance":2,"en":"There are also provincial courts for lesser offences, family courts, traffic courts and small claims courts for civil cases involving small sums of money.","en_simple":"There are also provincial courts for smaller offences, family courts, traffic courts, and small claims courts (civil cases about small amounts of money).","fr":"Il y a aussi des tribunaux provinciaux pour des infractions de moindre importance, comme les tribunaux de la famille, les cours des infractions routières, et les tribunaux des petites créances pour les affaires civiles concernant de petites sommes d’argent.","tr":{"ar":"توجد أيضًا محاكم مقاطعات للجرائم الأقل خطورة، ومحاكم الأسرة، ومحاكم المرور، ومحاكم المطالبات الصغيرة للقضايا المدنية المتعلقة بمبالغ مالية صغيرة."},"questions":[{"type":"mc","q":{"en":"Which court handles civil cases involving small sums of money?","fr":"Quel tribunal traite les affaires civiles concernant de petites sommes d’argent?"},"options":{"en":["The Supreme Court of Canada","The Federal Court","Family court","Small claims court"],"fr":["La Cour suprême du Canada","La Cour fédérale","Le tribunal de la famille","Le tribunal des petites créances"]},"answer":3},{"type":"tf","q":{"en":"Provincial courts deal with lesser offences.","fr":"Les tribunaux provinciaux s’occupent des infractions de moindre importance."},"answer":true}]},{"id":"justice-009","topic":"police-role","importance":2,"en":"The police are there to keep people safe and to enforce the law. You can ask the police for help in all kinds of situations—if there’s been an accident, if someone has stolen something from you, if you are a victim of assault, if you see a crime taking place or if someone you know has gone missing.","en_simple":"Police keep people safe and enforce the law. Ask police for help after an accident, a theft, an assault, if you see a crime, or if someone is missing.","fr":"Le rôle de la police est de veiller à la sécurité des gens et à l’application de la loi. Vous pouvez demander l’aide de la police dans toutes sortes de situations – s’il y a eu un accident, si quelqu’un vous a volé quelque chose, si vous êtes victime d’une agression, si vous êtes témoin d’un crime ou si quelqu’un que vous connaissez a disparu.","tr":{"ar":"الشرطة موجودة للحفاظ على سلامة الناس وفرض القانون. يمكنك طلب مساعدة الشرطة في جميع أنواع الحالات: إذا وقع حادث، أو إذا سرق أحدهم شيئًا منك، أو إذا كنت ضحية اعتداء، أو إذا رأيت جريمة تُرتكب، أو إذا فُقد شخص تعرفه."},"questions":[{"type":"mc","q":{"en":"What is the role of the police in Canada?","fr":"Quel est le rôle de la police au Canada?"},"options":{"en":["To make the laws","To keep people safe and enforce the law","To settle disputes between citizens","To appoint judges"],"fr":["Rédiger les lois","Veiller à la sécurité des gens et à l’application de la loi","Régler les conflits entre citoyens","Nommer les juges"]},"answer":1},{"type":"mc","q":{"en":"In which situation does the guide say you can ask the police for help?","fr":"Dans quelle situation le guide dit-il que vous pouvez demander l’aide de la police?"},"options":{"en":["If you want to vote in an election","If you need a passport","If someone you know has gone missing","If you want to buy a house"],"fr":["Si vous voulez voter à une élection","Si vous avez besoin d’un passeport","Si quelqu’un que vous connaissez a disparu","Si vous voulez acheter une maison"]},"answer":2}]},{"id":"justice-010","topic":"types-of-police","importance":3,"en":"There are different types of police in Canada. There are provincial police forces in Ontario and Quebec and municipal police departments in all provinces. The Royal Canadian Mounted Police (RCMP) enforce federal laws throughout Canada, and serve as the provincial police in all provinces and territories except Ontario and Quebec, as well as in some municipalities.","en_simple":"Ontario and Quebec have their own provincial police. All provinces have municipal police. The RCMP enforces federal laws across Canada and is the provincial police everywhere except Ontario and Quebec.","fr":"Il y a différents genres de police au Canada. Il y a des services de police provinciaux en Ontario et au Québec et des services de police municipaux dans toutes les provinces. La Gendarmerie royale du Canada (GRC) applique les lois fédérales dans l’ensemble du Canada et sert de police provinciale dans toutes les provinces et tous les territoires, sauf l’Ontario et le Québec, ainsi que dans certaines municipalités.","tr":{"ar":"توجد أنواع مختلفة من الشرطة في كندا. هناك قوات شرطة مقاطعات في أونتاريو وكيبيك، وأقسام شرطة بلدية في جميع المقاطعات. وتفرض شرطة الخيالة الملكية الكندية (RCMP) القوانين الفدرالية في جميع أنحاء كندا، وتعمل كشرطة مقاطعات في جميع المقاطعات والأقاليم ما عدا أونتاريو وكيبيك، وكذلك في بعض البلديات."},"questions":[{"type":"mc","q":{"en":"Which two provinces have their own provincial police forces?","fr":"Quelles deux provinces ont leur propre service de police provincial?"},"options":{"en":["British Columbia and Alberta","Ontario and Quebec","Nova Scotia and New Brunswick","Manitoba and Saskatchewan"],"fr":["La Colombie-Britannique et l’Alberta","L’Ontario et le Québec","La Nouvelle-Écosse et le Nouveau-Brunswick","Le Manitoba et la Saskatchewan"]},"answer":1},{"type":"mc","q":{"en":"What does the Royal Canadian Mounted Police (RCMP) do?","fr":"Que fait la Gendarmerie royale du Canada (GRC)?"},"options":{"en":["Enforces federal laws throughout Canada","Serves only as the police of Ottawa","Makes federal laws","Serves as the provincial police in Ontario and Quebec"],"fr":["Elle applique les lois fédérales dans l’ensemble du Canada","Elle sert uniquement de police à Ottawa","Elle rédige les lois fédérales","Elle sert de police provinciale en Ontario et au Québec"]},"answer":0},{"type":"tf","q":{"en":"The RCMP serves as the provincial police in Ontario and Quebec.","fr":"La GRC sert de police provinciale en Ontario et au Québec."},"answer":false},{"type":"mc","q":{"en":"Which type of police department exists in all provinces?","fr":"Quel type de service de police existe dans toutes les provinces?"},"options":{"en":["Provincial police","Military police","Municipal police","Border police"],"fr":["La police provinciale","La police militaire","La police municipale","La police frontalière"]},"answer":2}]},{"id":"justice-011","topic":"questioning-police","importance":3,"en":"You can also question the police about their service or conduct if you feel you need to. Almost all police forces in Canada have a process by which you can bring your concerns to the police and seek action.","en_simple":"Yes, you can question the police about their service or conduct. Almost all police forces have a process for complaints.","fr":"Vous pouvez aussi poser des questions aux agents de police au sujet de leurs services ou de leur conduite si vous avez l’impression que vous devez le faire. Presque tous les services de police au Canada ont un processus grâce auquel vous pouvez faire part de vos préoccupations et demander que des mesures soient prises.","tr":{"ar":"يمكنك أيضًا مساءلة الشرطة بشأن خدمتها أو سلوكها إذا شعرت بالحاجة إلى ذلك. ولدى جميع قوات الشرطة في كندا تقريبًا إجراء يتيح لك عرض مخاوفك على الشرطة وطلب اتخاذ إجراء."},"questions":[{"type":"tf","q":{"en":"In Canada, you are allowed to question the police about their service or conduct.","fr":"Au Canada, vous avez le droit de poser des questions à la police au sujet de ses services ou de sa conduite."},"answer":true},{"type":"mc","q":{"en":"In Canada, are you allowed to question the police about their service or conduct?","fr":"Au Canada, avez-vous le droit de poser des questions à la police au sujet de ses services ou de sa conduite?"},"options":{"en":["No, never","Only if you are a lawyer","Yes, and almost all police forces have a process for bringing concerns","Only in Ontario and Quebec"],"fr":["Non, jamais","Seulement si vous êtes avocat","Oui, et presque tous les services de police ont un processus pour faire part de vos préoccupations","Seulement en Ontario et au Québec"]},"answer":2}]},{"id":"justice-012","topic":"legal-help","importance":2,"en":"Lawyers can help you with legal problems and act for you in court. If you cannot pay for a lawyer, in most communities there are legal aid services available free of charge or at a low cost.","en_simple":"Lawyers help with legal problems and represent you in court. If you cannot pay, most communities have legal aid that is free or low cost.","fr":"Des avocats peuvent vous aider à résoudre des problèmes juridiques et vous représenter en cour. Si vous ne pouvez pas payer les services d’un avocat, la plupart des communautés offrent des services d’aide juridique gratuitement ou à un faible coût.","tr":{"ar":"يمكن للمحامين مساعدتك في المشكلات القانونية وتمثيلك في المحكمة. وإذا لم تستطع دفع أتعاب محامٍ، فإن معظم المجتمعات توفر خدمات المساعدة القانونية مجانًا أو بتكلفة منخفضة."},"questions":[{"type":"mc","q":{"en":"What can you do if you cannot pay for a lawyer?","fr":"Que pouvez-vous faire si vous ne pouvez pas payer les services d’un avocat?"},"options":{"en":["Ask the police to represent you","Use legal aid services, available free or at low cost in most communities","Ask a judge to pay for one","You cannot go to court"],"fr":["Demander à la police de vous représenter","Recourir aux services d’aide juridique, offerts gratuitement ou à faible coût dans la plupart des communautés","Demander à un juge d’en payer un","Vous ne pouvez pas aller en cour"]},"answer":1},{"type":"tf","q":{"en":"Lawyers can act for you in court.","fr":"Les avocats peuvent vous représenter en cour."},"answer":true}]},{"id":"justice-013","topic":"prisons","importance":1,"en":"Prisons have an essential role in punishing criminals and deterring crime.","en_simple":"Prisons punish criminals and deter (prevent) crime.","fr":"Les prisons jouent un rôle essentiel en punissant les criminels et en prévenant le crime.","tr":{"ar":"تؤدي السجون دورًا أساسيًا في معاقبة المجرمين وردع الجريمة."},"questions":[{"type":"mc","q":{"en":"According to the guide, what is the essential role of prisons?","fr":"Selon le guide, quel est le rôle essentiel des prisons?"},"options":{"en":["Making laws","Settling disputes","Punishing criminals and deterring crime","Training police officers"],"fr":["Rédiger les lois","Régler les conflits","Punir les criminels et prévenir le crime","Former les policiers"]},"answer":2}]}]},{"unit":"symbols","order":9,"title":{"en":"Canadian Symbols","fr":"Les symboles canadiens"},"title_tr":{"ar":"الرموز الكندية"},"source":{"en":"12-canadian-symbols","fr":"12-symboles-canadiens"},"cards":[{"id":"symbols-001","topic":"symbols-intro","importance":2,"en":"Canada has many important symbols — objects, events, and people that have special meaning. Together they help explain what it means to be Canadian and express our national identity.","en_simple":"Canadian symbols are objects, events and people with special meaning. Examples: the maple leaf, the beaver, the flag, the Crown, hockey.","fr":"Le Canada a beaucoup de symboles importants – des objets, des événements et des personnes qui ont un sens particulier. Ensemble, ils aident à expliquer ce que signifie être Canadien et à façonner notre identité nationale.","tr":{"ar":"لكندا رموز مهمة كثيرة — أشياء وأحداث وأشخاص لهم معنى خاص. وهي معًا تساعد على شرح معنى أن يكون المرء كنديًا وتعبّر عن هويتنا الوطنية."},"questions":[{"type":"mc","q":{"en":"Name two Canadian symbols.","fr":"Nommez deux symboles canadiens."},"options":{"en":["The bald eagle and the dollar","The maple leaf and the beaver","The Statue of Liberty and the rose","The kangaroo and the thistle"],"fr":["Le pygargue à tête blanche et le dollar","La feuille d’érable et le castor","La statue de la Liberté et la rose","Le kangourou et le chardon"]},"answer":1}]},{"id":"symbols-002","topic":"crown","importance":3,"en":"The Crown has been a symbol of the state in Canada for 400 years. Canada has been a constitutional monarchy in its own right since Confederation in 1867 during Queen Victoria’s reign.","en_simple":"The Crown has been a symbol of the state in Canada for 400 years. Canada became a constitutional monarchy in 1867 (Confederation), when Queen Victoria was Queen.","fr":"La Couronne est un symbole de l’État au Canada depuis 400 ans. Le Canada est une monarchie constitutionnelle à part entière depuis la Confédération en 1867, pendant le règne de la reine Victoria.","tr":{"ar":"كان التاج رمزًا للدولة في كندا منذ 400 عام. وكندا ملكية دستورية بحد ذاتها منذ الاتحاد الكونفدرالي عام 1867 في عهد الملكة فيكتوريا (Queen Victoria)."},"questions":[{"type":"mc","q":{"en":"For how long has the Crown been a symbol of the state in Canada?","fr":"Depuis combien de temps la Couronne est-elle un symbole de l’État au Canada?"},"options":{"en":["100 years","200 years","400 years","800 years"],"fr":["100 ans","200 ans","400 ans","800 ans"]},"answer":2},{"type":"mc","q":{"en":"Who was the Sovereign at the time of Confederation in 1867?","fr":"Qui était le souverain au moment de la Confédération en 1867?"},"options":{"en":["Queen Elizabeth II","Queen Victoria","King George VI","King Charles III"],"fr":["La reine Elizabeth II","La reine Victoria","Le roi George VI","Le roi Charles III"]},"answer":1},{"type":"tf","q":{"en":"Canada has been a constitutional monarchy in its own right since Confederation in 1867.","fr":"Le Canada est une monarchie constitutionnelle à part entière depuis la Confédération en 1867."},"answer":true}]},{"id":"symbols-003","topic":"crown","importance":3,"en":"Queen Elizabeth II, who has been Queen of Canada since 1952, marked her Golden Jubilee in 2002, and celebrates her Diamond Jubilee (60 years as Sovereign) in 2012. (Note: the Oath of Citizenship now names the current Sovereign, King Charles III.)","en_simple":"Queen Elizabeth II became Queen of Canada in 1952. Golden Jubilee (50 years) = 2002. Diamond Jubilee (60 years) = 2012. Today the Sovereign is King Charles III.","fr":"La reine Elizabeth II est devenue la reine du Canada en 1952 et a célébré son jubilé d’or en tant que souveraine en 2002. Son jubilé de diamant (60 ans de règne) sera célébré en 2012.","tr":{"ar":"الملكة إليزابيث الثانية (Queen Elizabeth II)، التي أصبحت ملكة كندا عام 1952، احتفلت بيوبيلها الذهبي عام 2002، وبيوبيلها الماسي (60 عامًا على العرش) عام 2012. (ملاحظة: يذكر قَسَم المواطنة الآن الملك الحالي، الملك تشارلز الثالث (King Charles III).)"},"questions":[{"type":"mc","q":{"en":"In what year did Queen Elizabeth II become Queen of Canada?","fr":"En quelle année la reine Elizabeth II est-elle devenue reine du Canada?"},"options":{"en":["1867","1921","1952","1965"],"fr":["1867","1921","1952","1965"]},"answer":2},{"type":"mc","q":{"en":"What did Queen Elizabeth II celebrate in 2012?","fr":"Qu’a célébré la reine Elizabeth II en 2012?"},"options":{"en":["Her Golden Jubilee","Her Diamond Jubilee (60 years as Sovereign)","Her coronation","Her Silver Jubilee"],"fr":["Son jubilé d’or","Son jubilé de diamant (60 ans de règne)","Son couronnement","Son jubilé d’argent"]},"answer":1},{"type":"tf","q":{"en":"Queen Elizabeth II marked her Golden Jubilee in 2002.","fr":"La reine Elizabeth II a célébré son jubilé d’or en 2002."},"answer":true}]},{"id":"symbols-004","topic":"crown","importance":2,"en":"The Crown is a symbol of government, including Parliament, the legislatures, the courts, police services and the Canadian Forces.","en_simple":"The Crown is a symbol of government: Parliament, the legislatures, the courts, the police and the Canadian Forces.","fr":"La Couronne est un symbole du gouvernement, y compris du Parlement, des assemblées législatives, des tribunaux, des services de police et des forces canadiennes.","tr":{"ar":"التاج رمز للحكومة، بما في ذلك البرلمان والمجالس التشريعية والمحاكم وخدمات الشرطة والقوات الكندية."},"questions":[{"type":"mc","q":{"en":"The Crown is a symbol of which of the following?","fr":"La Couronne est un symbole de quoi parmi les éléments suivants?"},"options":{"en":["Government, including Parliament, the courts and the police","The Hudson’s Bay Company","The National Hockey League","The provinces only"],"fr":["Du gouvernement, y compris du Parlement, des tribunaux et de la police","De la Compagnie de la Baie d’Hudson","De la Ligue nationale de hockey","Des provinces seulement"]},"answer":0}]},{"id":"symbols-005","topic":"flag","importance":3,"en":"A new Canadian flag was raised for the first time in 1965.","en_simple":"The current Canadian flag (red maple leaf) was first raised in 1965.","fr":"Un nouveau drapeau canadien a été hissé pour la première fois en 1965.","tr":{"ar":"رُفع العلم الكندي الجديد لأول مرة عام 1965."},"questions":[{"type":"mc","q":{"en":"In what year was the new Canadian flag raised for the first time?","fr":"En quelle année le nouveau drapeau canadien a-t-il été hissé pour la première fois?"},"options":{"en":["1921","1948","1965","1980"],"fr":["1921","1948","1965","1980"]},"answer":2},{"type":"tf","q":{"en":"The new Canadian flag was raised for the first time in 1867.","fr":"Le nouveau drapeau canadien a été hissé pour la première fois en 1867."},"answer":false}]},{"id":"symbols-006","topic":"flag","importance":3,"en":"The red-white-red pattern comes from the flag of the Royal Military College, Kingston, founded in 1876.","en_simple":"The red-white-red pattern of the flag comes from the flag of the Royal Military College in Kingston (founded 1876).","fr":"Le motif rouge-blanc-rouge s’inspire du drapeau du Collège militaire royal de Kingston, fondé en 1876.","tr":{"ar":"يأتي نمط الأحمر-الأبيض-الأحمر من علم الكلية العسكرية الملكية (Royal Military College) في كينغستون، التي تأسست عام 1876."},"questions":[{"type":"mc","q":{"en":"Where does the red-white-red pattern of the Canadian flag come from?","fr":"D’où vient le motif rouge-blanc-rouge du drapeau canadien?"},"options":{"en":["The flag of the Hudson’s Bay Company","The flag of the Royal Military College, Kingston","The flag of Quebec","The Union Jack"],"fr":["Du drapeau de la Compagnie de la Baie d’Hudson","Du drapeau du Collège militaire royal de Kingston","Du drapeau du Québec","De l’Union Jack"]},"answer":1},{"type":"mc","q":{"en":"In what year was the Royal Military College, Kingston, founded?","fr":"En quelle année le Collège militaire royal de Kingston a-t-il été fondé?"},"options":{"en":["1834","1876","1892","1921"],"fr":["1834","1876","1892","1921"]},"answer":1}]},{"id":"symbols-007","topic":"flag","importance":3,"en":"Red and white had been colours of France and England since the Middle Ages and the national colours of Canada since 1921.","en_simple":"Red and white are the national colours of Canada since 1921. They were the colours of France and England since the Middle Ages.","fr":"Le rouge et le blanc sont les couleurs de la France et de l’Angleterre depuis le Moyen Âge et les couleurs nationales du Canada depuis 1921.","tr":{"ar":"كان الأحمر والأبيض لونَي فرنسا وإنجلترا منذ العصور الوسطى، وهما اللونان الوطنيان لكندا منذ عام 1921."},"questions":[{"type":"mc","q":{"en":"Since what year have red and white been the national colours of Canada?","fr":"Depuis quelle année le rouge et le blanc sont-ils les couleurs nationales du Canada?"},"options":{"en":["1867","1921","1948","1965"],"fr":["1867","1921","1948","1965"]},"answer":1},{"type":"mc","q":{"en":"What are the national colours of Canada?","fr":"Quelles sont les couleurs nationales du Canada?"},"options":{"en":["Blue and white","Red and white","Red and blue","Green and white"],"fr":["Bleu et blanc","Rouge et blanc","Rouge et bleu","Vert et blanc"]},"answer":1}]},{"id":"symbols-008","topic":"flag","importance":3,"en":"The Union Jack is our official Royal Flag.","en_simple":"The Union Jack is Canada's official Royal Flag.","fr":"Le drapeau de l’Union Jack est notre drapeau royal officiel.","tr":{"ar":"علم الاتحاد (Union Jack) هو علمنا الملكي الرسمي."},"questions":[{"type":"mc","q":{"en":"What is Canada’s official Royal Flag?","fr":"Quel est le drapeau royal officiel du Canada?"},"options":{"en":["The Canadian Red Ensign","The Maple Leaf flag","The Union Jack","The fleur-de-lys flag"],"fr":["Le Red Ensign canadien","Le drapeau à la feuille d’érable","L’Union Jack","Le drapeau à la fleur de lys"]},"answer":2}]},{"id":"symbols-009","topic":"flag","importance":2,"en":"The Canadian Red Ensign served as the Canadian flag for about 100 years, and has been carried officially by veterans since 2005. The provinces and territories also have flags that embody their distinct traditions.","en_simple":"Before 1965, the Canadian Red Ensign was Canada's flag for about 100 years. Veterans carry it officially since 2005. Each province and territory has its own flag.","fr":"Le Red Ensign canadien a été le drapeau canadien pendant environ 100 ans, et il est porté officiellement par les anciens combattants depuis 2005. Les provinces et les territoires ont aussi des drapeaux qui expriment leurs traditions distinctes.","tr":{"ar":"كان «الراية الحمراء الكندية» (Canadian Red Ensign) علم كندا لنحو 100 عام، ويحمله قدامى المحاربين رسميًا منذ عام 2005. وللمقاطعات والأقاليم أيضًا أعلام تجسّد تقاليدها المميزة."},"questions":[{"type":"mc","q":{"en":"For about how long did the Canadian Red Ensign serve as the Canadian flag?","fr":"Pendant environ combien de temps le Red Ensign canadien a-t-il été le drapeau canadien?"},"options":{"en":["About 25 years","About 50 years","About 100 years","About 400 years"],"fr":["Environ 25 ans","Environ 50 ans","Environ 100 ans","Environ 400 ans"]},"answer":2},{"type":"tf","q":{"en":"The provinces and territories have their own flags that embody their distinct traditions.","fr":"Les provinces et les territoires ont leurs propres drapeaux qui expriment leurs traditions distinctes."},"answer":true}]},{"id":"symbols-010","topic":"maple-leaf","importance":3,"en":"The maple leaf is Canada’s best-known symbol.","en_simple":"The maple leaf is the best-known symbol of Canada.","fr":"La feuille d’érable est le symbole du Canada le plus connu.","tr":{"ar":"ورقة القيقب هي أشهر رموز كندا."},"questions":[{"type":"mc","q":{"en":"What is Canada’s best-known symbol?","fr":"Quel est le symbole du Canada le plus connu?"},"options":{"en":["The beaver","The fleur-de-lys","The maple leaf","The Crown"],"fr":["Le castor","La fleur de lys","La feuille d’érable","La Couronne"]},"answer":2}]},{"id":"symbols-011","topic":"maple-leaf","importance":2,"en":"Maple leaves were adopted as a symbol by French-Canadians in the 1700s, have appeared on Canadian uniforms and insignia since the 1850s, and are carved into the headstones of our fallen soldiers buried overseas and in Canada.","en_simple":"French-Canadians adopted the maple leaf in the 1700s. It has been on Canadian military uniforms since the 1850s, and is carved on the headstones of fallen soldiers.","fr":"Les feuilles d’érable ont été adoptées comme symbole par les Canadiens français au dix-huitième siècle, elles figurent sur les uniformes et les insignes militaires canadiens depuis les années 1850 et sont gravées sur les pierres tombales de nos soldats morts au combat et enterrés à l’étranger et au Canada.","tr":{"ar":"تبنّى الكنديون الفرنسيون أوراق القيقب رمزًا لهم في القرن الثامن عشر (1700s)، وهي تظهر على الزي العسكري والشارات الكندية منذ خمسينيات القرن التاسع عشر (1850s)، وتُنقش على شواهد قبور جنودنا الذين سقطوا والمدفونين في الخارج وفي كندا."},"questions":[{"type":"mc","q":{"en":"Who adopted the maple leaf as a symbol in the 1700s?","fr":"Qui a adopté la feuille d’érable comme symbole au dix-huitième siècle?"},"options":{"en":["The Hudson’s Bay Company","French-Canadians","The Royal Military College","The Loyalists"],"fr":["La Compagnie de la Baie d’Hudson","Les Canadiens français","Le Collège militaire royal","Les loyalistes"]},"answer":1},{"type":"mc","q":{"en":"Since when have maple leaves appeared on Canadian uniforms and insignia?","fr":"Depuis quand les feuilles d’érable figurent-elles sur les uniformes et les insignes militaires canadiens?"},"options":{"en":["The 1700s","The 1850s","1921","1965"],"fr":["Le dix-huitième siècle","Les années 1850","1921","1965"]},"answer":1}]},{"id":"symbols-012","topic":"fleur-de-lys","importance":2,"en":"It is said that the lily flower (“fleur-de-lys”) was adopted by the French king in the year 496. It became the symbol of French royalty for more than a thousand years, including the colony of New France.","en_simple":"The fleur-de-lys (lily flower) was adopted by the French king in 496. It was the symbol of French royalty for more than 1,000 years, including in New France.","fr":"On prétend que la fleur de lys a été adoptée par le roi français en 496. Elle a été le symbole de la royauté française pendant plus de 1 000 ans et aura été aussi celui de la colonie de la Nouvelle-France.","tr":{"ar":"يُقال إن زهرة الزنبق («فلور دو ليس» fleur-de-lys) تبنّاها الملك الفرنسي عام 496. وأصبحت رمز الملكية الفرنسية لأكثر من ألف عام، بما في ذلك مستعمرة فرنسا الجديدة (New France)."},"questions":[{"type":"mc","q":{"en":"In what year is the fleur-de-lys said to have been adopted by the French king?","fr":"En quelle année la fleur de lys aurait-elle été adoptée par le roi français?"},"options":{"en":["496","1215","1534","1834"],"fr":["496","1215","1534","1834"]},"answer":0},{"type":"mc","q":{"en":"The fleur-de-lys was the symbol of what for more than a thousand years?","fr":"La fleur de lys a été le symbole de quoi pendant plus de mille ans?"},"options":{"en":["English royalty","French royalty","The Catholic Church","The Hudson’s Bay Company"],"fr":["De la royauté anglaise","De la royauté française","De l’Église catholique","De la Compagnie de la Baie d’Hudson"]},"answer":1}]},{"id":"symbols-013","topic":"fleur-de-lys","importance":3,"en":"Revived at Confederation, the fleur-de-lys was included in the Canadian Red Ensign. In 1948 Quebec adopted its own flag, based on the Cross and the fleur-de-lys.","en_simple":"The fleur-de-lys was part of the Canadian Red Ensign. In 1948, Quebec adopted its own flag with the Cross and the fleur-de-lys.","fr":"Elle reprend de l’importance au moment de la Confédération et est incluse dans le Red Ensign canadien. En 1948, le Québec adopte son propre drapeau conçu à partir de la croix et de la fleur de lys.","tr":{"ar":"أُحييت زهرة الزنبق عند الاتحاد الكونفدرالي وأُدرجت في الراية الحمراء الكندية. وفي عام 1948 اعتمدت كيبيك علمها الخاص المستند إلى الصليب وزهرة الزنبق."},"questions":[{"type":"mc","q":{"en":"In what year did Quebec adopt its own flag?","fr":"En quelle année le Québec a-t-il adopté son propre drapeau?"},"options":{"en":["1867","1921","1948","1965"],"fr":["1867","1921","1948","1965"]},"answer":2},{"type":"mc","q":{"en":"The flag of Quebec is based on which symbols?","fr":"Le drapeau du Québec est conçu à partir de quels symboles?"},"options":{"en":["The maple leaf and the beaver","The Cross and the fleur-de-lys","The Union Jack and the Crown","The thistle and the rose"],"fr":["La feuille d’érable et le castor","La croix et la fleur de lys","L’Union Jack et la Couronne","Le chardon et la rose"]},"answer":1}]},{"id":"symbols-014","topic":"coat-of-arms","importance":3,"en":"As an expression of national pride after the First World War, Canada adopted an official coat of arms and a national motto, A Mari Usque Ad Mare, which in Latin means “from sea to sea.”","en_simple":"After World War I, Canada adopted a coat of arms and a motto: A Mari Usque Ad Mare = \"from sea to sea\" (Latin).","fr":"Pour exprimer sa fierté nationale après la Première Guerre mondiale, le Canada a adopté des armoiries officielles et une devise nationale, A mari usque ad mare, ce qui signifie « d’un océan à l’autre ».","tr":{"ar":"تعبيرًا عن الفخر الوطني بعد الحرب العالمية الأولى، اعتمدت كندا شعارًا رسميًا (شعار النبالة) وشعارًا وطنيًا هو «A Mari Usque Ad Mare»، ومعناه باللاتينية «من البحر إلى البحر»."},"questions":[{"type":"mc","q":{"en":"What does Canada’s motto, A Mari Usque Ad Mare, mean?","fr":"Que signifie la devise du Canada, A mari usque ad mare?"},"options":{"en":["Peace, order and good government","From sea to sea","Strong and free","God and my right"],"fr":["Paix, ordre et bon gouvernement","D’un océan à l’autre","Fort et libre","Dieu et mon droit"]},"answer":1},{"type":"mc","q":{"en":"When did Canada adopt an official coat of arms and a national motto?","fr":"Quand le Canada a-t-il adopté des armoiries officielles et une devise nationale?"},"options":{"en":["At Confederation in 1867","After the First World War","After the Second World War","In 1965 with the new flag"],"fr":["À la Confédération en 1867","Après la Première Guerre mondiale","Après la Seconde Guerre mondiale","En 1965 avec le nouveau drapeau"]},"answer":1},{"type":"tf","q":{"en":"Canada’s national motto is written in Latin.","fr":"La devise nationale du Canada est écrite en latin."},"answer":true}]},{"id":"symbols-015","topic":"coat-of-arms","importance":2,"en":"The arms contain symbols of England, France, Scotland and Ireland as well as red maple leaves. Today the arms can be seen on dollar bills, government documents and public buildings.","en_simple":"The coat of arms has symbols of England, France, Scotland and Ireland, plus red maple leaves. You can see it on dollar bills, government documents and public buildings.","fr":"Les armoiries contiennent les symboles de l’Angleterre, de la France, de l’Écosse et de l’Irlande ainsi que des feuilles d’érable rouges. Aujourd’hui, les armoiries sont reproduites sur les billets de banque, les documents gouvernementaux et les édifices publics.","tr":{"ar":"يحتوي شعار النبالة على رموز إنجلترا وفرنسا واسكتلندا وأيرلندا، إضافة إلى أوراق قيقب حمراء. ويمكن اليوم رؤيته على الأوراق النقدية والوثائق الحكومية والمباني العامة."},"questions":[{"type":"mc","q":{"en":"The Canadian coat of arms contains symbols of which four countries?","fr":"Les armoiries du Canada contiennent les symboles de quels quatre pays?"},"options":{"en":["England, France, Scotland and Ireland","England, France, Spain and Portugal","Scotland, Ireland, Wales and Germany","France, Italy, Scotland and the United States"],"fr":["L’Angleterre, la France, l’Écosse et l’Irlande","L’Angleterre, la France, l’Espagne et le Portugal","L’Écosse, l’Irlande, le pays de Galles et l’Allemagne","La France, l’Italie, l’Écosse et les États-Unis"]},"answer":0},{"type":"tf","q":{"en":"The Canadian coat of arms can be seen on dollar bills and public buildings.","fr":"Les armoiries du Canada sont reproduites sur les billets de banque et les édifices publics."},"answer":true}]},{"id":"symbols-016","topic":"parliament-buildings","importance":2,"en":"The towers, arches, sculptures and stained glass of the Parliament Buildings embody the French, English and Aboriginal traditions and the Gothic Revival architecture popular in the time of Queen Victoria. The buildings were completed in the 1860s.","en_simple":"The Parliament Buildings are in the Gothic Revival style (popular in Queen Victoria's time). They were completed in the 1860s.","fr":"Les tours, les voûtes, les sculptures et les vitraux des édifices du Parlement expriment les traditions françaises, anglaises et autochtones ainsi que l’architecture néogothique populaire à l’époque du règne de la reine Victoria. Les édifices ont été terminés dans les années 1860.","tr":{"ar":"تجسّد أبراج مباني البرلمان وأقواسها ومنحوتاتها وزجاجها الملوّن التقاليد الفرنسية والإنجليزية وتقاليد السكان الأصليين، وعمارة إحياء الطراز القوطي التي كانت شائعة في عهد الملكة فيكتوريا. وقد اكتمل بناؤها في ستينيات القرن التاسع عشر (1860s)."},"questions":[{"type":"mc","q":{"en":"In which architectural style are the Parliament Buildings built?","fr":"Dans quel style architectural les édifices du Parlement sont-ils construits?"},"options":{"en":["Second Empire","Baroque","Gothic Revival","Neoclassical"],"fr":["Second Empire","Baroque","Néogothique","Néoclassique"]},"answer":2},{"type":"mc","q":{"en":"When were the Parliament Buildings completed?","fr":"Quand les édifices du Parlement ont-ils été terminés?"},"options":{"en":["In the 1860s","In 1916","In 1922","In 1927"],"fr":["Dans les années 1860","En 1916","En 1922","En 1927"]},"answer":0}]},{"id":"symbols-017","topic":"parliament-buildings","importance":3,"en":"The Centre Block was destroyed by an accidental fire in 1916 and rebuilt in 1922. The Library is the only part of the original building remaining.","en_simple":"A fire destroyed the Centre Block in 1916. It was rebuilt in 1922. Only the Library survived from the original building.","fr":"L’édifice du Centre a été détruit par un incendie accidentel en 1916 et reconstruit en 1922; la Bibliothèque est l’unique partie de l’édifice qui a été épargnée par les flammes.","tr":{"ar":"دُمّر المبنى المركزي (Centre Block) بحريق عرضي عام 1916 وأُعيد بناؤه عام 1922. والمكتبة هي الجزء الوحيد المتبقي من المبنى الأصلي."},"questions":[{"type":"mc","q":{"en":"In what year was the Centre Block of Parliament destroyed by fire?","fr":"En quelle année l’édifice du Centre du Parlement a-t-il été détruit par un incendie?"},"options":{"en":["1867","1916","1922","1927"],"fr":["1867","1916","1922","1927"]},"answer":1},{"type":"mc","q":{"en":"Which is the only part of the original Parliament building that remains?","fr":"Quelle est l’unique partie de l’édifice original du Parlement qui subsiste?"},"options":{"en":["The Peace Tower","The Senate Chamber","The Library","The Memorial Chamber"],"fr":["La Tour de la Paix","La Chambre du Sénat","La Bibliothèque","La Chapelle du Souvenir"]},"answer":2},{"type":"tf","q":{"en":"The Centre Block was rebuilt in 1922.","fr":"L’édifice du Centre a été reconstruit en 1922."},"answer":true}]},{"id":"symbols-018","topic":"parliament-buildings","importance":3,"en":"The Peace Tower was completed in 1927 in memory of the First World War. The Memorial Chamber within the Tower contains the Books of Remembrance in which are written the names of soldiers, sailors and airmen who died serving Canada in wars or while on duty.","en_simple":"The Peace Tower was finished in 1927 to remember World War I. Inside, the Memorial Chamber holds the Books of Remembrance with the names of Canadians who died in service.","fr":"La Tour de la Paix a été terminée en 1927 en souvenir de la Première Guerre mondiale. À l’intérieur de la Tour, la Chapelle du Souvenir contient les Livres du Souvenir, dans lesquels sont écrits les noms des soldats, des marins et des aviateurs qui sont morts au service du Canada dans des guerres ou dans l’exercice de leurs fonctions.","tr":{"ar":"اكتمل بناء برج السلام (Peace Tower) عام 1927 تخليدًا لذكرى الحرب العالمية الأولى. وتضم غرفة الذكرى داخل البرج «كتب الذكرى» التي كُتبت فيها أسماء الجنود والبحّارة والطيارين الذين ماتوا في خدمة كندا في الحروب أو أثناء أداء الواجب."},"questions":[{"type":"mc","q":{"en":"The Peace Tower was completed in 1927 in memory of what?","fr":"La Tour de la Paix a été terminée en 1927 en souvenir de quoi?"},"options":{"en":["Confederation","The First World War","The Second World War","The War of 1812"],"fr":["De la Confédération","De la Première Guerre mondiale","De la Seconde Guerre mondiale","De la guerre de 1812"]},"answer":1},{"type":"mc","q":{"en":"What do the Books of Remembrance in the Memorial Chamber contain?","fr":"Que contiennent les Livres du Souvenir de la Chapelle du Souvenir?"},"options":{"en":["The text of the Constitution","The names of all Prime Ministers","The names of soldiers, sailors and airmen who died serving Canada","The names of Order of Canada recipients"],"fr":["Le texte de la Constitution","Les noms de tous les premiers ministres","Les noms des soldats, des marins et des aviateurs morts au service du Canada","Les noms des membres de l’Ordre du Canada"]},"answer":2}]},{"id":"symbols-019","topic":"legislatures","importance":2,"en":"The Quebec National Assembly is built in the French Second Empire style, while the legislatures of the other provinces are Baroque, Romanesque and neoclassical, reflecting the Greco-Roman heritage of Western civilization in which democracy originated.","en_simple":"The Quebec National Assembly is in the French Second Empire style. Other provincial legislatures are Baroque, Romanesque or neoclassical.","fr":"L’Assemblée nationale du Québec est construite dans le style du Second Empire français, tandis que les assemblées législatives des autres provinces sont d’architecture baroque, romane et néoclassique et reflètent l’héritage gréco-romain de la civilisation occidentale qui a donné naissance à la démocratie.","tr":{"ar":"بُنيت الجمعية الوطنية في كيبيك على طراز الإمبراطورية الفرنسية الثانية، بينما المجالس التشريعية للمقاطعات الأخرى باروكية ورومانسكية وكلاسيكية جديدة، تعكس التراث اليوناني-الروماني للحضارة الغربية التي نشأت فيها الديمقراطية."},"questions":[{"type":"mc","q":{"en":"In which style is the Quebec National Assembly built?","fr":"Dans quel style l’Assemblée nationale du Québec est-elle construite?"},"options":{"en":["Gothic Revival","French Second Empire","Romanesque","Baroque"],"fr":["Néogothique","Second Empire français","Roman","Baroque"]},"answer":1}]},{"id":"symbols-020","topic":"sports","importance":3,"en":"Hockey is Canada’s most popular spectator sport and is considered to be the national winter sport. Ice hockey was developed in Canada in the 1800s.","en_simple":"Hockey is Canada's
