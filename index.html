vil law and French criminal law","French civil and criminal law","American civil and criminal law"],"fr":["Le droit civil français et le droit criminel britannique","Le droit civil britannique et le droit criminel français","Le droit civil et criminel français","Le droit civil et criminel américain"]},"answer":0},{"type":"tf","q":{"en":"The Quebec Act permitted Catholics to hold public office, which was not then allowed in Britain.","fr":"L’Acte de Québec permettait aux catholiques d’exercer des fonctions officielles, ce qui n’était pas autorisé en Grande-Bretagne à l’époque."},"answer":true}]},{"id":"history1-023","topic":"loyalists","importance":3,"en":"In 1776, the 13 British colonies to the south of Quebec declared independence and formed the United States. More than 40,000 people loyal to the Crown, called “Loyalists,” fled the oppression of the American Revolution to settle in Nova Scotia and Quebec.","en_simple":"In 1776, the 13 British colonies became the United States. More than 40,000 \"Loyalists\" (people loyal to the Crown) fled to Nova Scotia and Quebec.","fr":"En 1776, les treize colonies britanniques au sud du Québec proclament leur indépendance et forment les États-Unis. Plus de 40 000 personnes fidèles à la Couronne, les « loyalistes », fuient l’oppression de la Révolution américaine afin de s’établir en Nouvelle-Écosse et au Québec.","tr":{"ar":"في عام 1776، أعلنت المستعمرات البريطانية الثلاث عشرة جنوب كيبيك استقلالها وشكّلت الولايات المتحدة. وفرّ أكثر من 40,000 شخص موالين للتاج، يُسمّون «الموالين» (Loyalists)، من اضطهاد الثورة الأمريكية ليستقروا في نوفا سكوشا وكيبيك."},"questions":[{"type":"mc","q":{"en":"Who were the Loyalists?","fr":"Qui étaient les loyalistes?"},"options":{"en":["French settlers loyal to the King of France","People loyal to the Crown who fled the American Revolution to settle in Canada","Soldiers who fought for the United States","Fur traders of the Hudson’s Bay Company"],"fr":["Des colons français fidèles au roi de France","Des personnes fidèles à la Couronne qui ont fui la Révolution américaine pour s’établir au Canada","Des soldats qui ont combattu pour les États-Unis","Des négociants en fourrures de la Compagnie de la Baie d’Hudson"]},"answer":1},{"type":"mc","q":{"en":"About how many Loyalists fled to Nova Scotia and Quebec?","fr":"Environ combien de loyalistes ont fui vers la Nouvelle-Écosse et le Québec?"},"options":{"en":["More than 3,000","More than 10,000","More than 40,000","More than 100,000"],"fr":["Plus de 3 000","Plus de 10 000","Plus de 40 000","Plus de 100 000"]},"answer":2},{"type":"mc","q":{"en":"In what year did the 13 British colonies declare independence?","fr":"En quelle année les treize colonies britanniques ont-elles proclamé leur indépendance?"},"options":{"en":["1759","1774","1776","1791"],"fr":["1759","1774","1776","1791"]},"answer":2}]},{"id":"history1-024","topic":"loyalists","importance":2,"en":"Joseph Brant led thousands of Loyalist Mohawk Indians into Canada. The Loyalists came from Dutch, German, British, Scandinavian, Aboriginal and other origins and from Presbyterian, Anglican, Baptist, Methodist, Jewish, Quaker, and Catholic religious backgrounds.","en_simple":"Joseph Brant led thousands of Loyalist Mohawk Indians into Canada. The Loyalists came from many origins and religions.","fr":"Joseph Brant conduit des milliers d’Indiens mohawks loyalistes au Canada. Les loyalistes sont notamment d’origine hollandaise, allemande, britannique, scandinave, autochtone et d’autres origines, et de confession presbytérienne, anglicane, baptiste, méthodiste, juive, quaker et catholique.","tr":{"ar":"قاد جوزيف برانت (Joseph Brant) آلاف الهنود الموهوك الموالين إلى كندا. وجاء الموالون من أصول هولندية وألمانية وبريطانية واسكندنافية وأصلية وغيرها، ومن خلفيات دينية مشيخية وأنجليكانية ومعمدانية وميثودية ويهودية وكويكرية وكاثوليكية."},"questions":[{"type":"mc","q":{"en":"Who led thousands of Loyalist Mohawk Indians into Canada?","fr":"Qui a conduit des milliers d’Indiens mohawks loyalistes au Canada?"},"options":{"en":["Chief Tecumseh","Joseph Brant","John Graves Simcoe","Sir Guy Carleton"],"fr":["Le chef Tecumseh","Joseph Brant","John Graves Simcoe","Sir Guy Carleton"]},"answer":1},{"type":"tf","q":{"en":"The Loyalists all came from British origins and the Anglican religion.","fr":"Les loyalistes étaient tous d’origine britannique et de confession anglicane."},"answer":false}]},{"id":"history1-025","topic":"loyalists","importance":2,"en":"About 3,000 black Loyalists, freedmen and slaves, came north seeking a better life. In turn, in 1792, some black Nova Scotians, who were given poor land, moved on to establish Freetown, Sierra Leone (West Africa), a new British colony for freed slaves.","en_simple":"About 3,000 black Loyalists came north. In 1792, some black Nova Scotians, who had been given poor land, left to found Freetown, Sierra Leone, a British colony for freed slaves.","fr":"Quelque 3 000 loyalistes noirs, esclaves ou affranchis, viennent vers le nord à la recherche d’une vie meilleure. Par la suite, certains Néo-Écossais noirs, ayant reçu des terres stériles, se sont rendus en Afrique de l’Ouest en 1792 afin d’y établir Freetown, en Sierra Leone, nouvelle colonie britannique pour les esclaves affranchis.","tr":{"ar":"جاء نحو 3,000 من الموالين السود، من المحررين والعبيد، إلى الشمال بحثًا عن حياة أفضل. وبدورهم، في عام 1792، انتقل بعض سكان نوفا سكوشا السود، الذين مُنحوا أراضي رديئة، لتأسيس فريتاون (Freetown) في سيراليون (غرب أفريقيا)، وهي مستعمرة بريطانية جديدة للعبيد المحررين."},"questions":[{"type":"mc","q":{"en":"About how many black Loyalists came north seeking a better life?","fr":"Environ combien de loyalistes noirs sont venus vers le nord à la recherche d’une vie meilleure?"},"options":{"en":["About 300","About 3,000","About 30,000","About 40,000"],"fr":["Environ 300","Environ 3 000","Environ 30 000","Environ 40 000"]},"answer":1},{"type":"mc","q":{"en":"In 1792, some black Nova Scotians moved on to establish which colony?","fr":"En 1792, certains Néo-Écossais noirs sont partis établir quelle colonie?"},"options":{"en":["Port-Royal, Acadia","Fort Garry, Manitoba","Freetown, Sierra Leone","Kingston, Jamaica"],"fr":["Port-Royal, en Acadie","Fort Garry, au Manitoba","Freetown, en Sierra Leone","Kingston, en Jamaïque"]},"answer":2}]},{"id":"history1-026","topic":"beginnings-of-democracy","importance":3,"en":"Democratic institutions developed gradually and peacefully. The first representative assembly was elected in Halifax, Nova Scotia, in 1758. Prince Edward Island followed in 1773, New Brunswick in 1785.","en_simple":"The first representative assembly was elected in Halifax, Nova Scotia, in 1758. Then Prince Edward Island in 1773 and New Brunswick in 1785.","fr":"Les institutions démocratiques se développent progressivement et pacifiquement. La première assemblée de représentants est élue à Halifax, en Nouvelle-Écosse, en 1758. Vont suivre l’Île-du-Prince-Édouard en 1773 et le Nouveau-Brunswick en 1785.","tr":{"ar":"تطورت المؤسسات الديمقراطية تدريجيًا وسلميًا. انتُخبت أول جمعية تمثيلية في هاليفاكس (Halifax)، نوفا سكوشا، عام 1758. وتبعتها جزيرة الأمير إدوارد عام 1773، ونيو برونزويك عام 1785."},"questions":[{"type":"mc","q":{"en":"Where and when was the first representative assembly elected?","fr":"Où et quand la première assemblée de représentants a-t-elle été élue?"},"options":{"en":["Québec City, 1608","Halifax, Nova Scotia, 1758","Charlottetown, Prince Edward Island, 1773","York, Upper Canada, 1791"],"fr":["Québec, 1608","Halifax, Nouvelle-Écosse, 1758","Charlottetown, Île-du-Prince-Édouard, 1773","York, Haut-Canada, 1791"]},"answer":1},{"type":"mc","q":{"en":"In what year did New Brunswick get its first representative assembly?","fr":"En quelle année le Nouveau-Brunswick a-t-il eu sa première assemblée de représentants?"},"options":{"en":["1758","1773","1785","1791"],"fr":["1758","1773","1785","1791"]},"answer":2},{"type":"tf","q":{"en":"Prince Edward Island elected a representative assembly in 1773.","fr":"L’Île-du-Prince-Édouard a élu une assemblée de représentants en 1773."},"answer":true}]},{"id":"history1-027","topic":"constitutional-act","importance":3,"en":"The Constitutional Act of 1791 divided the Province of Quebec into Upper Canada (later Ontario), which was mainly Loyalist, Protestant and English-speaking, and Lower Canada (later Quebec), heavily Catholic and French-speaking.","en_simple":"The Constitutional Act of 1791 split the Province of Quebec into Upper Canada (now Ontario: Loyalist, Protestant, English) and Lower Canada (now Quebec: Catholic, French).","fr":"L’Acte constitutionnel de 1791 divise la Province de Québec en deux entités, le Haut-Canada (aujourd’hui l’Ontario), essentiellement loyaliste, protestant et anglophone, et le Bas-Canada (aujourd’hui le Québec), surtout catholique et francophone.","tr":{"ar":"قسّم القانون الدستوري (Constitutional Act) لعام 1791 مقاطعة كيبيك إلى كندا العليا (أونتاريو لاحقًا)، التي كانت في معظمها موالية وبروتستانتية وناطقة بالإنجليزية، وكندا السفلى (كيبيك لاحقًا)، الكاثوليكية والناطقة بالفرنسية إلى حد كبير."},"questions":[{"type":"mc","q":{"en":"What did the Constitutional Act of 1791 do?","fr":"Qu’a fait l’Acte constitutionnel de 1791?"},"options":{"en":["United Upper and Lower Canada into one province","Divided the Province of Quebec into Upper Canada and Lower Canada","Created the Dominion of Canada","Restored French civil law"],"fr":["Il a uni le Haut-Canada et le Bas-Canada en une seule province","Il a divisé la Province de Québec en Haut-Canada et Bas-Canada","Il a créé le Dominion du Canada","Il a rétabli le droit civil français"]},"answer":1},{"type":"mc","q":{"en":"Upper Canada later became which province?","fr":"Le Haut-Canada est devenu plus tard quelle province?"},"options":{"en":["Quebec","Nova Scotia","Ontario","Manitoba"],"fr":["Le Québec","La Nouvelle-Écosse","L’Ontario","Le Manitoba"]},"answer":2},{"type":"tf","q":{"en":"Lower Canada was mainly Loyalist, Protestant and English-speaking.","fr":"Le Bas-Canada était essentiellement loyaliste, protestant et anglophone."},"answer":false}]},{"id":"history1-028","topic":"constitutional-act","importance":2,"en":"The Act also granted to the Canadas, for the first time, legislative assemblies elected by the people. The name Canada also became official at this time and has been used ever since. The Atlantic colonies and the two Canadas were known collectively as British North America.","en_simple":"The Constitutional Act gave the Canadas their first elected legislative assemblies. The name Canada became official in 1791. The Atlantic colonies and the two Canadas together were called British North America.","fr":"L’Acte accorde pour la première fois aux deux Canadas des assemblées législatives élues par la population. Le nom Canada devient alors officiel et sera toujours utilisé par la suite. Les colonies de la côte atlantique et les deux Canadas sont appelés collectivement « Amérique du Nord britannique ».","tr":{"ar":"منح القانون أيضًا الكنديتين، لأول مرة، جمعيات تشريعية ينتخبها الشعب. وأصبح اسم كندا رسميًا في ذلك الوقت واستُخدم منذ ذلك الحين. وكانت المستعمرات الأطلسية والكنديتان تُعرف مجتمعةً باسم أمريكا الشمالية البريطانية (British North America)."},"questions":[{"type":"mc","q":{"en":"What were the Atlantic colonies and the two Canadas known as collectively?","fr":"Comment appelait-on collectivement les colonies de la côte atlantique et les deux Canadas?"},"options":{"en":["New France","The Dominion of Canada","British North America","The United Provinces"],"fr":["La Nouvelle-France","Le Dominion du Canada","L’Amérique du Nord britannique","Les Provinces-Unies"]},"answer":2},{"type":"tf","q":{"en":"The name Canada became official with the Constitutional Act of 1791.","fr":"Le nom Canada est devenu officiel avec l’Acte constitutionnel de 1791."},"answer":true}]},{"id":"history1-029","topic":"abolition-of-slavery","importance":3,"en":"In 1793, Upper Canada, led by Lieutenant Governor John Graves Simcoe, a Loyalist military officer, became the first province in the Empire to move toward abolition. Simcoe was Upper Canada’s first Lieutenant Governor and founder of the City of York (now Toronto).","en_simple":"In 1793, Upper Canada, led by Lieutenant Governor John Graves Simcoe, was the first province in the British Empire to move toward ending slavery. Simcoe also founded York (now Toronto).","fr":"En 1793, le Haut-Canada, dirigé par le lieutenant-gouverneur John Graves Simcoe, un officier militaire loyaliste, est la première province de l’Empire à prendre le virage de l’abolition. Le lieutenant-colonel John Graves Simcoe a été le premier lieutenant-gouverneur du Haut-Canada et le fondateur de la ville de York (aujourd’hui Toronto).","tr":{"ar":"في عام 1793، أصبحت كندا العليا، بقيادة نائب الحاكم جون غريفز سيمكو (John Graves Simcoe)، وهو ضابط عسكري موالٍ، أول مقاطعة في الإمبراطورية تتجه نحو إلغاء العبودية. وكان سيمكو أول نائب حاكم لكندا العليا ومؤسس مدينة يورك (تورونتو حاليًا)."},"questions":[{"type":"mc","q":{"en":"Who led Upper Canada to become the first province in the Empire to move toward abolition of slavery in 1793?","fr":"Qui a dirigé le Haut-Canada, première province de l’Empire à prendre le virage de l’abolition de l’esclavage en 1793?"},"options":{"en":["Sir Isaac Brock","Lord Durham","John Graves Simcoe","Sir Guy Carleton"],"fr":["Sir Isaac Brock","Lord Durham","John Graves Simcoe","Sir Guy Carleton"]},"answer":2},{"type":"mc","q":{"en":"John Graves Simcoe founded which city?","fr":"John Graves Simcoe a fondé quelle ville?"},"options":{"en":["Halifax","Kingston","Montreal","York (now Toronto)"],"fr":["Halifax","Kingston","Montréal","York (aujourd’hui Toronto)"]},"answer":3},{"type":"tf","q":{"en":"In 1793, Upper Canada became the first province in the British Empire to move toward abolition of slavery.","fr":"En 1793, le Haut-Canada est devenu la première province de l’Empire britannique à prendre le virage de l’abolition de l’esclavage."},"answer":true}]},{"id":"history1-030","topic":"abolition-of-slavery","importance":3,"en":"In 1807, the British Parliament prohibited the buying and selling of slaves, and in 1833 abolished slavery throughout the Empire.","en_simple":"In 1807, Britain banned buying and selling slaves. In 1833, Britain abolished slavery in the whole Empire.","fr":"En 1807, le Parlement britannique interdit la vente et l’achat d’esclaves et abolit ensuite l’esclavage dans tout l’Empire en 1833.","tr":{"ar":"في عام 1807، حظر البرلمان البريطاني شراء العبيد وبيعهم، وفي عام 1833 ألغى العبودية في جميع أنحاء الإمبراطورية."},"questions":[{"type":"mc","q":{"en":"In what year did the British Parliament abolish slavery throughout the Empire?","fr":"En quelle année le Parlement britannique a-t-il aboli l’esclavage dans tout l’Empire?"},"options":{"en":["1793","1807","1833","1853"],"fr":["1793","1807","1833","1853"]},"answer":2},{"type":"mc","q":{"en":"What did the British Parliament do in 1807?","fr":"Qu’a fait le Parlement britannique en 1807?"},"options":{"en":["Prohibited the buying and selling of slaves","Abolished slavery throughout the Empire","Passed the Quebec Act","United Upper and Lower Canada"],"fr":["Il a interdit la vente et l’achat d’esclaves","Il a aboli l’esclavage dans tout l’Empire","Il a adopté l’Acte de Québec","Il a uni le Haut-Canada et le Bas-Canada"]},"answer":0}]},{"id":"history1-031","topic":"underground-railroad","importance":2,"en":"Thousands of slaves escaped from the United States, followed “the North Star” and settled in Canada via the Underground Railroad, a Christian anti-slavery network.","en_simple":"Thousands of slaves escaped from the United States and came to Canada by the Underground Railroad, a Christian anti-slavery network. They followed \"the North Star.\"","fr":"Des milliers d’esclaves fuient les États-Unis. Ils suivent « l’étoile du Nord » et s’établissent au Canada grâce au « chemin de fer clandestin », un réseau chrétien antiesclavagiste.","tr":{"ar":"هرب آلاف العبيد من الولايات المتحدة، واتبعوا «نجم الشمال» واستقروا في كندا عبر «السكة الحديدية السرية» (Underground Railroad)، وهي شبكة مسيحية مناهضة للعبودية."},"questions":[{"type":"mc","q":{"en":"What was the Underground Railroad?","fr":"Qu’était le « chemin de fer clandestin »?"},"options":{"en":["The first railway in Canada","A Christian anti-slavery network that helped slaves escape to Canada","A Hudson’s Bay Company trade route","A tunnel under the Rideau Canal"],"fr":["Le premier chemin de fer au Canada","Un réseau chrétien antiesclavagiste qui aidait les esclaves à fuir vers le Canada","Une route commerciale de la Compagnie de la Baie d’Hudson","Un tunnel sous le canal Rideau"]},"answer":1}]},{"id":"history1-032","topic":"growing-economy","importance":2,"en":"The first companies in Canada were formed during the French and British regimes and competed for the fur trade. The Hudson’s Bay Company, with French, British and Aboriginal employees, came to dominate the trade in the northwest from Fort Garry (Winnipeg) and Fort Edmonton to Fort Langley (near Vancouver) and Fort Victoria—trading posts that later became cities.","en_simple":"The Hudson's Bay Company dominated the fur trade in the northwest from its forts: Fort Garry (Winnipeg), Fort Edmonton, Fort Langley (near Vancouver) and Fort Victoria. These trading posts later became cities.","fr":"Les premières entreprises au Canada, formées sous les régimes français et britannique, se font concurrence pour la traite des fourrures. La Compagnie de la Baie d’Hudson, dont les employés sont français, britanniques et autochtones, en vient à dominer le commerce dans le Nord-Ouest, de Fort Garry (Winnipeg) et Fort Edmonton à Fort Langley (près de Vancouver) et Fort Victoria – des postes de traite devenus plus tard des villes.","tr":{"ar":"تأسست أولى الشركات في كندا خلال النظامين الفرنسي والبريطاني وتنافست على تجارة الفراء. وهيمنت شركة خليج هدسون، بموظفيها الفرنسيين والبريطانيين والأصليين، على التجارة في الشمال الغربي من فورت غاري (وينيبيغ) وفورت إدمونتون إلى فورت لانغلي (قرب فانكوفر) وفورت فيكتوريا، وهي مراكز تجارية أصبحت مدنًا لاحقًا."},"questions":[{"type":"mc","q":{"en":"Fort Garry, a Hudson’s Bay Company trading post, later became which city?","fr":"Fort Garry, poste de traite de la Compagnie de la Baie d’Hudson, est devenu plus tard quelle ville?"},"options":{"en":["Edmonton","Vancouver","Winnipeg","Victoria"],"fr":["Edmonton","Vancouver","Winnipeg","Victoria"]},"answer":2},{"type":"tf","q":{"en":"The first companies in Canada competed for the fur trade.","fr":"Les premières entreprises au Canada se faisaient concurrence pour la traite des fourrures."},"answer":true}]},{"id":"history1-033","topic":"growing-economy","importance":2,"en":"The first financial institutions opened in the late 18th and early 19th centuries. The Montreal Stock Exchange opened in 1832. For centuries Canada’s economy was based mainly on farming and on exporting natural resources such as fur, fish and timber, transported by roads, lakes, rivers and canals.","en_simple":"The Montreal Stock Exchange opened in 1832. For centuries, Canada's economy was mainly farming and exporting natural resources: fur, fish and timber.","fr":"Les premières institutions financières voient le jour à la fin du dix-huitième siècle et au début du dix-neuvième siècle. La Bourse de Montréal est créée en 1832. Pendant des siècles, l’économie du Canada repose essentiellement sur l’agriculture et l’exportation de ressources naturelles, comme la fourrure, le poisson et le bois de sciage, qui sont transportées par les routes, les lacs, les rivières, les fleuves et les canaux.","tr":{"ar":"افتُتحت أولى المؤسسات المالية في أواخر القرن الثامن عشر وأوائل القرن التاسع عشر. وافتُتحت بورصة مونتريال عام 1832. ولقرون، اعتمد اقتصاد كندا أساسًا على الزراعة وتصدير الموارد الطبيعية مثل الفراء والأسماك والأخشاب، التي نُقلت عبر الطرق والبحيرات والأنهار والقنوات."},"questions":[{"type":"mc","q":{"en":"In what year did the Montreal Stock Exchange open?","fr":"En quelle année la Bourse de Montréal a-t-elle été créée?"},"options":{"en":["1791","1812","1832","1867"],"fr":["1791","1812","1832","1867"]},"answer":2},{"type":"mc","q":{"en":"For centuries, Canada’s economy was based mainly on farming and exporting which natural resources?","fr":"Pendant des siècles, l’économie du Canada reposait sur l’agriculture et l’exportation de quelles ressources naturelles?"},"options":{"en":["Oil, gas and uranium","Fur, fish and timber","Gold, silver and copper","Wheat, corn and cattle"],"fr":["Le pétrole, le gaz et l’uranium","La fourrure, le poisson et le bois","L’or, l’argent et le cuivre","Le blé, le maïs et le bétail"]},"answer":1}]},{"id":"history1-034","topic":"mary-ann-shadd-cary","importance":2,"en":"Mary Ann Shadd Cary was an outspoken activist in the movement to abolish slavery in the U.S.A. In 1853 she became the first woman publisher in Canada, helping to found and edit The Provincial Freeman, a weekly newspaper dedicated to anti-slavery, black immigration to Canada, temperance, and upholding British rule.","en_simple":"Mary Ann Shadd Cary was an anti-slavery activist. In 1853, she became the first woman publisher in Canada, with the newspaper The Provincial Freeman.","fr":"Mary Ann Shadd Cary est une militante active du mouvement visant à abolir l’esclavage aux États-Unis. En 1853, elle devient la première femme éditrice de journal au Canada, en participant à la fondation et à la rédaction du Provincial Freeman, un hebdomadaire consacré à la lutte contre l’esclavage, à l’immigration des Noirs au Canada, à la tempérance (incitant les gens à boire moins d’alcool) et au maintien de l’autorité britannique.","tr":{"ar":"كانت ماري آن شاد كاري (Mary Ann Shadd Cary) ناشطة صريحة في حركة إلغاء العبودية في الولايات المتحدة. وفي عام 1853 أصبحت أول ناشرة في كندا، إذ ساعدت في تأسيس وتحرير صحيفة «ذا بروفينشال فريمان» (The Provincial Freeman)، وهي أسبوعية مكرّسة لمناهضة العبودية وهجرة السود إلى كندا والاعتدال في الشرب ودعم الحكم البريطاني."},"questions":[{"type":"mc","q":{"en":"Who became the first woman publisher in Canada in 1853?","fr":"Qui est devenue la première femme éditrice de journal au Canada en 1853?"},"options":{"en":["Laura Secord","Mary Ann Shadd Cary","Agnes Macphail","Emily Carr"],"fr":["Laura Secord","Mary Ann Shadd Cary","Agnes Macphail","Emily Carr"]},"answer":1},{"type":"tf","q":{"en":"Mary Ann Shadd Cary helped found The Provincial Freeman, an anti-slavery newspaper.","fr":"Mary Ann Shadd Cary a participé à la fondation du Provincial Freeman, un journal antiesclavagiste."},"answer":true}]},{"id":"history1-035","topic":"war-of-1812","importance":2,"en":"After the defeat of Napoleon Bonaparte’s fleet in the Battle of Trafalgar (1805), the Royal Navy ruled the waves. The British Empire, which included Canada, fought to resist Bonaparte’s bid to dominate Europe. This led to American resentment at British interference with their shipping. Believing it would be easy to conquer Canada, the United States launched an invasion in June 1812.","en_simple":"Americans were angry that Britain interfered with their shipping during the wars against Napoleon. Thinking Canada would be easy to conquer, the United States invaded in June 1812.","fr":"Après la défaite de la flotte de Napoléon Bonaparte à la bataille de Trafalgar (1805), la Royal Navy domine sur la mer. L’Empire britannique, dont le Canada fait partie, résiste à Bonaparte qui cherche à dominer l’Europe. Cet affrontement amène les Britanniques à s’ingérer dans le commerce maritime des Américains, ce que ces derniers acceptent mal. Convaincus qu’il sera facile de s’emparer du Canada, les États-Unis lancent une invasion en juin 1812.","tr":{"ar":"بعد هزيمة أسطول نابليون بونابرت في معركة الطرف الأغر (1805)، سيطرت البحرية الملكية على البحار. وقاتلت الإمبراطورية البريطانية، التي شملت كندا، لمقاومة محاولة بونابرت السيطرة على أوروبا. وأدى ذلك إلى استياء أمريكي من تدخل البريطانيين في ملاحتهم. واعتقادًا بأن غزو كندا سيكون سهلًا، شنّت الولايات المتحدة غزوًا في يونيو 1812."},"questions":[{"type":"mc","q":{"en":"Why did the United States invade Canada in June 1812?","fr":"Pourquoi les États-Unis ont-ils envahi le Canada en juin 1812?"},"options":{"en":["To free the slaves in Upper Canada","Because of resentment at British interference with their shipping, believing Canada would be easy to conquer","To help the Rebellions of 1837–38","To take over the fur trade"],"fr":["Pour libérer les esclaves du Haut-Canada","Par ressentiment envers l’ingérence britannique dans leur commerce maritime, convaincus qu’il serait facile de s’emparer du Canada","Pour aider les rébellions de 1837-1838","Pour s’emparer de la traite des fourrures"]},"answer":1},{"type":"tf","q":{"en":"The Royal Navy ruled the waves after the Battle of Trafalgar in 1805.","fr":"La Royal Navy a dominé les mers après la bataille de Trafalgar en 1805."},"answer":true}]},{"id":"history1-036","topic":"war-of-1812","importance":3,"en":"Canadian volunteers and First Nations, including Shawnee led by Chief Tecumseh, supported British soldiers in Canada’s defence. In July, Major-General Sir Isaac Brock captured Detroit but was killed while defending against an American attack at Queenston Heights, near Niagara Falls, a battle the Americans lost.","en_simple":"Canadian volunteers and First Nations (Shawnee led by Chief Tecumseh) helped the British defend Canada. In July 1812, Sir Isaac Brock captured Detroit. He was killed at Queenston Heights, near Niagara Falls, but the Americans lost that battle.","fr":"Des volontaires canadiens et des membres des Premières Nations, dont des Shawnees dirigés par le chef Tecumseh, aident les soldats britanniques à défendre le Canada. En juillet, le major-général sir Isaac Brock s’empare de Detroit, mais il est tué lors d’une attaque américaine à Queenston Heights, près de Niagara Falls, attaque qui sera tout de même repoussée avec succès.","tr":{"ar":"دعم المتطوعون الكنديون والأمم الأولى، بمن فيهم الشاوني بقيادة الزعيم تيكومسي (Chief Tecumseh)، الجنود البريطانيين في الدفاع عن كندا. وفي يوليو، استولى اللواء السير إسحاق بروك (Sir Isaac Brock) على ديترويت، لكنه قُتل أثناء الدفاع ضد هجوم أمريكي في كوينستون هايتس (Queenston Heights) قرب شلالات نياغارا، وهي معركة خسرها الأمريكيون."},"questions":[{"type":"mc","q":{"en":"Who led the Shawnee in support of the British during the War of 1812?","fr":"Qui a dirigé les Shawnees en soutien aux Britanniques pendant la guerre de 1812?"},"options":{"en":["Joseph Brant","Chief Tecumseh","Gabriel Dumont","Louis Riel"],"fr":["Joseph Brant","Le chef Tecumseh","Gabriel Dumont","Louis Riel"]},"answer":1},{"type":"mc","q":{"en":"Where was Major-General Sir Isaac Brock killed?","fr":"Où le major-général sir Isaac Brock a-t-il été tué?"},"options":{"en":["At Châteauguay","At Detroit","At Queenston Heights, near Niagara Falls","At York"],"fr":["À Châteauguay","À Detroit","À Queenston Heights, près de Niagara Falls","À York"]},"answer":2},{"type":"tf","q":{"en":"In July 1812, Sir Isaac Brock captured Detroit.","fr":"En juillet 1812, sir Isaac Brock s’est emparé de Detroit."},"answer":true}]},{"id":"history1-037","topic":"war-of-1812","importance":3,"en":"In 1813, Lieutenant-Colonel Charles de Salaberry and 460 soldiers, mostly French Canadiens, turned back 4,000 American invaders at Châteauguay, south of Montreal.","en_simple":"In 1813, Charles de Salaberry and 460 soldiers (mostly French Canadiens) stopped 4,000 American invaders at Châteauguay, south of Montreal.","fr":"En 1813, le lieutenant-colonel Charles de Salaberry et 460 soldats, pour la plupart des Canadiens français, refoulent 4 000 envahisseurs américains à Châteauguay, au sud de Montréal.","tr":{"ar":"في عام 1813، صدّ المقدم شارل دو سالابيري (Charles de Salaberry) و460 جنديًا، معظمهم من الكنديين الفرنسيين، 4,000 غازٍ أمريكي في شاتوغي (Châteauguay) جنوب مونتريال."},"questions":[{"type":"mc","q":{"en":"Who turned back 4,000 American invaders at Châteauguay in 1813?","fr":"Qui a refoulé 4 000 envahisseurs américains à Châteauguay en 1813?"},"options":{"en":["Sir Isaac Brock","Robert Ross","Charles de Salaberry","James FitzGibbon"],"fr":["Sir Isaac Brock","Robert Ross","Charles de Salaberry","James FitzGibbon"]},"answer":2},{"type":"mc","q":{"en":"How many soldiers did de Salaberry have at Châteauguay?","fr":"Combien de soldats de Salaberry avait-il à Châteauguay?"},"options":{"en":["460","3,000","4,000","40,000"],"fr":["460","3 000","4 000","40 000"]},"answer":0}]},{"id":"history1-038","topic":"war-of-1812","importance":3,"en":"In 1813 the Americans burned Government House and the Parliament Buildings in York (now Toronto). In retaliation in 1814, Major-General Robert Ross led an expedition from Nova Scotia that burned down the White House and other public buildings in Washington, D.C. Ross died in battle soon afterwards and was buried in Halifax with full military honours.","en_simple":"In 1813, the Americans burned Government House and the Parliament Buildings in York (Toronto). In 1814, Major-General Robert Ross burned the White House in Washington in return. Ross died soon after and was buried in Halifax.","fr":"En 1813, les Américains incendient la résidence du gouverneur général et les édifices du Parlement à York (aujourd’hui Toronto). En guise de représailles, en 1814, le major-général Robert Ross quitte la Nouvelle-Écosse à la tête d’une expédition qui se solde par l’incendie de la Maison-Blanche et d’autres édifices publics à Washington D.C. Ross meurt au combat peu après et est enterré à Halifax avec tous les honneurs militaires.","tr":{"ar":"في عام 1813 أحرق الأمريكيون دار الحكومة ومباني البرلمان في يورك (تورونتو حاليًا). وردًا على ذلك، في عام 1814، قاد اللواء روبرت روس (Robert Ross) حملة من نوفا سكوشا أحرقت البيت الأبيض ومباني عامة أخرى في واشنطن العاصمة. ومات روس في المعركة بعد ذلك بقليل ودُفن في هاليفاكس بكامل التكريم العسكري."},"questions":[{"type":"mc","q":{"en":"What did the Americans burn in York (now Toronto) in 1813?","fr":"Qu’ont incendié les Américains à York (aujourd’hui Toronto) en 1813?"},"options":{"en":["The Citadel","Fort Henry","Government House and the Parliament Buildings","The Montreal Stock Exchange"],"fr":["La citadelle","Fort Henry","La résidence du gouverneur et les édifices du Parlement","La Bourse de Montréal"]},"answer":2},{"type":"mc","q":{"en":"Who led the 1814 expedition that burned down the White House?","fr":"Qui a dirigé l’expédition de 1814 qui a incendié la Maison-Blanche?"},"options":{"en":["Major-General Robert Ross","Sir Isaac Brock","The Duke of Wellington","Charles de Salaberry"],"fr":["Le major-général Robert Ross","Sir Isaac Brock","Le duc de Wellington","Charles de Salaberry"]},"answer":0},{"type":"tf","q":{"en":"Robert Ross was buried in Halifax with full military honours.","fr":"Robert Ross a été enterré à Halifax avec tous les honneurs militaires."},"answer":true}]},{"id":"history1-039","topic":"war-of-1812","importance":3,"en":"By 1814, the American attempt to conquer Canada had failed. The British paid for a costly Canadian defence system, including the Citadels at Halifax and Québec City, the naval drydock at Halifax and Fort Henry at Kingston. The present-day Canada-U.S.A. border is partly an outcome of the War of 1812, which ensured that Canada would remain independent of the United States.","en_simple":"By 1814, the American attempt to conquer Canada had failed. The War of 1812 ensured Canada stayed independent of the United States, and today's Canada-U.S. border is partly a result of it.","fr":"En 1814, la tentative de conquête du Canada par les Américains est un échec complet. Les Britanniques mettent en place un coûteux système de défense au Canada, notamment les citadelles de Halifax et de Québec, la cale sèche à Halifax et Fort Henry à Kingston, qui sont aujourd’hui des lieux historiques populaires. La frontière canado-américaine actuelle a été en partie tracée à la suite de la guerre de 1812, qui a permis de garantir que le Canada resterait indépendant des États-Unis.","tr":{"ar":"بحلول عام 1814، فشلت المحاولة الأمريكية لغزو كندا. ودفع البريطانيون ثمن نظام دفاعي كندي مكلف، شمل قلعتي هاليفاكس ومدينة كيبيك، والحوض الجاف البحري في هاليفاكس، وفورت هنري في كينغستون. والحدود الحالية بين كندا والولايات المتحدة هي جزئيًا نتيجة لحرب 1812، التي ضمنت بقاء كندا مستقلة عن الولايات المتحدة."},"questions":[{"type":"mc","q":{"en":"What was an outcome of the War of 1812?","fr":"Quel a été un résultat de la guerre de 1812?"},"options":{"en":["Canada joined the United States","Canada remained independent of the United States and the present-day border was partly set","France regained Quebec","Upper and Lower Canada were united"],"fr":["Le Canada s’est joint aux États-Unis","Le Canada est resté indépendant des États-Unis et la frontière actuelle a été en partie tracée","La France a repris le Québec","Le Haut-Canada et le Bas-Canada ont été unis"]},"answer":1},{"type":"tf","q":{"en":"By 1814, the American attempt to conquer Canada had succeeded.","fr":"En 1814, la tentative de conquête du Canada par les Américains avait réussi."},"answer":false}]},{"id":"history1-040","topic":"war-of-1812","importance":2,"en":"The Duke of Wellington sent some of his best soldiers to defend Canada in 1814. He then chose Bytown (Ottawa) as the endpoint of the Rideau Canal, part of a network of forts to prevent the U.S.A. from invading Canada again. Wellington, who defeated Napoleon in 1815, therefore played a direct role in founding the national capital.","en_simple":"The Duke of Wellington sent soldiers to defend Canada in 1814. He chose Bytown (now Ottawa) as the end of the Rideau Canal, so he helped found the national capital.","fr":"Le duc de Wellington a envoyé quelques-uns de ses meilleurs soldats pour défendre le Canada en 1814. Il a ensuite décidé de terminer le canal Rideau à Bytown (Ottawa) dans le cadre de la mise en place d’un réseau de forts visant à empêcher les États-Unis d’envahir encore une fois le Canada. Wellington, qui a vaincu Napoléon en 1815, a donc joué un rôle direct dans la fondation de la capitale nationale.","tr":{"ar":"أرسل دوق ويلينغتون (Duke of Wellington) بعض أفضل جنوده للدفاع عن كندا عام 1814. ثم اختار بايتاون (أوتاوا) نقطة نهاية لقناة ريدو، ضمن شبكة من الحصون لمنع الولايات المتحدة من غزو كندا مرة أخرى. وبذلك لعب ويلينغتون، الذي هزم نابليون عام 1815، دورًا مباشرًا في تأسيس العاصمة الوطنية."},"questions":[{"type":"mc","q":{"en":"Who chose Bytown (Ottawa) as the endpoint of the Rideau Canal?","fr":"Qui a choisi Bytown (Ottawa) comme point d’arrivée du canal Rideau?"},"options":{"en":["Sir Isaac Brock","The Duke of Wellington","Lord Durham","Sir John A. Macdonald"],"fr":["Sir Isaac Brock","Le duc de Wellington","Lord Durham","Sir John A. Macdonald"]},"answer":1},{"type":"mc","q":{"en":"Bytown is the former name of which city?","fr":"Bytown est l’ancien nom de quelle ville?"},"options":{"en":["Toronto","Kingston","Ottawa","Halifax"],"fr":["Toronto","Kingston","Ottawa","Halifax"]},"answer":2}]},{"id":"history1-041","topic":"laura-secord","importance":2,"en":"In 1813, Laura Secord, pioneer wife and mother of five children, made a dangerous 19 mile (30 km) journey on foot to warn Lieutenant James FitzGibbon of a planned American attack. Her bravery contributed to victory at the Battle of Beaver Dams. She is recognized as a heroine to this day.","en_simple":"In 1813, Laura Secord walked 30 km to warn Lieutenant James FitzGibbon about an American attack. This helped win the Battle of Beaver Dams. She is a Canadian heroine.","fr":"En 1813, Laura Secord, pionnière et mère de cinq enfants, a entrepris une marche dangereuse de 19 miles (30 km) afin d’avertir le lieutenant James FitzGibbon d’une attaque planifiée par les Américains. Sa bravoure a contribué à la victoire remportée à Beaver Dams. Son héroïsme est encore reconnu aujourd’hui.","tr":{"ar":"في عام 1813، قامت لورا سيكورد (Laura Secord)، الزوجة الرائدة وأم لخمسة أطفال، برحلة خطرة سيرًا على الأقدام مسافة 19 ميلًا (30 كم) لتحذير الملازم جيمس فيتزغيبون من هجوم أمريكي مخطط له. وأسهمت شجاعتها في النصر في معركة بيفر دامز. وهي معترف بها بطلةً حتى اليوم."},"questions":[{"type":"mc","q":{"en":"Who made a dangerous 30 km journey on foot in 1813 to warn of a planned American attack?","fr":"Qui a entrepris une marche dangereuse de 30 km en 1813 pour avertir d’une attaque américaine planifiée?"},"options":{"en":["Mary Ann Shadd Cary","Laura Secord","Agnes Macphail","Emily Murphy"],"fr":["Mary Ann Shadd Cary","Laura Secord","Agnes Macphail","Emily Murphy"]},"answer":1},{"type":"mc","q":{"en":"Laura Secord’s bravery contributed to victory at which battle?","fr":"La bravoure de Laura Secord a contribué à la victoire à quelle bataille?"},"options":{"en":["The Battle of Beaver Dams","The Battle of Queenston Heights","The Battle of Châteauguay","The Battle of the Plains of Abraham"],"fr":["La bataille de Beaver Dams","La bataille de Queenston Heights","La bataille de Châteauguay","La bataille des plaines d’Abraham"]},"answer":0}]},{"id":"history1-042","topic":"rebellions-1837","importance":3,"en":"In the 1830s, reformers in Upper and Lower Canada believed that progress toward full democracy was too slow. Some believed Canada should adopt American republican values or even try to join the United States. When armed rebellions occurred in 1837–38 in the area outside Montreal and in Toronto, the rebels did not have enough public support to succeed. They were defeated by British troops and Canadian volunteers. A number of rebels were hanged or exiled; some exiles later returned to Canada.","en_simple":"In 1837–38, reformers who thought democracy was coming too slowly started armed rebellions near Montreal and in Toronto. The rebels lacked public support and were defeated by British troops and Canadian volunteers. Some rebels were hanged or exiled.","fr":"Durant les années 1830, les réformateurs du Haut-Canada et du Bas-Canada estiment que les progrès vers la démocratie véritable sont trop lents. Certains sont d’avis que le Canada devrait adopter les valeurs républicaines des Américains ou même essayer de se joindre aux États-Unis. Lorsque des rébellions armées se produisent en 1837 et 1838 aux environs de Montréal et à Toronto, les rebelles n’obtiennent pas l’appui de la population qu’il leur faudrait pour réussir. Ils sont défaits par les troupes britanniques et des volontaires canadiens. Plusieurs rebelles sont pendus ou envoyés en exil; certains de ces derniers reviendront plus tard au pays.","tr":{"ar":"في ثلاثينيات القرن التاسع عشر، رأى الإصلاحيون في كندا العليا والسفلى أن التقدم نحو الديمقراطية الكاملة بطيء جدًا. واعتقد بعضهم أن على كندا تبنّي القيم الجمهورية الأمريكية أو حتى محاولة الانضمام إلى الولايات المتحدة. وعندما وقعت تمردات مسلحة في 1837-1838 في المنطقة خارج مونتريال وفي تورونتو، لم يحظَ المتمردون بدعم شعبي كافٍ للنجاح. وهُزموا على يد القوات البريطانية والمتطوعين الكنديين. وشُنق عدد من المتمردين أو نُفوا؛ وعاد بعض المنفيين لاحقًا إلى كندا."},"questions":[{"type":"mc","q":{"en":"Where did the armed rebellions of 1837–38 take place?","fr":"Où ont eu lieu les rébellions armées de 1837-1838?"},"options":{"en":["In Halifax and Québec City","In the area outside Montreal and in Toronto","In Winnipeg and Edmonton","In Kingston and Ottawa"],"fr":["À Halifax et à Québec","Aux environs de Montréal et à Toronto","À Winnipeg et à Edmonton","À Kingston et à Ottawa"]},"answer":1},{"type":"mc","q":{"en":"Why did the rebels of 1837–38 fail?","fr":"Pourquoi les rebelles de 1837-1838 ont-ils échoué?"},"options":{"en":["The Americans invaded","They did not have enough public support","Lord Durham arrested them","France refused to help"],"fr":["Les Américains ont envahi le pays","Ils n’avaient pas assez d’appui de la population","Lord Durham les a arrêtés","La France a refusé de les aider"]},"answer":1},{"type":"tf","q":{"en":"In the 1830s, reformers believed progress toward full democracy was too slow.","fr":"Dans les années 1830, les réformateurs estimaient que les progrès vers la démocratie véritable étaient trop lents."},"answer":true}]},{"id":"history1-043","topic":"lord-durham","importance":3,"en":"Lord Durham, an English reformer sent to report on the rebellions, recommended that Upper and Lower Canada be merged and given responsible government. Controversially, Lord Durham also said that the quickest way for the Canadiens to achieve progress was to assimilate into English-speaking Protestant culture.","en_simple":"Lord Durham reported on the rebellions. He recommended uniting Upper and Lower Canada and giving them responsible government. He also said, controversially, that French Canadians should assimilate into English Protestant culture.","fr":"Lord Durham, un réformateur anglais dépêché pour faire rapport sur les rébellions, recommande de fusionner le Haut-Canada et le Bas-Canada et de les doter d’un gouvernement responsable. Suscitant la controverse, lord Durham ajoute que le moyen le plus rapide pour les Canadiens français de réaliser des progrès est de s’assimiler à la culture protestante anglophone.","tr":{"ar":"أوصى اللورد دورهام (Lord Durham)، وهو مصلح إنجليزي أُرسل لإعداد تقرير عن التمردات، بدمج كندا العليا والسفلى ومنحهما حكومة مسؤولة. وعلى نحو مثير للجدل، قال اللورد دورهام أيضًا إن أسرع طريقة لتقدم الكنديين الفرنسيين هي الاندماج في الثقافة البروتستانتية الناطقة بالإنجليزية."},"questions":[{"type":"mc","q":{"en":"What did Lord Durham recommend after the rebellions of 1837–38?","fr":"Qu’a recommandé lord Durham après les rébellions de 1837-1838?"},"options":{"en":["That Canada join the United States","That Upper and Lower Canada be merged and given responsible government","That Quebec become independent","That slavery be abolished"],"fr":["Que le Canada se joigne aux États-Unis","Que le Haut-Canada et le Bas-Canada soient fusionnés et dotés d’un gouvernement responsable","Que le Québec devienne indépendant","Que l’esclavage soit aboli"]},"answer":1},{"type":"tf","q":{"en":"Lord Durham recommended that the Canadiens assimilate into English-speaking Protestant culture.","fr":"Lord Durham a recommandé que les Canadiens français s’assimilent à la culture protestante anglophone."},"answer":true}]},{"id":"history1-044","topic":"fathers-of-confederation","importance":2,"en":"Some reformers, including Sir Étienne-Paschal Taché and Sir George-Étienne Cartier, later became Fathers of Confederation, as did a former member of the voluntary government militia in Upper Canada, Sir John A. Macdonald.","en_simple":"Reformers Sir Étienne-Paschal Taché and Sir George-Étienne Cartier later became Fathers of Confederation. So did Sir John A. Macdonald, who had been in the government militia in Upper Canada.","fr":"Certains réformateurs, dont sir Étienne-Paschal Taché et sir George-Étienne Cartier, deviendront plus tard des Pères de la Confédération, de même qu’un ancien membre des troupes gouvernementales volontaires du Haut-Canada, sir John A. Macdonald.","tr":{"ar":"أصبح بعض الإصلاحيين، ومنهم السير إتيان-باسكال تاشيه (Sir Étienne-Paschal Taché) والسير جورج-إتيان كارتييه (Sir George-Étienne Cartier)، لاحقًا من آباء الكونفدرالية، وكذلك السير جون أ. ماكدونالد (Sir John A. Macdonald)، وهو عضو سابق في الميليشيا الحكومية التطوعية في كندا العليا."},"questions":[{"type":"mc","q":{"en":"Which of the following reformers later became Fathers of Confederation?","fr":"Lesquels des réformateurs suivants sont devenus plus tard des Pères de la Confédération?"},"options":{"en":["Wolfe and Montcalm","Brock and Tecumseh","Taché and Cartier","Durham and Elgin"],"fr":["Wolfe et Montcalm","Brock et Tecumseh","Taché et Cartier","Durham et Elgin"]},"answer":2},{"type":"tf","q":{"en":"Sir John A. Macdonald was a former member of the voluntary government militia in Upper Canada.","fr":"Sir John A. Macdonald était un ancien membre des troupes gouvernementales volontaires du Haut-Canada."},"answer":true}]},{"id":"history1-045","topic":"responsible-government","importance":3,"en":"In 1840, Upper and Lower Canada were united as the Province of Canada. Reformers such as Sir Louis-Hippolyte La Fontaine and Robert Baldwin, in parallel with Joseph Howe in Nova Scotia, worked with British governors toward responsible government.","en_simple":"In 1840, Upper and Lower Canada were united as the Province of Canada. Reformers La Fontaine and Baldwin (and Joseph Howe in Nova Scotia) worked toward responsible government.","fr":"En 1840, le Haut-Canada et le Bas-Canada sont réunis pour former la Province du Canada. Des réformateurs comme sir Louis-Hippolyte La Fontaine et Robert Baldwin, de même que Joseph Howe en Nouvelle-Écosse, collaborent avec les gouverneurs britanniques à l’établissement d’un gouvernement responsable.","tr":{"ar":"في عام 1840، اتحدت كندا العليا وكندا السفلى لتشكيل مقاطعة كندا. وعمل إصلاحيون مثل السير لويس-هيبوليت لافونتين (Sir Louis-Hippolyte La Fontaine) وروبرت بالدوين (Robert Baldwin)، بالتوازي مع جوزيف هاو (Joseph Howe) في نوفا سكوشا، مع الحكام البريطانيين نحو الحكومة المسؤولة."},"questions":[{"type":"mc","q":{"en":"In what year were Upper and Lower Canada united as the Province of Canada?","fr":"En quelle année le Haut-Canada et le Bas-Canada ont-ils été réunis pour former la Province du Canada?"},"options":{"en":["1791","1837","1840","1867"],"fr":["1791","1837","1840","1867"]},"answer":2},{"type":"mc","q":{"en":"Which reformer worked toward responsible government in Nova Scotia?","fr":"Quel réformateur a travaillé à l’établissement d’un gouvernement responsable en Nouvelle-Écosse?"},"options":{"en":["Robert Baldwin","Joseph Howe","Lord Elgin","Louis-Hippolyte La Fontaine"],"fr":["Robert Baldwin","Joseph Howe","Lord Elgin","Louis-Hippolyte La Fontaine"]},"answer":1},{"type":"tf","q":{"en":"La Fontaine and Baldwin worked with British governors toward responsible government.","fr":"La Fontaine et Baldwin ont collaboré avec les gouverneurs britanniques à l’établissement d’un gouvernement responsable."},"answer":true}]},{"id":"history1-046","topic":"responsible-government","importance":3,"en":"The first British North American colony to attain full responsible government was Nova Scotia in 1847–48. In 1848–49 the governor of United Canada, Lord Elgin, with encouragement from London, introduced responsible government.","en_simple":"Nova Scotia was the first colony to get full responsible government, in 1847–48. In 1848–49, Lord Elgin, governor of United Canada, introduced responsible government there.","fr":"La première colonie de l’Amérique du Nord britannique à se doter d’un gouvernement pleinement responsable est la Nouvelle-Écosse, en 1847-1848. En 1848-1849, le gouverneur du Canada-Uni, lord Elgin, avec les encouragements de Londres, établit un gouvernement responsable.","tr":{"ar":"كانت نوفا سكوشا أول مستعمرة في أمريكا الشمالية البريطانية تحصل على حكومة مسؤولة كاملة، في 1847-1848. وفي 1848-1849، أدخل اللورد إلغين (Lord Elgin)، حاكم كندا المتحدة، الحكومة المسؤولة بتشجيع من لندن."},"questions":[{"type":"mc","q":{"en":"Which was the first British North American colony to attain full responsible government?","fr":"Quelle a été la première colonie de l’Amérique du Nord britannique à se doter d’un gouvernement pleinement responsable?"},"options":{"en":["The Province of Canada","New Brunswick","Nova Scotia","Prince Edward Island"],"fr":["La Province du Canada","Le Nouveau-Brunswick","La Nouvelle-Écosse","L’Île-du-Prince-Édouard"]},"answer":2},{"type":"mc","q":{"en":"Which governor introduced responsible government in United Canada in 1848–49?","fr":"Quel gouverneur a établi le gouvernement responsable au Canada-Uni en 1848-1849?"},"options":{"en":["Lord Durham","Lord Elgin","Lord Dorchester","Sir Guy Carleton"],"fr":["Lord Durham","Lord Elgin","Lord Dorchester","Sir Guy Carleton"]},"answer":1},{"type":"tf","q":{"en":"Nova Scotia attained full responsible government in 1847–48.","fr":"La Nouvelle-Écosse s’est dotée d’un gouvernement pleinement responsable en 1847-1848."},"answer":true}]},{"id":"history1-047","topic":"responsible-government","importance":3,"en":"Responsible government meant that the ministers of the Crown must have the support of a majority of the elected representatives in order to govern. This is the system that we have today: if the government loses a confidence vote in the assembly it must resign.","en_simple":"Responsible government = the ministers of the Crown need the support of a majority of the elected representatives to govern. If the government loses a confidence vote, it must resign. Canada still uses this system today.","fr":"Cela signifie que les ministres de la Couronne doivent obtenir le soutien de la majorité des représentants élus pour gouverner. Ce système est celui que nous avons aujourd’hui : si le gouvernement perd un vote de confiance à l’assemblée législative, il doit démissionner.","tr":{"ar":"تعني الحكومة المسؤولة أن وزراء التاج يجب أن يحظوا بدعم أغلبية الممثلين المنتخبين حتى يحكموا. وهذا هو النظام المعمول به اليوم: إذا خسرت الحكومة تصويتًا على الثقة في الجمعية فعليها أن تستقيل."},"questions":[{"type":"mc","q":{"en":"What is meant by the term “responsible government”?","fr":"Que signifie l’expression « gouvernement responsable »?"},"options":{"en":["The government is responsible to the King alone","The ministers of the Crown must have the support of a majority of the elected representatives in order to govern","The government is chosen by the British Parliament","The governor appoints all the ministers for life"],"fr":["Le gouvernement est responsable devant le roi seulement","Les ministres de la Couronne doivent obtenir le soutien de la majorité des représentants élus pour gouverner","Le gouvernement est choisi par le Parlement britannique","Le gouverneur nomme tous les ministres à vie"]},"answer":1},{"type":"mc","q":{"en":"Under responsible government, what must the government do if it loses a confidence vote in the assembly?","fr":"Dans un gouvernement responsable, que doit faire le gouvernement s’il perd un vote de confiance à l’assemblée?"},"options":{"en":["Ask the King for help","Resign","Dissolve the assembly permanently","Appeal to the courts"],"fr":["Demander l’aide du roi","Démissionner","Dissoudre l’assemblée de façon permanente","Faire appel aux tribunaux"]},"answer":1},{"type":"tf","q":{"en":"Responsible government is still the system Canada has today.","fr":"Le gouvernement responsable est encore le système que le Canada a aujourd’hui."},"answer":true}]},{"id":"history1-048","topic":"la-fontaine","importance":3,"en":"La Fontaine, a champion of democracy and French language rights, became the first leader of a responsible government in the Canadas. Sir Louis-Hippolyte La Fontaine became the first head of a responsible government (similar to a prime minister) in Canada in 1849.","en_simple":"Sir Louis-Hippolyte La Fontaine, a champion of democracy and French language rights, became the first head of a responsible government (like a prime minister) in Canada in 1849.","fr":"La Fontaine, défenseur de la démocratie et des droits des francophones, devient le premier chef d’un gouvernement responsable des deux Canadas. Sir Louis-Hippolyte La Fontaine, défenseur des droits des francophones, est devenu le premier chef d’un gouvernement responsable (semblable à un premier ministre) au Canada en 1849.","tr":{"ar":"أصبح لافونتين، المدافع عن الديمقراطية وحقوق اللغة الفرنسية، أول زعيم لحكومة مسؤولة في الكنديتين. وأصبح السير لويس-هيبوليت لافونتين أول رئيس لحكومة مسؤولة (شبيه برئيس الوزراء) في كندا عام 1849."},"questions":[{"type":"mc","q":{"en":"Who was Sir Louis-Hippolyte La Fontaine?","fr":"Qui était sir Louis-Hippolyte La Fontaine?"},"options":{"en":["The first Prime Minister of the Dominion of Canada","A champion of democracy and French language rights, and the first head of a responsible government in Canada","The governor who introduced responsible government","A hero of the War of 1812"],"fr":["Le premier premier ministre du Dominion du Canada","Un défenseur de la démocratie et des droits des francophones, et le premier chef d’un gouvernement responsable au Canada","Le gouverneur qui a établi le gouvernement responsable","Un héros de la guerre de 1812"]},"answer":1},{"type":"mc","q":{"en":"In what year did La Fontaine become the first head of a responsible government in Canada?","fr":"En quelle année La Fontaine est-il devenu le premier chef d’un gouvernement responsable au Canada?"},"options":{"en":["1840","1847","1849","1867"],"fr":["1840","1847","1849","1867"]},"answer":2},{"type":"tf","q":{"en":"Robert Baldwin became the first head of a responsible government in Canada in 1849.","fr":"Robert Baldwin est devenu le premier chef d’un gouvernement responsable au Canada en 1849."},"answer":false}]}]},{"unit":"history2","order":4,"title":{"en":"History II: Confederation to 1945","fr":"Histoire II : de la Confédération à 1945"},"title_tr":{"ar":"التاريخ 2: من الكونفدرالية إلى 1945"},"source":{"en":"07-canadas-history","fr":"07-histoire-du-canada"},"cards":[{"id":"history2-001","topic":"fathers-of-confederation","importance":3,"en":"From 1864 to 1867, representatives of Nova Scotia, New Brunswick and the Province of Canada, with British support, worked together to establish a new country. These men are known as the Fathers of Confederation.","en_simple":"From 1864 to 1867, leaders from Nova Scotia, New Brunswick and the Province of Canada worked to create a new country. They are called the Fathers of Confederation.","fr":"De 1864 à 1867, les représentants de la Nouvelle-Écosse, du Nouveau-Brunswick et de la Province du Canada, avec l’appui des Britanniques, travaillent ensemble pour créer un nouveau pays. On appelle ces hommes les Pères de la Confédération.","tr":{"ar":"من عام 1864 إلى 1867، عمل ممثلو نوفا سكوشا ونيو برونزويك ومقاطعة كندا، بدعم بريطاني، معًا لتأسيس بلد جديد. ويُعرف هؤلاء الرجال باسم آباء الكونفدرالية (Fathers of Confederation)."},"questions":[{"type":"mc","q":{"en":"Who are known as the Fathers of Confederation?","fr":"Qui appelle-t-on les Pères de la Confédération?"},"options":{"en":["The first British governors of Canada","The representatives who worked from 1864 to 1867 to establish a new country","The founders of the Hudson’s Bay Company","The first Canadian soldiers in the First World War"],"fr":["Les premiers gouverneurs britanniques du Canada","Les représentants qui ont travaillé de 1864 à 1867 pour créer un nouveau pays","Les fondateurs de la Compagnie de la Baie d’Hudson","Les premiers soldats canadiens de la Première Guerre mondiale"]},"answer":1},{"type":"mc","q":{"en":"Between which years did the Fathers of Confederation work to establish a new country?","fr":"Entre quelles années les Pères de la Confédération ont-ils travaillé à créer un nouveau pays?"},"options":{"en":["1759–1763","1812–1814","1864–1867","1885–1890"],"fr":["1759-1763","1812-1814","1864-1867","1885-1890"]},"answer":2},{"type":"tf","q":{"en":"The Fathers of Confederation worked with British support to create a new country.","fr":"Les Pères de la Confédération ont travaillé avec l’appui des Britanniques pour créer un nouveau pays."},"answer":true}]},{"id":"history2-002","topic":"levels-of-government","importance":3,"en":"The Fathers of Confederation created two levels of government: federal and provincial. Each province would elect its own legislature and have control of such areas as education and health.","en_simple":"Confederation created 2 levels of government: federal and provincial. Each province elects its own legislature and controls areas like education and health.","fr":"Ils instaurent deux ordres de gouvernement, soit le fédéral et le provincial. Chaque province élit sa propre assemblée législative et exerce son autorité sur des domaines tels que l’éducation et la santé.","tr":{"ar":"أنشأ آباء الكونفدرالية مستويين من الحكومة: الفيدرالي والمقاطعي. وتنتخب كل مقاطعة مجلسها التشريعي الخاص وتسيطر على مجالات مثل التعليم والصحة."},"questions":[{"type":"mc","q":{"en":"Which two levels of government did the Fathers of Confederation create?","fr":"Quels deux ordres de gouvernement les Pères de la Confédération ont-ils instaurés?"},"options":{"en":["Municipal and territorial","Federal and provincial","Royal and colonial","Federal and municipal"],"fr":["Municipal et territorial","Fédéral et provincial","Royal et colonial","Fédéral et municipal"]},"answer":1},{"type":"mc","q":{"en":"Under Confederation, which areas were placed under provincial control?","fr":"Selon la Confédération, quels domaines relèvent des provinces?"},"options":{"en":["National defence and currency","Education and health","Foreign affairs and the navy","Postal service and railways"],"fr":["La défense nationale et la monnaie","L’éducation et la santé","Les affaires étrangères et la marine","Le service postal et les chemins de fer"]},"answer":1}]},{"id":"history2-003","topic":"original-provinces","importance":3,"en":"The old Province of Canada was split into two new provinces: Ontario and Quebec, which, together with New Brunswick and Nova Scotia, formed the new country called the Dominion of Canada.","en_simple":"The Province of Canada was split into Ontario and Quebec. With New Brunswick and Nova Scotia, these 4 provinces formed the Dominion of Canada.","fr":"L’ancienne Province du Canada est séparée en deux nouvelles provinces : l’Ontario et le Québec, qui, ensemble, avec le Nouveau-Brunswick et la Nouvelle-Écosse, forment le nouveau pays appelé le Dominion (ou Puissance) du Canada.","tr":{"ar":"قُسِّمت مقاطعة كندا القديمة إلى مقاطعتين جديدتين: أونتاريو وكيبيك، اللتان شكّلتا مع نيو برونزويك ونوفا سكوشا البلد الجديد المسمى دومينيون كندا (Dominion of Canada)."},"questions":[{"type":"mc","q":{"en":"Which four provinces formed the Dominion of Canada in 1867?","fr":"Quelles quatre provinces forment le Dominion du Canada en 1867?"},"options":{"en":["Ontario, Quebec, Manitoba, British Columbia","Ontario, Quebec, New Brunswick, Nova Scotia","Quebec, Nova Scotia, Prince Edward Island, Newfoundland","Ontario, New Brunswick, Alberta, Saskatchewan"],"fr":["Ontario, Québec, Manitoba, Colombie-Britannique","Ontario, Québec, Nouveau-Brunswick, Nouvelle-Écosse","Québec, Nouvelle-Écosse, Île-du-Prince-Édouard, Terre-Neuve","Ontario, Nouveau-Brunswick, Alberta, Saskatchewan"]},"answer":1},{"type":"mc","q":{"en":"The old Province of Canada was split into which two provinces?","fr":"L’ancienne Province du Canada a été séparée en quelles deux provinces?"},"options":{"en":["Nova Scotia and New Brunswick","Manitoba and Saskatchewan","Ontario and Quebec","Quebec and New Brunswick"],"fr":["La Nouvelle-Écosse et le Nouveau-Brunswick","Le Manitoba et la Saskatchewan","L’Ontario et le Québec","Le Québec et le Nouveau-Brunswick"]},"answer":2},{"type":"tf","q":{"en":"Prince Edward Island was one of the four original provinces of the Dominion of Canada.","fr":"L’Île-du-Prince-Édouard était l’une des quatre provinces d’origine du Dominion du Canada."},"answer":false}]},{"id":"history2-004","topic":"bna-act","importance":3,"en":"The British Parliament passed the British North America Act in 1867. The Dominion of Canada was officially born on July 1, 1867.","en_simple":"The British Parliament passed the British North America Act in 1867. Canada was officially born on July 1, 1867.","fr":"L’Acte de l’Amérique du Nord britannique est adopté par le Parlement britannique en 1867. Le Dominion du Canada est officiellement créé le 1er juillet 1867.","tr":{"ar":"أقرّ البرلمان البريطاني قانون أمريكا الشمالية البريطانية (British North America Act) عام 1867. ووُلد دومينيون كندا رسميًا في 1 يوليو 1867."},"questions":[{"type":"mc","q":{"en":"Which act, passed by the British Parliament in 1867, created the Dominion of Canada?","fr":"Quelle loi, adoptée par le Parlement britannique en 1867, a créé le Dominion du Canada?"},"options":{"en":["The Quebec Act","The Constitution Act, 1982","The Statute of Westminster","The British North America Act"],"fr":["L’Acte de Québec","La Loi constitutionnelle de 1982","Le Statut de Westminster","L’Acte de l’Amérique du Nord britannique"]},"answer":3},{"type":"mc","q":{"en":"On what date was the Dominion of Canada officially born?","fr":"À quelle date le Dominion du Canada a-t-il été officiellement créé?"},"options":{"en":["July 1, 1867","July 4, 1867","November 11, 1867","January 1, 1864"],"fr":["Le 1er juillet 1867","Le 4 juillet 1867","Le 11 novembre 1867","Le 1er janvier 1864"]},"answer":0},{"type":"tf","q":{"en":"The British North America Act was passed by the Parliament of Canada.","fr":"L’Acte de l’Amérique du Nord britannique a été adopté par le Parlement du Canada."},"answer":false}]},{"id":"history2-005","topic":"dominion-day","importance":3,"en":"Until 1982, July 1 was celebrated as “Dominion Day” to commemorate the day that Canada became a self-governing Dominion. Today it is officially known as Canada Day.","en_simple":"July 1 was called “Dominion Day” until 1982. Today it is called Canada Day.","fr":"Jusqu’en 1982, le 1er juillet est célébré sous le nom de « Fête du Dominion » afin de commémorer le jour où le Canada est devenu un dominion doté d’un gouvernement autonome. Aujourd’hui, cette fête est officiellement connue sous le nom de « Fête du Canada ».","tr":{"ar":"حتى عام 1982، كان يُحتفل بيوم 1 يوليو باسم «يوم الدومينيون» لإحياء ذكرى اليوم الذي أصبحت فيه كندا دومينيون يتمتع بالحكم الذاتي. واليوم يُعرف رسميًا باسم يوم كندا (Canada Day)."},"questions":[{"type":"mc","q":{"en":"What was Canada Day called before 1982?","fr":"Comment s’appelait la Fête du Canada avant 1982?"},"options":{"en":["Confederation Day","Dominion Day","Victoria Day","Empire Day"],"fr":["La Fête de la Confédération","La Fête du Dominion","La Fête de la Reine","La Fête de l’Empire"]},"answer":1},{"type":"mc","q":{"en":"In what year was Dominion Day renamed Canada Day?","fr":"En quelle année la Fête du Dominion a-t-elle été renommée Fête du Canada?"},"options":{"en":["1867","1931","1965","1982"],"fr":["1867","1931","1965","1982"]},"answer":3}]},{"id":"history2-006","topic":"national-colours","importance":2,"en":"King George V assigned Canada’s national colours (white and red) in 1921, the colours of our national flag today.","en_simple":"In 1921, King George V gave Canada its national colours: white and red. These are the colours of the flag today.","fr":"Le roi George V établit en 1921 les couleurs officielles du Canada (rouge et blanc), qui sont aujourd’hui les couleurs du drapeau canadien.","tr":{"ar":"حدّد الملك جورج الخامس (King George V) الألوان الوطنية لكندا (الأبيض والأحمر) عام 1921، وهي ألوان علمنا الوطني اليوم."},"questions":[{"type":"mc","q":{"en":"Who assigned Canada’s national colours, white and red, in 1921?","fr":"Qui a établi les couleurs officielles du Canada, le rouge et le blanc, en 1921?"},"options":{"en":["Queen Victoria","King George V","Sir John A. Macdonald","Sir Wilfrid Laurier"],"fr":["La reine Victoria","Le roi George V","Sir John A. Macdonald","Sir Wilfrid Laurier"]},"answer":1}]},{"id":"history2-007","topic":"dominion-tilley","importance":3,"en":"Sir Leonard Tilley, an elected official and Father of Confederation from New Brunswick, suggested the term Dominion of Canada in 1864. He was inspired by Psalm 72 in the Bible which refers to “dominion from sea to sea and from the river to the ends of the earth.”","en_simple":"Sir Leonard Tilley from New Brunswick suggested the name “Dominion of Canada” in 1864. The idea came from Psalm 72 in the Bible: “dominion from sea to sea.”","fr":"C’est en 1864 que sir Leonard Tilley, représentant élu du Nouveau-Brunswick et l’un des Pères de la Confédération, suggère le terme Dominion du Canada. Il s’inspire du passage suivant du psaume 72 de la Bible : « Qu’il domine d’une mer à l’autre, et du Fleuve jusqu’au bout de la terre! »","tr":{"ar":"اقترح سير ليونارد تيلي (Sir Leonard Tilley)، وهو مسؤول منتخب وأحد آباء الكونفدرالية من نيو برونزويك، مصطلح «دومينيون كندا» عام 1864. وقد استلهمه من المزمور 72 في الكتاب المقدس الذي يشير إلى «السيادة من البحر إلى البحر ومن النهر إلى أقاصي الأرض»."},"questions":[{"type":"mc","q":{"en":"Who suggested the term “Dominion of Canada” in 1864?","fr":"Qui a suggéré le terme « Dominion du Canada » en 1864?"},"options":{"en":["Sir George-Étienne Cartier","Sir John A. Macdonald","Sir Leonard Tilley","Louis Riel"],"fr":["Sir George-Étienne Cartier","Sir John A. Macdonald","Sir Leonard Tilley","Louis Riel"]},"answer":2},{"type":"mc","q":{"en":"The term “Dominion of Canada” was inspired by which part of the Bible?","fr":"Le terme « Dominion du Canada » s’inspire de quelle partie de la Bible?"},"options":{"en":["Psalm 23","Psalm 72","The Book of Genesis","The Ten Commandments"],"fr":["Le psaume 23","Le psaume 72","Le livre de la Genèse","Les dix commandements"]},"answer":1},{"type":"tf","q":{"en":"Sir Leonard Tilley was a Father of Confederation from Nova Scotia.","fr":"Sir Leonard Tilley était un Père de la Confédération de la Nouvelle-Écosse."},"answer":false}]},{"id":"history2-008","topic":"dominion-tilley","importance":2,"en":"This phrase embodied the vision of building a powerful, united, wealthy and free country that spanned a continent. The title was written into the Constitution, was used officially for about 100 years, and remains part of our heritage today.","en_simple":"“Dominion from sea to sea” was the vision of a strong, united, rich and free country across a continent. The title was in the Constitution and used officially for about 100 years.","fr":"Ce passage incarne la vision de la création d’un pays puissant, uni, prospère et libre, s’étendant sur tout un continent. Ce titre est inscrit dans la Constitution et la désignation « dominion » qui signifie « puissance », utilisée pendant plus d’un siècle, fait toujours partie de notre patrimoine.","tr":{"ar":"جسّدت هذه العبارة رؤية بناء بلد قوي وموحّد وغني وحر يمتد عبر قارة. وكُتب هذا اللقب في الدستور، واستُخدم رسميًا نحو 100 عام، ولا يزال جزءًا من تراثنا اليوم."},"questions":[{"type":"mc","q":{"en":"For about how many years was the title “Dominion” used officially?","fr":"Pendant environ combien d’années le titre « Dominion » a-t-il été utilisé officiellement?"},"options":{"en":["About 10 years","About 50 years","About 100 years","About 200 years"],"fr":["Environ 10 ans","Environ 50 ans","Environ 100 ans","Environ 200 ans"]},"answer":2}]},{"id":"history2-009","topic":"expansion","importance":3,"en":"Expansion of the Dominion: 1867 — Ontario, Quebec, Nova Scotia, New Brunswick; 1870 — Manitoba, Northwest Territories (N.W.T.); 1871 — British Columbia; 1873 — Prince Edward Island.","en_simple":"Provinces joined Canada: 1867 Ontario, Quebec, Nova Scotia, New Brunswick; 1870 Manitoba and Northwest Territories; 1871 British Columbia; 1873 Prince Edward Island.","fr":"Élargissement du Dominion : 1867 — Ontario, Québec, Nouvelle-Écosse, Nouveau-Brunswick; 1870 — Manitoba, Territoires du Nord-Ouest (T.N.-O.); 1871 — Colombie-Britannique; 1873 — Île-du-Prince-Édouard.","tr":{"ar":"توسع الدومينيون: 1867 — أونتاريو وكيبيك ونوفا سكوشا ونيو برونزويك؛ 1870 — مانيتوبا والأقاليم الشمالية الغربية؛ 1871 — كولومبيا البريطانية؛ 1873 — جزيرة الأمير إدوارد."},"questions":[{"type":"mc","q":{"en":"In what year did Manitoba and the Northwest Territories join Canada?","fr":"En quelle année le Manitoba et les Territoires du Nord-Ouest se sont-ils joints au Canada?"},"options":{"en":["1867","1870","1873","1905"],"fr":["1867","1870","1873","1905"]},"answer":1},{"type":"mc","q":{"en":"In what year did British Columbia join Canada?","fr":"En quelle année la Colombie-Britannique s’est-elle jointe au Canada?"},"options":{"en":["1867","1870","1871","1885"],"fr":["1867","1870","1871","1885"]},"answer":2},{"type":"mc","q":{"en":"Which province joined Canada in 1873?","fr":"Quelle province s’est jointe au Canada en 1873?"},"options":{"en":["Manitoba","British Columbia","Newfoundland and Labrador","Prince Edward Island"],"fr":["Le Manitoba","La Colombie-Britannique","Terre-Neuve-et-Labrador","L’Île-du-Prince-Édouard"]},"answer":3}]},{"id":"history2-010","topic":"expansion","importance":3,"en":"Expansion of the Dominion: 1880 — Transfer of the Arctic Islands (to N.W.T.); 1898 — Yukon Territory; 1905 — Alberta, Saskatchewan.","en_simple":"1880: the Arctic Islands were added to the Northwest Territories. 1898: Yukon Territory. 1905: Alberta and Saskatchewan.","fr":"Élargissement du Dominion : 1880 — Transfert des îles de l’Arctique (aux T.N.-O.); 1898 — Territoire du Yukon; 1905 — Alberta, Saskatchewan.","tr":{"ar":"توسع الدومينيون: 1880 — نقل جزر القطب الشمالي (إلى الأقاليم الشمالية الغربية)؛ 1898 — إقليم يوكون؛ 1905 — ألبرتا وساسكاتشوان."},"questions":[{"type":"mc","q":{"en":"In what year did Alberta and Saskatchewan become provinces?","fr":"En quelle année l’Alberta et la Saskatchewan sont-elles devenues des provinces?"},"options":{"en":["1898","1905","1949","1870"],"fr":["1898","1905","1949","1870"]},"answer":1},{"type":"mc","q":{"en":"In what year did the Yukon Territory join Canada?","fr":"En quelle année le Territoire du Yukon s’est-il joint au Canada?"},"options":{"en":["1880","1898","1905","1999"],"fr":["1880","1898","1905","1999"]},"answer":1},{"type":"tf","q":{"en":"The Arctic Islands were transferred to the Northwest Territories in 1880.","fr":"Les îles de l’Arctique ont été transférées aux Territoires du Nord-Ouest en 1880."},"answer":true}]},{"id":"history2-011","topic":"expansion","importance":3,"en":"Expansion of the Dominion: 1949 — Newfoundland and Labrador; 1999 — Nunavut.","en_simple":"Newfoundland and Labrador joined Canada in 1949. Nunavut was created in 1999.","fr":"Élargissement du Dominion : 1949 — Terre-Neuve et Labrador; 1999 — Nunavut.","tr":{"ar":"توسع الدومينيون: 1949 — نيوفاوندلاند ولابرادور؛ 1999 — نونافوت."},"questions":[{"type":"mc","q":{"en":"Which was the last province to join Canada, in 1949?","fr":"Quelle est la dernière province à s’être jointe au Canada, en 1949?"},"options":{"en":["Prince Edward Island","British Columbia","Newfoundland and Labrador","Nunavut"],"fr":["L’Île-du-Prince-Édouard","La Colombie-Britannique","Terre-Neuve-et-Labrador","Le Nunavut"]},"answer":2},{"type":"mc","q":{"en":"In what year was Nunavut created?","fr":"En quelle année le Nunavut a-t-il été créé?"},"options":{"en":["1949","1982","1999","2005"],"fr":["1949","1982","1999","2005"]},"answer":2}]},{"id":"history2-012","topic":"expansion","importance":1,"en":"In the 1920s, some believed that the British West Indies (British territories in the Caribbean Sea) should become part of Canada. This did not occur, though Canada and Commonwealth Caribbean countries and territories enjoy close ties today.","en_simple":"In the 1920s, some people wanted the British West Indies (Caribbean) to join Canada. It did not happen.","fr":"Dans les années 1920, certains estiment que les Antilles britanniques (les territoires britanniques dans la mer des Caraïbes) devraient être annexées au Canada. Cela n’a pas lieu, mais le Canada et les pays et territoires des Antilles membres du Commonwealth entretiennent aujourd’hui d’étroites relations.","tr":{"ar":"في عشرينيات القرن العشرين، اعتقد البعض أن جزر الهند الغربية البريطانية (الأراضي البريطانية في البحر الكاريبي) ينبغي أن تصبح جزءًا من كندا. لم يحدث ذلك، لكن كندا ودول وأقاليم الكاريبي الأعضاء في الكومنولث تربطها علاقات وثيقة اليوم."},"questions":[{"type":"tf","q":{"en":"In the 1920s, the British West Indies became part of Canada.","fr":"Dans les années 1920, les Antilles britanniques ont été annexées au Canada."},"answer":false}]},{"id":"history2-013","topic":"macdonald","importance":3,"en":"In 1867, Sir John Alexander Macdonald, a Father of Confederation, became Canada’s first Prime Minister. Born in Scotland on January 11, 1815, he came to Upper Canada as a child. He was a lawyer in Kingston, Ontario, a gifted politician and a colourful personality.","en_simple":"Sir John A. Macdonald was Canada's first Prime Minister (1867). He was born in Scotland on January 11, 1815, and was a lawyer in Kingston, Ontario.","fr":"En 1867, sir John Alexander Macdonald, un des Pères de la Confédération, devient le premier premier ministre du Canada. Né le 11 janvier 1815 en Écosse, il arrive dans le Haut-Canada pendant son enfance. Il pratique comme avocat à Kingston, en Ontario. C’est un homme politique brillant et un personnage coloré.","tr":{"ar":"في عام 1867، أصبح سير جون ألكسندر ماكدونالد (Sir John Alexander Macdonald)، أحد آباء الكونفدرالية، أول رئيس وزراء لكندا. وُلد في اسكتلندا في 11 يناير 1815، وجاء إلى كندا العليا وهو طفل. كان محاميًا في كينغستون بأونتاريو، وسياسيًا موهوبًا وشخصية مميزة."},"questions":[{"type":"mc","q":{"en":"Who was Canada’s first Prime Minister?","fr":"Qui a été le premier premier ministre du Canada?"},"options":{"en":["Sir Wilfrid Laurier","Sir John A. Macdonald","Sir George-Étienne Cartier","Sir Robert Borden"],"fr":["Sir Wilfrid Laurier","Sir John A. Macdonald","Sir George-Étienne Cartier","Sir Robert Borden"]},"answer":1},{"type":"mc","q":{"en":"Where was Sir John A. Macdonald born?","fr":"Où est né sir John A. Macdonald?"},"options":{"en":["Kingston, Ontario","England","Scotland","Ireland"],"fr":["Kingston, en Ontario","En Angleterre","En Écosse","En Irlande"]},"answer":2},{"type":"mc","q":{"en":"In which city was Sir John A. Macdonald a lawyer?","fr":"Dans quelle ville sir John A. Macdonald pratiquait-il le droit?"},"options":{"en":["Montreal","Toronto","Ottawa","Kingston"],"fr":["Montréal","Toronto","Ottawa","Kingston"]},"answer":3}]},{"id":"history2-014","topic":"macdonald","importance":3,"en":"Parliament has recognized January 11 as Sir John A. Macdonald Day. His portrait is on the $10 bill.","en_simple":"January 11 is Sir John A. Macdonald Day. His picture is on the $10 bill.","fr":"Le Parlement a fait du 11 janvier la Journée sir John A. Macdonald. Son portrait figure sur les billets de dix dollars.","tr":{"ar":"اعترف البرلمان بيوم 11 يناير بوصفه يوم سير جون أ. ماكدونالد. وصورته موجودة على ورقة الـ10 دولارات."},"questions":[{"type":"mc","q":{"en":"What date is Sir John A. Macdonald Day?","fr":"Quelle est la date de la Journée sir John A. Macdonald?"},"options":{"en":["July 1","January 11","November 11","April 9"],"fr":["Le 1er juillet","Le 11 janvier","Le 11 novembre","Le 9 avril"]},"answer":1},{"type":"mc","q":{"en":"Whose portrait is on the Canadian $10 bill?","fr":"Le portrait de qui figure sur le billet canadien de dix dollars?"},"options":{"en":["Sir Wilfrid Laurier","Sir Robert Borden","Sir John A. Macdonald","Queen Victoria"],"fr":["Sir Wilfrid Laurier","Sir Robert Borden","Sir John A. Macdonald","La reine Victoria"]},"answer":2}]},{"id":"history2-015","topic":"cartier","importance":3,"en":"Sir George-Étienne Cartier was the key architect of Confederation from Quebec. A railway lawyer, Montrealer, close ally of Macdonald and patriotic Canadien, Cartier led Quebec into Confederation and helped negotiate the entry of the Northwest Territories, Manitoba and British Columbia into Canada.","en_simple":"Sir George-Étienne Cartier was the key architect of Confederation from Quebec. He led Quebec into Confederation and helped bring in the Northwest Territories, Manitoba and British Columbia.","fr":"Sir George-Étienne Cartier est le principal architecte de la Confédération issu du Québec. Avocat spécialisé dans le domaine des chemins de fer, Montréalais, proche allié de Macdonald et Canadien français patriote, Cartier fait entrer le Québec dans la Confédération et aide à négocier l’entrée dans le Canada des Territoires du Nord-Ouest, du Manitoba et de la Colombie-Britannique.","tr":{"ar":"كان سير جورج-إتيان كارتييه (Sir George-Étienne Cartier) المهندس الرئيسي للكونفدرالية من كيبيك. وهو محامٍ في مجال السكك الحديدية من مونتريال وحليف مقرّب لماكدونالد وكندي وطني، قاد كيبيك إلى الكونفدرالية وساعد في التفاوض على انضمام الأقاليم الشمالية الغربية ومانيتوبا وكولومبيا البريطانية إلى كندا."},"questions":[{"type":"mc","q":{"en":"Who was the key architect of Confederation from Quebec?","fr":"Qui était le principal architecte de la Confédération issu du Québec?"},"options":{"en":["Sir George-Étienne Cartier","Louis Riel","Sir Wilfrid Laurier","Sir Leonard Tilley"],"fr":["Sir George-Étienne Cartier","Louis Riel","Sir Wilfrid Laurier","Sir Leonard Tilley"]},"answer":0},{"type":"tf","q":{"en":"Sir George-Étienne Cartier was a close ally of Sir John A. Macdonald.","fr":"Sir George-Étienne Cartier était un proche allié de sir John A. Macdonald."},"answer":true}]},{"id":"history2-016","topic":"riel","importance":3,"en":"When Canada took over the vast northwest region from the Hudson’s Bay Company in 1869, the 12,000 Métis of the Red River were not consulted. In response, Louis Riel led an armed uprising and seized Fort Garry, the territorial capital.","en_simple":"In 1869, Canada took the northwest from the Hudson's Bay Company without asking the 12,000 Métis of the Red River. Louis Riel led an armed uprising and took Fort Garry, the territorial capital.","fr":"Quand, en 1869, le Canada prend possession des vastes régions du Nord-Ouest transférées par la Compagnie de la Baie d’Hudson, les 12 000 Métis de la rivière Rouge ne sont pas consultés. En réaction, Louis Riel mène une révolte armée et s’empare de Fort Garry, la capitale territoriale.","tr":{"ar":"عندما استولت كندا على منطقة الشمال الغربي الشاسعة من شركة خليج هدسون عام 1869، لم تتم استشارة 12,000 من الميتيس في ريد ريفر. وردًا على ذلك، قاد لويس رييل (Louis Riel) انتفاضة مسلحة واستولى على فورت غاري (Fort Garry)، عاصمة الإقليم."},"questions":[{"type":"mc","q":{"en":"Who led the Métis uprising at the Red River in 1869 and seized Fort Garry?","fr":"Qui a mené la révolte des Métis de la rivière Rouge en 1869 et s’est emparé de Fort Garry?"},"options":{"en":["Gabriel Dumont","Sir Sam Steele","Louis Riel","Sir George-Étienne Cartier"],"fr":["Gabriel Dumont","Sir Sam Steele","Louis Riel","Sir George-Étienne Cartier"]},"answer":2},{"type":"mc","q":{"en":"From whom did Canada take over the vast northwest region in 1869?","fr":"De qui le Canada a-t-il pris possession des vastes régions du Nord-Ouest en 1869?"},"options":{"en":["The United States","The Hudson’s Bay Company","France","The Canadian Pacific Railway"],"fr":["Les États-Unis","La Compagnie de la Baie d’Hudson","La France","Le Chemin de fer Canadien Pacifique"]},"answer":1},{"type":"tf","q":{"en":"The Métis of the Red River were consulted before Canada took over the northwest in 1869.","fr":"Les Métis de la rivière Rouge ont été consultés avant que le Canada prenne possession du Nord-Ouest en 1869."},"answer":false}]},{"id":"history2-017","topic":"riel","importance":3,"en":"Ottawa sent soldiers to retake Fort Garry in 1870. Riel fled to the United States and Canada established a new province: Manitoba. Riel was elected to Parliament but never took his seat.","en_simple":"In 1870, soldiers took back Fort Garry. Riel fled to the United States, and Canada created a new province: Manitoba. Riel was elected to Parliament but never took his seat.","fr":"En 1870, Ottawa envoie des soldats pour reprendre Fort Garry. Riel s’enfuit aux États-Unis et le Canada crée une nouvelle province, le Manitoba. Riel est élu au Parlement, mais il n’occupera jamais son siège.","tr":{"ar":"أرسلت أوتاوا جنودًا لاستعادة فورت غاري عام 1870. فرّ رييل إلى الولايات المتحدة وأنشأت كندا مقاطعة جديدة: مانيتوبا. انتُخب رييل في البرلمان لكنه لم يشغل مقعده قط."},"questions":[{"type":"mc","q":{"en":"Which new province did Canada establish in 1870 after the Red River uprising?","fr":"Quelle nouvelle province le Canada a-t-il créée en 1870 après la révolte de la rivière Rouge?"},"options":{"en":["Saskatchewan","British Columbia","Alberta","Manitoba"],"fr":["La Saskatchewan","La Colombie-Britannique","L’Alberta","Le Manitoba"]},"answer":3},{"type":"tf","q":{"en":"After Fort Garry was retaken in 1870, Louis Riel fled to the United States.","fr":"Après la reprise de Fort Garry en 1870, Louis Riel s’est enfui aux États-Unis."},"answer":true}]},{"id":"history2-018","topic":"riel","importance":3,"en":"A second rebellion in 1885 in pre
