ance de la Chambre »."},"answer":true}]},{"id":"government-011","topic":"three-parts-of-parliament","importance":3,"en":"Parliament has three parts: the Sovereign (Queen or King), the Senate and the House of Commons.","en_simple":"Parliament has 3 parts: the Sovereign (Queen or King), the Senate, and the House of Commons.","fr":"Le Parlement comprend trois parties : le souverain (la reine ou le roi), le Sénat et la Chambre des communes.","tr":{"ar":"يتألف البرلمان من ثلاثة أجزاء: الملك أو الملكة (العاهل)، ومجلس الشيوخ، ومجلس العموم."},"questions":[{"type":"mc","q":{"en":"What are the three parts of Parliament?","fr":"Quelles sont les trois parties du Parlement?"},"options":{"en":["The Sovereign, the Senate and the House of Commons","The Prime Minister, the Cabinet and the Supreme Court","The Governor General, the Premiers and the Commissioners","The Senate, the House of Commons and the Supreme Court"],"fr":["Le souverain, le Sénat et la Chambre des communes","Le premier ministre, le Cabinet et la Cour suprême","Le gouverneur général, les premiers ministres provinciaux et les commissaires","Le Sénat, la Chambre des communes et la Cour suprême"]},"answer":0},{"type":"tf","q":{"en":"The Supreme Court is one of the three parts of Parliament.","fr":"La Cour suprême est l’une des trois parties du Parlement."},"answer":false},{"type":"mc","q":{"en":"Which of the following is NOT one of the three parts of Parliament?","fr":"Lequel des éléments suivants n’est PAS l’une des trois parties du Parlement?"},"options":{"en":["The Senate","The House of Commons","The Sovereign","The Cabinet"],"fr":["Le Sénat","La Chambre des communes","Le souverain","Le Cabinet"]},"answer":3}]},{"id":"government-012","topic":"provincial-legislatures","importance":2,"en":"Provincial legislatures comprise the Lieutenant Governor and the elected Assembly.","en_simple":"A provincial legislature has 2 parts: the Lieutenant Governor and the elected Assembly.","fr":"Les assemblées législatives provinciales sont constituées du lieutenant-gouverneur et de l’assemblée élue.","tr":{"ar":"تتألف المجالس التشريعية للمقاطعات من نائب الحاكم العام (الحاكم المساعد) والجمعية المنتخبة."},"questions":[{"type":"mc","q":{"en":"What do provincial legislatures comprise?","fr":"De quoi les assemblées législatives provinciales sont-elles constituées?"},"options":{"en":["The Premier and the Senate","The Lieutenant Governor and the elected Assembly","The Governor General and the House of Commons","The Commissioner and the Cabinet"],"fr":["Le premier ministre provincial et le Sénat","Le lieutenant-gouverneur et l’assemblée élue","Le gouverneur général et la Chambre des communes","Le commissaire et le Cabinet"]},"answer":1}]},{"id":"government-013","topic":"prime-minister-cabinet","importance":3,"en":"In the federal government, the Prime Minister selects the Cabinet ministers and is responsible for the operations and policy of the government.","en_simple":"The Prime Minister chooses the Cabinet ministers and is responsible for how the government runs and its policies.","fr":"Dans le gouvernement fédéral, le premier ministre choisit les ministres du Cabinet et il est responsable des activités et des politiques du gouvernement.","tr":{"ar":"في الحكومة الاتحادية، يختار رئيس الوزراء وزراء مجلس الوزراء، وهو مسؤول عن عمليات الحكومة وسياساتها."},"questions":[{"type":"mc","q":{"en":"Who selects the Cabinet ministers in the federal government?","fr":"Qui choisit les ministres du Cabinet dans le gouvernement fédéral?"},"options":{"en":["The Governor General","The Senate","The Prime Minister","The Sovereign"],"fr":["Le gouverneur général","Le Sénat","Le premier ministre","Le souverain"]},"answer":2},{"type":"tf","q":{"en":"The Prime Minister is responsible for the operations and policy of the government.","fr":"Le premier ministre est responsable des activités et des politiques du gouvernement."},"answer":true}]},{"id":"government-014","topic":"house-of-commons","importance":3,"en":"The House of Commons is the representative chamber, made up of members of Parliament elected by the people, traditionally every four years.","en_simple":"The House of Commons is made up of members of Parliament (MPs) elected by the people, usually every 4 years.","fr":"La Chambre des communes est la chambre des représentants, composée de députés élus par la population, traditionnellement tous les quatre ans.","tr":{"ar":"مجلس العموم هو مجلس التمثيل، ويتألف من أعضاء البرلمان الذين ينتخبهم الشعب، تقليديًا كل أربع سنوات."},"questions":[{"type":"mc","q":{"en":"How often are members of Parliament traditionally elected?","fr":"À quelle fréquence les députés sont-ils traditionnellement élus?"},"options":{"en":["Every 2 years","Every 4 years","Every 5 years","Every 6 years"],"fr":["Tous les 2 ans","Tous les 4 ans","Tous les 5 ans","Tous les 6 ans"]},"answer":1},{"type":"mc","q":{"en":"Which chamber of Parliament is made up of members elected by the people?","fr":"Quelle chambre du Parlement est composée de députés élus par la population?"},"options":{"en":["The Senate","The Supreme Court","The Cabinet","The House of Commons"],"fr":["Le Sénat","La Cour suprême","Le Cabinet","La Chambre des communes"]},"answer":3},{"type":"tf","q":{"en":"Members of the House of Commons are appointed by the Governor General.","fr":"Les députés de la Chambre des communes sont nommés par le gouverneur général."},"answer":false}]},{"id":"government-015","topic":"senate","importance":3,"en":"Senators are appointed by the Governor General on the advice of the Prime Minister and serve until age 75.","en_simple":"Senators are appointed (not elected) by the Governor General on the advice of the Prime Minister. They serve until age 75.","fr":"Les sénateurs sont nommés par le gouverneur général sur recommandation du premier ministre et restent en poste jusqu’à l’âge de 75 ans.","tr":{"ar":"يُعيَّن أعضاء مجلس الشيوخ من قِبل الحاكم العام بناءً على مشورة رئيس الوزراء، ويخدمون حتى سن 75 عامًا."},"questions":[{"type":"mc","q":{"en":"How are senators chosen?","fr":"Comment les sénateurs sont-ils choisis?"},"options":{"en":["Elected by voters every four years","Appointed by the Governor General on the advice of the Prime Minister","Chosen by the provincial premiers","Appointed by the Supreme Court"],"fr":["Élus par les électeurs tous les quatre ans","Nommés par le gouverneur général sur recommandation du premier ministre","Choisis par les premiers ministres provinciaux","Nommés par la Cour suprême"]},"answer":1},{"type":"mc","q":{"en":"Until what age do senators serve?","fr":"Jusqu’à quel âge les sénateurs restent-ils en poste?"},"options":{"en":["65","70","75","80"],"fr":["65","70","75","80"]},"answer":2},{"type":"tf","q":{"en":"Senators are elected by the people every four years.","fr":"Les sénateurs sont élus par la population tous les quatre ans."},"answer":false}]},{"id":"government-016","topic":"bills-royal-assent","importance":3,"en":"Both the House of Commons and the Senate consider and review bills (proposals for new laws). No bill can become law in Canada until it has been passed by both chambers and has received royal assent, granted by the Governor General on behalf of the Sovereign.","en_simple":"A bill is a proposal for a new law. To become law, a bill must pass both the House of Commons and the Senate, and then get royal assent from the Governor General (on behalf of the Sovereign).","fr":"La Chambre des communes et le Sénat examinent et révisent les projets de loi (propositions de nouvelles lois). Aucun projet de loi ne peut devenir une loi au Canada avant d’avoir été adopté par les deux Chambres et d’avoir obtenu la sanction royale, accordée par le gouverneur général au nom du souverain.","tr":{"ar":"يدرس مجلس العموم ومجلس الشيوخ كلاهما مشاريع القوانين (مقترحات القوانين الجديدة) ويراجعانها. ولا يمكن لأي مشروع قانون أن يصبح قانونًا في كندا قبل أن يُقرّه المجلسان ويحصل على الموافقة الملكية التي يمنحها الحاكم العام نيابةً عن العاهل."},"questions":[{"type":"mc","q":{"en":"What is a bill?","fr":"Qu’est-ce qu’un projet de loi?"},"options":{"en":["A proposal for a new law","A tax paid to the Senate","A royal visit to Canada","A vote of non-confidence"],"fr":["Une proposition de nouvelle loi","Une taxe versée au Sénat","Une visite royale au Canada","Un vote de censure"]},"answer":0},{"type":"mc","q":{"en":"Who grants royal assent to a bill?","fr":"Qui accorde la sanction royale à un projet de loi?"},"options":{"en":["The Prime Minister","The Speaker of the House","The Governor General on behalf of the Sovereign","The Chief Justice of the Supreme Court"],"fr":["Le premier ministre","Le président de la Chambre","Le gouverneur général au nom du souverain","Le juge en chef de la Cour suprême"]},"answer":2},{"type":"tf","q":{"en":"A bill can become law after being passed by the House of Commons alone.","fr":"Un projet de loi peut devenir une loi après avoir été adopté par la Chambre des communes seulement."},"answer":false}]},{"id":"government-017","topic":"legislative-process","importance":3,"en":"How a bill becomes law — Step 1 First Reading: the bill is considered read for the first time and is printed. Step 2 Second Reading: members debate the bill’s principle. Step 3 Committee Stage: committee members study the bill clause by clause. Step 4 Report Stage: members can make other amendments. Step 5 Third Reading: members debate and vote on the bill. Step 6 Senate: the bill follows a similar process in the Senate. Step 7 Royal Assent: the bill receives royal assent after being passed by both Houses.","en_simple":"The 7 steps of a bill: (1) First Reading – bill is printed; (2) Second Reading – debate on the principle; (3) Committee Stage – study clause by clause; (4) Report Stage – more amendments; (5) Third Reading – debate and vote; (6) Senate – same process; (7) Royal Assent.","fr":"Comment un projet de loi devient une loi — Étape 1 Première lecture : on considère que le projet de loi est lu une première fois et il est imprimé. Étape 2 Deuxième lecture : les députés débattent du principe du projet de loi. Étape 3 Étape du comité : les membres du comité examinent le projet de loi, article par article. Étape 4 Étape du rapport : les députés peuvent ajouter d’autres amendements. Étape 5 Troisième lecture : les députés débattent du projet de loi et votent. Étape 6 Sénat : le projet de loi suit un processus similaire. Étape 7 Sanction royale : accepté par les deux Chambres, le projet de loi reçoit alors la sanction royale.","tr":{"ar":"كيف يصبح مشروع القانون قانونًا — الخطوة 1 القراءة الأولى: يُعتبر مشروع القانون مقروءًا للمرة الأولى ويُطبع. الخطوة 2 القراءة الثانية: يناقش الأعضاء مبدأ مشروع القانون. الخطوة 3 مرحلة اللجنة: يدرس أعضاء اللجنة مشروع القانون بندًا بندًا. الخطوة 4 مرحلة التقرير: يمكن للأعضاء إدخال تعديلات أخرى. الخطوة 5 القراءة الثالثة: يناقش الأعضاء مشروع القانون ويصوّتون عليه. الخطوة 6 مجلس الشيوخ: يمر مشروع القانون بعملية مماثلة في مجلس الشيوخ. الخطوة 7 الموافقة الملكية: يحصل مشروع القانون على الموافقة الملكية بعد إقراره من المجلسين."},"questions":[{"type":"mc","q":{"en":"How many steps are there in the legislative process for a bill to become law?","fr":"Combien d’étapes compte le processus législatif pour qu’un projet de loi devienne une loi?"},"options":{"en":["3","5","7","10"],"fr":["3","5","7","10"]},"answer":2},{"type":"mc","q":{"en":"What happens at First Reading?","fr":"Que se passe-t-il à la première lecture?"},"options":{"en":["Members debate and vote on the bill","The bill is considered read for the first time and is printed","The bill receives royal assent","Committee members study the bill clause by clause"],"fr":["Les députés débattent du projet de loi et votent","On considère que le projet de loi est lu une première fois et il est imprimé","Le projet de loi reçoit la sanction royale","Les membres du comité examinent le projet de loi, article par article"]},"answer":1},{"type":"mc","q":{"en":"At which stage do members debate the bill’s principle?","fr":"À quelle étape les députés débattent-ils du principe du projet de loi?"},"options":{"en":["First Reading","Committee Stage","Second Reading","Report Stage"],"fr":["Première lecture","Étape du comité","Deuxième lecture","Étape du rapport"]},"answer":2},{"type":"mc","q":{"en":"At which stage is the bill studied clause by clause?","fr":"À quelle étape le projet de loi est-il examiné article par article?"},"options":{"en":["Committee Stage","Second Reading","Third Reading","Royal Assent"],"fr":["Étape du comité","Deuxième lecture","Troisième lecture","Sanction royale"]},"answer":0},{"type":"mc","q":{"en":"At which stage can members make other amendments to the bill?","fr":"À quelle étape les députés peuvent-ils ajouter d’autres amendements au projet de loi?"},"options":{"en":["First Reading","Second Reading","Senate","Report Stage"],"fr":["Première lecture","Deuxième lecture","Sénat","Étape du rapport"]},"answer":3},{"type":"mc","q":{"en":"At which stage do members debate and vote on the bill?","fr":"À quelle étape les députés débattent-ils du projet de loi et votent-ils?"},"options":{"en":["First Reading","Third Reading","Committee Stage","Report Stage"],"fr":["Première lecture","Troisième lecture","Étape du comité","Étape du rapport"]},"answer":1},{"type":"mc","q":{"en":"What is the final step for a bill to become law?","fr":"Quelle est la dernière étape pour qu’un projet de loi devienne une loi?"},"options":{"en":["Third Reading","Senate","Committee Stage","Royal Assent"],"fr":["Troisième lecture","Sénat","Étape du comité","Sanction royale"]},"answer":3},{"type":"tf","q":{"en":"After Third Reading in the House of Commons, the bill follows a similar process in the Senate.","fr":"Après la troisième lecture à la Chambre des communes, le projet de loi suit un processus similaire au Sénat."},"answer":true}]},{"id":"government-018","topic":"voting-age","importance":3,"en":"Living in a democracy, Canadian citizens have the right and the responsibility to participate in making decisions that affect them. It is important for Canadians aged 18 or more to participate in their democracy by voting in federal, provincial or territorial and municipal elections.","en_simple":"Canadian citizens aged 18 or older should vote in federal, provincial or territorial, and municipal elections.","fr":"Vivant dans une démocratie, les citoyens canadiens ont le droit et la responsabilité de participer à la prise des décisions qui les touchent. Il est important pour les Canadiens âgés de 18 ans ou plus de participer à leur démocratie en votant aux élections fédérales, provinciales ou territoriales, et municipales.","tr":{"ar":"لأنهم يعيشون في ديمقراطية، يتمتع المواطنون الكنديون بالحق والمسؤولية في المشاركة في اتخاذ القرارات التي تؤثر فيهم. ومن المهم للكنديين البالغين 18 عامًا فأكثر أن يشاركوا في ديمقراطيتهم بالتصويت في الانتخابات الاتحادية والإقليمية (مقاطعات أو أقاليم) والبلدية."},"questions":[{"type":"mc","q":{"en":"At what age should Canadians participate in their democracy by voting?","fr":"À partir de quel âge les Canadiens devraient-ils participer à leur démocratie en votant?"},"options":{"en":["16","18","21","25"],"fr":["16","18","21","25"]},"answer":1},{"type":"tf","q":{"en":"Canadian citizens have the right and the responsibility to participate in making decisions that affect them.","fr":"Les citoyens canadiens ont le droit et la responsabilité de participer à la prise des décisions qui les touchent."},"answer":true}]},{"id":"government-019","topic":"head-of-state","importance":3,"en":"As a constitutional monarchy, Canada’s Head of State is a hereditary Sovereign (Queen or King), who reigns in accordance with the Constitution: the rule of law.","en_simple":"Canada's Head of State is the Sovereign (Queen or King). The title passes down in the royal family. The Sovereign reigns according to the Constitution and the rule of law.","fr":"Le Canada étant une monarchie constitutionnelle, son chef d’État est un souverain héréditaire (reine ou roi), qui règne conformément à la Constitution, soit à la primauté du droit.","tr":{"ar":"بوصف كندا ملكية دستورية، فإن رئيس الدولة فيها هو عاهل وراثي (ملكة أو ملك) يحكم وفقًا للدستور، أي سيادة القانون."},"questions":[{"type":"mc","q":{"en":"Who is Canada’s Head of State?","fr":"Qui est le chef d’État du Canada?"},"options":{"en":["The Prime Minister","The Governor General","The Chief Justice","The Sovereign (Queen or King)"],"fr":["Le premier ministre","Le gouverneur général","Le juge en chef","Le souverain (reine ou roi)"]},"answer":3},{"type":"mc","q":{"en":"What does it mean to say that Canada is a constitutional monarchy?","fr":"Que signifie le fait que le Canada est une monarchie constitutionnelle?"},"options":{"en":["The Head of State is a hereditary Sovereign who reigns in accordance with the Constitution","The Sovereign is elected every four years","The Prime Minister is the Head of State","The Sovereign makes all the laws without Parliament"],"fr":["Le chef d’État est un souverain héréditaire qui règne conformément à la Constitution","Le souverain est élu tous les quatre ans","Le premier ministre est le chef d’État","Le souverain adopte toutes les lois sans le Parlement"]},"answer":0},{"type":"tf","q":{"en":"Canada’s Sovereign is elected by the people.","fr":"Le souverain du Canada est élu par la population."},"answer":false}]},{"id":"government-020","topic":"sovereign-role","importance":2,"en":"The Sovereign is a part of Parliament, playing an important, non-partisan role as the focus of citizenship and allegiance, most visibly during royal visits to Canada. The Sovereign is a symbol of Canadian sovereignty, a guardian of constitutional freedoms, and a reflection of our history.","en_simple":"The Sovereign is part of Parliament and is non-partisan (not on the side of any party). The Sovereign is a symbol of Canadian sovereignty, a guardian of constitutional freedoms, and a reflection of our history.","fr":"Le souverain fait partie du Parlement et joue un rôle important, non partisan en tant que figure centrale de la citoyenneté et de l’allégeance, d’une manière plus visible lors des visites royales au Canada. Sa Majesté est le symbole de la souveraineté canadienne, la gardienne des libertés constitutionnelles et le reflet de notre histoire.","tr":{"ar":"العاهل جزء من البرلمان، ويؤدي دورًا مهمًا غير حزبي بوصفه محور المواطنة والولاء، ويتجلى ذلك أكثر خلال الزيارات الملكية لكندا. والعاهل رمز للسيادة الكندية، وحارس للحريات الدستورية، وانعكاس لتاريخنا."},"questions":[{"type":"mc","q":{"en":"What kind of role does the Sovereign play in Parliament?","fr":"Quel genre de rôle le souverain joue-t-il au Parlement?"},"options":{"en":["A partisan role, leading the governing party","An important, non-partisan role as the focus of citizenship and allegiance","A judicial role, deciding court cases","No role at all"],"fr":["Un rôle partisan, à la tête du parti au pouvoir","Un rôle important, non partisan, en tant que figure centrale de la citoyenneté et de l’allégeance","Un rôle judiciaire, en tranchant les causes devant les tribunaux","Aucun rôle"]},"answer":1},{"type":"tf","q":{"en":"The Sovereign is a symbol of Canadian sovereignty and a guardian of constitutional freedoms.","fr":"Le souverain est le symbole de la souveraineté canadienne et le gardien des libertés constitutionnelles."},"answer":true}]},{"id":"government-021","topic":"commonwealth","importance":3,"en":"The Royal Family’s example of lifelong service to the community is an encouragement for citizens to give their best to their country. As Head of the Commonwealth, the Sovereign links Canada to 53 other nations that cooperate to advance social, economic and cultural progress.","en_simple":"The Sovereign is Head of the Commonwealth. This links Canada to 53 other nations that work together for social, economic and cultural progress.","fr":"L’exemple de la famille royale qui s’est toujours dévouée pour la communauté incite les citoyens à donner le meilleur d’eux-mêmes à leur pays. Comme chef du Commonwealth, le souverain lie le Canada à 53 autres nations qui coopèrent pour l’avancement social, économique et culturel.","tr":{"ar":"مثال العائلة الملكية في الخدمة المجتمعية مدى الحياة يشجع المواطنين على بذل أفضل ما لديهم لبلدهم. وبوصفه رئيس الكومنولث (Commonwealth)، يربط العاهل كندا بـ53 دولة أخرى تتعاون لتحقيق التقدم الاجتماعي والاقتصادي والثقافي."},"questions":[{"type":"mc","q":{"en":"As Head of the Commonwealth, the Sovereign links Canada to how many other nations?","fr":"Comme chef du Commonwealth, le souverain lie le Canada à combien d’autres nations?"},"options":{"en":["10","27","53","193"],"fr":["10","27","53","193"]},"answer":2},{"type":"mc","q":{"en":"Who is the Head of the Commonwealth?","fr":"Qui est le chef du Commonwealth?"},"options":{"en":["The Governor General","The Sovereign","The Prime Minister of Canada","The Secretary-General of the United Nations"],"fr":["Le gouverneur général","Le souverain","Le premier ministre du Canada","Le secrétaire général des Nations Unies"]},"answer":1}]},{"id":"government-022","topic":"other-monarchies","importance":2,"en":"Other constitutional monarchies include Denmark, Norway, Sweden, Australia, New Zealand, The Netherlands, Spain, Thailand, Japan, Jordan and Morocco.","en_simple":"Other constitutional monarchies: Denmark, Norway, Sweden, Australia, New Zealand, the Netherlands, Spain, Thailand, Japan, Jordan, and Morocco.","fr":"Parmi les autres monarchies constitutionnelles du monde, mentionnons le Danemark, la Norvège, la Suède, l’Australie, la Nouvelle-Zélande, les Pays-Bas, l’Espagne, la Thaïlande, le Japon, la Jordanie et le Maroc.","tr":{"ar":"من الملكيات الدستورية الأخرى: الدنمارك، والنرويج، والسويد، وأستراليا، ونيوزيلندا، وهولندا، وإسبانيا، وتايلاند، واليابان، والأردن، والمغرب."},"questions":[{"type":"mc","q":{"en":"Which of the following is another constitutional monarchy, like Canada?","fr":"Lequel des pays suivants est aussi une monarchie constitutionnelle, comme le Canada?"},"options":{"en":["The United States","France","Japan","Germany"],"fr":["Les États-Unis","La France","Le Japon","L’Allemagne"]},"answer":2},{"type":"tf","q":{"en":"Australia and New Zealand are constitutional monarchies.","fr":"L’Australie et la Nouvelle-Zélande sont des monarchies constitutionnelles."},"answer":true}]},{"id":"government-023","topic":"head-of-state-vs-government","importance":3,"en":"There is a clear distinction in Canada between the head of state—the Sovereign—and the head of government—the Prime Minister, who actually directs the governing of the country.","en_simple":"Head of state = the Sovereign. Head of government = the Prime Minister, who actually runs the country.","fr":"Il existe une nette distinction au Canada entre le chef d’État – le souverain – et le chef du gouvernement – le premier ministre, qui dirige réellement le pays.","tr":{"ar":"هناك تمييز واضح في كندا بين رئيس الدولة — وهو العاهل — ورئيس الحكومة — وهو رئيس الوزراء الذي يدير فعليًا حكم البلاد."},"questions":[{"type":"mc","q":{"en":"Who is the head of government in Canada?","fr":"Qui est le chef du gouvernement au Canada?"},"options":{"en":["The Sovereign","The Governor General","The Prime Minister","The Chief Justice"],"fr":["Le souverain","Le gouverneur général","Le premier ministre","Le juge en chef"]},"answer":2},{"type":"mc","q":{"en":"Who actually directs the governing of the country?","fr":"Qui dirige réellement le pays?"},"options":{"en":["The Prime Minister","The Sovereign","The Senate","The Lieutenant Governor"],"fr":["Le premier ministre","Le souverain","Le Sénat","Le lieutenant-gouverneur"]},"answer":0},{"type":"tf","q":{"en":"The Prime Minister is Canada’s head of state.","fr":"Le premier ministre est le chef d’État du Canada."},"answer":false}]},{"id":"government-024","topic":"governor-general","importance":3,"en":"The Sovereign is represented in Canada by the Governor General, who is appointed by the Sovereign on the advice of the Prime Minister, usually for five years.","en_simple":"The Governor General represents the Sovereign in Canada. The Sovereign appoints the Governor General on the advice of the Prime Minister, usually for 5 years.","fr":"Le souverain est représenté au Canada par le gouverneur général, qui est nommé par le souverain sur recommandation du premier ministre, habituellement pour cinq ans.","tr":{"ar":"يمثّل العاهلَ في كندا الحاكمُ العام، الذي يعيّنه العاهل بناءً على مشورة رئيس الوزراء، عادةً لمدة خمس سنوات."},"questions":[{"type":"mc","q":{"en":"Who represents the Sovereign in Canada?","fr":"Qui représente le souverain au Canada?"},"options":{"en":["The Prime Minister","The Governor General","The Speaker of the Senate","The Commissioner"],"fr":["Le premier ministre","Le gouverneur général","Le président du Sénat","Le commissaire"]},"answer":1},{"type":"mc","q":{"en":"Who appoints the Governor General?","fr":"Qui nomme le gouverneur général?"},"options":{"en":["The House of Commons","The Senate","The Supreme Court","The Sovereign, on the advice of the Prime Minister"],"fr":["La Chambre des communes","Le Sénat","La Cour suprême","Le souverain, sur recommandation du premier ministre"]},"answer":3},{"type":"mc","q":{"en":"For how long is the Governor General usually appointed?","fr":"Pour combien de temps le gouverneur général est-il habituellement nommé?"},"options":{"en":["2 years","4 years","5 years","Until age 75"],"fr":["2 ans","4 ans","5 ans","Jusqu’à l’âge de 75 ans"]},"answer":2}]},{"id":"government-025","topic":"lieutenant-governor","importance":3,"en":"In each of the ten provinces, the Sovereign is represented by the Lieutenant Governor, who is appointed by the Governor General on the advice of the Prime Minister, also normally for five years.","en_simple":"In each of the 10 provinces, the Lieutenant Governor represents the Sovereign. The Governor General appoints the Lieutenant Governor on the advice of the Prime Minister, normally for 5 years.","fr":"Dans chacune des dix provinces, le souverain est représenté par le lieutenant-gouverneur, qui est nommé par le gouverneur général sur recommandation du premier ministre, aussi habituellement pour cinq ans.","tr":{"ar":"في كل مقاطعة من المقاطعات العشر، يمثّل العاهلَ نائبُ الحاكم العام (الحاكم المساعد)، الذي يعيّنه الحاكم العام بناءً على مشورة رئيس الوزراء، عادةً لمدة خمس سنوات أيضًا."},"questions":[{"type":"mc","q":{"en":"Who represents the Sovereign in each province?","fr":"Qui représente le souverain dans chaque province?"},"options":{"en":["The Premier","The Lieutenant Governor","The Commissioner","The Governor General"],"fr":["Le premier ministre provincial","Le lieutenant-gouverneur","Le commissaire","Le gouverneur général"]},"answer":1},{"type":"mc","q":{"en":"Who appoints the Lieutenant Governor?","fr":"Qui nomme le lieutenant-gouverneur?"},"options":{"en":["The Governor General, on the advice of the Prime Minister","The Premier of the province","The provincial Legislative Assembly","The Senate"],"fr":["Le gouverneur général, sur recommandation du premier ministre","Le premier ministre de la province","L’assemblée législative provinciale","Le Sénat"]},"answer":0},{"type":"tf","q":{"en":"The Lieutenant Governor is normally appointed for five years.","fr":"Le lieutenant-gouverneur est habituellement nommé pour cinq ans."},"answer":true}]},{"id":"government-026","topic":"three-branches","importance":3,"en":"The interplay between the three branches of government—the Executive, Legislative and Judicial—which work together but also sometimes in creative tension, helps to secure the rights and freedoms of Canadians.","en_simple":"The 3 branches of government are the Executive, the Legislative, and the Judicial. They work together, and this protects the rights and freedoms of Canadians.","fr":"L’interaction entre les trois pouvoirs du gouvernement – l’exécutif, le législatif et le judiciaire –, qui collaborent, mais parfois dans un climat de tension créatrice, aide à protéger les droits et les libertés des Canadiens.","tr":{"ar":"التفاعل بين السلطات الثلاث للحكومة — التنفيذية والتشريعية والقضائية — التي تعمل معًا، وأحيانًا في توتر خلّاق، يساعد على صون حقوق الكنديين وحرياتهم."},"questions":[{"type":"mc","q":{"en":"What are the three branches of government?","fr":"Quels sont les trois pouvoirs du gouvernement?"},"options":{"en":["Federal, provincial and municipal","The Sovereign, the Senate and the House of Commons","Executive, Legislative and Judicial","The Prime Minister, the Premiers and the Commissioners"],"fr":["Le fédéral, le provincial et le municipal","Le souverain, le Sénat et la Chambre des communes","L’exécutif, le législatif et le judiciaire","Le premier ministre, les premiers ministres provinciaux et les commissaires"]},"answer":2},{"type":"tf","q":{"en":"The three branches of government are the Executive, the Legislative and the Judicial.","fr":"Les trois pouvoirs du gouvernement sont l’exécutif, le législatif et le judiciaire."},"answer":true},{"type":"mc","q":{"en":"Which of the following is NOT one of the three branches of government?","fr":"Lequel des éléments suivants n’est PAS l’un des trois pouvoirs du gouvernement?"},"options":{"en":["Executive","Legislative","Judicial","Municipal"],"fr":["L’exécutif","Le législatif","Le judiciaire","Le municipal"]},"answer":3}]},{"id":"government-027","topic":"legislature-member-names","importance":3,"en":"Each provincial and territorial government has an elected legislature where provincial and territorial laws are passed. The members of the legislature are called members of the Legislative Assembly (MLAs), members of the National Assembly (MNAs), members of the Provincial Parliament (MPPs) or members of the House of Assembly (MHAs), depending on the province or territory.","en_simple":"Every province and territory has an elected legislature that passes its laws. Its members are called MLAs (Legislative Assembly), MNAs (National Assembly, Quebec), MPPs (Provincial Parliament, Ontario), or MHAs (House of Assembly), depending on the place.","fr":"Chaque gouvernement provincial et territorial a une assemblée législative élue qui adopte les lois provinciales et territoriales. Les membres de cette assemblée sont appelés membres de l’Assemblée législative, membres de l’Assemblée nationale, membres du Parlement provincial ou membres de la Chambre d’assemblée, selon la province ou le territoire, ou tout simplement députés.","tr":{"ar":"لكل حكومة مقاطعة أو إقليم مجلس تشريعي منتخب تُسنّ فيه قوانين المقاطعة أو الإقليم. ويُسمّى أعضاء المجلس أعضاء الجمعية التشريعية (MLAs)، أو أعضاء الجمعية الوطنية (MNAs)، أو أعضاء البرلمان الإقليمي (MPPs)، أو أعضاء مجلس النواب (MHAs)، حسب المقاطعة أو الإقليم."},"questions":[{"type":"mc","q":{"en":"What does MPP stand for?","fr":"Que signifie l’abréviation anglaise MPP?"},"options":{"en":["Member of the Provincial Parliament","Minister of Public Policy","Member of the Prime Minister’s Party","Member of the Provincial Police"],"fr":["Membre du Parlement provincial","Ministre des politiques publiques","Membre du parti du premier ministre","Membre de la police provinciale"]},"answer":0},{"type":"mc","q":{"en":"Which of the following is NOT a name for a member of a provincial or territorial legislature?","fr":"Lequel des titres suivants n’est PAS un nom donné à un membre d’une assemblée législative provinciale ou territoriale?"},"options":{"en":["Member of the Legislative Assembly (MLA)","Member of the National Assembly (MNA)","Member of the Senate (MS)","Member of the House of Assembly (MHA)"],"fr":["Membre de l’Assemblée législative","Membre de l’Assemblée nationale","Membre du Sénat","Membre de la Chambre d’assemblée"]},"answer":2},{"type":"tf","q":{"en":"Members of a provincial legislature may be called MLAs, MNAs, MPPs or MHAs depending on the province.","fr":"Les membres d’une assemblée législative provinciale peuvent être appelés membres de l’Assemblée législative, de l’Assemblée nationale, du Parlement provincial ou de la Chambre d’assemblée, selon la province."},"answer":true}]},{"id":"government-028","topic":"premier","importance":3,"en":"In each province, the Premier has a role similar to that of the Prime Minister in the federal government, just as the Lieutenant Governor has a role similar to that of the Governor General.","en_simple":"In a province, the Premier is like the Prime Minister, and the Lieutenant Governor is like the Governor General.","fr":"Dans chaque province, le premier ministre a un rôle similaire à celui du premier ministre du gouvernement fédéral, tout comme le lieutenant-gouverneur a un rôle similaire à celui du gouverneur général.","tr":{"ar":"في كل مقاطعة، يؤدي رئيس وزراء المقاطعة (Premier) دورًا مشابهًا لدور رئيس الوزراء في الحكومة الاتحادية، تمامًا كما يؤدي نائب الحاكم العام دورًا مشابهًا لدور الحاكم العام."},"questions":[{"type":"mc","q":{"en":"In a province, who has a role similar to that of the Prime Minister?","fr":"Dans une province, qui a un rôle similaire à celui du premier ministre fédéral?"},"options":{"en":["The Lieutenant Governor","The Premier","The Commissioner","The Speaker"],"fr":["Le lieutenant-gouverneur","Le premier ministre provincial","Le commissaire","Le président de l’assemblée"]},"answer":1},{"type":"mc","q":{"en":"In a province, who has a role similar to that of the Governor General?","fr":"Dans une province, qui a un rôle similaire à celui du gouverneur général?"},"options":{"en":["The Premier","The Commissioner","The Chief Justice","The Lieutenant Governor"],"fr":["Le premier ministre provincial","Le commissaire","Le juge en chef","Le lieutenant-gouverneur"]},"answer":3}]},{"id":"government-029","topic":"commissioner","importance":2,"en":"In the three territories, the Commissioner represents the federal government and plays a ceremonial role.","en_simple":"In the 3 territories, the Commissioner represents the federal government. The role is ceremonial.","fr":"Dans les trois territoires, le commissaire représente le gouvernement fédéral et joue un rôle cérémonial.","tr":{"ar":"في الأقاليم الثلاثة، يمثّل المفوّض (Commissioner) الحكومة الاتحادية ويؤدي دورًا شرفيًا (بروتوكوليًا)."},"questions":[{"type":"mc","q":{"en":"Who represents the federal government in the three territories?","fr":"Qui représente le gouvernement fédéral dans les trois territoires?"},"options":{"en":["The Lieutenant Governor","The Premier","The Commissioner","The Governor General"],"fr":["Le lieutenant-gouverneur","Le premier ministre territorial","Le commissaire","Le gouverneur général"]},"answer":2},{"type":"tf","q":{"en":"The Commissioner in a territory plays a ceremonial role.","fr":"Le commissaire d’un territoire joue un rôle cérémonial."},"answer":true}]},{"id":"government-030","topic":"system-diagram","importance":3,"en":"Canada’s System of Government: the Sovereign (King or Queen) is represented by the Governor General. The Legislative branch (Parliament) is the Senate (senators appointed by the Governor General on the advice of the Prime Minister) and the House of Commons (members of Parliament elected by voters). The Executive branch is the Prime Minister and Cabinet. The Judicial branch is the Supreme Court of Canada and the other courts.","en_simple":"Canada's system: Sovereign → represented by the Governor General. Legislative branch = Parliament (Senate = appointed; House of Commons = elected). Executive branch = Prime Minister and Cabinet. Judicial branch = Supreme Court of Canada and other courts.","fr":"Le système de gouvernement du Canada : le souverain (roi ou reine) est représenté par le gouverneur général. Le pouvoir législatif (Parlement) comprend le Sénat (sénateurs nommés par le gouverneur général sur recommandation du premier ministre) et la Chambre des communes (députés élus par les électeurs). Le pouvoir exécutif : le premier ministre et le Cabinet. Le pouvoir judiciaire : la Cour suprême du Canada et les autres tribunaux.","tr":{"ar":"نظام الحكم في كندا: العاهل (الملك أو الملكة) يمثّله الحاكم العام. السلطة التشريعية (البرلمان) تتألف من مجلس الشيوخ (أعضاؤه يعيّنهم الحاكم العام بناءً على مشورة رئيس الوزراء) ومجلس العموم (أعضاء البرلمان ينتخبهم الناخبون). السلطة التنفيذية: رئيس الوزراء ومجلس الوزراء. السلطة القضائية: المحكمة العليا لكندا والمحاكم الأخرى."},"questions":[{"type":"mc","q":{"en":"Who makes up the Executive branch of Canada’s government?","fr":"Qui compose le pouvoir exécutif du gouvernement du Canada?"},"options":{"en":["The Senate and the House of Commons","The Supreme Court of Canada","The Prime Minister and Cabinet","The Governor General and the Lieutenant Governors"],"fr":["Le Sénat et la Chambre des communes","La Cour suprême du Canada","Le premier ministre et le Cabinet","Le gouverneur général et les lieutenants-gouverneurs"]},"answer":2},{"type":"mc","q":{"en":"Which branch of government includes the Supreme Court of Canada?","fr":"Quel pouvoir du gouvernement comprend la Cour suprême du Canada?"},"options":{"en":["Executive","Legislative","Municipal","Judicial"],"fr":["L’exécutif","Le législatif","Le municipal","Le judiciaire"]},"answer":3},{"type":"mc","q":{"en":"Which branch of government is Parliament (the Senate and the House of Commons)?","fr":"À quel pouvoir du gouvernement appartient le Parlement (le Sénat et la Chambre des communes)?"},"options":{"en":["Legislative","Executive","Judicial","Ceremonial"],"fr":["Le législatif","L’exécutif","Le judiciaire","Le cérémonial"]},"answer":0},{"type":"tf","q":{"en":"In Parliament, the Senate is elected and the House of Commons is appointed.","fr":"Au Parlement, le Sénat est élu et la Chambre des communes est nommée."},"answer":false}]}]},{"unit":"elections","order":7,"title":{"en":"Federal Elections & Other Levels of Government","fr":"Les élections fédérales et les autres ordres de gouvernement"},"title_tr":{"ar":"الانتخابات الفيدرالية ومستويات الحكومة الأخرى"},"source":{"en":"10-federal-elections","fr":"10-elections-federales"},"cards":[{"id":"elections-001","topic":"members-of-parliament","importance":3,"en":"Canadians vote in elections for the people they want to represent them in the House of Commons. Members of the House of Commons are also known as members of Parliament or MPs.","en_simple":"Canadians vote to choose the people who represent them in the House of Commons. These people are called members of Parliament (MPs).","fr":"Les Canadiens votent aux élections pour les personnes qu’ils veulent comme représentants à la Chambre des communes. Les membres de la Chambre des communes sont aussi appelés membres du Parlement ou députés.","tr":{"ar":"يصوّت الكنديون في الانتخابات لاختيار الأشخاص الذين يريدونهم ممثلين لهم في مجلس العموم. ويُعرف أعضاء مجلس العموم أيضًا بأعضاء البرلمان أو النواب (MPs)."},"questions":[{"type":"mc","q":{"en":"How are Members of Parliament chosen?","fr":"Comment les députés sont-ils choisis?"},"options":{"en":["They are appointed by the United Nations","They are chosen by the provincial premiers","They are elected by voters in their local constituency (riding)","They are elected by landowners and police chiefs"],"fr":["Ils sont nommés par les Nations Unies","Ils sont choisis par les premiers ministres provinciaux","Ils sont élus par les électeurs de leur circonscription","Ils sont élus par les propriétaires fonciers et les chefs de police"]},"answer":2},{"type":"mc","q":{"en":"Members of the House of Commons are also known as…","fr":"Les membres de la Chambre des communes sont aussi appelés…"},"options":{"en":["Senators","Members of Parliament (MPs)","Ministers of the Crown","Lieutenant Governors"],"fr":["Sénateurs","Membres du Parlement (députés)","Ministres de la Couronne","Lieutenants-gouverneurs"]},"answer":1}]},{"id":"elections-002","topic":"election-date","importance":3,"en":"Under legislation passed by Parliament, federal elections must be held on the third Monday in October every four years following the most recent general election.","en_simple":"Federal elections must happen on the third Monday in October, every 4 years after the last general election.","fr":"D’après une loi adoptée par le Parlement, des élections fédérales doivent avoir lieu le troisième lundi d’octobre tous les quatre ans après les dernières élections générales.","tr":{"ar":"بموجب تشريع أقرّه البرلمان، يجب أن تُجرى الانتخابات الفيدرالية في يوم الاثنين الثالث من شهر أكتوبر كل 4 سنوات بعد آخر انتخابات عامة."},"questions":[{"type":"mc","q":{"en":"When must federal elections be held?","fr":"Quand les élections fédérales doivent-elles avoir lieu?"},"options":{"en":["On the first Monday in September every five years","On the third Monday in October every four years","On July 1 every four years","Whenever the Senate decides"],"fr":["Le premier lundi de septembre tous les cinq ans","Le troisième lundi d’octobre tous les quatre ans","Le 1er juillet tous les quatre ans","Quand le Sénat le décide"]},"answer":1},{"type":"tf","q":{"en":"Federal elections in Canada are held every five years.","fr":"Les élections fédérales au Canada ont lieu tous les cinq ans."},"answer":false},{"type":"mc","q":{"en":"In which month must a fixed-date federal election be held?","fr":"Dans quel mois une élection fédérale à date fixe doit-elle avoir lieu?"},"options":{"en":["October","June","November","April"],"fr":["Octobre","Juin","Novembre","Avril"]},"answer":0}]},{"id":"elections-003","topic":"election-date","importance":2,"en":"The Prime Minister may ask the Governor General to call an earlier election.","en_simple":"The Prime Minister can ask the Governor General to call an election before the fixed date.","fr":"Le premier ministre peut demander au gouverneur général de déclencher une élection plus tôt.","tr":{"ar":"يجوز لرئيس الوزراء أن يطلب من الحاكم العام الدعوة إلى انتخابات مبكرة."},"questions":[{"type":"mc","q":{"en":"Who may the Prime Minister ask to call an earlier election?","fr":"À qui le premier ministre peut-il demander de déclencher une élection plus tôt?"},"options":{"en":["The Chief Justice","The Speaker of the House","The Governor General","The Leader of the Opposition"],"fr":["Le juge en chef","Le président de la Chambre","Le gouverneur général","Le chef de l’opposition"]},"answer":2}]},{"id":"elections-004","topic":"electoral-districts","importance":3,"en":"Canada is divided into 308 electoral districts, also known as ridings or constituencies. An electoral district is a geographical area represented by a member of Parliament (MP).","en_simple":"The guide says Canada has 308 electoral districts. They are also called ridings or constituencies. Each one is an area represented by 1 MP.","fr":"Le Canada est divisé en 308 zones électorales, appelées circonscriptions. Une circonscription est une zone géographique représentée par un député.","tr":{"ar":"تنقسم كندا إلى 308 دوائر انتخابية، تُعرف أيضًا بالدوائر (ridings) أو الدوائر الانتخابية (constituencies). والدائرة الانتخابية هي منطقة جغرافية يمثّلها عضو في البرلمان (نائب)."},"questions":[{"type":"mc","q":{"en":"According to Discover Canada, how many electoral districts is Canada divided into?","fr":"Selon Découvrir le Canada, en combien de circonscriptions le Canada est-il divisé?"},"options":{"en":["105","308","338","10"],"fr":["105","308","338","10"]},"answer":1},{"type":"mc","q":{"en":"What is another name for an electoral district?","fr":"Quel est l’autre nom d’une zone électorale?"},"options":{"en":["A province","A municipality","A riding or constituency","A reserve"],"fr":["Une province","Une municipalité","Une circonscription","Une réserve"]},"answer":2},{"type":"tf","q":{"en":"An electoral district is a geographical area represented by a member of Parliament.","fr":"Une circonscription est une zone géographique représentée par un député."},"answer":true}]},{"id":"elections-005","topic":"electoral-districts","importance":3,"en":"The citizens in each electoral district elect one MP who sits in the House of Commons to represent them, as well as all Canadians.","en_simple":"Each electoral district elects 1 MP. The MP sits in the House of Commons and represents the people of the district and all Canadians.","fr":"Les citoyens de chaque circonscription élisent un député qui siège à la Chambre des communes. Ce député représente ses électeurs ainsi que tous les Canadiens.","tr":{"ar":"ينتخب المواطنون في كل دائرة انتخابية نائبًا واحدًا يجلس في مجلس العموم ليمثلهم، ويمثل جميع الكنديين أيضًا."},"questions":[{"type":"mc","q":{"en":"How many MPs does each electoral district elect?","fr":"Combien de députés chaque circonscription élit-elle?"},"options":{"en":["One","Two","Three","It depends on the population"],"fr":["Un","Deux","Trois","Cela dépend de la population"]},"answer":0},{"type":"tf","q":{"en":"An MP represents only the people of his or her own riding, not all Canadians.","fr":"Un député représente seulement les gens de sa circonscription, et non tous les Canadiens."},"answer":false}]},{"id":"elections-006","topic":"candidates","importance":2,"en":"Canadian citizens who are 18 years old or older may run in a federal election. The people who run for office are called candidates. There can be many candidates in an electoral district.","en_simple":"Canadian citizens 18 or older can run in a federal election. People who run are called candidates. A district can have many candidates.","fr":"Les citoyens canadiens âgés de 18 ans ou plus peuvent se présenter à une élection fédérale. Les personnes qui se présentent à une élection sont appelées candidats. Il peut y avoir de nombreux candidats dans une circonscription.","tr":{"ar":"يجوز للمواطنين الكنديين البالغين 18 عامًا أو أكثر الترشح في الانتخابات الفيدرالية. ويُسمّى الأشخاص الذين يترشحون للمنصب مرشحين. ويمكن أن يكون هناك مرشحون كثيرون في الدائرة الانتخابية الواحدة."},"questions":[{"type":"mc","q":{"en":"Who may run as a candidate in a federal election?","fr":"Qui peut se présenter comme candidat à une élection fédérale?"},"options":{"en":["Any resident of Canada aged 16 or older","Canadian citizens who are 18 years old or older","Only members of a political party","Only citizens who own property"],"fr":["Tout résident du Canada âgé de 16 ans ou plus","Les citoyens canadiens âgés de 18 ans ou plus","Seulement les membres d’un parti politique","Seulement les citoyens propriétaires"]},"answer":1},{"type":"mc","q":{"en":"What are the people who run for office called?","fr":"Comment appelle-t-on les personnes qui se présentent à une élection?"},"options":{"en":["Electors","Senators","Candidates","Ministers"],"fr":["Électeurs","Sénateurs","Candidats","Ministres"]},"answer":2}]},{"id":"elections-007","topic":"candidates","importance":3,"en":"The people in each electoral district vote for the candidate and political party of their choice. The candidate who receives the most votes becomes the MP for that electoral district.","en_simple":"People vote for the candidate and party they want. The candidate with the most votes becomes the MP for that district.","fr":"Dans chaque circonscription, les gens votent pour le candidat et le parti politique de leur choix. Le candidat qui obtient le plus grand nombre de votes devient le député de cette circonscription.","tr":{"ar":"يصوّت الناس في كل دائرة انتخابية للمرشح والحزب السياسي اللذين يختارونهما. ويصبح المرشح الحاصل على أكبر عدد من الأصوات نائبًا عن تلك الدائرة الانتخابية."},"questions":[{"type":"mc","q":{"en":"Who becomes the MP for an electoral district?","fr":"Qui devient le député d’une circonscription?"},"options":{"en":["The candidate chosen by the Governor General","The candidate who receives the most votes","The oldest candidate","The candidate chosen by the Prime Minister"],"fr":["Le candidat choisi par le gouverneur général","Le candidat qui obtient le plus grand nombre de votes","Le candidat le plus âgé","Le candidat choisi par le premier ministre"]},"answer":1},{"type":"tf","q":{"en":"A candidate must win more than half of the votes to become the MP.","fr":"Un candidat doit obtenir plus de la moitié des votes pour devenir député."},"answer":false}]},{"id":"elections-008","topic":"voting-eligibility","importance":3,"en":"One of the privileges of Canadian citizenship is the right to vote. You are eligible to vote in a federal election or cast a ballot in a federal referendum if you are: a Canadian citizen; and at least 18 years old on voting day; and on the voters’ list.","en_simple":"To vote in a federal election or referendum you must be: (1) a Canadian citizen, (2) at least 18 years old on voting day, (3) on the voters' list.","fr":"Un des privilèges de la citoyenneté canadienne est le droit de vote. Pour voter lors d’une élection fédérale ou d’un référendum fédéral, il faut être à la fois : citoyen canadien; âgé d’au moins 18 ans le jour du vote; inscrit sur la liste électorale.","tr":{"ar":"من امتيازات المواطنة الكندية الحق في التصويت. يحق لك التصويت في انتخابات فيدرالية أو الإدلاء بصوتك في استفتاء فيدرالي إذا كنت: مواطنًا كنديًا؛ وبالغًا 18 عامًا على الأقل في يوم التصويت؛ ومدرجًا في قائمة الناخبين."},"questions":[{"type":"mc","q":{"en":"Who is entitled to vote in Canadian federal elections?","fr":"Qui a le droit de voter aux élections fédérales canadiennes?"},"options":{"en":["Anyone living in Canada who is 18 or older","A Canadian citizen, at least 18 years old on voting day, and on the voters’ list","Any Canadian citizen who is at least 16 years old","Permanent residents who have lived in Canada for 3 years"],"fr":["Toute personne vivant au Canada âgée de 18 ans ou plus","Un citoyen canadien, âgé d’au moins 18 ans le jour du vote, et inscrit sur la liste électorale","Tout citoyen canadien âgé d’au moins 16 ans","Les résidents permanents qui vivent au Canada depuis 3 ans"]},"answer":1},{"type":"mc","q":{"en":"What is the minimum age to vote in a federal election?","fr":"Quel est l’âge minimal pour voter à une élection fédérale?"},"options":{"en":["16","18","19","21"],"fr":["16","18","19","21"]},"answer":1},{"type":"tf","q":{"en":"Permanent residents may vote in federal elections.","fr":"Les résidents permanents peuvent voter aux élections fédérales."},"answer":false}]},{"id":"elections-009","topic":"elections-canada","importance":3,"en":"The voters’ lists used during federal elections and referendums are produced from the National Register of Electors by a neutral agency of Parliament called Elections Canada. This is a permanent database of Canadian citizens 18 years of age or older who are qualified to vote.","en_simple":"Elections Canada is a neutral agency of Parliament. It makes the voters' lists from the National Register of Electors, a permanent database of citizens 18 or older who can vote.","fr":"Les listes électorales utilisées pendant les élections et les référendums fédéraux sont produites à partir du Registre national des électeurs par un organisme neutre du Parlement appelé Élections Canada. Il s’agit d’une base de données permanente sur les citoyens canadiens âgés de 18 ans ou plus qui ont le droit de voter.","tr":{"ar":"تُعدّ قوائم الناخبين المستخدمة في الانتخابات والاستفتاءات الفيدرالية من السجل الوطني للناخبين بواسطة هيئة محايدة تابعة للبرلمان تُسمى «انتخابات كندا» (Elections Canada). وهو قاعدة بيانات دائمة للمواطنين الكنديين البالغين 18 عامًا أو أكثر المؤهلين للتصويت."},"questions":[{"type":"mc","q":{"en":"What is the name of the neutral agency of Parliament that produces the voters’ lists?","fr":"Comment s’appelle l’organisme neutre du Parlement qui produit les listes électorales?"},"options":{"en":["Statistics Canada","Service Canada","Elections Canada","The Supreme Court"],"fr":["Statistique Canada","Service Canada","Élections Canada","La Cour suprême"]},"answer":2},{"type":"mc","q":{"en":"What is the National Register of Electors?","fr":"Qu’est-ce que le Registre national des électeurs?"},"options":{"en":["A list of all political parties in Canada","A permanent database of Canadian citizens 18 or older who are qualified to vote","A list of all members of Parliament","A record of election results since 1867"],"fr":["Une liste de tous les partis politiques du Canada","Une base de données permanente sur les citoyens canadiens de 18 ans ou plus qui ont le droit de voter","Une liste de tous les députés","Un registre des résultats électoraux depuis 1867"]},"answer":1}]},{"id":"elections-010","topic":"voter-information-card","importance":2,"en":"Once an election has been called, Elections Canada mails a voter information card to each elector whose name is in the National Register of Electors. The card lists when and where you vote and the number to call if you require an interpreter or other special services.","en_simple":"When an election is called, Elections Canada mails a voter information card to each elector in the National Register. The card says when and where to vote, and a number to call for an interpreter or special services.","fr":"Quand une élection est déclenchée, Élections Canada envoie par la poste une carte d’information de l’électeur à chaque personne dont le nom figure dans le Registre national des électeurs. La carte indique quand et à quel endroit vous devez voter ainsi que le numéro de téléphone à composer si vous avez besoin d’un interprète ou d’autres services spéciaux.","tr":{"ar":"بعد الدعوة إلى الانتخابات، ترسل «انتخابات كندا» بالبريد بطاقة معلومات الناخب إلى كل ناخب يرد اسمه في السجل الوطني للناخبين. وتبيّن البطاقة موعد التصويت ومكانه، والرقم الذي يمكن الاتصال به إذا احتجت إلى مترجم أو خدمات خاصة أخرى."},"questions":[{"type":"mc","q":{"en":"What does the voter information card tell you?","fr":"Qu’indique la carte d’information de l’électeur?"},"options":{"en":["The names of all candidates","When and where you vote","How to join a political party","The results of the last election"],"fr":["Les noms de tous les candidats","Quand et où vous devez voter","Comment adhérer à un parti politique","Les résultats de la dernière élection"]},"answer":1},{"type":"tf","q":{"en":"Elections Canada mails a voter information card to each elector in the National Register of Electors once an election has been called.","fr":"Élections Canada envoie par la poste une carte d’information de l’électeur à chaque personne inscrite au Registre national des électeurs une fois l’élection déclenchée."},"answer":true}]},{"id":"elections-011","topic":"voters-list","importance":2,"en":"Even if you choose not to be listed in the National Register of Electors or do not receive a voter information card, you can still be added to the voters’ list at any time, including on election day. To vote either on election day or at advance polls, go to the polling station listed on your voter information card.","en_simple":"If you are not in the Register or did not get a card, you can still be added to the voters' list at any time, even on election day. You vote at the polling station on your card.","fr":"Même si vous choisissez de ne pas faire inscrire votre nom dans le Registre national des électeurs ou ne recevez pas de carte d’information de l’électeur, vous pouvez faire ajouter votre nom à la liste électorale en tout temps, même le jour de l’élection. Pour voter le jour de l’élection ou par anticipation, rendez-vous au bureau de vote indiqué sur votre carte d’information de l’électeur.","tr":{"ar":"حتى إذا اخترت عدم إدراج اسمك في السجل الوطني للناخبين أو لم تتلقَّ بطاقة معلومات الناخب، يمكنك إضافة اسمك إلى قائمة الناخبين في أي وقت، بما في ذلك يوم الانتخابات. وللتصويت في يوم الانتخابات أو في الاقتراع المسبق، توجّه إلى مركز الاقتراع المذكور في بطاقة معلومات الناخب."},"questions":[{"type":"tf","q":{"en":"You can be added to the voters’ list at any time, including on election day.","fr":"Vous pouvez faire ajouter votre nom à la liste électorale en tout temps, même le jour de l’élection."},"answer":true},{"type":"mc","q":{"en":"If you did not receive a voter information card, what can you do?","fr":"Si vous n’avez pas reçu de carte d’information de l’électeur, que pouvez-vous faire?"},"options":{"en":["You cannot vote in that election","You can still be added to the voters’ list, even on election day","You must wait for the next election","You must ask your MP for permission"],"fr":["Vous ne pouvez pas voter à cette élection","Vous pouvez quand même faire ajouter votre nom à la liste électorale, même le jour de l’élection","Vous devez attendre la prochaine élection","Vous devez demander la permission à votre député"]},"answer":1}]},{"id":"elections-012","topic":"secret-ballot","importance":3,"en":"Canadian law secures the right to a secret ballot. This means that no one can watch you vote and no one should look at how you voted. No one, including family members, your employer or union representative, has the right to insist that you tell them how you voted.","en_simple":"Your vote is secret. No one can watch you vote. No one, not even your family, employer or union, has the right to make you say how you voted.","fr":"La loi canadienne prévoit le droit à un vote secret. Cela veut dire que personne ne peut vous regarder voter et que personne ne devrait regarder pour qui vous avez voté. Personne, y compris les membres de votre famille, votre employeur ou votre représentant syndical, n’a le droit d’insister pour que vous lui disiez pour qui vous avez voté.","tr":{"ar":"يكفل القانون الكندي الحق في الاقتراع السري. وهذا يعني أنه لا يحق لأحد مراقبتك أثناء التصويت ولا ينبغي لأحد النظر إلى ما صوّتَّ له. ولا يحق لأحد، بمن فيهم أفراد الأسرة أو صاحب العمل أو ممثل النقابة، أن يُصرّ على أن تخبره بمن صوّتَّ له."},"questions":[{"type":"mc","q":{"en":"In Canada, are you obliged to tell other people how you voted?","fr":"Au Canada, êtes-vous obligé de dire aux autres pour qui vous avez voté?"},"options":{"en":["Yes, if your employer asks","Yes, if a family member asks","No, no one has the right to insist that you tell them how you voted","Only if a union representative asks"],"fr":["Oui, si votre employeur le demande","Oui, si un membre de la famille le demande","Non, personne n’a le droit d’insister pour que vous disiez pour qui vous avez voté","Seulement si un représentant syndical le demande"]},"answer":2},{"type":"tf","q":{"en":"Your employer has the right to insist that you tell them how you voted.","fr":"Votre employeur a le droit d’insister pour que vous lui disiez pour qui vous avez voté."},"answer":false},{"type":"mc","q":{"en":"What does the right to a secret ballot mean?","fr":"Que signifie le droit à un vote secret?"},"options":{"en":["Ballots are not counted in public","No one can watch you vote and no one should look at how you voted","Only citizens can know the results","Candidates’ names are hidden on the ballot"],"fr":["Les bulletins ne sont pas comptés en public","Personne ne peut vous regarder voter et personne ne devrait regarder pour qui vous avez voté","Seuls les citoyens peuvent connaître les résultats","Les noms des candidats sont cachés sur le bulletin"]},"answer":1}]},{"id":"elections-013","topic":"results","importance":2,"en":"Immediately after the polling stations close, election officers count the ballots and the results are announced on radio and television, and in the newspapers.","en_simple":"Right after the polls close, election officers count the ballots. Results are announced on radio, TV and in newspapers.","fr":"Immédiatement après la fermeture des bureaux de vote, les membres du personnel électoral comptent les votes et les résultats sont annoncés à la radio et à la télévision ainsi que dans les journaux.","tr":{"ar":"فور إغلاق مراكز الاقتراع، يقوم موظفو الانتخابات بعدّ الأصوات، وتُعلن النتائج في الإذاعة والتلفزيون والصحف."},"questions":[{"type":"mc","q":{"en":"When are the ballots counted in a federal election?","fr":"Quand les bulletins de vote sont-ils comptés lors d’une élection fédérale?"},"options":{"en":["One week after election day","Immediately after the polling stations close","Before the polls open","After the Governor General approves"],"fr":["Une semaine après le jour de l’élection","Immédiatement après la fermeture des bureaux de vote","Avant l’ouverture des bureaux de vote","Après l’approbation du gouverneur général"]},"answer":1}]},{"id":"elections-014","topic":"forming-government","importance":3,"en":"Ordinarily, after an election, the leader of the political party with the most seats in the House of Commons is invited by the Governor General to form the government. After being appointed by the Governor General, the leader of this party becomes the Prime Minister.","en_simple":"After an election, the Governor General invites the leader of the party with the most seats to form the government. That leader becomes the Prime Minister.","fr":"Habituellement, après une élection, le chef du parti politique qui a le plus grand nombre de sièges à la Chambre des communes est invité par le gouverneur général à former le gouvernement. Après avoir été nommé par le gouverneur général, le chef de ce parti devient le premier ministre.","tr":{"ar":"عادةً، بعد الانتخابات، يدعو الحاكم العام زعيم الحزب السياسي الحاصل على أكبر عدد من المقاعد في مجلس العموم إلى تشكيل الحكومة. وبعد تعيينه من قِبل الحاكم العام، يصبح زعيم هذا الحزب رئيس الوزراء."},"questions":[{"type":"mc","q":{"en":"After an election, which party forms the government?","fr":"Après une élection, quel parti forme le gouvernement?"},"options":{"en":["The party chosen by the Senate","The party with the most seats in the House of Commons","The party with the oldest leader","The party that received the most money"],"fr":["Le parti choisi par le Sénat","Le parti qui a le plus grand nombre de sièges à la Chambre des communes","Le parti dont le chef est le plus âgé","Le parti qui a reçu le plus d’argent"]},"answer":1},{"type":"mc","q":{"en":"Who invites the leader of the party with the most seats to form the government?","fr":"Qui invite le chef du parti ayant le plus de sièges à former le gouvernement?"},"options":{"en":["The Governor General","The Chief Justice","The Speaker of the Senate","The Leader of the Opposition"],"fr":["Le gouverneur général","Le juge en chef","Le président du Sénat","Le chef de l’opposition"]},"answer":0},{"type":"tf","q":{"en":"The Prime Minister is elected directly by all Canadian voters.","fr":"Le premier ministre est élu directement par tous les électeurs canadiens."},"answer":false}]},{"id":"elections-015","topic":"majority-government","importance":3,"en":"If the party in power holds at least half of the seats in the House of Commons, this is called a majority government.","en_simple":"Majority government = the party in power has at least half of the seats in the House of Commons.","fr":"Si le parti au pouvoir détient au moins la moitié des sièges à la Chambre des communes, on dit qu’il s’agit d’un gouvernement majoritaire.","tr":{"ar":"إذا كان الحزب الحاكم يملك نصف مقاعد مجلس العموم على الأقل، يُسمى ذلك حكومة أغلبية."},"questions":[{"type":"mc","q":{"en":"What is a majority government?","fr":"Qu’est-ce qu’un gouvernement majoritaire?"},"options":{"en":["The party in power holds at least half of the seats in the House of Commons","The party in power holds less than half of the seats","Two parties share power equally","The Senate has more members than the House"],"fr":["Le parti au pouvoir détient au moins la moitié des sièges à la Chambre des communes","Le parti au pouvoir détient moins de la moitié des sièges","Deux partis partagent le pouvoir également","Le Sénat compte plus de membres que la Chambre"]},"answer":0},{"type":"tf","q":{"en":"A majority government holds at least half of the seats in the House of Commons.","fr":"Un gouvernement majoritaire détient au moins la moitié des sièges à la Chambre des communes."},"answer":true}]},{"id":"elections-016","topic":"minority-government","importance":3,"en":"If the party in power holds less than half of the seats in the House of Commons, this is called a minority government.","en_simple":"Minority government = the party in power has less than half of the seats in the House of Commons.","fr":"Si le parti au pouvoir détient moins de la moitié des sièges à la Chambre des communes, on dit qu’il forme un gouvernement minoritaire.","tr":{"ar":"إذا كان الحزب الحاكم يملك أقل من نصف مقاعد مجلس العموم، يُسمى ذلك حكومة أقلية."},"questions":[{"type":"mc","q":{"en":"What is a minority government?","fr":"Qu’est-ce qu’un gouvernement minoritaire?"},"options":{"en":["A government formed by the Senate","A government led by the Governor General","A government with no opposition parties","The party in power holds less than half of the seats in the House of Commons"],"fr":["Un gouvernement formé par le Sénat","Un gouvernement dirigé par le gouverneur général","Un gouvernement sans partis d’opposition","Le parti au pouvoir détient moins de la moitié des sièges à la Chambre des communes"]},"answer":3},{"type":"tf","q":{"en":"A minority government holds at least half of the seats in the House of Commons.","fr":"Un gouvernement minoritaire détient au moins la moitié des sièges à la Chambre des communes."},"answer":false}]},{"id":"elections-017","topic":"confidence","importance":3,"en":"The Prime Minister and the party in power run the government as long as they have the support or confidence of the majority of the MPs. When the House of Commons votes on a major issue such as the budget, this is considered a matter of confidence. If a majority of the members vote against a major government decision, the party in power is defeated, which usually results in the Prime Minister asking the Governor General, on behalf of the Sovereign, to call an election.","en_simple":"The government stays in power only while most MPs support it (confidence). A vote on the budget is a matter of confidence. If most MPs vote against a major decision, the government is defeated and the PM usually asks the GG to call an election.","fr":"Le premier ministre et le parti au pouvoir forment le gouvernement aussi longtemps qu’ils ont l’appui ou la confiance de la majorité des députés. Quand la Chambre des communes vote sur un enjeu important comme le budget, on considère qu’il s’agit d’une question de confiance. Si la majorité des députés de la Chambre des communes vote contre une décision importante du gouvernement, le parti au pouvoir est défait, ce qui amène habituellement le premier ministre à demander au gouverneur général, au nom du souverain, de déclencher une élection.","tr":{"ar":"يدير رئيس الوزراء والحزب الحاكم الحكومة ما داما يحظيان بدعم أو ثقة أغلبية النواب. وعندما يصوّت مجلس العموم على مسألة كبرى مثل الميزانية، يُعدّ ذلك مسألة ثقة. وإذا صوّتت أغلبية الأعضاء ضد قرار حكومي كبير، يُهزم الحزب الحاكم، مما يؤدي عادةً إلى أن يطلب رئيس الوزراء من الحاكم العام، نيابةً عن الملك، الدعوة إلى انتخابات."},"questions":[{"type":"mc","q":{"en":"A vote in the House of Commons on which issue is considered a matter of confidence?","fr":"Un vote à la Chambre des communes sur quel enjeu est considéré comme une question de confiance?"},"options":{"en":["The national anthem","The budget","The date of Canada Day","The appointment of judges"],"fr":["L’hymne national","Le budget","La date de la fête du Canada","La nomination des juges"]},"answer":1},{"type":"mc","q":{"en":"What usually happens if a majority of MPs vote against a major government decision?","fr":"Que se passe-t-il habituellement si la majorité des députés vote contre une décision importante du gouvernement?"},"options":{"en":["The Senate takes over the government","The Governor General becomes Prime Minister","The party in power is defeated and the Prime Minister asks the Governor General to call an election","Nothing; the government continues as before"],"fr":["Le Sénat prend le contrôle du gouvernement","Le gouverneur général devient premier ministre","Le parti au pouvoir est défait et le premier ministre demande au gouverneur général de déclencher une élection","Rien; le gouvernement continue comme avant"]},"answer":2},{"type":"tf","q":{"en":"The Prime Minister and the party in power run the government as long as they have the confidence of the majority of the MPs.","fr":"Le premier ministre et le parti au pouvoir forment le gouvernement aussi longtemps qu’ils ont la confiance de la majorité des députés."},"answer":true}]},{"id":"elections-018","topic":"cabinet","importance":3,"en":"The Prime Minister chooses the ministers of the Crown, most of them from among members of the House of Commons. Cabinet ministers are responsible for running the federal government departments.","en_simple":"The Prime Minister chooses the ministers of the Crown, mostly from MPs. Cabinet ministers run the federal government departments.","fr":"Le premier ministre choisit les ministres de la Couronne, la plupart d’entre eux parmi les députés de la Chambre des communes. Les ministres du Cabinet ont la responsabilité de diriger les ministères du gouvernement fédéral.","tr":{"ar":"يختار رئيس الوزراء وزراء التاج، ومعظمهم من بين أعضاء مجلس العموم. ويتولى وزراء مجلس الوزراء مسؤولية إدارة وزارات الحكومة الفيدرالية."},"questions":[{"type":"mc","q":{"en":"Who chooses the ministers of the Crown?","fr":"Qui choisit les ministres de la Couronne?"},"options":{"en":["The Governor General","The voters","The Senate","The Prime Minister"],"fr":["Le gouverneur général","Les électeurs","Le Sénat","Le premier ministre"]},"answer":3},{"type":"mc","q":{"en":"What are Cabinet ministers responsible for?","fr":"De quoi les ministres du Cabinet sont-ils responsables?"},"options":{"en":["Running the federal government departments","Counting the ballots","Appointing the Governor General","Representing the King in the provinces"],"fr":["Diriger les ministères du gouvernement fédéral","Compter les bulletins de vote","Nommer le gouverneur général","Représenter le roi dans les provinces"]},"answer":0}]},{"id":"elections-019","topic":"cabinet","importance":2,"en":"The Prime Minister and the Cabinet ministers are called the Cabinet and they make important decisions about how the country is governed. They prepare the budget and propose most new laws. Their decisions can be questioned by all members of the House of Commons.","en_simple":"The Cabinet = the Prime Minister + the Cabinet ministers. The Cabinet prepares the budget and proposes most new laws. All MPs can question its decisions.","fr":"Le premier ministre et les ministres du Cabinet forment ce qu’on appelle le Cabinet et prennent les décisions importantes sur la façon de diriger le pays. Ils préparent le budget et proposent la plupart des nouvelles lois. Leurs décisions peuvent être remises en question par tous les députés de la Chambre des communes.","tr":{"ar":"يُسمى رئيس الوزراء ووزراء مجلس الوزراء معًا «مجلس الوزراء» (الكابينيت)، وهم يتخذون القرارات المهمة بشأن كيفية حكم البلاد. ويُعدّون الميزانية ويقترحون معظم القوانين الجديدة. ويمكن لجميع أعضاء مجلس العموم التشكيك في قراراتهم."},"questions":[{"type":"mc","q":{"en":"Who prepares the budget and proposes most new laws?","fr":"Qui prépare le budget et propose la plupart des nouvelles lois?"},"options":{"en":["The Senate","The Cabinet","The Supreme Court","Elections Canada"],"fr":["Le Sénat","Le Cabinet","La Cour suprême","Élections Canada"]},"answer":1},{"type":"tf","q":{"en":"The Prime Minister and the Cabinet ministers together are called the Cabinet.","fr":"Le premier ministre et les ministres du Cabinet forment ensemble le Cabinet."},"answer":true}]},{"id":"elections-020","topic":"opposition","importance":3,"en":"The other parties that are not in power are known as opposition parties. The opposition party with the most members of the House of Commons is the Official Opposition or His Majesty’s Loyal Opposition. The role of opposition parties is to peacefully oppose or try to improve government proposals.","en_simple":"Parties not in power are opposition parties. The biggest opposition party is the Official Opposition, also called His Majesty's Loyal Opposition. Their job is to peacefully oppose or improve government proposals.","fr":"Les autres partis qui ne sont pas au pouvoir sont appelés les partis d’opposition. Le parti d’opposition qui a le plus grand nombre de députés à la Chambre des communes est l’opposition officielle, ou La loyale Opposition de Sa Majesté. Le rôle des partis d’opposition est de s’opposer pacifiquement aux propositions du gouvernement ou d’essayer de les améliorer.","tr":{"ar":"تُعرف الأحزاب الأخرى غير الحاكمة بأحزاب المعارضة. وحزب المعارضة الذي يملك أكبر عدد من الأعضاء في مجلس العموم هو المعارضة الرسمية أو «معارضة جلالة الملك الموالية». ودور أحزاب المعارضة هو معارضة مقترحات الحكومة سلميًا أو محاولة تحسينها."},"questions":[{"type":"mc","q":{"en":"What is the Official Opposition also called?","fr":"Comment appelle-t-on aussi l’opposition officielle?"},"options":{"en":["The Shadow Government","His Majesty’s Loyal Opposition","The Senate Opposition","The Crown Party"],"fr":["Le gouvernement fantôme","La loyale Opposition de Sa Majesté","L’opposition du Sénat","Le Parti de la Couronne"]},"answer":1},{"type":"mc","q":{"en":"Which party becomes the Official Opposition?","fr":"Quel parti devient l’opposition officielle?"},"options":{"en":["The opposition party with the most members in the House of Commons","The party with the most senators","The party chosen by the Governor General","The newest political party"],"fr":["Le parti d’opposition qui a le plus grand nombre de députés à la Chambre des communes","Le parti qui a le plus de sénateurs","Le parti choisi par le gouverneur général","Le parti politique le plus récent"]},"answer":0},{"type":"mc","q":{"en":"What is the role of the opposition parties?","fr":"Quel est le rôle des partis d’opposition?"},"options":{"en":["To run the government departments","To appoint judges","To peacefully oppose or try to improve government proposals","To count the votes in an election"],"fr":["Diriger les ministères du gouvernement","Nommer les juges","S’opposer pacifiquement aux propositions du gouvernement ou essayer de les améliorer","Compter les votes lors d’une élection"]},"answer":2}]},{"id":"elections-021","topic":"political-parties","importance":3,"en":"There are three major political parties currently represented in the House of Commons: the Conservative Party, the Liberal Party, and the New Democratic Party.","en_simple":"The 3 major parties in the House of Commons: the Conservative Party, the Liberal Party, and the New Democratic Party (NDP).","fr":"Il y a actuellement trois grands partis politiques représentés à la Chambre des communes : le Parti conservateur, le Nouveau Parti démocratique et le Parti libéral.","tr":{"ar":"هناك ثلاثة أحزاب سياسية رئيسية ممثلة حاليًا في مجلس العموم: حزب المحافظين (Conservative Party)، والحزب الليبرالي (Liberal Party)، والحزب الديمقراطي الجديد (New Democratic Party)."},"questions":[{"type":"mc","q":{"en":"Which of the following is NOT one of the three major political parties named in the guide?","fr":"Lequel des partis suivants n’est PAS l’un des trois grands partis politiques nommés dans le guide?"},"options":{"en":["The Conservative Party","The Liberal Party","The New Democratic Party","The Green Party"],"fr":["Le Parti conservateur","Le Parti libéral","Le Nouveau Parti démocratique","Le Parti vert"]},"answer":3},{"type":"mc","q":{"en":"Name the three major political parties represented in the House of Commons.","fr":"Nommez les trois grands partis politiques représentés à la Chambre des communes."},"options":{"en":["Conservative, Liberal, New Democratic","Republican, Democratic, Libertarian","Labour, Conservative, Green","Liberal, Bloc, Reform"],"fr":["Conservateur, libéral, néo-démocrate","Républicain, démocrate, libertarien","Travailliste, conservateur, vert","Libéral, Bloc, réformiste"]},"answer":0}]},{"id":"elections-022","topic":"voting-procedure","importance":2,"en":"Voting procedure, step 1: Electors whose information is in the National Register of Electors will receive a voter information card. Step 2: If you do not receive a voter information card, call your local elections office to ensure that you are on the voters’ list. If you do not have the number, call Elections Canada, in Ottawa.","en_simple":"Step 1: electors in the National Register get a voter information card. Step 2: if you do not get a card, call your local elections office, or call Elections Canada in Ottawa.","fr":"1. La carte d’information de l’électeur — Les électeurs dont les renseignements se trouvent dans le Registre national des électeurs recevront une carte d’information de l’électeur. 2. Je n’ai pas reçu de carte — Si vous ne recevez pas de carte d’information de l’électeur, téléphonez à votre bureau d’élection local pour vérifier que votre nom est sur la liste électorale. Si vous n’avez pas le numéro du bureau, téléphonez à Élections Canada, à Ottawa.","tr":{"ar":"إجراءات التصويت، الخطوة 1: يتلقى الناخبون المسجلون في السجل الوطني للناخبين بطاقة معلومات الناخب. الخطوة 2: إذا لم تتلقَّ بطاقة معلومات الناخب، فاتصل بمكتب الانتخابات المحلي للتأكد من إدراج اسمك في قائمة الناخبين. وإذا لم يكن لديك الرقم، فاتصل بـ«انتخابات كندا» في أوتاوا."},"questions":[{"type":"mc","q":{"en":"What should you do if you do not receive a voter information card?","fr":"Que devez-vous faire si vous ne recevez pas de carte d’information de l’électeur?"},"options":{"en":["Call your local elections office or Elections Canada to ensure you are on the voters’ list","Go to the Senate","Write to the Governor General","Wait until the next election"],"fr":["Téléphoner à votre bureau d’élection local ou à Élections Canada pour vérifier que vous êtes sur la liste électorale","Vous rendre au Sénat","Écrire au gouverneur général","Attendre la prochaine élection"]},"answer":0},{"type":"tf","q":{"en":"The voter information card confirms that your name is on the voters’ list.","fr":"La carte d’information de l’électeur confirme que votre nom est sur la liste électorale."},"answer":true}]},{"id":"elections-023","topic":"voting-procedure","importance":2,"en":"Voting procedure, step 3: If you cannot or do not wish to vote on election day, you can vote at the advance polls or by special ballot. The dates and location are on your voter information card.","en_simple":"Step 3: if you cannot vote on election day, you can vote at the advance polls or by special ballot. Dates and places are on your card.","fr":"3. Le vote par anticipation et le bulletin de vote spécial — Si vous ne pouvez pas ou ne voulez pas voter le jour de l’élection, vous pouvez voter par anticipation ou par bulletin de vote spécial, aux dates et lieux inscrits sur votre carte d’information de l’électeur.","tr":{"ar":"إجراءات التصويت، الخطوة 3: إذا كنت لا تستطيع أو لا ترغب في التصويت يوم الانتخابات، يمكنك التصويت في الاقتراع المسبق أو عن طريق الاقتراع الخاص. وتُذكر التواريخ والأماكن في بطاقة معلومات الناخب."},"questions":[{"type":"mc","q":{"en":"What can you do if you cannot vote on election day?","fr":"Que pouvez-vous faire si vous ne pouvez pas voter le jour de l’élection?"},"options":{"en":["Ask a family member to vote for you","Vote by email","Vote at the advance polls or by special ballot","Nothing; you lose your vote"],"fr":["Demander à un membre de votre famille de voter pour vous","Voter par courriel","Voter par anticipation ou par bulletin de vote spécial","Rien; vous perdez votre vote"]},"answer":2}]},{"id":"elections-024","topic":"voting-procedure","importance":3,"en":"Voting procedure, step 4: On election day, go to your polling station. The location is on your voter information card. Bring this card and proof of your identity and address to the polling station.","en_simple":"Step 4: on election day, go to your polling station (the address is on your card). Bring your voter information card and proof of your identity and address.","fr":"4. Le jour de l’élection — Rendez-vous à votre bureau de vote, dont l’adresse figure sur votre carte d’information de l’électeur. Apportez cette carte ainsi qu’une preuve de votre identité et de votre adresse au bureau de vote.","tr":{"ar":"إجراءات التصويت، الخطوة 4: في يوم الانتخابات، توجّه إلى مركز الاقتراع الخاص بك؛ وموقعه مذكور في بطاقة معلومات الناخب. أحضر هذه البطاقة وإثبات هويتك وعنوانك إلى مركز الاقتراع."},"questions":[{"type":"mc","q":{"en":"What sh
