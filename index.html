 most popular spectator sport and the national winter sport. Ice hockey was developed in Canada in the 1800s.","fr":"Le hockey, sport de spectacle favori des Canadiens, est considéré comme le sport d’hiver national. Le hockey sur glace a vu le jour au Canada au dix-neuvième siècle.","tr":{"ar":"الهوكي هو الرياضة الأكثر شعبية بين المتفرجين في كندا ويُعدّ الرياضة الشتوية الوطنية. وقد تطوّر هوكي الجليد في كندا في القرن التاسع عشر (1800s)."},"questions":[{"type":"mc","q":{"en":"What is Canada’s national winter sport?","fr":"Quel est le sport d’hiver national du Canada?"},"options":{"en":["Curling","Lacrosse","Hockey","Skiing"],"fr":["Le curling","La crosse","Le hockey","Le ski"]},"answer":2},{"type":"mc","q":{"en":"What is Canada’s most popular spectator sport?","fr":"Quel est le sport de spectacle favori des Canadiens?"},"options":{"en":["Soccer","Hockey","Canadian football","Baseball"],"fr":["Le soccer","Le hockey","Le football canadien","Le baseball"]},"answer":1},{"type":"tf","q":{"en":"Ice hockey was developed in Canada in the 1800s.","fr":"Le hockey sur glace a vu le jour au Canada au dix-neuvième siècle."},"answer":true}]},{"id":"symbols-021","topic":"sports","importance":3,"en":"The National Hockey League plays for the championship Stanley Cup, donated by Lord Stanley, the Governor General, in 1892.","en_simple":"NHL teams play for the Stanley Cup. Lord Stanley, the Governor General, donated it in 1892.","fr":"Les équipes qui forment la Ligue nationale de hockey se disputent la Coupe Stanley, donnée en 1892 par lord Stanley, gouverneur général du Canada.","tr":{"ar":"تتنافس فرق دوري الهوكي الوطني على كأس ستانلي (Stanley Cup)، التي تبرّع بها اللورد ستانلي (Lord Stanley)، الحاكم العام، عام 1892."},"questions":[{"type":"mc","q":{"en":"Who donated the Stanley Cup?","fr":"Qui a donné la Coupe Stanley?"},"options":{"en":["Lord Stanley, the Governor General","Sir John A. Macdonald","Adrienne Clarkson","Queen Victoria"],"fr":["Lord Stanley, gouverneur général","Sir John A. Macdonald","Adrienne Clarkson","La reine Victoria"]},"answer":0},{"type":"mc","q":{"en":"In what year was the Stanley Cup donated?","fr":"En quelle année la Coupe Stanley a-t-elle été donnée?"},"options":{"en":["1867","1876","1892","2005"],"fr":["1867","1876","1892","2005"]},"answer":2}]},{"id":"symbols-022","topic":"sports","importance":3,"en":"The Clarkson Cup, established in 2005 by Adrienne Clarkson, the 26th Governor General (and the first of Asian origin), is awarded for women’s hockey.","en_simple":"The Clarkson Cup (2005) is for women's hockey. Adrienne Clarkson was the 26th Governor General and the first of Asian origin.","fr":"La Coupe Clarkson, créée en 2005 par Adrienne Clarkson, la 26e gouverneure générale (et la première d’origine asiatique), est décernée aux équipes de hockey féminin.","tr":{"ar":"كأس كلاركسون (Clarkson Cup)، التي أنشأتها عام 2005 أدريان كلاركسون (Adrienne Clarkson)، الحاكمة العامة السادسة والعشرون (وأول حاكم عام من أصل آسيوي)، تُمنح في هوكي السيدات."},"questions":[{"type":"mc","q":{"en":"The Clarkson Cup is awarded for what?","fr":"La Coupe Clarkson est décernée pour quoi?"},"options":{"en":["Men’s hockey","Women’s hockey","Lacrosse","Curling"],"fr":["Le hockey masculin","Le hockey féminin","La crosse","Le curling"]},"answer":1},{"type":"mc","q":{"en":"Who was Adrienne Clarkson?","fr":"Qui était Adrienne Clarkson?"},"options":{"en":["The first woman Prime Minister","The 26th Governor General and the first of Asian origin","The founder of the Royal Military College","The first woman Member of Parliament"],"fr":["La première femme premier ministre","La 26e gouverneure générale et la première d’origine asiatique","La fondatrice du Collège militaire royal","La première femme députée"]},"answer":1},{"type":"tf","q":{"en":"The Clarkson Cup was established in 1892.","fr":"La Coupe Clarkson a été créée en 1892."},"answer":false}]},{"id":"symbols-023","topic":"sports","importance":2,"en":"Canadian football is the second most popular sport. Curling, an ice game introduced by Scottish pioneers, is popular.","en_simple":"Canadian football is the second most popular sport. Curling (an ice game) was introduced by Scottish pioneers.","fr":"Le jeu de football canadien est le deuxième sport le plus populaire. Le curling, jeu sur glace introduit par les pionniers écossais, est également populaire.","tr":{"ar":"كرة القدم الكندية هي ثاني أكثر الرياضات شعبية. والكيرلنغ، وهي لعبة على الجليد أدخلها الروّاد الاسكتلنديون، رياضة شائعة."},"questions":[{"type":"mc","q":{"en":"What is the second most popular sport in Canada?","fr":"Quel est le deuxième sport le plus populaire au Canada?"},"options":{"en":["Soccer","Curling","Canadian football","Lacrosse"],"fr":["Le soccer","Le curling","Le football canadien","La crosse"]},"answer":2},{"type":"mc","q":{"en":"Who introduced curling to Canada?","fr":"Qui a introduit le curling au Canada?"},"options":{"en":["French pioneers","Scottish pioneers","Irish pioneers","Aboriginal peoples"],"fr":["Les pionniers français","Les pionniers écossais","Les pionniers irlandais","Les peuples autochtones"]},"answer":1}]},{"id":"symbols-024","topic":"sports","importance":3,"en":"Lacrosse, an ancient sport first played by Aboriginals, is the official summer sport. Soccer has the most registered players of any game in Canada.","en_simple":"Lacrosse (first played by Aboriginal peoples) is the official summer sport. Soccer has the most registered players in Canada.","fr":"Le jeu de la crosse, sport ancien joué à l’origine par les Autochtones, est le sport officiel de l’été. Le soccer, quant à lui, compte plus de joueurs inscrits que toute autre activité sportive au Canada.","tr":{"ar":"اللاكروس، وهي رياضة قديمة لعبها السكان الأصليون أولًا، هي الرياضة الصيفية الرسمية. وكرة القدم (السوكر) لديها أكبر عدد من اللاعبين المسجّلين بين جميع الألعاب في كندا."},"questions":[{"type":"mc","q":{"en":"What is Canada’s official summer sport?","fr":"Quel est le sport officiel de l’été au Canada?"},"options":{"en":["Soccer","Baseball","Lacrosse","Canadian football"],"fr":["Le soccer","Le baseball","La crosse","Le football canadien"]},"answer":2},{"type":"mc","q":{"en":"Which sport has the most registered players in Canada?","fr":"Quel sport compte le plus de joueurs inscrits au Canada?"},"options":{"en":["Hockey","Soccer","Lacrosse","Curling"],"fr":["Le hockey","Le soccer","La crosse","Le curling"]},"answer":1},{"type":"mc","q":{"en":"Who first played lacrosse?","fr":"Qui a joué à la crosse à l’origine?"},"options":{"en":["Scottish pioneers","French settlers","Aboriginal peoples","British soldiers"],"fr":["Les pionniers écossais","Les colons français","Les Autochtones","Les soldats britanniques"]},"answer":2}]},{"id":"symbols-025","topic":"beaver","importance":3,"en":"The beaver was adopted centuries ago as a symbol of the Hudson’s Bay Company. It became an emblem of the St. Jean Baptiste Society, a French-Canadian patriotic association, in 1834, and was also adopted by other groups.","en_simple":"The beaver was a symbol of the Hudson's Bay Company centuries ago. In 1834 it became the emblem of the St. Jean Baptiste Society (a French-Canadian patriotic group).","fr":"Le castor a été choisi comme symbole de la Compagnie de la Baie d’Hudson il y a plusieurs siècles. Il devient en 1834 l’emblème de la Société Saint-Jean-Baptiste, association patriotique canadienne-française, et son image est utilisée par d’autres groupes.","tr":{"ar":"اعتُمد القندس قبل قرون رمزًا لشركة خليج هدسون (Hudson’s Bay Company). وأصبح عام 1834 شعارًا لجمعية سان جان باتيست (St. Jean Baptiste Society)، وهي جمعية وطنية كندية فرنسية، كما تبنّته جماعات أخرى."},"questions":[{"type":"mc","q":{"en":"The beaver was adopted centuries ago as the symbol of which company?","fr":"Le castor a été choisi il y a plusieurs siècles comme symbole de quelle compagnie?"},"options":{"en":["The Canadian Pacific Railway","The Hudson’s Bay Company","The North West Company","The Royal Military College"],"fr":["Du Canadien Pacifique","De la Compagnie de la Baie d’Hudson","De la Compagnie du Nord-Ouest","Du Collège militaire royal"]},"answer":1},{"type":"mc","q":{"en":"In what year did the beaver become an emblem of the St. Jean Baptiste Society?","fr":"En quelle année le castor est-il devenu l’emblème de la Société Saint-Jean-Baptiste?"},"options":{"en":["1834","1867","1892","1921"],"fr":["1834","1867","1892","1921"]},"answer":0}]},{"id":"symbols-026","topic":"beaver","importance":2,"en":"This industrious rodent can be seen on the five-cent coin, on the coats of arms of Saskatchewan and Alberta, and of cities such as Montreal and Toronto.","en_simple":"The beaver is on the 5-cent coin, on the coats of arms of Saskatchewan and Alberta, and of the cities of Montreal and Toronto.","fr":"On voit ce rongeur infatigable sur les pièces de monnaie de cinq cents ainsi que sur les armoiries de la Saskatchewan et de l’Alberta et sur celles de certaines villes comme Montréal et Toronto.","tr":{"ar":"يمكن رؤية هذا القارض المجتهد على قطعة الخمسة سنتات، وعلى شعارَي ساسكاتشوان وألبرتا، وشعارَي مدينتَي مونتريال وتورنتو."},"questions":[{"type":"mc","q":{"en":"On which Canadian coin does the beaver appear?","fr":"Sur quelle pièce de monnaie canadienne le castor figure-t-il?"},"options":{"en":["The one-cent coin","The five-cent coin","The ten-cent coin","The one-dollar coin"],"fr":["La pièce d’un cent","La pièce de cinq cents","La pièce de dix cents","La pièce d’un dollar"]},"answer":1},{"type":"mc","q":{"en":"The beaver appears on the coats of arms of which two provinces?","fr":"Le castor figure sur les armoiries de quelles deux provinces?"},"options":{"en":["Ontario and Quebec","Nova Scotia and New Brunswick","Saskatchewan and Alberta","British Columbia and Manitoba"],"fr":["L’Ontario et le Québec","La Nouvelle-Écosse et le Nouveau-Brunswick","La Saskatchewan et l’Alberta","La Colombie-Britannique et le Manitoba"]},"answer":2}]},{"id":"symbols-027","topic":"official-languages","importance":3,"en":"English and French are the two official languages and are important symbols of identity. Anglophones and Francophones have lived together in partnership and creative tension for more than 300 years. You must have adequate knowledge of English or French to become a Canadian citizen. Adult applicants 55 years of age and over are exempted from this requirement.","en_simple":"English and French are the 2 official languages. Anglophones and Francophones have lived together for more than 300 years. To become a citizen you need adequate English or French, except adults aged 55 and over.","fr":"Le français et l’anglais sont les deux langues officielles et constituent d’importants symboles d’identité. Les francophones et les anglophones vivent ensemble dans un climat de partenariat et de tension créatrice depuis plus de 300 ans. Vous devez posséder une connaissance suffisante du français ou de l’anglais pour obtenir la citoyenneté canadienne. Cette exigence ne s’applique pas aux candidats adultes âgés de 55 ans ou plus.","tr":{"ar":"الإنجليزية والفرنسية هما اللغتان الرسميتان وهما رمزان مهمان للهوية. عاش الناطقون بالإنجليزية والناطقون بالفرنسية معًا في شراكة وتوتر خلّاق لأكثر من 300 عام. يجب أن تكون لديك معرفة كافية بالإنجليزية أو الفرنسية لتصبح مواطنًا كنديًا. ويُعفى من هذا الشرط المتقدمون البالغون من العمر 55 عامًا فأكثر."},"questions":[{"type":"mc","q":{"en":"Adult applicants of what age are exempted from the language requirement for citizenship?","fr":"Les candidats adultes de quel âge sont exemptés de l’exigence linguistique pour la citoyenneté?"},"options":{"en":["18 and over","45 and over","55 and over","65 and over"],"fr":["18 ans ou plus","45 ans ou plus","55 ans ou plus","65 ans ou plus"]},"answer":2},{"type":"mc","q":{"en":"For how long have Anglophones and Francophones lived together in Canada?","fr":"Depuis combien de temps les anglophones et les francophones vivent-ils ensemble au Canada?"},"options":{"en":["More than 100 years","More than 200 years","More than 300 years","More than 500 years"],"fr":["Plus de 100 ans","Plus de 200 ans","Plus de 300 ans","Plus de 500 ans"]},"answer":2},{"type":"tf","q":{"en":"You must have adequate knowledge of English or French to become a Canadian citizen.","fr":"Vous devez posséder une connaissance suffisante du français ou de l’anglais pour obtenir la citoyenneté canadienne."},"answer":true}]},{"id":"symbols-028","topic":"official-languages","importance":3,"en":"Parliament passed the Official Languages Act in 1969. It has three main objectives: establish equality between French and English in Parliament, the Government of Canada and institutions subject to the Act; maintain and develop official language minority communities in Canada; and promote equality of French and English in Canadian society.","en_simple":"The Official Languages Act (1969) has 3 objectives: (1) equality of French and English in Parliament and the Government of Canada, (2) maintain and develop official language minority communities, (3) promote equality of French and English in society.","fr":"Adoptée par le Parlement en 1969, la Loi sur les langues officielles vise les trois objectifs principaux suivants : établir l’égalité entre le français et l’anglais au sein du Parlement, du gouvernement du Canada et des institutions assujetties à la Loi; maintenir et développer les communautés de langue officielle en situation minoritaire au Canada; promouvoir l’égalité du français et de l’anglais dans la société canadienne.","tr":{"ar":"أقرّ البرلمان قانون اللغات الرسمية عام 1969. وله ثلاثة أهداف رئيسية: إرساء المساواة بين الفرنسية والإنجليزية في البرلمان وحكومة كندا والمؤسسات الخاضعة للقانون؛ والحفاظ على مجتمعات الأقليات الناطقة باللغات الرسمية في كندا وتنميتها؛ وتعزيز المساواة بين الفرنسية والإنجليزية في المجتمع الكندي."},"questions":[{"type":"mc","q":{"en":"In what year did Parliament pass the Official Languages Act?","fr":"En quelle année le Parlement a-t-il adopté la Loi sur les langues officielles?"},"options":{"en":["1867","1965","1969","1982"],"fr":["1867","1965","1969","1982"]},"answer":2},{"type":"mc","q":{"en":"Which of the following is one of the three main objectives of the Official Languages Act?","fr":"Lequel des éléments suivants est l’un des trois objectifs principaux de la Loi sur les langues officielles?"},"options":{"en":["Make French the only language of Quebec","Maintain and develop official language minority communities in Canada","Require all citizens to speak both languages","Replace English with French in Parliament"],"fr":["Faire du français la seule langue du Québec","Maintenir et développer les communautés de langue officielle en situation minoritaire au Canada","Obliger tous les citoyens à parler les deux langues","Remplacer l’anglais par le français au Parlement"]},"answer":1},{"type":"tf","q":{"en":"The Official Languages Act has three main objectives.","fr":"La Loi sur les langues officielles vise trois objectifs principaux."},"answer":true}]},{"id":"symbols-029","topic":"anthem","importance":3,"en":"O Canada was proclaimed as the National Anthem in 1980. It was first sung in Québec City in 1880. French and English Canadians sing different words to the National Anthem.","en_simple":"O Canada became the National Anthem in 1980. It was first sung in Québec City in 1880. The French and English words are different.","fr":"Le « Ô Canada » a été proclamé hymne national en 1980, un siècle après avoir été chanté pour la première fois dans la ville de Québec, en 1880. Les francophones et les anglophones du Canada chantent des versions différentes de l’hymne national.","tr":{"ar":"أُعلن نشيد «أو كندا» (O Canada) نشيدًا وطنيًا عام 1980. وقد غُنّي لأول مرة في مدينة كيبيك عام 1880. ويغنّي الكنديون الفرنسيون والإنجليز كلمات مختلفة للنشيد الوطني."},"questions":[{"type":"mc","q":{"en":"In what year was O Canada proclaimed as the National Anthem?","fr":"En quelle année le « Ô Canada » a-t-il été proclamé hymne national?"},"options":{"en":["1880","1921","1965","1980"],"fr":["1880","1921","1965","1980"]},"answer":3},{"type":"mc","q":{"en":"Where and when was O Canada first sung?","fr":"Où et quand le « Ô Canada » a-t-il été chanté pour la première fois?"},"options":{"en":["Ottawa in 1867","Québec City in 1880","Montreal in 1921","Toronto in 1965"],"fr":["À Ottawa en 1867","Dans la ville de Québec en 1880","À Montréal en 1921","À Toronto en 1965"]},"answer":1},{"type":"tf","q":{"en":"French and English Canadians sing the same words to the National Anthem.","fr":"Les francophones et les anglophones du Canada chantent les mêmes paroles de l’hymne national."},"answer":false}]},{"id":"symbols-030","topic":"anthem","importance":2,"en":"The Royal Anthem of Canada, “God Save the King (or Queen),” can be played or sung on any occasion when Canadians wish to honour the Sovereign.","en_simple":"The Royal Anthem is \"God Save the King (or Queen)\". It is sung to honour the Sovereign.","fr":"L’hymne royal du Canada, intitulé « Dieu protège le Roi (ou la Reine) », peut être joué ou chanté à toute occasion où les Canadiens veulent honorer le souverain.","tr":{"ar":"النشيد الملكي لكندا، «حفظ الله الملك (أو الملكة)» (God Save the King)، يمكن عزفه أو غناؤه في أي مناسبة يرغب فيها الكنديون في تكريم الملك."},"questions":[{"type":"mc","q":{"en":"What is the Royal Anthem of Canada?","fr":"Quel est l’hymne royal du Canada?"},"options":{"en":["O Canada","The Maple Leaf Forever","God Save the King (or Queen)","Rule, Britannia!"],"fr":["Ô Canada","The Maple Leaf Forever","Dieu protège le Roi (ou la Reine)","Rule, Britannia!"]},"answer":2}]},{"id":"symbols-031","topic":"honours","importance":2,"en":"All countries have ways to recognize outstanding citizens. Official awards are called honours, consisting of orders, decorations, and medals.","en_simple":"Official awards are called honours. There are 3 kinds: orders, decorations and medals.","fr":"Tous les pays ont des façons particulières de reconnaître leurs citoyens exceptionnels. Les récompenses officielles, ou distinctions honorifiques, sont présentées sous la forme d’ordres, de décorations et de médailles.","tr":{"ar":"لكل الدول طرق لتكريم مواطنيها المتميزين. وتُسمّى الجوائز الرسمية «أوسمة شرف»، وتتكون من الأوامر (الرُّتب) والأوسمة والميداليات."},"questions":[{"type":"mc","q":{"en":"Official awards, called honours, consist of what?","fr":"Les récompenses officielles, ou distinctions honorifiques, sont présentées sous quelle forme?"},"options":{"en":["Titles, lands and pensions","Orders, decorations and medals","Trophies, cups and ribbons","Certificates, plaques and scholarships"],"fr":["Des titres, des terres et des pensions","Des ordres, des décorations et des médailles","Des trophées, des coupes et des rubans","Des certificats, des plaques et des bourses"]},"answer":1}]},{"id":"symbols-032","topic":"honours","importance":3,"en":"After using British honours for many years, Canada started its own honours system with the Order of Canada in 1967, the centennial of Confederation.","en_simple":"Canada started its own honours system with the Order of Canada in 1967, 100 years after Confederation.","fr":"Après avoir utilisé les titres et décorations britanniques pendant de nombreuses années, le Canada a mis en place son propre système de distinctions honorifiques en créant l’Ordre du Canada en 1967, année marquant le centenaire de la Confédération.","tr":{"ar":"بعد استخدام أوسمة الشرف البريطانية سنوات طويلة، بدأت كندا نظام أوسمتها الخاص بإنشاء وسام كندا (Order of Canada) عام 1967، في الذكرى المئوية للاتحاد الكونفدرالي."},"questions":[{"type":"mc","q":{"en":"In what year did Canada start its own honours system with the Order of Canada?","fr":"En quelle année le Canada a-t-il créé son propre système de distinctions honorifiques avec l’Ordre du Canada?"},"options":{"en":["1867","1927","1967","1982"],"fr":["1867","1927","1967","1982"]},"answer":2},{"type":"tf","q":{"en":"The Order of Canada was created in 1967, the centennial of Confederation.","fr":"L’Ordre du Canada a été créé en 1967, année du centenaire de la Confédération."},"answer":true}]},{"id":"symbols-033","topic":"victoria-cross","importance":3,"en":"The Victoria Cross (V.C.) is the highest honour available to Canadians and is awarded for the most conspicuous bravery, a daring or pre-eminent act of valour or self-sacrifice, or extreme devotion to duty in the presence of the enemy. The V.C. has been awarded to 96 Canadians since 1854.","en_simple":"The Victoria Cross (V.C.) is the highest honour for Canadians. It is given for great bravery in front of the enemy. 96 Canadians have received it since 1854.","fr":"La Croix de Victoria, la plus haute distinction que peuvent recevoir les Canadiens, sert à reconnaître des actes de bravoure ou des sacrifices remarquables, ou le dévouement ultime au devoir, face à l’ennemi. La Croix de Victoria a été décernée à 96 Canadiens depuis 1854.","tr":{"ar":"صليب فيكتوريا (Victoria Cross) هو أعلى وسام شرف متاح للكنديين، ويُمنح لأبرز أعمال الشجاعة، أو لعمل جريء أو بارز من البسالة أو التضحية بالنفس، أو للتفاني الشديد في أداء الواجب في مواجهة العدو. وقد مُنح صليب فيكتوريا لـ96 كنديًا منذ عام 1854."},"questions":[{"type":"mc","q":{"en":"What is the highest honour that Canadians can receive?","fr":"Quelle est la plus haute distinction que peuvent recevoir les Canadiens?"},"options":{"en":["The Order of Canada","The Victoria Cross","The Stanley Cup","The Clarkson Cup"],"fr":["L’Ordre du Canada","La Croix de Victoria","La Coupe Stanley","La Coupe Clarkson"]},"answer":1},{"type":"mc","q":{"en":"How many Canadians have been awarded the Victoria Cross since 1854?","fr":"Combien de Canadiens ont reçu la Croix de Victoria depuis 1854?"},"options":{"en":["26","60","96","400"],"fr":["26","60","96","400"]},"answer":2},{"type":"tf","q":{"en":"The Victoria Cross is awarded for bravery in the presence of the enemy.","fr":"La Croix de Victoria est décernée pour la bravoure face à l’ennemi."},"answer":true}]},{"id":"symbols-034","topic":"victoria-cross","importance":3,"en":"Then Lieutenant Alexander Roberts Dunn, born in present-day Toronto, served in the British Army in the Charge of the Light Brigade at Balaclava (1854) in the Crimean War, and was the first Canadian to be awarded the Victoria Cross.","en_simple":"Alexander Roberts Dunn (born in Toronto) was the first Canadian to get the Victoria Cross, at Balaclava in 1854 (Crimean War).","fr":"Alexander Roberts Dunn, né à York (aujourd’hui Toronto), a servi en tant que lieutenant dans l’armée britannique à l’occasion de la charge de la brigade légère à Balaclava (1854), pendant la guerre de Crimée. Il est le premier Canadien à avoir reçu la Croix de Victoria.","tr":{"ar":"الملازم آنذاك ألكسندر روبرتس دَن (Alexander Roberts Dunn)، المولود فيما يُعرف اليوم بتورنتو، خدم في الجيش البريطاني في هجوم اللواء الخفيف في بالاكلافا (1854) خلال حرب القرم، وكان أول كندي يُمنح صليب فيكتوريا."},"questions":[{"type":"mc","q":{"en":"Who was the first Canadian to be awarded the Victoria Cross?","fr":"Qui a été le premier Canadien à recevoir la Croix de Victoria?"},"options":{"en":["William Hall","Billy Bishop","Alexander Roberts Dunn","Filip Konowal"],"fr":["William Hall","Billy Bishop","Alexander Roberts Dunn","Filip Konowal"]},"answer":2},{"type":"mc","q":{"en":"In which war did Alexander Roberts Dunn earn the Victoria Cross?","fr":"Pendant quelle guerre Alexander Roberts Dunn a-t-il mérité la Croix de Victoria?"},"options":{"en":["The First World War","The Crimean War","The Second World War","The War of 1812"],"fr":["La Première Guerre mondiale","La guerre de Crimée","La Seconde Guerre mondiale","La guerre de 1812"]},"answer":1}]},{"id":"symbols-035","topic":"victoria-cross","importance":3,"en":"Able Seaman William Hall of Horton, Nova Scotia, whose parents were American slaves, was the first black man to be awarded the V.C. for his role in the Siege of Lucknow during the Indian Rebellion of 1857.","en_simple":"William Hall from Horton, Nova Scotia, was the first black man to get the Victoria Cross (Siege of Lucknow, 1857).","fr":"Le matelot de 2e classe William Hall, de Horton, en Nouvelle-Écosse, dont les parents étaient des esclaves américains, est le premier Noir à avoir mérité la Croix de Victoria, pour son rôle dans le siège de Lucknow durant la Rébellion indienne de 1857.","tr":{"ar":"البحّار المؤهل ويليام هول (William Hall) من هورتون في نوفا سكوشا، الذي كان والداه من العبيد الأمريكيين، كان أول رجل أسود يُمنح صليب فيكتوريا لدوره في حصار لكناو خلال التمرد الهندي عام 1857."},"questions":[{"type":"mc","q":{"en":"Who was the first black man to be awarded the Victoria Cross?","fr":"Qui a été le premier Noir à recevoir la Croix de Victoria?"},"options":{"en":["Alexander Roberts Dunn","William Hall","Paul Triquet","Robert Hampton Gray"],"fr":["Alexander Roberts Dunn","William Hall","Paul Triquet","Robert Hampton Gray"]},"answer":1},{"type":"mc","q":{"en":"William Hall earned the Victoria Cross for his role in which event?","fr":"William Hall a mérité la Croix de Victoria pour son rôle dans quel événement?"},"options":{"en":["The Charge of the Light Brigade","The Battle of Hill 70","The Siege of Lucknow","The attack on Casa Berardi"],"fr":["La charge de la brigade légère","La bataille de la cote 70","Le siège de Lucknow","L’attaque de Casa Berardi"]},"answer":2},{"type":"tf","q":{"en":"William Hall was from Horton, Nova Scotia.","fr":"William Hall était de Horton, en Nouvelle-Écosse."},"answer":true}]},{"id":"symbols-036","topic":"victoria-cross","importance":2,"en":"Corporal Filip Konowal, born in Ukraine, showed exceptional courage in the Battle of Hill 70 in 1917, and became the first member of the Canadian Corps not born in the British Empire to be awarded the V.C.","en_simple":"Filip Konowal (born in Ukraine) got the Victoria Cross at the Battle of Hill 70 in 1917. He was the first member of the Canadian Corps not born in the British Empire to get it.","fr":"Le caporal Filip Konowal, né en Ukraine, a montré un courage exceptionnel pendant la bataille de la cote 70, en 1917. Il est le premier membre du Corps canadien n’étant pas né dans l’Empire britannique à se voir décerner la Croix de Victoria.","tr":{"ar":"العريف فيليب كونوفال (Filip Konowal)، المولود في أوكرانيا، أظهر شجاعة استثنائية في معركة التل 70 عام 1917، وأصبح أول عضو في الفيلق الكندي غير مولود في الإمبراطورية البريطانية يُمنح صليب فيكتوريا."},"questions":[{"type":"mc","q":{"en":"Who was the first member of the Canadian Corps not born in the British Empire to be awarded the Victoria Cross?","fr":"Qui a été le premier membre du Corps canadien non né dans l’Empire britannique à recevoir la Croix de Victoria?"},"options":{"en":["Filip Konowal","William Hall","Billy Bishop","Alexander Roberts Dunn"],"fr":["Filip Konowal","William Hall","Billy Bishop","Alexander Roberts Dunn"]},"answer":0},{"type":"mc","q":{"en":"Where was Filip Konowal born?","fr":"Où Filip Konowal est-il né?"},"options":{"en":["Poland","Ukraine","Russia","Ireland"],"fr":["En Pologne","En Ukraine","En Russie","En Irlande"]},"answer":1}]},{"id":"symbols-037","topic":"victoria-cross","importance":3,"en":"Flying ace Captain Billy Bishop, born in Owen Sound, Ontario, earned the V.C. in the Royal Flying Corps during the First World War, and was later an honorary Air Marshal of the Royal Canadian Air Force.","en_simple":"Billy Bishop, a flying ace from Owen Sound, Ontario, got the Victoria Cross in World War I (Royal Flying Corps). Later he was honorary Air Marshal of the RCAF.","fr":"Le capitaine Billy Bishop, as de l’aviation, est né à Owen Sound, en Ontario. Il a reçu la Croix de Victoria alors qu’il servait dans le Royal Flying Corps pendant la Première Guerre mondiale, et a plus tard été nommé maréchal de l’Air honoraire de l’Aviation royale du Canada.","tr":{"ar":"الكابتن بيلي بيشوب (Billy Bishop)، الطيار البارع المولود في أوين ساوند بأونتاريو، نال صليب فيكتوريا في سلاح الطيران الملكي خلال الحرب العالمية الأولى، وأصبح لاحقًا مارشال جو فخريًا في سلاح الجو الملكي الكندي."},"questions":[{"type":"mc","q":{"en":"Who was the flying ace from Owen Sound, Ontario, who earned the Victoria Cross in the First World War?","fr":"Qui est l’as de l’aviation né à Owen Sound, en Ontario, qui a reçu la Croix de Victoria pendant la Première Guerre mondiale?"},"options":{"en":["Robert Hampton Gray","Paul Triquet","Billy Bishop","Filip Konowal"],"fr":["Robert Hampton Gray","Paul Triquet","Billy Bishop","Filip Konowal"]},"answer":2},{"type":"tf","q":{"en":"Billy Bishop was later an honorary Air Marshal of the Royal Canadian Air Force.","fr":"Billy Bishop a plus tard été nommé maréchal de l’Air honoraire de l’Aviation royale du Canada."},"answer":true}]},{"id":"symbols-038","topic":"victoria-cross","importance":2,"en":"Captain Paul Triquet of Cabano, Quebec, earned the V.C. leading his men and a handful of tanks in the attack on Casa Berardi in Italy in 1943 during the Second World War, and was later a Brigadier.","en_simple":"Paul Triquet from Cabano, Quebec, got the Victoria Cross at Casa Berardi, Italy, in 1943 (World War II). Later he was a Brigadier.","fr":"Le capitaine Paul Triquet, de Cabano, au Québec, s’est vu décerner la Croix de Victoria pour avoir mené ses hommes et une poignée de chars d’assaut dans l’attaque de Casa Berardi en Italie, en 1943, pendant la Seconde Guerre mondiale. Il est plus tard devenu brigadier.","tr":{"ar":"الكابتن بول تريكيه (Paul Triquet) من كابانو في كيبيك نال صليب فيكتوريا لقيادته رجاله وعددًا قليلًا من الدبابات في الهجوم على كازا بيراردي في إيطاليا عام 1943 خلال الحرب العالمية الثانية، وأصبح لاحقًا عميدًا."},"questions":[{"type":"mc","q":{"en":"Where did Paul Triquet earn the Victoria Cross in 1943?","fr":"Où Paul Triquet a-t-il mérité la Croix de Victoria en 1943?"},"options":{"en":["Hill 70, France","Casa Berardi, Italy","Lucknow, India","Balaclava, Crimea"],"fr":["À la cote 70, en France","À Casa Berardi, en Italie","À Lucknow, en Inde","À Balaclava, en Crimée"]},"answer":1},{"type":"mc","q":{"en":"Paul Triquet was from which province?","fr":"Paul Triquet venait de quelle province?"},"options":{"en":["Ontario","Nova Scotia","Quebec","British Columbia"],"fr":["De l’Ontario","De la Nouvelle-Écosse","Du Québec","De la Colombie-Britannique"]},"answer":2}]},{"id":"symbols-039","topic":"victoria-cross","importance":3,"en":"Lieutenant Robert Hampton Gray, a navy pilot born in Trail, B.C., was killed while bombing and sinking a Japanese warship in August 1945, a few days before the end of the Second World War, and was the last Canadian to receive the V.C. to date.","en_simple":"Robert Hampton Gray, a navy pilot from Trail, B.C., died in August 1945 sinking a Japanese warship. He is the last Canadian to receive the Victoria Cross.","fr":"Le lieutenant Robert Hampton Gray, pilote dans la marine né à Trail, en Colombie-Britannique, a perdu la vie en contribuant à bombarder et à faire sombrer un navire de combat japonais en août 1945, quelques jours avant la fin de la Seconde Guerre mondiale. Il est le dernier Canadien à ce jour à avoir reçu la Croix de Victoria.","tr":{"ar":"الملازم روبرت هامبتون غراي (Robert Hampton Gray)، طيار بحري مولود في تريل بكولومبيا البريطانية، قُتل أثناء قصف سفينة حربية يابانية وإغراقها في أغسطس 1945، قبل أيام قليلة من نهاية الحرب العالمية الثانية، وكان آخر كندي يتلقى صليب فيكتوريا حتى الآن."},"questions":[{"type":"mc","q":{"en":"Who was the last Canadian to receive the Victoria Cross to date?","fr":"Qui est le dernier Canadien à ce jour à avoir reçu la Croix de Victoria?"},"options":{"en":["Billy Bishop","Paul Triquet","Robert Hampton Gray","Filip Konowal"],"fr":["Billy Bishop","Paul Triquet","Robert Hampton Gray","Filip Konowal"]},"answer":2},{"type":"mc","q":{"en":"Robert Hampton Gray was killed in August 1945 while doing what?","fr":"Robert Hampton Gray a perdu la vie en août 1945 en faisant quoi?"},"options":{"en":["Leading tanks in Italy","Bombing and sinking a Japanese warship","Flying over France","Fighting at Hill 70"],"fr":["En menant des chars en Italie","En bombardant et en faisant sombrer un navire de combat japonais","En volant au-dessus de la France","En combattant à la cote 70"]},"answer":1},{"type":"tf","q":{"en":"Robert Hampton Gray was born in Trail, British Columbia.","fr":"Robert Hampton Gray est né à Trail, en Colombie-Britannique."},"answer":true}]},{"id":"symbols-040","topic":"holidays","importance":3,"en":"New Year’s Day — January 1. Sir John A. Macdonald Day — January 11.","en_simple":"New Year's Day = January 1. Sir John A. Macdonald Day = January 11.","fr":"Jour de l’An — 1er janvier. Journée sir John A. Macdonald — 11 janvier.","tr":{"ar":"يوم رأس السنة — 1 يناير. يوم السير جون أ. ماكدونالد (Sir John A. Macdonald) — 11 يناير."},"questions":[{"type":"mc","q":{"en":"When is Sir John A. Macdonald Day?","fr":"Quand est la Journée sir John A. Macdonald?"},"options":{"en":["January 1","January 11","April 9","November 20"],"fr":["Le 1er janvier","Le 11 janvier","Le 9 avril","Le 20 novembre"]},"answer":1},{"type":"tf","q":{"en":"New Year’s Day is celebrated on January 1.","fr":"Le Jour de l’An est célébré le 1er janvier."},"answer":true}]},{"id":"symbols-041","topic":"holidays","importance":1,"en":"Good Friday — Friday immediately preceding Easter Sunday. Easter Monday — Monday immediately following Easter Sunday.","en_simple":"Good Friday = the Friday before Easter Sunday. Easter Monday = the Monday after Easter Sunday.","fr":"Vendredi saint — Vendredi précédant immédiatement le dimanche de Pâques. Lundi de Pâques — Lundi suivant immédiatement le dimanche de Pâques.","tr":{"ar":"الجمعة العظيمة — الجمعة التي تسبق أحد الفصح مباشرة. اثنين الفصح — الاثنين الذي يلي أحد الفصح مباشرة."},"questions":[{"type":"mc","q":{"en":"When is Good Friday?","fr":"Quand est le Vendredi saint?"},"options":{"en":["The Friday immediately preceding Easter Sunday","The Friday immediately following Easter Sunday","The first Friday of April","April 9"],"fr":["Le vendredi précédant immédiatement le dimanche de Pâques","Le vendredi suivant immédiatement le dimanche de Pâques","Le premier vendredi d’avril","Le 9 avril"]},"answer":0}]},{"id":"symbols-042","topic":"holidays","importance":3,"en":"Vimy Day — April 9.","en_simple":"Vimy Day = April 9.","fr":"Jour de Vimy — 9 avril.","tr":{"ar":"يوم فيمي (Vimy Day) — 9 أبريل."},"questions":[{"type":"mc","q":{"en":"When is Vimy Day?","fr":"Quand est le Jour de Vimy?"},"options":{"en":["January 11","April 9","June 24","November 11"],"fr":["Le 11 janvier","Le 9 avril","Le 24 juin","Le 11 novembre"]},"answer":1},{"type":"tf","q":{"en":"Vimy Day is on November 11.","fr":"Le Jour de Vimy est le 11 novembre."},"answer":false}]},{"id":"symbols-043","topic":"holidays","importance":3,"en":"Victoria Day — Monday preceding May 25 (Sovereign’s Birthday).","en_simple":"Victoria Day = the Monday before May 25. It marks the Sovereign's Birthday.","fr":"Fête de Victoria — Lundi précédant le 25 mai (anniversaire du souverain).","tr":{"ar":"يوم فيكتوريا (Victoria Day) — الاثنين الذي يسبق 25 مايو (عيد ميلاد الملك)."},"questions":[{"type":"mc","q":{"en":"When is Victoria Day?","fr":"Quand est la fête de Victoria?"},"options":{"en":["May 25","The Monday preceding May 25","The first Monday of May","The Monday following May 25"],"fr":["Le 25 mai","Le lundi précédant le 25 mai","Le premier lundi de mai","Le lundi suivant le 25 mai"]},"answer":1},{"type":"mc","q":{"en":"What does Victoria Day mark?","fr":"Que souligne la fête de Victoria?"},"options":{"en":["Confederation","The Sovereign’s Birthday","The end of the First World War","The new flag"],"fr":["La Confédération","L’anniversaire du souverain","La fin de la Première Guerre mondiale","Le nouveau drapeau"]},"answer":1}]},{"id":"symbols-044","topic":"holidays","importance":2,"en":"Fête Nationale (Quebec) — June 24 (Feast of St. John the Baptist).","en_simple":"Fête Nationale (Quebec) = June 24, the Feast of St. John the Baptist.","fr":"Fête nationale (Québec) — 24 juin (fête de Saint-Jean-Baptiste).","tr":{"ar":"العيد الوطني (كيبيك) — 24 يونيو (عيد القديس يوحنا المعمدان)."},"questions":[{"type":"mc","q":{"en":"When is the Fête Nationale in Quebec?","fr":"Quand est la Fête nationale au Québec?"},"options":{"en":["June 24","July 1","May 25","September 1"],"fr":["Le 24 juin","Le 1er juillet","Le 25 mai","Le 1er septembre"]},"answer":0},{"type":"tf","q":{"en":"June 24 is the Feast of St. John the Baptist.","fr":"Le 24 juin est la fête de Saint-Jean-Baptiste."},"answer":true}]},{"id":"symbols-045","topic":"holidays","importance":3,"en":"Canada Day — July 1.","en_simple":"Canada Day = July 1.","fr":"Fête du Canada — 1er juillet.","tr":{"ar":"يوم كندا (Canada Day) — 1 يوليو."},"questions":[{"type":"mc","q":{"en":"When is Canada Day?","fr":"Quand est la fête du Canada?"},"options":{"en":["June 24","July 1","July 4","September 1"],"fr":["Le 24 juin","Le 1er juillet","Le 4 juillet","Le 1er septembre"]},"answer":1},{"type":"tf","q":{"en":"Canada Day is celebrated on July 1.","fr":"La fête du Canada est célébrée le 1er juillet."},"answer":true}]},{"id":"symbols-046","topic":"holidays","importance":2,"en":"Labour Day — First Monday of September. Thanksgiving Day — Second Monday of October.","en_simple":"Labour Day = the first Monday of September. Thanksgiving Day = the second Monday of October.","fr":"Fête du Travail — Premier lundi de septembre. Action de grâces — Deuxième lundi d’octobre.","tr":{"ar":"عيد العمال — أول اثنين من سبتمبر. عيد الشكر — ثاني اثنين من أكتوبر."},"questions":[{"type":"mc","q":{"en":"When is Thanksgiving Day in Canada?","fr":"Quand est l’Action de grâces au Canada?"},"options":{"en":["The fourth Thursday of November","The first Monday of September","The second Monday of October","October 31"],"fr":["Le quatrième jeudi de novembre","Le premier lundi de septembre","Le deuxième lundi d’octobre","Le 31 octobre"]},"answer":2},{"type":"mc","q":{"en":"When is Labour Day?","fr":"Quand est la fête du Travail?"},"options":{"en":["May 1","The first Monday of September","The second Monday of October","September 30"],"fr":["Le 1er mai","Le premier lundi de septembre","Le deuxième lundi d’octobre","Le 30 septembre"]},"answer":1}]},{"id":"symbols-047","topic":"holidays","importance":3,"en":"Remembrance Day — November 11.","en_simple":"Remembrance Day = November 11.","fr":"Jour du Souvenir — 11 novembre.","tr":{"ar":"يوم الذكرى (Remembrance Day) — 11 نوفمبر."},"questions":[{"type":"mc","q":{"en":"When is Remembrance Day?","fr":"Quand est le jour du Souvenir?"},"options":{"en":["April 9","November 11","November 20","December 26"],"fr":["Le 9 avril","Le 11 novembre","Le 20 novembre","Le 26 décembre"]},"answer":1}]},{"id":"symbols-048","topic":"holidays","importance":3,"en":"Sir Wilfrid Laurier Day — November 20.","en_simple":"Sir Wilfrid Laurier Day = November 20.","fr":"Journée sir Wilfrid Laurier — 20 novembre.","tr":{"ar":"يوم السير ويلفريد لورييه (Sir Wilfrid Laurier) — 20 نوفمبر."},"questions":[{"type":"mc","q":{"en":"When is Sir Wilfrid Laurier Day?","fr":"Quand est la Journée sir Wilfrid Laurier?"},"options":{"en":["January 11","April 9","November 11","November 20"],"fr":["Le 11 janvier","Le 9 avril","Le 11 novembre","Le 20 novembre"]},"answer":3},{"type":"tf","q":{"en":"Sir Wilfrid Laurier Day is on January 11.","fr":"La Journée sir Wilfrid Laurier est le 11 janvier."},"answer":false}]},{"id":"symbols-049","topic":"holidays","importance":1,"en":"Christmas Day — December 25. Boxing Day — December 26.","en_simple":"Christmas Day = December 25. Boxing Day = December 26.","fr":"Noël — 25 décembre. Lendemain de Noël — 26 décembre.","tr":{"ar":"عيد الميلاد — 25 ديسمبر. يوم الصناديق (Boxing Day) — 26 ديسمبر."},"questions":[{"type":"mc","q":{"en":"When is Boxing Day?","fr":"Quand est le lendemain de Noël?"},"options":{"en":["December 24","December 25","December 26","January 1"],"fr":["Le 24 décembre","Le 25 décembre","Le 26 décembre","Le 1er janvier"]},"answer":2}]}]},{"unit":"economy","order":10,"title":{"en":"Canada’s Economy","fr":"L’économie canadienne"},"title_tr":{"ar":"اقتصاد كندا"},"source":{"en":"13-canadas-economy","fr":"13-economie-canadienne"},"cards":[{"id":"economy-001","topic":"trading-nation","importance":3,"en":"Canada has always been a trading nation and commerce remains the engine of economic growth. As Canadians, we could not maintain our standard of living without engaging in trade with other nations.","en_simple":"Canada is a trading nation. Trade (commerce) is the engine of economic growth. Canadians need trade with other countries to keep their standard of living.","fr":"Le Canada est depuis toujours une nation commerçante et le commerce reste le moteur de sa croissance économique. Comme Canadiens, nous ne pourrions maintenir notre niveau de vie sans commercer avec les autres pays.","tr":{"ar":"لطالما كانت كندا أمة تجارية، ولا تزال التجارة محرك النمو الاقتصادي. وكَكنديين، لا يمكننا الحفاظ على مستوى معيشتنا دون التبادل التجاري مع الدول الأخرى."},"questions":[{"type":"mc","q":{"en":"What remains the engine of Canada’s economic growth?","fr":"Qu’est-ce qui reste le moteur de la croissance économique du Canada?"},"options":{"en":["Military spending","Commerce (trade)","Tourism","Government jobs"],"fr":["Les dépenses militaires","Le commerce","Le tourisme","Les emplois gouvernementaux"]},"answer":1},{"type":"tf","q":{"en":"Canada could maintain its standard of living without trading with other nations.","fr":"Le Canada pourrait maintenir son niveau de vie sans commercer avec les autres pays."},"answer":false}]},{"id":"economy-002","topic":"free-trade","importance":3,"en":"In 1988, Canada enacted free trade with the United States.","en_simple":"In 1988, Canada started free trade with the United States.","fr":"En 1988, le Canada a négocié un accord de libre-échange avec les États-Unis.","tr":{"ar":"في عام 1988، أقرّت كندا التجارة الحرة مع الولايات المتحدة."},"questions":[{"type":"mc","q":{"en":"In what year did Canada enact free trade with the United States?","fr":"En quelle année le Canada a-t-il conclu un accord de libre-échange avec les États-Unis?"},"options":{"en":["1967","1982","1988","1994"],"fr":["1967","1982","1988","1994"]},"answer":2},{"type":"mc","q":{"en":"With which country did Canada enact free trade in 1988?","fr":"Avec quel pays le Canada a-t-il conclu un accord de libre-échange en 1988?"},"options":{"en":["Mexico","The United Kingdom","Japan","The United States"],"fr":["Le Mexique","Le Royaume-Uni","Le Japon","Les États-Unis"]},"answer":3}]},{"id":"economy-003","topic":"nafta","importance":3,"en":"Mexico became a partner in 1994 in the broader North American Free Trade Agreement (NAFTA), with over 444 million people and over $1 trillion in merchandise trade in 2008.","en_simple":"In 1994, Mexico joined the North American Free Trade Agreement (NAFTA). NAFTA covers over 444 million people and had over $1 trillion in merchandise trade in 2008.","fr":"Le Mexique est devenu notre partenaire en 1994, dans le cadre de l’Accord de libre-échange nord-américain (ALENA), qui englobe 444 millions de personnes et a représenté en 2008 plus de un billion de dollars en commerce de marchandises.","tr":{"ar":"أصبحت المكسيك شريكًا في عام 1994 ضمن اتفاقية التجارة الحرة لأمريكا الشمالية الأوسع (NAFTA)، التي تضم أكثر من 444 مليون نسمة وتجاوزت تجارة البضائع فيها تريليون دولار في عام 2008."},"questions":[{"type":"mc","q":{"en":"In what year did Mexico become a partner in the North American Free Trade Agreement (NAFTA)?","fr":"En quelle année le Mexique est-il devenu partenaire de l’Accord de libre-échange nord-américain (ALENA)?"},"options":{"en":["1988","1994","2000","2008"],"fr":["1988","1994","2000","2008"]},"answer":1},{"type":"mc","q":{"en":"Which country joined Canada and the United States in NAFTA in 1994?","fr":"Quel pays s’est joint au Canada et aux États-Unis dans l’ALENA en 1994?"},"options":{"en":["Brazil","The United Kingdom","Mexico","France"],"fr":["Le Brésil","Le Royaume-Uni","Le Mexique","La France"]},"answer":2},{"type":"mc","q":{"en":"How many people does NAFTA cover, according to Discover Canada?","fr":"Combien de personnes l’ALENA englobe-t-il, selon Découvrir le Canada?"},"options":{"en":["Over 34 million","Over 100 million","Over 444 million","Over 1 billion"],"fr":["Plus de 34 millions","Plus de 100 millions","Plus de 444 millions","Plus de 1 milliard"]},"answer":2},{"type":"tf","q":{"en":"NAFTA merchandise trade was over $1 trillion in 2008.","fr":"Le commerce de marchandises dans le cadre de l’ALENA a dépassé un billion de dollars en 2008."},"answer":true}]},{"id":"economy-004","topic":"largest-economies","importance":3,"en":"Today, Canada has one of the ten largest economies in the world.","en_simple":"Canada has one of the 10 largest economies in the world.","fr":"Aujourd’hui, le Canada compte parmi les dix économies les plus importantes de la planète.","tr":{"ar":"اليوم، تمتلك كندا واحدًا من أكبر عشرة اقتصادات في العالم."},"questions":[{"type":"mc","q":{"en":"Canada has one of the ______ largest economies in the world.","fr":"Le Canada compte parmi les ______ économies les plus importantes de la planète."},"options":{"en":["three","five","ten","twenty"],"fr":["trois","cinq","dix","vingt"]},"answer":2},{"type":"tf","q":{"en":"Canada has one of the ten largest economies in the world.","fr":"Le Canada compte parmi les dix économies les plus importantes de la planète."},"answer":true}]},{"id":"economy-005","topic":"g8","importance":3,"en":"Canada is part of the G8 group of leading industrialized countries with the United States, Germany, the United Kingdom, Italy, France, Japan and Russia.","en_simple":"Canada is in the G8, the group of 8 leading industrialized countries: Canada, the United States, Germany, the United Kingdom, Italy, France, Japan and Russia.","fr":"Le Canada fait partie du G8, le groupe des huit principaux pays industrialisés, avec les États-Unis, l’Allemagne, le Royaume-Uni, l’Italie, la France, le Japon et la Russie.","tr":{"ar":"كندا جزء من مجموعة الثماني (G8) للدول الصناعية الرائدة، مع الولايات المتحدة وألمانيا والمملكة المتحدة وإيطاليا وفرنسا واليابان وروسيا."},"questions":[{"type":"mc","q":{"en":"What is the G8?","fr":"Qu’est-ce que le G8?"},"options":{"en":["A group of eight Canadian provinces","The group of eight leading industrialized countries","Eight free trade partners of Canada","The eight largest cities in Canada"],"fr":["Un groupe de huit provinces canadiennes","Le groupe des huit principaux pays industrialisés","Huit partenaires de libre-échange du Canada","Les huit plus grandes villes du Canada"]},"answer":1},{"type":"mc","q":{"en":"Which of the following countries is NOT a member of the G8?","fr":"Lequel des pays suivants n’est PAS membre du G8?"},"options":{"en":["Japan","Russia","Mexico","Italy"],"fr":["Le Japon","La Russie","Le Mexique","L’Italie"]},"answer":2},{"type":"mc","q":{"en":"Which countries are members of the G8 with Canada?","fr":"Quels pays sont membres du G8 avec le Canada?"},"options":{"en":["United States, Germany, United Kingdom, Italy, France, Japan, Russia","United States, Mexico, Brazil, Argentina, Chile, Peru, Colombia","China, India, Japan, South Korea, Australia, New Zealand, Indonesia","United Kingdom, Australia, New Zealand, India, South Africa, Jamaica, Nigeria"],"fr":["États-Unis, Allemagne, Royaume-Uni, Italie, France, Japon, Russie","États-Unis, Mexique, Brésil, Argentine, Chili, Pérou, Colombie","Chine, Inde, Japon, Corée du Sud, Australie, Nouvelle-Zélande, Indonésie","Royaume-Uni, Australie, Nouvelle-Zélande, Inde, Afrique du Sud, Jamaïque, Nigéria"]},"answer":0}]},{"id":"economy-006","topic":"three-industries","importance":3,"en":"Canada’s economy includes three main types of industries: service industries, manufacturing industries and natural resources industries.","en_simple":"Canada's economy has 3 main types of industries: (1) service, (2) manufacturing, (3) natural resources.","fr":"L’économie canadienne comprend trois grands secteurs industriels : le secteur des services, le secteur manufacturier et le secteur de l’exploitation des ressources naturelles.","tr":{"ar":"يشمل اقتصاد كندا ثلاثة أنواع رئيسية من الصناعات: الصناعات الخدمية، والصناعات التحويلية، وصناعات الموارد الطبيعية."},"questions":[{"type":"mc","q":{"en":"What are the three main types of industries in Canada?","fr":"Quels sont les trois grands secteurs industriels au Canada?"},"options":{"en":["Service, manufacturing and natural resources","Farming, fishing and hunting","Banking, insurance and real estate","Oil, gas and mining"],"fr":["Les services, le secteur manufacturier et les ressources naturelles","L’agriculture, la pêche et la chasse","Les banques, les assurances et l’immobilier","Le pétrole, le gaz et les mines"]},"answer":0},{"type":"tf","q":{"en":"Canada’s economy includes four main types of industries.","fr":"L’économie canadienne comprend quatre grands secteurs industriels."},"answer":false}]},{"id":"economy-007","topic":"service-industries","importance":3,"en":"Service industries provide thousands of different jobs in areas like transportation, education, health care, construction, banking, communications, retail services, tourism and government. More than 75% of working Canadians now have jobs in service industries.","en_simple":"Service industries include transportation, education, health care, construction, banking, communications, retail, tourism and government. More than 75% of working Canadians work in service industries.","fr":"Le secteur des services fournit des milliers d’emplois dans des domaines tels que le transport, l’éducation, les soins de santé, la construction, les opérations bancaires, les communications, la vente au détail, le tourisme et l’administration gouvernementale. Plus de 75 pour 100 des travailleurs canadiens occupent maintenant un emploi dans le secteur des services.","tr":{"ar":"توفر الصناعات الخدمية آلاف الوظائف المختلفة في مجالات مثل النقل والتعليم والرعاية الصحية والبناء والخدمات المصرفية والاتصالات وخدمات التجزئة والسياحة والحكومة. وأكثر من 75% من الكنديين العاملين يشغلون الآن وظائف في الصناعات الخدمية."},"questions":[{"type":"mc","q":{"en":"What percentage of working Canadians have jobs in service industries?","fr":"Quel pourcentage des travailleurs canadiens occupent un emploi dans le secteur des services?"},"options":{"en":["More than 25%","More than 50%","More than 75%","More than 90%"],"fr":["Plus de 25 pour 100","Plus de 50 pour 100","Plus de 75 pour 100","Plus de 90 pour 100"]},"answer":2},{"type":"mc","q":{"en":"Which of the following is an example of a service industry?","fr":"Lequel des exemples suivants fait partie du secteur des services?"},"options":{"en":["Forestry","Mining","Aerospace manufacturing","Health care"],"fr":["La foresterie","L’exploitation minière","La fabrication aérospatiale","Les soins de santé"]},"answer":3},{"type":"tf","q":{"en":"Most working Canadians have jobs in natural resources industries.","fr":"La plupart des travailleurs canadiens occupent un emploi dans le secteur des ressources naturelles."},"answer":false}]},{"id":"economy-008","topic":"manufacturing-industries","importance":2,"en":"Manufacturing industries make products to sell in Canada and around the world. Manufactured products include paper, high technology equipment, aerospace technology, automobiles, machinery, food, clothing and many other goods.","en_simple":"Manufacturing industries make products to sell in Canada and the world: paper, high-tech equipment, aerospace technology, cars, machinery, food, clothing and more.","fr":"Le secteur manufacturier produit des biens qui sont vendus au Canada et partout dans le monde; citons, entre autres, le papier, le matériel de haute technologie, la technologie aérospatiale, les automobiles, l’équipement, les aliments et les vêtements.","tr":{"ar":"تصنع الصناعات التحويلية منتجات لبيعها في كندا وحول العالم. وتشمل المنتجات المصنّعة الورق ومعدات التكنولوجيا المتقدمة وتكنولوجيا الفضاء والسيارات والآلات والأغذية والملابس وسلعًا كثيرة أخرى."},"questions":[{"type":"mc","q":{"en":"Which of the following is a product of Canada’s manufacturing industries?","fr":"Lequel des produits suivants provient du secteur manufacturier canadien?"},"options":{"en":["Aerospace technology","Tourism","Banking","Fishing"],"fr":["La technologie aérospatiale","Le tourisme","Les opérations bancaires","La pêche"]},"answer":0},{"type":"tf","q":{"en":"Manufacturing industries make products to sell only in Canada.","fr":"Le secteur manufacturier produit des biens vendus uniquement au Canada."},"answer":false}]},{"id":"economy-009","topic":"natural-resources","importance":3,"en":"Natural resources industries include forestry, fishing, agriculture, mining and energy. These industries have played an important part in the country’s history and development, and a large percentage of Canada’s exports are natural resources commodities.","en_simple":"Natural resources industries: forestry, fishing, agriculture, mining and energy. They were important in Canada's history, and a large part of Canada's exports are natural resources.","fr":"Le secteur de l’exploitation des ressources naturelles comprend la foresterie, la pêche, l’agriculture, l’exploitation minière et l’énergie. Ces industries ont joué un rôle important dans l’histoire et le développement du Canada. Aujourd’hui, l’économie de plusieurs régions du pays repose encore sur l’exploitation des ressources naturelles, et ces dernières représentent un pourcentage élevé des exportations du Canada.","tr":{"ar":"تشمل صناعات الموارد الطبيعية الغابات وصيد الأسماك والزراعة والتعدين والطاقة. وقد أدّت هذه الصناعات دورًا مهمًا في تاريخ البلاد وتطورها، ونسبة كبيرة من صادرات كندا هي سلع من الموارد الطبيعية."},"questions":[{"type":"mc","q":{"en":"Which of the following is a natural resources industry?","fr":"Laquelle des industries suivantes fait partie du secteur des ressources naturelles?"},"options":{"en":["Banking","Education","Retail services","Mining"],"fr":["Les opérations bancaires","L’éducation","La vente au détail","L’exploitation minière"]},"answer":3},{"type":"mc","q":{"en":"Name five natural resources industries in Canada.","fr":"Nommez cinq industries du secteur des ressources naturelles au Canada."},"options":{"en":["Tourism, banking, retail, health care, government","Forestry, fishing, agriculture, mining, energy","Paper, automobiles, clothing, food, machinery","Transportation, construction, communications, education, aerospace"],"fr":["Tourisme, banques, vente au détail, soins de santé, administration gouvernementale","Foresterie, pêche, agriculture, exploitation minière, énergie","Papier, automobiles, vêtements, aliments, équipement","Transport, construction, communications, éducation, aérospatiale"]},"answer":1},{"type":"tf","q":{"en":"A large percentage of Canada’s exports are natural resources commodities.","fr":"Les ressources naturelles représentent un pourcentage élevé des exportations du Canada."},"answer":true}]},{"id":"economy-010","topic":"us-trading-partner","importance":3,"en":"Canada enjoys close relations with the United States and each is the other’s largest trading partner. Over three-quarters of Canadian exports are destined for the U.S.A. In fact we have the biggest bilateral trading relationship in the world.","en_simple":"The United States is Canada's largest trading partner, and Canada is the largest trading partner of the U.S. More than 3/4 of Canada's exports go to the U.S. It is the biggest two-country trading relationship in the world.","fr":"Le Canada entretient des liens étroits avec les États-Unis, et chacun des deux pays est le plus important partenaire commercial de l’autre. Plus des trois quarts des exportations canadiennes sont destinées aux États-Unis. En fait, nos deux pays entretiennent la plus importante relation commerciale bilatérale du monde.","tr":{"ar":"تتمتع كندا بعلاقات وثيقة مع الولايات المتحدة، وكل منهما أكبر شريك تجاري للأخرى. وأكثر من ثلاثة أرباع الصادرات الكندية موجّهة إلى الولايات المتحدة. وفي الواقع، تربطنا أكبر علاقة تجارية ثنائية في العالم."},"questions":[{"type":"mc","q":{"en":"Which country is Canada’s largest international trading partner?","fr":"Quel pays est le plus important partenaire commercial du Canada à l’échelle internationale?"},"options":{"en":["The United Kingdom","The United States","China","Mexico"],"fr":["Le Royaume-Uni","Les États-Unis","La Chine","Le Mexique"]},"answer":1},{"type":"mc","q":{"en":"What share of Canadian exports is destined for the United States?","fr":"Quelle part des exportations canadiennes est destinée aux États-Unis?"},"options":{"en":["Over one-quarter","Over one-half","Over three-quarters","All of them"],"fr":["Plus du quart","Plus de la moitié","Plus des trois quarts","La totalité"]},"answer":2},{"type":"tf","q":{"en":"Canada and the United States have the biggest bilateral trading relationship in the world.","fr":"Le Canada et les États-Unis entretiennent la plus importante relation commerciale bilatérale du monde."},"answer":true}]},{"id":"economy-011","topic":"exports-and-border","importance":2,"en":"Canada exports billions of dollars worth of energy products, industrial goods, machinery, equipment, automotive, agricultural, fishing and forestry products, and consumer goods every year. Millions of Canadians and Americans cross every year and in safety what is traditionally known as “the world’s longest undefended border.”","en_simple":"Every year Canada exports energy products, industrial goods, machinery, equipment, cars, farm, fishing and forestry products, and consumer goods. The Canada–U.S. border is called “the world's longest undefended border.”","fr":"Le Canada exporte chaque année pour des milliards de dollars de produits énergétiques, de biens industriels, d’équipement, d’appareils, de produits de l’automobile, de l’agriculture, de la pêche et de la foresterie ainsi que de biens de consommation. Des millions de Canadiens et d’Américains traversent chaque année en toute sécurité ce qu’on appelle couramment « la plus longue frontière non défendue du monde ».","tr":{"ar":"تصدّر كندا كل عام ما قيمته مليارات الدولارات من منتجات الطاقة والسلع الصناعية والآلات والمعدات ومنتجات السيارات والزراعة وصيد الأسماك والغابات والسلع الاستهلاكية. ويعبر ملايين الكنديين والأمريكيين كل عام بأمان ما يُعرف تقليديًا بـ«أطول حدود غير محروسة في العالم»."},"questions":[{"type":"mc","q":{"en":"The border between Canada and the United States is traditionally known as what?","fr":"Comment appelle-t-on couramment la frontière entre le Canada et les États-Unis?"},"options":{"en":["The Peace Line","The world’s longest undefended border","The 49th wall","The Northern Gate"],"fr":["La ligne de la paix","La plus longue frontière non défendue du monde","Le mur du 49e","La porte du Nord"]},"answer":1},{"type":"mc","q":{"en":"Which of the following does Canada export every year, according to Discover Canada?","fr":"Lequel des produits suivants le Canada exporte-t-il chaque année, selon Découvrir le Canada?"},"options":{"en":["Energy products","Coffee","Tropical fruit","Diamonds only"],"fr":["Des produits énergétiques","Du café","Des fruits tropicaux","Des diamants seulement"]},"answer":0}]},{"id":"economy-012","topic":"peace-arch","importance":2,"en":"At Blaine in the State of Washington, the Peace Arch, inscribed with the words “children of a common mother” and “brethren dwelling together in unity,” symbolizes our close ties and common interests.","en_simple":"The Peace Arch is at Blaine, Washington (USA). Its words are “children of a common mother” and “brethren dwelling together in unity.” It is a symbol of the close ties between Canada and the U.S.","fr":"À Blaine, dans l’État de Washington, l’Arche de la paix, sur laquelle on peut lire « children of a common mother » (enfants d’une même mère) et « brethren dwelling together in unity » (deux frères vivant ensemble dans l’harmonie), symbolise nos liens étroits et nos intérêts communs.","tr":{"ar":"في بلين (Blaine) بولاية واشنطن، يرمز قوس السلام (Peace Arch)، المنقوش عليه عبارتا «أبناء أم واحدة» و«إخوة يسكنون معًا في وحدة»، إلى روابطنا الوثيقة ومصالحنا المشتركة."},"questions":[{"type":"mc","q":{"en":"Where is the Peace Arch located?","fr":"Où se trouve l’Arche de la paix?"},"options":{"en":["Niagara Falls, Ontario","Windsor, Ontario","Blaine, Washington","Ottawa, Ontario"],"fr":["Niagara Falls, en Ontario","Windsor, en Ontario","Blaine, dans l’État de Washington","Ottawa, en Ontario"]},"answer":2},{"type":"mc","q":{"en":"Which words are inscribed on the Peace Arch?","fr":"Quels mots sont inscrits sur l’Arche de la paix?"},"options":{"en":["“Peace, order and good government”","“Children of a common mother”","“From sea to sea”","“Strong and free”"],"fr":["« Paix, ordre et bon gouvernement »","« Children of a common mother » (enfants d’une même mère)","« D’un océan à l’autre »","« Forts et libres »"]},"answer":1},{"type":"tf","q":{"en":"The Peace Arch symbolizes the close ties between Canada and the United States.","fr":"L’Arche de la paix symbolise les liens étroits entre le Canada et les États-Unis."},"answer":true}]}]},{"unit":"regions","order":11,"title":{"en":"Canada’s Regions","fr":"Les régions du Canada"},"title_tr":{"ar":"مناطق كندا"},"source":{"en":"14-canadas-regions","fr":"14-regions-du-canada"},"cards":[{"id":"regions-001","topic":"geography","importance":3,"en":"Canada is the second largest country on earth—10 million square kilometres.","en_simple":"Canada is the 2nd largest country in the world. It covers 10 million square kilometres.","fr":"Le Canada est le deuxième pays du monde en étendue et son territoire couvre près de 10 millions de kilomètres carrés.","tr":{"ar":"كندا هي ثاني أكبر دولة في العالم من حيث المساحة، إذ تبلغ مساحتها 10 ملايين كيلومتر مربع."},"questions":[{"type":"mc","q":{"en":"How large is Canada compared to other countries?","fr":"Quelle est la taille du Canada par rapport aux autres pays?"},"options":{"en":["The largest country on earth","The second largest country on earth","The third largest country on earth","The fifth largest country on earth"],"fr":["Le plus grand pays du monde","Le deuxième pays du monde en étendue","Le troisième pays du monde en étendue","Le cinquième pays du monde en étendue"]},"answer":1},{"type":"mc","q":{"en":"What is the approximate area of Canada?","fr":"Quelle est la superficie approximative du Canada?"},"options":{"en":["1 million square kilometres","4,700 square kilometres","10 million square kilometres","34 million square kilometres"],"fr":["1 million de kilomètres carrés","4 700 kilomètres carrés","10 millions de kilomètres carrés","34 millions de kilomètres carrés"]},"answer":2}]},{"id":"regions-002","topic":"geography","importance":3,"en":"Three oceans line Canada’s frontiers: the Pacific Ocean in the west, the Atlantic Ocean in the east, and the Arctic Ocean to the north. Along the southern edge of Canada lies the Canada-United States boundary.","en_simple":"3 oceans border Canada: Pacific (west), Atlantic (east), Arctic (north). The United States is to the south.","fr":"Trois océans bordent les frontières du Canada : l’océan Pacifique à l’ouest, l’océan Atlantique à l’est et l’océan Arctique au nord. À l’extrémité sud du territoire s’étend la frontière entre le Canada et les États-Unis.","tr":{"ar":"تحدّ كندا ثلاثة محيطات: المحيط الهادئ في الغرب، والمحيط الأطلسي في الشرق، والمحيط المتجمد الشمالي في الشمال. وعلى الحافة الجنوبية لكندا تقع الحدود بين كندا والولايات المتحدة."},"questions":[{"type":"mc","q":{"en":"Which three oceans line Canada’s frontiers?","fr":"Quels sont les trois océans qui bordent les frontières du Canada?"},"options":{"en":["Pacific, Atlantic and Arctic","Pacific, Atlantic and Indian","Atlantic, Arctic and Southern","Pacific, Indian and Arctic"],"fr":["Pacifique, Atlantique et Arctique","Pacifique, Atlantique et Indien","Atlantique, Arctique et Austral","Pacifique, Indien et Arctique"]},"answer":0},{"type":"mc","q":{"en":"Which ocean lies to the north of Canada?","fr":"Quel océan se trouve au nord du Canada?"},"options":{"en":["The Pacific Ocean","The Atlantic Ocean","The Indian Ocean","The Arctic Ocean"],"fr":["L’océan Pacifique","L’océan Atlantique","L’océan Indien","L’océan Arctique"]},"answer":3},{"type":"tf","q":{"en":"The Atlantic Ocean lies to the west of Canada.","fr":"L’océan Atlantique se trouve à l’ouest du Canada."},"answer":false}]},{"id":"regions-003","topic":"five-regions","importance":3,"en":"Canada includes many different geographical areas and five distinct regions: the Atlantic Provinces, Central Canada, the Prairie Provinces, the West Coast and the Northern Territories.","en_simple":"Canada has 5 regions: Atlantic Provinces, Central Canada, Prairie Provinces, West Coast, Northern Territories.","fr":"Le Canada compte de nombreux secteurs géographiques différents et cinq régions distinctes : les provinces de l’Atlantique; le centre du Canada; les provinces des Prairies; la côte Ouest; les territoires du Nord.","tr":{"ar":"تضم كندا مناطق جغرافية كثيرة مختلفة وخمس مناطق متميزة: مقاطعات الأطلسي، ووسط كندا، ومقاطعات البراري، والساحل الغربي، وأقاليم الشمال."},"questions":[{"type":"mc","q":{"en":"How many distinct regions does Canada have?","fr":"Combien de régions distinctes le Canada compte-t-il?"},"options":{"en":["Three","Five","Ten","Thirteen"],"fr":["Trois","Cinq","Dix","Treize"]},"answer":1},{"type":"mc","q":{"en":"Which of the following is one of Canada’s five regions?","fr":"Lequel des éléments suivants est l’une des cinq régions du Canada?"},"options":{"en":["The Great Lakes","The Rocky Mountains","The Prairie Provinces","The Maritimes"],"fr":["Les Grands Lacs","Les montagnes Rocheuses","Les provinces des Prairies","Les Maritimes"]},"answer":2},{"type":"mc","q":{"en":"Name the five regions of Canada.","fr":"Nommez les cinq régions du Canada."},"options":{"en":["Atlantic Provinces, Central Canada, Prairie Provinces, West Coast, Northern Territories","East, West, North, South, Centre","Maritimes, Quebec, Ontario, Prairies, Rockies","Atlantic, Pacific, Arctic, Great Lakes, Prairies"],"fr":["Provinces de l’Atlantique, centre du Canada, provinces des Prairies, côte Ouest, territoires du Nord","Est, Ouest, Nord, Sud, Centre","Maritimes, Québec, Ontario, Prairies, Rocheuses","Atlantique, Pacifique, Arctique, Grands Lacs, Prairies"]},"answer":0}]},{"id":"regions-004","topic":"national-capital","importance":3,"en":"Ottawa, located on the Ottawa River, was chosen as the capital in 1857 by Queen Victoria, the great-great-grandmother of Queen Elizabeth II.","en_simple":"Ottawa is the capital of Canada. It is on the Ottawa River. Queen Victoria chose it as capital in 1857.","fr":"Située sur la rivière des Outaouais, la ville d’Ottawa a été choisie comme capitale du Canada en 1857 par la reine Victoria, l’arrière-arrière-grand-mère de la reine Elizabeth II.","tr":{"ar":"أوتاوا (Ottawa)، الواقعة على نهر أوتاوا، اختارتها الملكة فيكتوريا (Queen Victoria) عاصمةً عام 1857، وهي الجدة الكبرى الثانية للملكة إليزابيث الثانية."},"questions":[{"type":"mc","q":{"en":"What is the capital city of Canada?","fr":"Quelle est la capitale du Canada?"},"options":{"en":["Toronto","Montreal","Ottawa","Québec City"],"fr":["Toronto","Montréal","Ottawa","Québec"]},"answer":2},{"type":"mc","q":{"en":"Who chose Ottawa as the capital of Canada, and when?","fr":"Qui a choisi Ottawa comme capitale du Canada, et en quelle année?"},"options":{"en":["Sir John A. Macdonald in 1867","Queen Victoria in 1857","Queen Elizabeth II in 1952","King George III in 1791"],"fr":["Sir John A. Macdonald en 1867","La reine Victoria en 1857","La reine Elizabeth II en 1952","Le roi George III en 1791"]},"answer":1},{"type":"mc","q":{"en":"On which river is Ottawa located?","fr":"Sur quelle rivière Ottawa est-elle située?"},"options":{"en":["The St. Lawrence River","The Ottawa River","The Mackenzie River","The St. John River"],"fr":["Le fleuve Saint-Laurent","La rivière des Outaouais","Le fleuve Mackenzie","La rivière Saint-Jean"]},"answer":1}]},{"id":"regions-005","topic":"national-capital","importance":2,"en":"Today Ottawa is Canada’s fourth largest metropolitan area. The National Capital Region, 4,700 square kilometres surrounding Ottawa, preserves and enhances the area’s built heritage and natural environment.","en_simple":"Ottawa is Canada's 4th largest metropolitan area. The National Capital Region around Ottawa covers 4,700 square kilometres.","fr":"Ottawa est aujourd’hui la quatrième ville en importance au Canada. La région de la capitale nationale, qui s’étend sur 4 700 kilomètres carrés autour d’Ottawa, préserve et rehausse le patrimoine bâti et l’environnement naturel du secteur.","tr":{"ar":"أوتاوا اليوم هي رابع أكبر منطقة حضرية في كندا. وتحافظ منطقة العاصمة الوطنية، التي تمتد على 4,700 كيلومتر مربع حول أوتاوا، على التراث المعماري والبيئة الطبيعية للمنطقة وتعززهما."},"questions":[{"type":"mc","q":{"en":"Ottawa is Canada’s ___ largest metropolitan area.","fr":"Ottawa est la ___ ville en importance au Canada."},"options":{"en":["second","third","fourth","fifth"],"fr":["deuxième","troisième","quatrième","cinquième"]},"answer":2},{"type":"mc","q":{"en":"How large is the National Capital Region surrounding Ottawa?","fr":"Quelle est la superficie de la région de la capitale nationale autour d’Ottawa?"},"options":{"en":["470 square kilometres","4,700 square kilometres","47,000 square kilometres","1.8 million square kilometres"],"fr":["470 kilomètres carrés","4 700 kilomètres carrés","47 000 kilomètres carrés","1,8 million de kilomètres carrés"]},"answer":1}]},{"id":"regions-006","topic":"provinces-territories","importance":3,"en":"Canada has ten provinces and three territories. Each province and territory has its own capital city. You should know the capital of your province or territory as well as that of Canada.","en_simple":"Canada has 10 provinces and 3 territories. Each one has its own capital city.","fr":"Le Canada compte dix provinces et trois territoires, chacun ayant sa capitale. Vous devriez connaître la capitale de votre province ou territoire ainsi que la capitale du Canada.","tr":{"ar":"تضم كندا عشر مقاطعات وثلاثة أقاليم، ولكل مقاطعة وإقليم عاصمته الخاصة. وعليك أن تعرف عاصمة مقاطعتك أو إقليمك وكذلك عاصمة كندا."},"questions":[{"type":"mc","q":{"en":"How many provinces and territories does Canada have?","fr":"Combien de provinces et de territoires le Canada compte-t-il?"},"options":{"en":["Ten provinces and three territories","Nine provinces and four territories","Thirteen provinces and no territories","Ten provinces and two territories"],"fr":["Dix provinces et trois territoires","Neuf provinces et quatre territoires","Treize provinces et aucun territoire","Dix provinces et deux territoires"]},"answer":0},{"type":"tf","q":{"en":"Canada has three territories.","fr":"Le Canada compte trois territoires."},"answer":true}]},{"id":"regions-007","topic":"population","importance":3,"en":"Canada has a population of about 34 million people. While the majority live in cities, Canadians also live in small towns, rural areas and everywhere in between.","en_simple":"Canada has about 34 million people. Most live in cities.","fr":"Le Canada compte environ 34 millions d’habitants. Bien que la majorité réside dans les grandes villes, les Canadiens vivent également dans des villages, en région rurale et partout ailleurs.","tr":{"ar":"يبلغ عدد سكان كندا نحو 34 مليون نسمة. ومع أن الأغلبية تعيش في المدن، يعيش الكنديون أيضًا في البلدات الصغيرة والمناطق الريفية وفي كل مكان بينهما."},"questions":[{"type":"mc","q":{"en":"What is the approximate population of Canada?","fr":"Quelle est la population approximative du Canada?"},"options":{"en":["12 million","20 million","34 million","100 million"],"fr":["12 millions","20 millions","34 millions","100 millions"]},"answer":2},{"type":"tf","q":{"en":"The majority of Canadians live in cities.","fr":"La majorité des Canadiens vivent dans les grandes villes."},"answer":true}]},{"id":"regions-008","topic":"capitals","importance":3,"en":"Newfoundland and Labrador is in the Atlantic region; its capital city is St. John’s.","en_simple":"Newfoundland and Labrador — capital: St. John's. Region: Atlantic.","fr":"Région de l’Atlantique — Terre-Neuve-et-Labrador — St. John’s","tr":{"ar":"نيوفاوندلاند ولابرادور (Newfoundland and Labrador) تقع في منطقة الأطلسي، وعاصمتها سانت جونز (St. John’s)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Newfoundland and Labrador?","fr":"Quelle est la capitale de Terre-Neuve-et-Labrador?"},"options":{"en":["Halifax","St. John’s","Fredericton","Charlottetown"],"fr":["Halifax","St. John’s","Fredericton","Charlottetown"]},"answer":1},{"type":"mc","q":{"en":"St. John’s is the capital of which province?","fr":"St. John’s est la capitale de quelle province?"},"options":{"en":["New Brunswick","Nova Scotia","Newfoundland and Labrador","Prince Edward Island"],"fr":["Nouveau-Brunswick","Nouvelle-Écosse","Terre-Neuve-et-Labrador","Île-du-Prince-Édouard"]},"answer":2}]},{"id":"regions-009","topic":"capitals","importance":3,"en":"Prince Edward Island is in the Atlantic region; its capital city is Charlottetown.","en_simple":"Prince Edward Island — capital: Charlottetown. Region: Atlantic.","fr":"Région de l’Atlantique — Île-du-Prince-Édouard — Charlottetown","tr":{"ar":"جزيرة الأمير إدوارد (Prince Edward Island) تقع في منطقة الأطلسي، وعاصمتها شارلوتتاون (Charlottetown)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Prince Edward Island?","fr":"Quelle est la capitale de l’Île-du-Prince-Édouard?"},"options":{"en":["Charlottetown","Halifax","St. John’s","Fredericton"],"fr":["Charlottetown","Halifax","St. John’s","Fredericton"]},"answer":0},{"type":"mc","q":{"en":"Charlottetown is the capital of which province?","fr":"Charlottetown est la capitale de quelle province?"},"options":{"en":["Nova Scotia","Newfoundland and Labrador","New Brunswick","Prince Edward Island"],"fr":["Nouvelle-Écosse","Terre-Neuve-et-Labrador","Nouveau-Brunswick","Île-du-Prince-Édouard"]},"answer":3}]},{"id":"regions-010","topic":"capitals","importance":3,"en":"Nova Scotia is in the Atlantic region; its capital city is Halifax.","en_simple":"Nova Scotia — capital: Halifax. Region: Atlantic.","fr":"Région de l’Atlantique — Nouvelle-Écosse — Halifax","tr":{"ar":"نوفا سكوشا (Nova Scotia) تقع في منطقة الأطلسي، وعاصمتها هاليفاكس (Halifax)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Nova Scotia?","fr":"Quelle est la capitale de la Nouvelle-Écosse?"},"options":{"en":["Fredericton","St. John’s","Halifax","Charlottetown"],"fr":["Fredericton","St. John’s","Halifax","Charlottetown"]},"answer":2},{"type":"mc","q":{"en":"Halifax is the capital of which province?","fr":"Halifax est la capitale de quelle province?"},"options":{"en":["Nova Scotia","New Brunswick","Prince Edward Island","Newfoundland and Labrador"],"fr":["Nouvelle-Écosse","Nouveau-Brunswick","Île-du-Prince-Édouard","Terre-Neuve-et-Labrador"]},"answer":0}]},{"id":"regions-011","topic":"capitals","importance":3,"en":"New Brunswick is in the Atlantic region; its capital city is Fredericton.","en_simple":"New Brunswick — capital: Fredericton. Region: Atlantic.","fr":"Région de l’Atlantique — Nouveau-Brunswick — Fredericton","tr":{"ar":"نيو برونزويك (New Brunswick) تقع في منطقة الأطلسي، وعاصمتها فريدريكتون (Fredericton)."},"questions":[{"type":"mc","q":{"en":"What is the capital of New Brunswick?","fr":"Quelle est la capitale du Nouveau-Brunswick?"},"options":{"en":["Saint John","Moncton","Halifax","Fredericton"],"fr":["Saint John","Moncton","Halifax","Fredericton"]},"answer":3},{"type":"mc","q":{"en":"Fredericton is the capital of which province?","fr":"Fredericton est la capitale de quelle province?"},"options":{"en":["Prince Edward Island","New Brunswick","Nova Scotia","Manitoba"],"fr":["Île-du-Prince-Édouard","Nouveau-Brunswick","Nouvelle-Écosse","Manitoba"]},"answer":1},{"type":"mc","q":{"en":"What provinces are referred to as the Atlantic Provinces?","fr":"Quelles provinces sont appelées les provinces de l’Atlantique?"},"options":{"en":["Newfoundland and Labrador, Prince Edward Island, Nova Scotia and New Brunswick","Quebec, Ontario, Nova Scotia and New Brunswick","Nova Scotia, New Brunswick, Quebec and Prince Edward Island","Newfoundland and Labrador, Nova Scotia, Quebec and Ontario"],"fr":["Terre-Neuve-et-Labrador, l’Île-du-Prince-Édouard, la Nouvelle-Écosse et le Nouveau-Brunswick","Le Québec, l’Ontario, la Nouvelle-Écosse et le Nouveau-Brunswick","La Nouvelle-Écosse, le Nouveau-Brunswick, le Québec et l’Île-du-Prince-Édouard","Terre-Neuve-et-Labrador, la Nouvelle-Écosse, le Québec et l’Ontario"]},"answer":0}]},{"id":"regions-012","topic":"capitals","importance":3,"en":"Quebec is in Central Canada; its capital city is Québec City.","en_simple":"Quebec — capital: Québec City. Region: Central Canada.","fr":"Centre du Canada — Québec — Québec","tr":{"ar":"كيبيك (Quebec) تقع في وسط كندا، وعاصمتها مدينة كيبيك (Québec City)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Quebec?","fr":"Quelle est la capitale du Québec?"},"options":{"en":["Montreal","Québec City","Ottawa","Toronto"],"fr":["Montréal","Québec","Ottawa","Toronto"]},"answer":1},{"type":"tf","q":{"en":"Montreal is the capital of Quebec.","fr":"Montréal est la capitale du Québec."},"answer":false}]},{"id":"regions-013","topic":"capitals","importance":3,"en":"Ontario is in Central Canada; its capital city is Toronto.","en_simple":"Ontario — capital: Toronto. Region: Central Canada.","fr":"Centre du Canada — Ontario — Toronto","tr":{"ar":"أونتاريو (Ontario) تقع في وسط كندا، وعاصمتها تورونتو (Toronto)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Ontario?","fr":"Quelle est la capitale de l’Ontario?"},"options":{"en":["Ottawa","Hamilton","Toronto","Kingston"],"fr":["Ottawa","Hamilton","Toronto","Kingston"]},"answer":2},{"type":"mc","q":{"en":"Which two provinces make up Central Canada?","fr":"Quelles deux provinces forment le centre du Canada?"},"options":{"en":["Manitoba and Saskatchewan","Ontario and Quebec","Quebec and New Brunswick","Ontario and Manitoba"],"fr":["Le Manitoba et la Saskatchewan","L’Ontario et le Québec","Le Québec et le Nouveau-Brunswick","L’Ontario et le Manitoba"]},"answer":1}]},{"id":"regions-014","topic":"capitals","importance":3,"en":"Manitoba is one of the Prairie Provinces; its capital city is Winnipeg.","en_simple":"Manitoba — capital: Winnipeg. Region: Prairie Provinces.","fr":"Provinces des Prairies — Manitoba — Winnipeg","tr":{"ar":"مانيتوبا (Manitoba) إحدى مقاطعات البراري، وعاصمتها وينيبيغ (Winnipeg)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Manitoba?","fr":"Quelle est la capitale du Manitoba?"},"options":{"en":["Regina","Winnipeg","Edmonton","Saskatoon"],"fr":["Regina","Winnipeg","Edmonton","Saskatoon"]},"answer":1},{"type":"mc","q":{"en":"Winnipeg is the capital of which province?","fr":"Winnipeg est la capitale de quelle province?"},"options":{"en":["Saskatchewan","Alberta","Manitoba","Ontario"],"fr":["Saskatchewan","Alberta","Manitoba","Ontario"]},"answer":2}]},{"id":"regions-015","topic":"capitals","importance":3,"en":"Saskatchewan is one of the Prairie Provinces; its capital city is Regina.","en_simple":"Saskatchewan — capital: Regina. Region: Prairie Provinces.","fr":"Provinces des Prairies — Saskatchewan — Regina","tr":{"ar":"ساسكاتشوان (Saskatchewan) إحدى مقاطعات البراري، وعاصمتها ريجاينا (Regina)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Saskatchewan?","fr":"Quelle est la capitale de la Saskatchewan?"},"options":{"en":["Saskatoon","Winnipeg","Edmonton","Regina"],"fr":["Saskatoon","Winnipeg","Edmonton","Regina"]},"answer":3},{"type":"mc","q":{"en":"Regina is the capital of which province?","fr":"Regina est la capitale de quelle province?"},"options":{"en":["Saskatchewan","Manitoba","Alberta","British Columbia"],"fr":["Saskatchewan","Manitoba","Alberta","Colombie-Britannique"]},"answer":0},{"type":"mc","q":{"en":"Which provinces are the Prairie Provinces?","fr":"Quell
