es provinces sont les provinces des Prairies?"},"options":{"en":["Manitoba, Saskatchewan and Alberta","Ontario, Manitoba and Saskatchewan","Saskatchewan, Alberta and British Columbia","Manitoba, Alberta and Yukon"],"fr":["Le Manitoba, la Saskatchewan et l’Alberta","L’Ontario, le Manitoba et la Saskatchewan","La Saskatchewan, l’Alberta et la Colombie-Britannique","Le Manitoba, l’Alberta et le Yukon"]},"answer":0}]},{"id":"regions-016","topic":"capitals","importance":3,"en":"Alberta is one of the Prairie Provinces; its capital city is Edmonton.","en_simple":"Alberta — capital: Edmonton. Region: Prairie Provinces.","fr":"Provinces des Prairies — Alberta — Edmonton","tr":{"ar":"ألبرتا (Alberta) إحدى مقاطعات البراري، وعاصمتها إدمونتون (Edmonton)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Alberta?","fr":"Quelle est la capitale de l’Alberta?"},"options":{"en":["Calgary","Edmonton","Regina","Banff"],"fr":["Calgary","Edmonton","Regina","Banff"]},"answer":1},{"type":"mc","q":{"en":"Edmonton is the capital of which province?","fr":"Edmonton est la capitale de quelle province?"},"options":{"en":["Saskatchewan","British Columbia","Manitoba","Alberta"],"fr":["Saskatchewan","Colombie-Britannique","Manitoba","Alberta"]},"answer":3}]},{"id":"regions-017","topic":"capitals","importance":3,"en":"British Columbia is the West Coast region; its capital city is Victoria.","en_simple":"British Columbia — capital: Victoria. Region: West Coast.","fr":"Côte Ouest — Colombie-Britannique — Victoria","tr":{"ar":"كولومبيا البريطانية (British Columbia) هي منطقة الساحل الغربي، وعاصمتها فيكتوريا (Victoria)."},"questions":[{"type":"mc","q":{"en":"What is the capital of British Columbia?","fr":"Quelle est la capitale de la Colombie-Britannique?"},"options":{"en":["Vancouver","Victoria","Edmonton","Whitehorse"],"fr":["Vancouver","Victoria","Edmonton","Whitehorse"]},"answer":1},{"type":"tf","q":{"en":"Vancouver is the capital of British Columbia.","fr":"Vancouver est la capitale de la Colombie-Britannique."},"answer":false},{"type":"mc","q":{"en":"Which province makes up the West Coast region?","fr":"Quelle province forme la région de la côte Ouest?"},"options":{"en":["Alberta","Yukon","British Columbia","Manitoba"],"fr":["L’Alberta","Le Yukon","La Colombie-Britannique","Le Manitoba"]},"answer":2}]},{"id":"regions-018","topic":"capitals","importance":3,"en":"Nunavut is in the North; its capital city is Iqaluit.","en_simple":"Nunavut — capital: Iqaluit. Region: North.","fr":"Nord — Nunavut — Iqaluit","tr":{"ar":"نونافوت (Nunavut) يقع في الشمال، وعاصمته إيكالويت (Iqaluit)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Nunavut?","fr":"Quelle est la capitale du Nunavut?"},"options":{"en":["Yellowknife","Whitehorse","Iqaluit","Resolute"],"fr":["Yellowknife","Whitehorse","Iqaluit","Resolute"]},"answer":2},{"type":"mc","q":{"en":"Iqaluit is the capital of which territory?","fr":"Iqaluit est la capitale de quel territoire?"},"options":{"en":["Nunavut","Northwest Territories","Yukon","Labrador"],"fr":["Le Nunavut","Les Territoires du Nord-Ouest","Le Yukon","Le Labrador"]},"answer":0}]},{"id":"regions-019","topic":"capitals","importance":3,"en":"The Northwest Territories are in the North; the capital city is Yellowknife.","en_simple":"Northwest Territories — capital: Yellowknife. Region: North.","fr":"Nord — Territoires du Nord-Ouest — Yellowknife","tr":{"ar":"الأقاليم الشمالية الغربية (Northwest Territories) تقع في الشمال، وعاصمتها يلونايف (Yellowknife)."},"questions":[{"type":"mc","q":{"en":"What is the capital of the Northwest Territories?","fr":"Quelle est la capitale des Territoires du Nord-Ouest?"},"options":{"en":["Iqaluit","Yellowknife","Whitehorse","Winnipeg"],"fr":["Iqaluit","Yellowknife","Whitehorse","Winnipeg"]},"answer":1},{"type":"mc","q":{"en":"Yellowknife is the capital of which territory?","fr":"Yellowknife est la capitale de quel territoire?"},"options":{"en":["Yukon","Nunavut","Northwest Territories","Alberta"],"fr":["Le Yukon","Le Nunavut","Les Territoires du Nord-Ouest","L’Alberta"]},"answer":2},{"type":"mc","q":{"en":"Which three territories make up Canada’s North?","fr":"Quels sont les trois territoires qui forment le Nord du Canada?"},"options":{"en":["Yukon, Northwest Territories and Nunavut","Yukon, Alaska and Nunavut","Northwest Territories, Labrador and Nunavut","Yukon, Northwest Territories and Manitoba"],"fr":["Le Yukon, les Territoires du Nord-Ouest et le Nunavut","Le Yukon, l’Alaska et le Nunavut","Les Territoires du Nord-Ouest, le Labrador et le Nunavut","Le Yukon, les Territoires du Nord-Ouest et le Manitoba"]},"answer":0}]},{"id":"regions-020","topic":"capitals","importance":3,"en":"Yukon Territory is in the North; its capital city is Whitehorse.","en_simple":"Yukon — capital: Whitehorse. Region: North.","fr":"Nord — Yukon — Whitehorse","tr":{"ar":"إقليم يوكون (Yukon) يقع في الشمال، وعاصمته وايتهورس (Whitehorse)."},"questions":[{"type":"mc","q":{"en":"What is the capital of Yukon?","fr":"Quelle est la capitale du Yukon?"},"options":{"en":["Whitehorse","Yellowknife","Iqaluit","Skagway"],"fr":["Whitehorse","Yellowknife","Iqaluit","Skagway"]},"answer":0},{"type":"mc","q":{"en":"Whitehorse is the capital of which territory?","fr":"Whitehorse est la capitale de quel territoire?"},"options":{"en":["Nunavut","Northwest Territories","Yukon","British Columbia"],"fr":["Le Nunavut","Les Territoires du Nord-Ouest","Le Yukon","La Colombie-Britannique"]},"answer":2}]},{"id":"regions-021","topic":"atlantic","importance":2,"en":"Atlantic Canada’s coasts and natural resources, including fishing, farming, forestry and mining, have made these provinces an important part of Canada’s history and development. The Atlantic Ocean brings cool winters and cool humid summers.","en_simple":"The Atlantic Provinces have fishing, farming, forestry and mining. The Atlantic Ocean gives them cool winters and cool, humid summers.","fr":"Grâce à leurs côtes ainsi qu’à leurs richesses naturelles, qui permettent, entre autres, la pêche, l’agriculture, la foresterie et l’exploitation minière, les provinces de l’Atlantique jouent un rôle important dans l’histoire et le développement du Canada. L’océan Atlantique entraîne des hivers plutôt frais et des étés frais et humides.","tr":{"ar":"جعلت سواحل كندا الأطلسية ومواردها الطبيعية، بما فيها صيد الأسماك والزراعة والغابات والتعدين، هذه المقاطعات جزءًا مهمًا من تاريخ كندا وتطورها. ويجلب المحيط الأطلسي شتاءً باردًا وصيفًا باردًا ورطبًا."},"questions":[{"type":"mc","q":{"en":"What kind of climate does the Atlantic Ocean bring to the Atlantic Provinces?","fr":"Quel type de climat l’océan Atlantique apporte-t-il aux provinces de l’Atlantique?"},"options":{"en":["Cold winters and hot summers","Cool winters and cool humid summers","A temperate climate all year","Long cold winters and short cool summers"],"fr":["Des hivers froids et des étés chauds","Des hivers frais et des étés frais et humides","Un climat tempéré toute l’année","De longs hivers froids et de courts étés frais"]},"answer":1}]},{"id":"regions-022","topic":"newfoundland-labrador","importance":3,"en":"Newfoundland and Labrador is the most easterly point in North America and has its own time zone.","en_simple":"Newfoundland and Labrador is the most easterly point in North America. It has its own time zone.","fr":"Terre-Neuve-et-Labrador, à l’extrême est de l’Amérique du Nord, occupe son propre fuseau horaire.","tr":{"ar":"نيوفاوندلاند ولابرادور هي أقصى نقطة شرقية في أمريكا الشمالية ولها منطقتها الزمنية الخاصة."},"questions":[{"type":"mc","q":{"en":"Which province is the most easterly point in North America and has its own time zone?","fr":"Quelle province est située à l’extrême est de l’Amérique du Nord et possède son propre fuseau horaire?"},"options":{"en":["Nova Scotia","Prince Edward Island","Newfoundland and Labrador","New Brunswick"],"fr":["La Nouvelle-Écosse","L’Île-du-Prince-Édouard","Terre-Neuve-et-Labrador","Le Nouveau-Brunswick"]},"answer":2},{"type":"tf","q":{"en":"Newfoundland and Labrador has its own time zone.","fr":"Terre-Neuve-et-Labrador possède son propre fuseau horaire."},"answer":true}]},{"id":"regions-023","topic":"newfoundland-labrador","importance":3,"en":"The oldest colony of the British Empire and a strategic prize in Canada’s early history, the province has long been known for its fisheries, coastal fishing villages and distinct culture. Today off-shore oil and gas extraction contributes a substantial part of the economy. Labrador also has immense hydro-electric resources.","en_simple":"Newfoundland was the oldest colony of the British Empire. It is known for fishing. Today offshore oil and gas are important. Labrador has huge hydro-electric resources.","fr":"Terre-Neuve est la plus ancienne colonie de l’Empire britannique et elle a été un atout stratégique pour le Canada à ses débuts. Elle est depuis longtemps reconnue pour ses lieux de pêche, ses villages côtiers de pêcheurs et sa culture bien à elle. De nos jours, l’exploitation pétrolière et gazière en mer contribue largement à son économie. Quant au Labrador, ses ressources hydroélectriques sont immenses.","tr":{"ar":"كانت نيوفاوندلاند أقدم مستعمرة في الإمبراطورية البريطانية وجائزة استراتيجية في تاريخ كندا المبكر، وعُرفت طويلًا بمصايد الأسماك وقرى الصيد الساحلية وثقافتها المتميزة. واليوم يسهم استخراج النفط والغاز البحري بجزء كبير من اقتصادها. كما يمتلك لابرادور (Labrador) موارد كهرومائية هائلة."},"questions":[{"type":"mc","q":{"en":"Which province was the oldest colony of the British Empire?","fr":"Quelle province a été la plus ancienne colonie de l’Empire britannique?"},"options":{"en":["Nova Scotia","Newfoundland and Labrador","Quebec","Ontario"],"fr":["La Nouvelle-Écosse","Terre-Neuve-et-Labrador","Le Québec","L’Ontario"]},"answer":1},{"type":"mc","q":{"en":"Which part of Canada has immense hydro-electric resources, according to the guide?","fr":"Selon le guide, quelle partie du Canada possède d’immenses ressources hydroélectriques?"},"options":{"en":["Prince Edward Island","The Badlands","Labrador","The Okanagan Valley"],"fr":["L’Île-du-Prince-Édouard","Les badlands","Le Labrador","La vallée de l’Okanagan"]},"answer":2}]},{"id":"regions-024","topic":"pei","importance":3,"en":"Prince Edward Island (P.E.I.) is the smallest province, known for its beaches, red soil and agriculture, especially potatoes.","en_simple":"Prince Edward Island (P.E.I.) is the smallest province. It is known for beaches, red soil and potatoes.","fr":"L’Île-du-Prince-Édouard (Î.-P.-É.), la plus petite des provinces, est reconnue pour ses plages, sa terre rouge et son agriculture, particulièrement sa production de pommes de terre.","tr":{"ar":"جزيرة الأمير إدوارد هي أصغر مقاطعة، وتشتهر بشواطئها وتربتها الحمراء وزراعتها، وخاصة البطاطا."},"questions":[{"type":"mc","q":{"en":"Which is the smallest province in Canada?","fr":"Quelle est la plus petite province du Canada?"},"options":{"en":["Nova Scotia","New Brunswick","Prince Edward Island","Newfoundland and Labrador"],"fr":["La Nouvelle-Écosse","Le Nouveau-Brunswick","L’Île-du-Prince-Édouard","Terre-Neuve-et-Labrador"]},"answer":2},{"type":"mc","q":{"en":"Prince Edward Island is known for its red soil and which crop?","fr":"L’Île-du-Prince-Édouard est reconnue pour sa terre rouge et pour quelle culture?"},"options":{"en":["Wheat","Potatoes","Grapes","Apples"],"fr":["Le blé","Les pommes de terre","Le raisin","Les pommes"]},"answer":1}]},{"id":"regions-025","topic":"pei","importance":3,"en":"P.E.I. is the birthplace of Confederation, connected to mainland Canada by one of the longest continuous multispan bridges in the world, the Confederation Bridge.","en_simple":"P.E.I. is the birthplace of Confederation. The Confederation Bridge connects it to the mainland. It is one of the longest multispan bridges in the world.","fr":"Berceau de la Confédération, l’Î.-P.-É. est reliée à la terre ferme par l’un des ponts continus à travées multiples les plus longs du monde, le pont de la Confédération.","tr":{"ar":"جزيرة الأمير إدوارد هي مهد الكونفدرالية، ويربطها بالبر الكندي أحد أطول الجسور المتعددة الفتحات المتصلة في العالم، وهو جسر الكونفدرالية (Confederation Bridge)."},"questions":[{"type":"mc","q":{"en":"Which province is known as the birthplace of Confederation?","fr":"Quelle province est connue comme le berceau de la Confédération?"},"options":{"en":["Ontario","Quebec","Nova Scotia","Prince Edward Island"],"fr":["L’Ontario","Le Québec","La Nouvelle-Écosse","L’Île-du-Prince-Édouard"]},"answer":3},{"type":"mc","q":{"en":"What connects Prince Edward Island to mainland Canada?","fr":"Qu’est-ce qui relie l’Île-du-Prince-Édouard à la terre ferme?"},"options":{"en":["The Confederation Bridge","The Rideau Canal","The White Pass and Yukon Railway","The Lions Gate Bridge"],"fr":["Le pont de la Confédération","Le canal Rideau","Le chemin de fer White Pass and Yukon","Le pont Lions Gate"]},"answer":0}]},{"id":"regions-026","topic":"pei","importance":2,"en":"Anne of Green Gables, set in P.E.I. by Lucy Maud Montgomery, is a much-loved story about the adventures of a little red-headed orphan girl.","en_simple":"Lucy Maud Montgomery wrote Anne of Green Gables. The story is set in P.E.I. It is about a red-headed orphan girl.","fr":"C’est à l’Î.-P.-É. que Lucy Maud Montgomery a situé son fameux roman Anne… la maison aux pignons verts, qui raconte les aventures d’une petite orpheline aux cheveux roux.","tr":{"ar":"رواية «آن في المرتفعات الخضراء» (Anne of Green Gables)، التي وضعت أحداثها لوسي مود مونتغمري (Lucy Maud Montgomery) في جزيرة الأمير إدوارد، قصة محبوبة عن مغامرات فتاة يتيمة صغيرة حمراء الشعر."},"questions":[{"type":"mc","q":{"en":"Who wrote Anne of Green Gables, set in Prince Edward Island?","fr":"Qui a écrit Anne… la maison aux pignons verts, dont l’action se déroule à l’Île-du-Prince-Édouard?"},"options":{"en":["Robert W. Service","Lucy Maud Montgomery","Laura Secord","Emily Carr"],"fr":["Robert W. Service","Lucy Maud Montgomery","Laura Secord","Emily Carr"]},"answer":1},{"type":"mc","q":{"en":"In which province is the story Anne of Green Gables set?","fr":"Dans quelle province se déroule l’histoire d’Anne… la maison aux pignons verts?"},"options":{"en":["Nova Scotia","Newfoundland and Labrador","Prince Edward Island","New Brunswick"],"fr":["La Nouvelle-Écosse","Terre-Neuve-et-Labrador","L’Île-du-Prince-Édouard","Le Nouveau-Brunswick"]},"answer":2}]},{"id":"regions-027","topic":"nova-scotia","importance":3,"en":"Nova Scotia is the most populous Atlantic Province, with a rich history as the gateway to Canada. Known for the world’s highest tides in the Bay of Fundy, the province’s identity is linked to shipbuilding, fisheries and shipping.","en_simple":"Nova Scotia has the biggest population of the Atlantic Provinces. The Bay of Fundy has the highest tides in the world. Nova Scotia is known for shipbuilding, fishing and shipping.","fr":"Parmi les provinces de l’Atlantique, c’est la Nouvelle-Écosse qui a la plus grande population. Elle est connue pour son brillant passé à titre de porte d’entrée du Canada et pour sa baie de Fundy, où les marées atteignent des hauteurs inégalées dans le monde. On l’identifie également à la construction navale, à la pêche et à la marine marchande.","tr":{"ar":"نوفا سكوشا هي أكثر مقاطعات الأطلسي سكانًا، ولها تاريخ غني بوصفها بوابة كندا. وتشتهر بأعلى مدّ في العالم في خليج فندي (Bay of Fundy)، وترتبط هويتها ببناء السفن ومصايد الأسماك والشحن البحري."},"questions":[{"type":"mc","q":{"en":"Which is the most populous Atlantic Province?","fr":"Quelle est la province de l’Atlantique la plus peuplée?"},"options":{"en":["New Brunswick","Nova Scotia","Newfoundland and Labrador","Prince Edward Island"],"fr":["Le Nouveau-Brunswick","La Nouvelle-Écosse","Terre-Neuve-et-Labrador","L’Île-du-Prince-Édouard"]},"answer":1},{"type":"mc","q":{"en":"Where are the world’s highest tides found?","fr":"Où trouve-t-on les marées les plus hautes du monde?"},"options":{"en":["The Bay of Fundy","Hudson Bay","The Gulf of St. Lawrence","Frobisher Bay"],"fr":["La baie de Fundy","La baie d’Hudson","Le golfe du Saint-Laurent","Frobisher Bay"]},"answer":0}]},{"id":"regions-028","topic":"nova-scotia","importance":3,"en":"As Canada’s largest east coast port, deep-water and ice-free, the capital, Halifax, has played an important role in Atlantic trade and defence and is home to Canada’s largest naval base.","en_simple":"Halifax is Canada's largest east coast port. It is deep-water and ice-free. It has Canada's largest naval base.","fr":"Sa capitale, Halifax, plus grand port de la côte Est du Canada, aux eaux profondes et libres de glace, occupe une place de premier plan dans la défense et le commerce du côté de l’Atlantique; elle abrite la plus importante base navale du Canada.","tr":{"ar":"هاليفاكس، العاصمة، هي أكبر ميناء على الساحل الشرقي لكندا، بمياهها العميقة الخالية من الجليد، وقد أدت دورًا مهمًا في التجارة والدفاع الأطلسيين، وهي موطن أكبر قاعدة بحرية في كندا."},"questions":[{"type":"mc","q":{"en":"Which city is Canada’s largest east coast port and home to Canada’s largest naval base?","fr":"Quelle ville est le plus grand port de la côte Est du Canada et abrite la plus importante base navale du pays?"},"options":{"en":["Saint John","St. John’s","Halifax","Charlottetown"],"fr":["Saint John","St. John’s","Halifax","Charlottetown"]},"answer":2},{"type":"tf","q":{"en":"Halifax is home to Canada’s largest naval base.","fr":"Halifax abrite la plus importante base navale du Canada."},"answer":true}]},{"id":"regions-029","topic":"nova-scotia","importance":2,"en":"Nova Scotia has a long history of coal mining, forestry and agriculture. The province’s Celtic and Gaelic traditions sustain a vibrant culture. Nova Scotia is home to over 700 annual festivals, including the spectacular military tattoo in Halifax.","en_simple":"Nova Scotia has Celtic and Gaelic traditions. It has more than 700 festivals every year, including the military tattoo in Halifax.","fr":"L’exploitation du charbon, la foresterie et l’agriculture ont façonné la Nouvelle-Écosse, qui aujourd’hui profite également de l’exploration pétrolière et gazière en mer. Ses traditions celtiques et gaéliques nourrissent une culture florissante; chaque année, la Nouvelle-Écosse est l’hôte de plus de 700 festivals, dont le spectaculaire carrousel militaire de Halifax.","tr":{"ar":"لنوفا سكوشا تاريخ طويل في تعدين الفحم والغابات والزراعة. وتُبقي تقاليدها السلتية والغيلية ثقافة نابضة بالحياة. وتستضيف نوفا سكوشا أكثر من 700 مهرجان سنويًا، منها العرض العسكري (التاتو) المذهل في هاليفاكس."},"questions":[{"type":"mc","q":{"en":"Which province is known for its Celtic and Gaelic traditions and over 700 annual festivals?","fr":"Quelle province est connue pour ses traditions celtiques et gaéliques et ses plus de 700 festivals annuels?"},"options":{"en":["Nova Scotia","Quebec","Manitoba","British Columbia"],"fr":["La Nouvelle-Écosse","Le Québec","Le Manitoba","La Colombie-Britannique"]},"answer":0},{"type":"mc","q":{"en":"Where does the spectacular military tattoo take place?","fr":"Où se déroule le spectaculaire carrousel militaire?"},"options":{"en":["Ottawa","Québec City","Halifax","Victoria"],"fr":["Ottawa","Québec","Halifax","Victoria"]},"answer":2}]},{"id":"regions-030","topic":"new-brunswick","importance":2,"en":"Situated in the Appalachian Range, New Brunswick was founded by the United Empire Loyalists and has the second largest river system on North America’s Atlantic coastline, the St. John River system.","en_simple":"New Brunswick is in the Appalachian Range. United Empire Loyalists founded it. The St. John River system is the 2nd largest river system on North America's Atlantic coast.","fr":"Fondée par les loyalistes de l’Empire-Uni, la province du Nouveau-Brunswick est traversée par les Appalaches et on y trouve le deuxième réseau hydrographique en importance du littoral atlantique de l’Amérique du Nord, soit le réseau de la rivière Saint-Jean.","tr":{"ar":"تقع نيو برونزويك في سلسلة جبال الأبالاش، وقد أسسها الموالون للإمبراطورية المتحدة (United Empire Loyalists)، وفيها ثاني أكبر نظام نهري على الساحل الأطلسي لأمريكا الشمالية، وهو نظام نهر سانت جون (St. John River)."},"questions":[{"type":"mc","q":{"en":"Which mountain range is New Brunswick situated in?","fr":"Dans quelle chaîne de montagnes le Nouveau-Brunswick est-il situé?"},"options":{"en":["The Rocky Mountains","The Appalachian Range","The Laurentians","The Coast Mountains"],"fr":["Les montagnes Rocheuses","Les Appalaches","Les Laurentides","La chaîne Côtière"]},"answer":1},{"type":"mc","q":{"en":"What is the second largest river system on North America’s Atlantic coastline?","fr":"Quel est le deuxième réseau hydrographique en importance du littoral atlantique de l’Amérique du Nord?"},"options":{"en":["The Mackenzie River system","The Ottawa River system","The St. John River system","The Fraser River system"],"fr":["Le réseau du fleuve Mackenzie","Le réseau de la rivière des Outaouais","Le réseau de la rivière Saint-Jean","Le réseau du fleuve Fraser"]},"answer":2}]},{"id":"regions-031","topic":"new-brunswick","importance":3,"en":"In New Brunswick, Saint John is the largest city, port and manufacturing centre; Moncton is the principal Francophone Acadian centre; and Fredericton, the historic capital.","en_simple":"New Brunswick: Saint John = largest city and port; Moncton = main Francophone Acadian centre; Fredericton = capital.","fr":"Saint John est la première ville en importance et est le principal centre portuaire et manufacturier. Moncton est le noyau francophone et acadien, et Fredericton est la capitale historique.","tr":{"ar":"في نيو برونزويك، سانت جون (Saint John) هي أكبر مدينة وميناء ومركز صناعي؛ ومونكتون (Moncton) هي المركز الفرنكوفوني الأكادي الرئيسي؛ وفريدريكتون هي العاصمة التاريخية."},"questions":[{"type":"mc","q":{"en":"What is the largest city in New Brunswick?","fr":"Quelle est la plus grande ville du Nouveau-Brunswick?"},"options":{"en":["Fredericton","Moncton","Saint John","Halifax"],"fr":["Fredericton","Moncton","Saint John","Halifax"]},"answer":2},{"type":"mc","q":{"en":"Which city is the principal Francophone Acadian centre of New Brunswick?","fr":"Quelle ville est le principal centre francophone et acadien du Nouveau-Brunswick?"},"options":{"en":["Moncton","Saint John","Fredericton","St. Boniface"],"fr":["Moncton","Saint John","Fredericton","Saint-Boniface"]},"answer":0}]},{"id":"regions-032","topic":"new-brunswick","importance":3,"en":"New Brunswick is the only officially bilingual province, and about one-third of the population lives and works in French.","en_simple":"New Brunswick is the only officially bilingual province. About 1/3 of its people live and work in French.","fr":"Le Nouveau-Brunswick est la seule province officiellement bilingue, et environ le tiers de sa population vit et travaille en français.","tr":{"ar":"نيو برونزويك هي المقاطعة الوحيدة الثنائية اللغة رسميًا، ونحو ثلث سكانها يعيشون ويعملون بالفرنسية."},"questions":[{"type":"mc","q":{"en":"Which is the only officially bilingual province in Canada?","fr":"Quelle est la seule province officiellement bilingue du Canada?"},"options":{"en":["Quebec","Ontario","Manitoba","New Brunswick"],"fr":["Le Québec","L’Ontario","Le Manitoba","Le Nouveau-Brunswick"]},"answer":3},{"type":"mc","q":{"en":"What proportion of New Brunswick’s population lives and works in French?","fr":"Quelle proportion de la population du Nouveau-Brunswick vit et travaille en français?"},"options":{"en":["About one-tenth","About one-third","About one-half","About three-quarters"],"fr":["Environ un dixième","Environ le tiers","Environ la moitié","Environ les trois quarts"]},"answer":1},{"type":"tf","q":{"en":"Quebec is the only officially bilingual province.","fr":"Le Québec est la seule province officiellement bilingue."},"answer":false}]},{"id":"regions-033","topic":"central-canada","importance":3,"en":"More than half the people in Canada live in cities and towns near the Great Lakes and the St. Lawrence River in southern Quebec and Ontario, known as Central Canada and the industrial and manufacturing heartland. Together, Ontario and Quebec produce more than three-quarters of all Canadian manufactured goods.","en_simple":"More than half of Canadians live in southern Quebec and Ontario (Central Canada). Ontario and Quebec make more than 3/4 of all Canadian manufactured goods.","fr":"Plus de la moitié de la population du pays vit dans les villes et les villages du sud du Québec et de l’Ontario, près des Grands Lacs et du fleuve Saint-Laurent. Cette région est le centre industriel et manufacturier du Canada. Ensemble, l’Ontario et le Québec produisent plus des trois quarts de tous les biens fabriqués au pays.","tr":{"ar":"يعيش أكثر من نصف سكان كندا في المدن والبلدات القريبة من البحيرات العظمى ونهر سانت لورانس في جنوب كيبيك وأونتاريو، وهي المنطقة المعروفة بوسط كندا والقلب الصناعي والتصنيعي. وتنتج أونتاريو وكيبيك معًا أكثر من ثلاثة أرباع جميع السلع المصنّعة في كندا."},"questions":[{"type":"mc","q":{"en":"What proportion of Canadians live in Central Canada?","fr":"Quelle proportion des Canadiens vivent dans le centre du Canada?"},"options":{"en":["About one-quarter","About one-third","More than half","Nearly all"],"fr":["Environ le quart","Environ le tiers","Plus de la moitié","Presque tous"]},"answer":2},{"type":"mc","q":{"en":"Together, Ontario and Quebec produce what share of all Canadian manufactured goods?","fr":"Ensemble, l’Ontario et le Québec produisent quelle part de tous les biens fabriqués au Canada?"},"options":{"en":["More than one-quarter","More than one-half","More than three-quarters","All of them"],"fr":["Plus du quart","Plus de la moitié","Plus des trois quarts","La totalité"]},"answer":2},{"type":"mc","q":{"en":"Which region is known as Canada’s industrial and manufacturing heartland?","fr":"Quelle région est connue comme le centre industriel et manufacturier du Canada?"},"options":{"en":["The Prairie Provinces","Central Canada","The West Coast","The Atlantic Provinces"],"fr":["Les provinces des Prairies","Le centre du Canada","La côte Ouest","Les provinces de l’Atlantique"]},"answer":1}]},{"id":"regions-034","topic":"quebec","importance":3,"en":"Nearly eight million people live in Quebec, the vast majority along or near the St. Lawrence River. More than three-quarters speak French as their first language.","en_simple":"Quebec has nearly 8 million people. Most live near the St. Lawrence River. More than 3/4 speak French as their first language.","fr":"Le Québec compte près de huit millions d’habitants, dont la vaste majorité est installée sur les rives du fleuve Saint-Laurent ou tout près. Plus des trois quarts des habitants du Québec ont le français comme langue maternelle.","tr":{"ar":"يعيش في كيبيك نحو 8 ملايين نسمة، وتعيش الغالبية العظمى منهم على طول نهر سانت لورانس (St. Lawrence River) أو بالقرب منه. وأكثر من ثلاثة أرباعهم يتحدثون الفرنسية لغةً أولى."},"questions":[{"type":"mc","q":{"en":"Approximately how many people live in Quebec?","fr":"Environ combien de personnes vivent au Québec?"},"options":{"en":["4 million","8 million","12 million","34 million"],"fr":["4 millions","8 millions","12 millions","34 millions"]},"answer":1},{"type":"mc","q":{"en":"What proportion of Quebecers speak French as their first language?","fr":"Quelle proportion des Québécois ont le français comme langue maternelle?"},"options":{"en":["About one-third","About one-half","More than three-quarters","Everyone"],"fr":["Environ le tiers","Environ la moitié","Plus des trois quarts","Tout le monde"]},"answer":2}]},{"id":"regions-035","topic":"quebec","importance":3,"en":"The resources of the Canadian Shield have helped Quebec to develop important industries, including forestry, energy and mining. Quebec is Canada’s main producer of pulp and paper. The province’s huge supply of fresh water has made it Canada’s largest producer of hydro-electricity.","en_simple":"The Canadian Shield gives Quebec forestry, energy and mining. Quebec is Canada's main producer of pulp and paper and the largest producer of hydro-electricity.","fr":"Les ressources du Bouclier canadien ont permis au Québec de développer d’importantes industries, notamment la foresterie, l’énergie et l’exploitation minière. Le Québec est le principal producteur de pâtes et papiers du Canada et ses immenses réserves d’eau douce en ont fait le plus grand producteur d’hydroélectricité du pays.","tr":{"ar":"ساعدت موارد الدرع الكندي (Canadian Shield) كيبيك على تطوير صناعات مهمة، منها الغابات والطاقة والتعدين. كيبيك هي المنتج الرئيسي للّب والورق في كندا، وجعلتها إمداداتها الهائلة من المياه العذبة أكبر منتج للطاقة الكهرومائية في كندا."},"questions":[{"type":"mc","q":{"en":"Which province is Canada’s largest producer of hydro-electricity?","fr":"Quelle province est le plus grand producteur d’hydroélectricité du Canada?"},"options":{"en":["Ontario","Manitoba","Quebec","British Columbia"],"fr":["L’Ontario","Le Manitoba","Le Québec","La Colombie-Britannique"]},"answer":2},{"type":"mc","q":{"en":"Which province is Canada’s main producer of pulp and paper?","fr":"Quelle province est le principal producteur de pâtes et papiers du Canada?"},"options":{"en":["Quebec","New Brunswick","British Columbia","Alberta"],"fr":["Le Québec","Le Nouveau-Brunswick","La Colombie-Britannique","L’Alberta"]},"answer":0}]},{"id":"regions-036","topic":"quebec","importance":2,"en":"Quebecers are leaders in cutting-edge industries such as pharmaceuticals and aeronautics. Quebec films, music, literary works and food have international stature, especially in La Francophonie, an association of French-speaking nations.","en_simple":"Quebec is a leader in pharmaceuticals and aeronautics. Quebec culture is famous in La Francophonie, an association of French-speaking nations.","fr":"Les Québécois sont des chefs de file dans des industries de pointe comme l’industrie pharmaceutique et l’aéronautique. Les films, la musique, les oeuvres littéraires et la cuisine du Québec connaissent un rayonnement international, en particulier au sein de la Francophonie, une association de pays francophones.","tr":{"ar":"الكيبيكيون روّاد في صناعات متطورة مثل الأدوية والطيران. وتحظى أفلام كيبيك وموسيقاها وأعمالها الأدبية وطعامها بمكانة دولية، خاصة في «الفرانكوفونية» (La Francophonie)، وهي رابطة للدول الناطقة بالفرنسية."},"questions":[{"type":"mc","q":{"en":"In which cutting-edge industries are Quebecers leaders, according to the guide?","fr":"Selon le guide, dans quelles industries de pointe les Québécois sont-ils des chefs de file?"},"options":{"en":["Shipbuilding and fishing","Pharmaceuticals and aeronautics","Oil sands and cattle ranching","Uranium and potash"],"fr":["La construction navale et la pêche","L’industrie pharmaceutique et l’aéronautique","Les sables bitumineux et l’élevage bovin","L’uranium et la potasse"]},"answer":1},{"type":"mc","q":{"en":"What is La Francophonie?","fr":"Qu’est-ce que la Francophonie?"},"options":{"en":["A Quebec political party","An association of French-speaking nations","A district of Montreal","A French-language newspaper"],"fr":["Un parti politique québécois","Une association de pays francophones","Un quartier de Montréal","Un journal de langue française"]},"answer":1}]},{"id":"regions-037","topic":"quebec","importance":3,"en":"Montreal, Canada’s second largest city and the second largest mainly French-speaking city in the world after Paris, is famous for its cultural diversity.","en_simple":"Montreal is Canada's 2nd largest city. It is the 2nd largest mainly French-speaking city in the world, after Paris.","fr":"Montréal, qui arrive au deuxième rang des villes les plus populeuses du Canada et n’est dépassée que par Paris lorsqu’on dresse la liste des plus grandes villes à population principalement francophone du monde, est réputée pour sa diversité culturelle.","tr":{"ar":"مونتريال (Montreal)، ثاني أكبر مدينة في كندا وثاني أكبر مدينة ناطقة بالفرنسية بشكل رئيسي في العالم بعد باريس، مشهورة بتنوعها الثقافي."},"questions":[{"type":"mc","q":{"en":"What is Canada’s second largest city?","fr":"Quelle est la deuxième ville la plus populeuse du Canada?"},"options":{"en":["Vancouver","Ottawa","Montreal","Calgary"],"fr":["Vancouver","Ottawa","Montréal","Calgary"]},"answer":2},{"type":"mc","q":{"en":"Montreal is the second largest mainly French-speaking city in the world after which city?","fr":"Montréal est la deuxième plus grande ville à population principalement francophone du monde après quelle ville?"},"options":{"en":["Québec City","Brussels","Paris","Geneva"],"fr":["Québec","Bruxelles","Paris","Genève"]},"answer":2}]},{"id":"regions-038","topic":"ontario","importance":3,"en":"At more than 12 million, the people of Ontario make up more than one-third of Canadians.","en_simple":"Ontario has more than 12 million people. That is more than 1/3 of all Canadians.","fr":"Avec plus de 12 millions d’habitants, l’Ontario compte plus d’un tiers de la population canadienne.","tr":{"ar":"يشكّل سكان أونتاريو، البالغ عددهم أكثر من 12 مليون نسمة، أكثر من ثلث الكنديين."},"questions":[{"type":"mc","q":{"en":"Which province has the largest population in Canada?","fr":"Quelle province a la plus grande population au Canada?"},"options":{"en":["Quebec","Ontario","British Columbia","Alberta"],"fr":["Le Québec","L’Ontario","La Colombie-Britannique","L’Alberta"]},"answer":1},{"type":"mc","q":{"en":"What proportion of Canadians live in Ontario?","fr":"Quelle proportion des Canadiens vivent en Ontario?"},"options":{"en":["More than one-tenth","More than one-quarter","More than one-third","More than one-half"],"fr":["Plus d’un dixième","Plus d’un quart","Plus d’un tiers","Plus de la moitié"]},"answer":2}]},{"id":"regions-039","topic":"ontario","importance":3,"en":"Toronto is the largest city in Canada and the country’s main financial centre. Many people work in the service or manufacturing industries, which produce a large percentage of Canada’s exports.","en_simple":"Toronto is the largest city in Canada and its main financial centre.","fr":"Toronto est la plus importante ville du Canada et le principal centre financier du pays. De nombreuses personnes travaillent dans le secteur des services et dans l’industrie manufacturière, qui produisent un pourcentage considérable des exportations du Canada.","tr":{"ar":"تورونتو هي أكبر مدينة في كندا والمركز المالي الرئيسي للبلاد. ويعمل كثيرون في قطاعي الخدمات والتصنيع اللذين ينتجان نسبة كبيرة من صادرات كندا."},"questions":[{"type":"mc","q":{"en":"What is the largest city in Canada and the country’s main financial centre?","fr":"Quelle est la plus grande ville du Canada et le principal centre financier du pays?"},"options":{"en":["Montreal","Ottawa","Vancouver","Toronto"],"fr":["Montréal","Ottawa","Vancouver","Toronto"]},"answer":3},{"type":"tf","q":{"en":"Ottawa is the largest city in Canada.","fr":"Ottawa est la plus grande ville du Canada."},"answer":false}]},{"id":"regions-040","topic":"ontario","importance":2,"en":"The Niagara region is known for its vineyards, wines and fruit crops. Founded by United Empire Loyalists, Ontario also has the largest French-speaking population outside of Quebec, with a proud history of preserving their language and culture.","en_simple":"The Niagara region in Ontario is known for wine and fruit. Ontario has the largest French-speaking population outside Quebec.","fr":"La région de Niagara est connue pour ses vignobles, ses vins et ses cultures fruitières. On trouve en Ontario, fondée par les loyalistes de l’Empire-Uni, la plus importante population francophone à l’extérieur du Québec, dont l’histoire est jalonnée de luttes pour préserver sa langue et sa culture.","tr":{"ar":"تشتهر منطقة نياغارا (Niagara) بكرومها ونبيذها ومحاصيلها من الفاكهة. وأونتاريو، التي أسسها الموالون للإمبراطورية المتحدة، تضم أيضًا أكبر عدد من الناطقين بالفرنسية خارج كيبيك، ولهم تاريخ مشرّف في الحفاظ على لغتهم وثقافتهم."},"questions":[{"type":"mc","q":{"en":"Which region of Ontario is known for its vineyards, wines and fruit crops?","fr":"Quelle région de l’Ontario est connue pour ses vignobles, ses vins et ses cultures fruitières?"},"options":{"en":["The Okanagan Valley","The Niagara region","The Badlands","The Exchange District"],"fr":["La vallée de l’Okanagan","La région de Niagara","Les badlands","Le quartier Exchange District"]},"answer":1},{"type":"mc","q":{"en":"Which province has the largest French-speaking population outside of Quebec?","fr":"Quelle province compte la plus importante population francophone à l’extérieur du Québec?"},"options":{"en":["New Brunswick","Manitoba","Ontario","Nova Scotia"],"fr":["Le Nouveau-Brunswick","Le Manitoba","L’Ontario","La Nouvelle-Écosse"]},"answer":2}]},{"id":"regions-041","topic":"great-lakes","importance":3,"en":"There are five Great Lakes located between Ontario and the United States: Lake Ontario, Lake Erie, Lake Huron, Lake Michigan (in the U.S.A.) and Lake Superior, the largest freshwater lake in the world.","en_simple":"The 5 Great Lakes: Ontario, Erie, Huron, Michigan (in the USA) and Superior. Lake Superior is the largest freshwater lake in the world.","fr":"Les cinq Grands Lacs se situent entre l’Ontario et les États-Unis; il s’agit du lac Ontario, du lac Érié, du lac Huron, du lac Michigan (aux États-Unis) et du lac Supérieur, le plus grand lac d’eau douce au monde.","tr":{"ar":"توجد خمس بحيرات عظمى بين أونتاريو والولايات المتحدة: بحيرة أونتاريو، وبحيرة إيري، وبحيرة هورون، وبحيرة ميشيغان (في الولايات المتحدة)، وبحيرة سوبيريور (Lake Superior) وهي أكبر بحيرة للمياه العذبة في العالم."},"questions":[{"type":"mc","q":{"en":"Name the five Great Lakes.","fr":"Nommez les cinq Grands Lacs."},"options":{"en":["Ontario, Erie, Huron, Michigan and Superior","Ontario, Erie, Winnipeg, Louise and Superior","Ontario, Huron, Michigan, Champlain and Superior","Erie, Huron, Michigan, Superior and Great Bear"],"fr":["Ontario, Érié, Huron, Michigan et Supérieur","Ontario, Érié, Winnipeg, Louise et Supérieur","Ontario, Huron, Michigan, Champlain et Supérieur","Érié, Huron, Michigan, Supérieur et Grand lac de l’Ours"]},"answer":0},{"type":"mc","q":{"en":"Which is the largest freshwater lake in the world?","fr":"Quel est le plus grand lac d’eau douce au monde?"},"options":{"en":["Lake Ontario","Lake Michigan","Lake Huron","Lake Superior"],"fr":["Le lac Ontario","Le lac Michigan","Le lac Huron","Le lac Supérieur"]},"answer":3},{"type":"mc","q":{"en":"Which of the Great Lakes is located entirely in the United States?","fr":"Lequel des Grands Lacs est situé entièrement aux États-Unis?"},"options":{"en":["Lake Erie","Lake Michigan","Lake Huron","Lake Ontario"],"fr":["Le lac Érié","Le lac Michigan","Le lac Huron","Le lac Ontario"]},"answer":1}]},{"id":"regions-042","topic":"prairies","importance":2,"en":"Manitoba, Saskatchewan and Alberta are the Prairie Provinces, rich in energy resources and some of the most fertile farmland in the world. The region is mostly dry, with cold winters and hot summers.","en_simple":"The Prairie Provinces (Manitoba, Saskatchewan, Alberta) have energy resources and very fertile farmland. The climate is mostly dry, with cold winters and hot summers.","fr":"Le Manitoba, la Saskatchewan et l’Alberta, qu’on appelle les provinces des Prairies, possèdent d’immenses ressources énergétiques et leurs terres agricoles sont parmi les plus fertiles du monde. La région est essentiellement sèche, avec des hivers froids et des étés chauds.","tr":{"ar":"مانيتوبا وساسكاتشوان وألبرتا هي مقاطعات البراري، الغنية بموارد الطاقة وببعض أخصب الأراضي الزراعية في العالم. والمنطقة جافة في معظمها، بشتاء بارد وصيف حار."},"questions":[{"type":"mc","q":{"en":"What is the climate of the Prairie Provinces?","fr":"Quel est le climat des provinces des Prairies?"},"options":{"en":["Mostly dry, with cold winters and hot summers","Cool winters and cool humid summers","Temperate all year","Long cold winters and short cool summers"],"fr":["Essentiellement sec, avec des hivers froids et des étés chauds","Des hivers frais et des étés frais et humides","Tempéré toute l’année","De longs hivers froids et de courts étés frais"]},"answer":0},{"type":"tf","q":{"en":"The Prairie Provinces have some of the most fertile farmland in the world.","fr":"Les terres agricoles des provinces des Prairies sont parmi les plus fertiles du monde."},"answer":true}]},{"id":"regions-043","topic":"manitoba","importance":2,"en":"Manitoba’s economy is based on agriculture, mining and hydro-electric power generation. The province’s most populous city is Winnipeg, whose Exchange District includes the most famous street intersection in Canada, Portage and Main.","en_simple":"Manitoba's economy: agriculture, mining and hydro-electric power. Winnipeg is its biggest city. Portage and Main in Winnipeg is the most famous street intersection in Canada.","fr":"L’économie du Manitoba s’appuie sur l’agriculture, l’exploitation minière et la production d’hydroélectricité. Winnipeg est la ville la plus peuplée de la province. C’est dans le quartier Exchange District de Winnipeg qu’on trouve l’intersection la plus célèbre du Canada : l’angle de l’avenue Portage et de la rue Main.","tr":{"ar":"يقوم اقتصاد مانيتوبا على الزراعة والتعدين وتوليد الطاقة الكهرومائية. وأكثر مدن المقاطعة سكانًا هي وينيبيغ، التي يضم حي إكستشينج فيها أشهر تقاطع شوارع في كندا، وهو تقاطع بورتاج وماين (Portage and Main)."},"questions":[{"type":"mc","q":{"en":"Where is Portage and Main, the most famous street intersection in Canada?","fr":"Où se trouve l’angle de Portage et Main, l’intersection la plus célèbre du Canada?"},"options":{"en":["Toronto","Winnipeg","Regina","Edmonton"],"fr":["Toronto","Winnipeg","Regina","Edmonton"]},"answer":1},{"type":"mc","q":{"en":"Manitoba’s economy is based on which three sectors?","fr":"L’économie du Manitoba s’appuie sur quels trois secteurs?"},"options":{"en":["Fishing, shipbuilding and tourism","Agriculture, mining and hydro-electric power","Oil sands, cattle and forestry","Pharmaceuticals, aeronautics and film"],"fr":["La pêche, la construction navale et le tourisme","L’agriculture, l’exploitation minière et l’hydroélectricité","Les sables bitumineux, l’élevage bovin et la foresterie","L’industrie pharmaceutique, l’aéronautique et le cinéma"]},"answer":1}]},{"id":"regions-044","topic":"manitoba","importance":3,"en":"Winnipeg’s French Quarter, St. Boniface, has Western Canada’s largest Francophone community at 45,000.","en_simple":"St. Boniface is Winnipeg's French Quarter. It has 45,000 people, the largest Francophone community in Western Canada.","fr":"Quant au quartier francophone de Winnipeg, Saint-Boniface, ses 45 000 habitants en font la plus grande communauté francophone de l’Ouest du Canada.","tr":{"ar":"يضم الحي الفرنسي في وينيبيغ، سان بونيفاس (St. Boniface)، أكبر مجتمع فرنكوفوني في غرب كندا بعدد 45,000 نسمة."},"questions":[{"type":"mc","q":{"en":"Where is Western Canada’s largest Francophone community?","fr":"Où se trouve la plus grande communauté francophone de l’Ouest du Canada?"},"options":{"en":["Moncton, New Brunswick","St. Boniface, Winnipeg","Victoria, British Columbia","Saskatoon, Saskatchewan"],"fr":["Moncton, au Nouveau-Brunswick","Saint-Boniface, à Winnipeg","Victoria, en Colombie-Britannique","Saskatoon, en Saskatchewan"]},"answer":1},{"type":"mc","q":{"en":"How many people live in St. Boniface’s Francophone community?","fr":"Combien de personnes compte la communauté francophone de Saint-Boniface?"},"options":{"en":["4,500","20,000","45,000","100,000"],"fr":["4 500","20 000","45 000","100 000"]},"answer":2}]},{"id":"regions-045","topic":"manitoba","importance":3,"en":"Manitoba is also an important centre of Ukrainian culture, with 14% reporting Ukrainian origins, and the largest Aboriginal population of any province, at over 15%.","en_simple":"In Manitoba, 14% of people have Ukrainian origins. Manitoba has the largest Aboriginal population of any province: more than 15%.","fr":"Le Manitoba est aussi une importante plaque tournante de la culture ukrainienne, 14 pour 100 de ses habitants étant d’origine ukrainienne, et il compte la plus grande proportion d’Autochtones de toutes les provinces, à plus de 15 pour 100 de sa population.","tr":{"ar":"مانيتوبا أيضًا مركز مهم للثقافة الأوكرانية، إذ يعلن 14% من سكانها عن أصول أوكرانية، وفيها أكبر نسبة من السكان الأصليين بين جميع المقاطعات، بأكثر من 15%."},"questions":[{"type":"mc","q":{"en":"Which province has the largest Aboriginal population of any province, at over 15%?","fr":"Quelle province compte la plus grande proportion d’Autochtones de toutes les provinces, à plus de 15 pour 100?"},"options":{"en":["Saskatchewan","British Columbia","Manitoba","Ontario"],"fr":["La Saskatchewan","La Colombie-Britannique","Le Manitoba","L’Ontario"]},"answer":2},{"type":"mc","q":{"en":"Manitoba is an important centre of which culture, with 14% reporting those origins?","fr":"Le Manitoba est une importante plaque tournante de quelle culture, 14 pour 100 de ses habitants déclarant cette origine?"},"options":{"en":["Ukrainian","Chinese","Punjabi","Gaelic"],"fr":["Ukrainienne","Chinoise","Punjabi","Gaélique"]},"answer":0}]},{"id":"regions-046","topic":"saskatchewan","importance":3,"en":"Saskatchewan, once known as the “breadbasket of the world” and the “wheat province,” has 40% of the arable land in Canada and is the country’s largest producer of grains and oilseeds.","en_simple":"Saskatchewan was called the “breadbasket of the world” and the “wheat province.” It has 40% of Canada's arable (farm) land. It is Canada's largest producer of grains and oilseeds.","fr":"La Saskatchewan, autrefois surnommée « le grenier du monde » et « la province du blé », possède 40 pour 100 des terres arables du Canada. Elle est la plus grande productrice de céréales et de plantes oléagineuses du pays.","tr":{"ar":"ساسكاتشوان، التي عُرفت يومًا بـ«سلة خبز العالم» و«مقاطعة القمح»، تمتلك 40% من الأراضي الصالحة للزراعة في كندا، وهي أكبر منتج للحبوب والبذور الزيتية في البلاد."},"questions":[{"type":"mc","q":{"en":"Which province was once known as the “breadbasket of the world” and the “wheat province”?","fr":"Quelle province était autrefois surnommée « le grenier du monde » et « la province du blé »?"},"options":{"en":["Manitoba","Alberta","Saskatchewan","Ontario"],"fr":["Le Manitoba","L’Alberta","La Saskatchewan","L’Ontario"]},"answer":2},{"type":"mc","q":{"en":"What percentage of Canada’s arable land is in Saskatchewan?","fr":"Quel pourcentage des terres arables du Canada se trouve en Saskatchewan?"},"options":{"en":["14%","15%","40%","85%"],"fr":["14 pour 100","15 pour 100","40 pour 100","85 pour 100"]},"answer":2},{"type":"tf","q":{"en":"Saskatchewan is Canada’s largest producer of grains and oilseeds.","fr":"La Saskatchewan est la plus grande productrice de céréales et de plantes oléagineuses du Canada."},"answer":true}]},{"id":"regions-047","topic":"saskatchewan","importance":2,"en":"Saskatchewan also boasts the world’s richest deposits of uranium and potash, used in fertilizer, and produces oil and natural gas.","en_simple":"Saskatchewan has the world's richest deposits of uranium and potash (used in fertilizer). It also produces oil and natural gas.","fr":"Elle renferme également les plus abondants gisements d’uranium et de potasse (utilisée dans les fertilisants) du monde, en plus de produire du pétrole et du gaz naturel.","tr":{"ar":"تفخر ساسكاتشوان أيضًا بأغنى رواسب اليورانيوم والبوتاس (المستخدم في الأسمدة) في العالم، وتنتج النفط والغاز الطبيعي."},"questions":[{"type":"mc","q":{"en":"Which province has the world’s richest deposits of uranium and potash?","fr":"Quelle province renferme les plus abondants gisements d’uranium et de potasse du monde?"},"options":{"en":["Alberta","Saskatchewan","Northwest Territories","Quebec"],"fr":["L’Alberta","La Saskatchewan","Les Territoires du Nord-Ouest","Le Québec"]},"answer":1},{"type":"mc","q":{"en":"What is potash used for?","fr":"À quoi sert la potasse?"},"options":{"en":["Fertilizer","Jewellery","Building bridges","Making paper"],"fr":["Les fertilisants","Les bijoux","La construction de ponts","La fabrication du papier"]},"answer":0}]},{"id":"regions-048","topic":"saskatchewan","importance":3,"en":"Regina, the capital, is home to the training academy of the Royal Canadian Mounted Police. Saskatoon, the largest city, is the headquarters of the mining industry and an important educational, research and technology centre.","en_simple":"Regina (capital of Saskatchewan) has the RCMP training academy. Saskatoon is the largest city in Saskatchewan and the headquarters of the mining industry.","fr":"C’est à Regina, la capitale, que se trouve l’école de la Gendarmerie royale du Canada. Saskatoon, la ville la plus populeuse de la Saskatchewan, accueille les sièges sociaux de compagnies minières et constitue un important centre d’enseignement, de recherche et de technologie.","tr":{"ar":"ريجاينا، العاصمة، هي موطن أكاديمية تدريب شرطة الخيالة الملكية الكندية (RCMP). وساسكاتون (Saskatoon)، أكبر مدينة، هي مقر صناعة التعدين ومركز مهم للتعليم والبحث والتكنولوجيا."},"questions":[{"type":"mc","q":{"en":"Which city is home to the training academy of the Royal Canadian Mounted Police?","fr":"Quelle ville abrite l’école de la Gendarmerie royale du Canada?"},"options":{"en":["Ottawa","Saskatoon","Regina","Winnipeg"],"fr":["Ottawa","Saskatoon","Regina","Winnipeg"]},"answer":2},{"type":"mc","q":{"en":"What is the largest city in Saskatchewan?","fr":"Quelle est la plus grande ville de la Saskatchewan?"},"options":{"en":["Regina","Saskatoon","Moose Jaw","Prince Albert"],"fr":["Regina","Saskatoon","Moose Jaw","Prince Albert"]},"answer":1}]},{"id":"regions-049","topic":"alberta","importance":3,"en":"Alberta is the most populous Prairie province. The province, and the world-famous Lake Louise in the Rocky Mountains, were both named after Princess Louise Caroline Alberta, fourth daughter of Queen Victoria.","en_simple":"Alberta has the biggest population of the Prairie Provinces. Alberta and Lake Louise are named after Princess Louise Caroline Alberta, the 4th daughter of Queen Victoria.","fr":"L’Alberta est la province la plus peuplée des Prairies. Cette province, tout comme le célèbre lac Louise situé dans les montagnes Rocheuses, a été nommée en l’honneur de la princesse Louise Caroline Alberta, quatrième fille de la reine Victoria.","tr":{"ar":"ألبرتا هي أكثر مقاطعات البراري سكانًا. وقد سُميت المقاطعة، وكذلك بحيرة لويز (Lake Louise) الشهيرة عالميًا في جبال الروكي، تيمنًا بالأميرة لويز كارولين ألبرتا (Princess Louise Caroline Alberta)، الابنة الرابعة للملكة فيكتوريا."},"questions":[{"type":"mc","q":{"en":"Which is the most populous Prairie province?","fr":"Quelle est la province des Prairies la plus peuplée?"},"options":{"en":["Manitoba","Saskatchewan","Alberta","British Columbia"],"fr":["Le Manitoba","La Saskatchewan","L’Alberta","La Colombie-Britannique"]},"answer":2},{"type":"mc","q":{"en":"After whom were Alberta and Lake Louise named?","fr":"En l’honneur de qui l’Alberta et le lac Louise ont-ils été nommés?"},"options":{"en":["Queen Victoria","Princess Louise Caroline Alberta, fourth daughter of Queen Victoria","Queen Elizabeth II","Prince Albert, husband of Queen Victoria"],"fr":["La reine Victoria","La princesse Louise Caroline Alberta, quatrième fille de la reine Victoria","La reine Elizabeth II","Le prince Albert, époux de la reine Victoria"]},"answer":1}]},{"id":"regions-050","topic":"alberta","importance":3,"en":"Alberta has five national parks, including Banff National Park, established in 1885. The rugged Badlands house some of the world’s richest deposits of prehistoric fossils and dinosaur finds.","en_simple":"Alberta has 5 national parks. Banff National Park was established in 1885. The Badlands have rich deposits of fossils and dinosaurs.","fr":"L’Alberta compte cinq parcs nationaux, dont le parc national Banff, fondé en 1885. La région sauvage des badlands recèle certains des plus riches gisements de fossiles préhistoriques et de restes de dinosaures du monde.","tr":{"ar":"في ألبرتا خمس حدائق وطنية، منها حديقة بانف الوطنية (Banff National Park) التي أُنشئت عام 1885. وتضم «الأراضي الوعرة» (Badlands) بعضًا من أغنى رواسب الأحافير القديمة واكتشافات الديناصورات في العالم."},"questions":[{"type":"mc","q":{"en":"In what year was Banff National Park established?","fr":"En quelle année le parc national Banff a-t-il été fondé?"},"options":{"en":["1867","1870","1885","1900"],"fr":["1867","1870","1885","1900"]},"answer":2},{"type":"mc","q":{"en":"How many national parks does Alberta have?","fr":"Combien de parcs nationaux l’Alberta compte-t-elle?"},"options":{"en":["Three","Five","Ten","Six hundred"],"fr":["Trois","Cinq","Dix","Six cents"]},"answer":1},{"type":"mc","q":{"en":"Where are some of the world’s richest deposits of prehistoric fossils and dinosaur finds?","fr":"Où trouve-t-on certains des plus riches gisements de fossiles préhistoriques et de restes de dinosaures du monde?"},"options":{"en":["The Alberta Badlands","The Canadian Shield","The Okanagan Valley","The tundra"],"fr":["Les badlands de l’Alberta","Le Bouclier canadien","La vallée de l’Okanagan","La toundra"]},"answer":0}]},{"id":"regions-051","topic":"alberta","importance":3,"en":"Alberta is the largest producer of oil and gas, and the oil sands in the north are being developed as a major energy source. Alberta is also renowned for agriculture, especially for the vast cattle ranches that make Canada one of the world’s major beef producers.","en_simple":"Alberta is Canada's largest producer of oil and gas. The oil sands are in northern Alberta. Alberta's cattle ranches make Canada a major beef producer.","fr":"L’Alberta est la première productrice de pétrole et de gaz du Canada, et les sables bitumineux du nord de la province sont une source énergétique considérable en voie d’exploitation. L’Alberta est également reconnue pour son agriculture, en particulier ses énormes exploitations bovines, qui font du Canada l’un des principaux producteurs bovins du monde.","tr":{"ar":"ألبرتا هي أكبر منتج للنفط والغاز، ويجري تطوير الرمال النفطية في شمالها كمصدر رئيسي للطاقة. وتشتهر ألبرتا أيضًا بالزراعة، وخاصة مزارع الماشية الشاسعة التي تجعل كندا أحد كبار منتجي لحوم البقر في العالم."},"questions":[{"type":"mc","q":{"en":"Which province is Canada’s largest producer of oil and gas?","fr":"Quelle province est la première productrice de pétrole et de gaz du Canada?"},"options":{"en":["Saskatchewan","Newfoundland and Labrador","Alberta","British Columbia"],"fr":["La Saskatchewan","Terre-Neuve-et-Labrador","L’Alberta","La Colombie-Britannique"]},"answer":2},{"type":"mc","q":{"en":"Alberta’s vast cattle ranches make Canada one of the world’s major producers of what?","fr":"Les énormes exploitations bovines de l’Alberta font du Canada l’un des principaux producteurs mondiaux de quoi?"},"options":{"en":["Wheat","Potatoes","Beef","Wine"],"fr":["Blé","Pommes de terre","Viande de boeuf","Vin"]},"answer":2}]},{"id":"regions-052","topic":"west-coast","importance":3,"en":"British Columbia is known for its majestic mountains and as Canada’s Pacific gateway. The Port of Vancouver, Canada’s largest and busiest, handles billions of dollars in goods traded around the world. Warm airstreams from the Pacific Ocean give the B.C. coast a temperate climate.","en_simple":"British Columbia is Canada's Pacific gateway. The Port of Vancouver is Canada's largest and busiest port. The B.C. coast has a temperate (mild) climate.","fr":"La Colombie-Britannique est connue pour ses montagnes majestueuses et à titre de porte d’entrée du Canada dans le Pacifique. Des milliards de dollars de marchandises transitent par le port de Vancouver – le plus grand et le plus fréquenté du Canada – à destination et en provenance de partout dans le monde. Grâce aux courants d’air chaud de l’océan Pacifique, la côte de la Colombie-Britannique bénéficie d’un climat tempéré.","tr":{"ar":"تشتهر كولومبيا البريطانية بجبالها المهيبة وبكونها بوابة كندا على المحيط الهادئ. ويتعامل ميناء فانكوفر (Port of Vancouver)، الأكبر والأكثر ازدحامًا في كندا، مع بضائع بمليارات الدولارات تُتداول حول العالم. وتمنح التيارات الهوائية الدافئة من المحيط الهادئ ساحل كولومبيا البريطانية مناخًا معتدلًا."},"questions":[{"type":"mc","q":{"en":"What is Canada’s largest and busiest port?","fr":"Quel est le port le plus grand et le plus fréquenté du Canada?"},"options":{"en":["The Port of Halifax","The Port of Montreal","The Port of Vancouver","The Port of Saint John"],"fr":["Le port de Halifax","Le port de Montréal","Le port de Vancouver","Le port de Saint John"]},"answer":2},{"type":"mc","q":{"en":"What gives the B.C. coast a temperate climate?","fr":"Qu’est-ce qui donne à la côte de la Colombie-Britannique un climat tempéré?"},"options":{"en":["Warm airstreams from the Pacific Ocean","The Rocky Mountains","The Arctic Ocean","The Great Lakes"],"fr":["Les courants d’air chaud de l’océan Pacifique","Les montagnes Rocheuses","L’océan Arctique","Les Grands Lacs"]},"answer":0}]},{"id":"regions-053","topic":"british-columbia","importance":3,"en":"British Columbia (B.C.), on the Pacific coast, is Canada’s westernmost province, with a population of four million. About one-half of all the goods produced in B.C. are forestry products, including lumber, newsprint, and pulp and paper products—the most valuable forestry industry in Canada.","en_simple":"B.C. is Canada's westernmost province. It has 4 million people. About half of all goods made in B.C. are forestry products. B.C. has the most valuable forestry industry in Canada.","fr":"La Colombie-Britannique, sur la côte du Pacifique, est la province canadienne située le plus à l’ouest. Sa population est de quatre millions d’habitants. Environ la moitié de tous les biens produits en Colombie-Britannique proviennent de la foresterie, notamment le bois de sciage, le papier journal et les produits des pâtes et papiers – l’industrie forestière la plus importante du Canada.","tr":{"ar":"كولومبيا البريطانية، على ساحل المحيط الهادئ، هي أقصى مقاطعة غربية في كندا، ويبلغ عدد سكانها 4 ملايين نسمة. ونحو نصف جميع السلع المنتجة فيها منتجات غابات، منها الخشب وورق الصحف ومنتجات اللب والورق، وهي أثمن صناعة غابات في كندا."},"questions":[{"type":"mc","q":{"en":"What is the approximate population of British Columbia?","fr":"Quelle est la population approximative de la Colombie-Britannique?"},"options":{"en":["1 million","4 million","8 million","12 million"],"fr":["1 million","4 millions","8 millions","12 millions"]},"answer":1},{"type":"mc","q":{"en":"About one-half of all goods produced in British Columbia come from which industry?","fr":"Environ la moitié de tous les biens produits en Colombie-Britannique proviennent de quelle industrie?"},"options":{"en":["Mining","Fishing","Forestry","Oil and gas"],"fr":["L’exploitation minière","La pêche","La foresterie","Le pétrole et le gaz"]},"answer":2}]},{"id":"regions-054","topic":"british-columbia","importance":2,"en":"B.C. is also known for mining, fishing, and the fruit orchards and wine industry of the Okanagan Valley. B.C. has the most extensive park system in Canada, with approximately 600 provincial parks. The province’s large Asian communities have made Chinese and Punjabi the most spoken languages in the cities after English.","en_simple":"The Okanagan Valley in B.C. is known for fruit orchards and wine. B.C. has about 600 provincial parks, the most in Canada. After English, Chinese and Punjabi are the most spoken languages in B.C. cities.","fr":"La Colombie-Britannique est également connue pour son industrie minière, son industrie de la pêche ainsi que les vergers et l’industrie vinicole de la vallée de l’Okanagan. Elle possède environ 600 parcs provinciaux, formant le plus vaste réseau de parcs au Canada. En raison de la grande taille des communautés asiatiques établies dans la province, les langues les plus parlées dans les villes après l’anglais sont le chinois et le punjabi.","tr":{"ar":"تشتهر كولومبيا البريطانية أيضًا بالتعدين وصيد الأسماك وبساتين الفاكهة وصناعة النبيذ في وادي أوكاناغان (Okanagan Valley). ولديها أوسع نظام حدائق في كندا بنحو 600 حديقة إقليمية. وقد جعلت الجاليات الآسيوية الكبيرة فيها الصينية والبنجابية أكثر اللغات تحدثًا في المدن بعد الإنجليزية."},"questions":[{"type":"mc","q":{"en":"Which valley in British Columbia is known for its fruit orchards and wine industry?","fr":"Quelle vallée de la Colombie-Britannique est connue pour ses vergers et son industrie vinicole?"},"options":{"en":["The Fraser Valley","The Niagara region","The Okanagan Valley","The Annapolis Valley"],"fr":["La vallée du Fraser","La région de Niagara","La vallée de l’Okanagan","La vallée de l’Annapolis"]},"answer":2},{"type":"mc","q":{"en":"Approximately how many provincial parks does British Columbia have?","fr":"Environ combien de parcs provinciaux la Colombie-Britannique possède-t-elle?"},"options":{"en":["5","60","600","6,000"],"fr":["5","60","600","6 000"]},"answer":2},{"type":"mc","q":{"en":"After English, which are the most spoken languages in British Columbia’s cities?","fr":"Après l’anglais, quelles sont les langues les plus parlées dans les villes de la Colombie-Britannique?"},"options":{"en":["French and Ukrainian","Chinese and Punjabi","Gaelic and Inuktitut","Spanish and German"],"fr":["Le français et l’ukrainien","Le chinois et le punjabi","Le gaélique et l’inuktitut","L’espagnol et l’allemand"]},"answer":1}]},{"id":"regions-055","topic":"british-columbia","importance":3,"en":"The capital of British Columbia, Victoria, is a tourist centre and headquarters of the navy’s Pacific fleet.","en_simple":"Victoria is the capital of B.C. It is a tourist centre and the headquarters of the navy's Pacific fleet.","fr":"La capitale, Victoria, est un centre touristique et sert de port d’attache à la flotte du Pacifique de la Marine canadienne.","tr":{"ar":"فيكتوريا، عاصمة كولومبيا البريطانية، مركز سياحي ومقر أسطول المحيط الهادئ التابع للبحرية."},"questions":[{"type":"mc","q":{"en":"Which city is the headquarters of the navy’s Pacific fleet?","fr":"Quelle ville sert de port d’attache à la flotte du Pacifique de la Marine?"},"options":{"en":["Vancouver","Victoria","Halifax","Prince Rupert"],"fr":["Vancouver","Victoria","Halifax","Prince Rupert"]},"answer":1}]},{"id":"regions-056","topic":"north","importance":3,"en":"The Northwest Territories, Nunavut and Yukon contain one-third of Canada’s land mass but have a population of only 100,000. There are gold, lead, copper, diamond and zinc mines. Oil and gas deposits are being developed.","en_simple":"The 3 territories cover 1/3 of Canada's land but have only 100,000 people. They have gold, lead, copper, diamond and zinc mines.","fr":"Les Territoires du Nord-Ouest, le Nunavut et le Yukon occupent le tiers de la masse terrestre du Canada; pourtant, leur population n’est que de 100 000 habitants. On y trouve des mines d’or, de plomb, de cuivre, de diamants et de zinc, et des gisements de pétrole et de gaz sont en voie d’exploitation.","tr":{"ar":"تشكّل الأقاليم الشمالية الغربية ونونافوت ويوكون ثلث مساحة كندا، لكن عدد سكانها لا يتجاوز 100,000 نسمة. وفيها مناجم للذهب والرصاص والنحاس والماس والزنك، ويجري تطوير رواسب النفط والغاز."},"questions":[{"type":"mc","q":{"en":"What fraction of Canada’s land mass do the three territories contain?","fr":"Quelle fraction de la masse terrestre du Canada les trois territoires occupent-ils?"},"options":{"en":["One-tenth","One-quarter","One-third","One-half"],"fr":["Un dixième","Un quart","Un tiers","La moitié"]},"answer":2},{"type":"mc","q":{"en":"What is the total population of the three northern territories?","fr":"Quelle est la population totale des trois territoires du Nord?"},"options":{"en":["About 20,000","About 100,000","About 1 million","About 4 million"],"fr":["Environ 20 000","Environ 100 000","Environ 1 million","Environ 4 millions"]},"answer":1},{"type":"mc","q":{"en":"Which of the following minerals is mined in Canada’s North, according to the guide?","fr":"Lequel des minéraux suivants est extrait dans le Nord du Canada, selon le guide?"},"options":{"en":["Potash","Uranium","Diamond","Coal"],"fr":["La potasse","L’uranium","Le diamant","Le charbon"]},"answer":2}]},{"id":"regions-057","topic":"north","importance":3,"en":"The North is often referred to as the “Land of the Midnight Sun” because at the height of summer, daylight can last up to 24 hours. In winter, the sun disappears and darkness sets in for three months. The Northern territories have long cold winters and short cool summers.","en_simple":"The North is called the “Land of the Midnight Sun.” In summer, daylight can last 24 hours. In winter, it is dark for 3 months. Winters are long and cold; summers are short and cool.","fr":"Le Nord est souvent appelé « la terre du soleil de minuit » : au milieu de l’été, le soleil peut briller jusqu’à 24 heures consécutives, tandis qu’en hiver, il disparaît et l’obscurité règne pendant trois mois. Les territoires du Nord ont de longs hivers froids et de courts étés frais.","tr":{"ar":"يُشار إلى الشمال غالبًا باسم «أرض شمس منتصف الليل» لأن ضوء النهار في ذروة الصيف قد يستمر حتى 24 ساعة. وفي الشتاء تختفي الشمس ويحل الظلام لمدة ثلاثة أشهر. وللأقاليم الشمالية شتاء طويل بارد وصيف قصير بارد."},"questions":[{"type":"mc","q":{"en":"Why is the North called the “Land of the Midnight Sun”?","fr":"Pourquoi le Nord est-il appelé « la terre du soleil de minuit »?"},"options":{"en":["Because the sun never sets in winter","Because at the height of summer daylight can last up to 24 hours","Because the sun is red at midnight","Because it is always dark"],"fr":["Parce que le soleil ne se couche jamais en hiver","Parce qu’au milieu de l’été, le soleil peut briller jusqu’à 24 heures consécutives","Parce que le soleil est rouge à minuit","Parce qu’il y fait toujours noir"]},"answer":1},{"type":"mc","q":{"en":"In the North, how long does darkness last in winter?","fr":"Dans le Nord, combien de temps dure l’obscurité en hiver?"},"options":{"en":["One week","One month","Three months","Six months"],"fr":["Une semaine","Un mois","Trois mois","Six mois"]},"answer":2}]},{"id":"regions-058","topic":"north","importance":2,"en":"Much of the North is made up of tundra, the vast rocky Arctic plain. Because of the cold Arctic climate, there are no trees on the tundra and the soil is permanently frozen. Some continue to earn a living by hunting, fishing and trapping. Inuit art is sold throughout Canada and around the world.","en_simple":"Much of the North is tundra: a vast, rocky Arctic plain with no trees and permanently frozen soil. Some people live by hunting, fishing and trapping. Inuit art is sold around the world.","fr":"La plus grande partie des territoires du Nord a pour toile de fond la toundra, vaste plaine arctique rocailleuse. En raison du climat froid de l’Arctique, la toundra est dépourvue d’arbres et le sol est constamment gelé. Certains habitants du Nord tirent encore leur subsistance de la chasse, de la pêche et de la trappe. Les objets d’art inuit sont vendus partout au Canada et dans le monde.","tr":{"ar":"يتكوّن معظم الشمال من التندرا، وهي السهل القطبي الصخري الشاسع. وبسبب مناخ القطب الشمالي البارد، لا توجد أشجار على التندرا وتربتها متجمدة بشكل دائم. ولا يزال بعض السكان يكسبون رزقهم من الصيد وصيد الأسماك ونصب الفخاخ. ويُباع فن الإنويت (Inuit) في جميع أنحاء كندا وحول العالم."},"questions":[{"type":"mc","q":{"en":"What is the tundra?","fr":"Qu’est-ce que la toundra?"},"options":{"en":["A vast rocky Arctic plain with no trees and permanently frozen soil","A mountain range in the Yukon","A forest region in northern Quebec","A river system in the Northwest Territories"],"fr":["Une vaste plaine arctique rocailleuse sans arbres et au sol constamment gelé","Une chaîne de montagnes au Yukon","Une région forestière du nord du Québec","Un réseau hydrographique des Territoires du Nord-Ouest"]},"answer":0},{"type":"tf","q":{"en":"There are no trees on the tundra and the soil is permanently frozen.","fr":"La toundra est dépourvue d’arbres et son sol est constamment gelé."},"answer":true}]},{"id":"regions-059","topic":"yukon","importance":3,"en":"Thousands of miners came to the Yukon during the Gold Rush of the 1890s, as celebrated in the poetry of Robert W. Service. Mining remains a significant part of the economy.","en_simple":"In the 1890s, thousands of miners came to the Yukon for the Gold Rush. The poet Robert W. Service wrote about it. Mining is still important in the Yukon.","fr":"Les milliers de mineurs qui se sont rendus au Yukon au cours de la ruée vers l’or des années 1890 sont célébrés dans la poésie de Robert W. Service. Les mines continuent d’ailleurs d’occuper une grande place dans l’économie du Yukon.","tr":{"ar":"توافد آلاف عمال المناجم على يوكون خلال حمى الذهب في تسعينيات القرن التاسع عشر، كما خلّدها شعر روبرت و. سيرفيس (Robert W. Service). ولا يزال التعدين جزءًا مهمًا من الاقتصاد."},"questions":[{"type":"mc","q":{"en":"When did the Yukon Gold Rush take place?","fr":"Quand a eu lieu la ruée vers l’or du Yukon?"},"options":{"en":["The 1850s","The 1870s","The 1890s","The 1920s"],"fr":["Les années 1850","Les années 1870","Les années 1890","Les années 1920"]},"answer":2},{"type":"mc","q":{"en":"Which poet celebrated the Yukon Gold Rush?","fr":"Quel poète a célébré la ruée vers l’or du Yukon?"},"options":{"en":["Lucy Maud Montgomery","Robert W. Service","Sir William Logan","Martin Frobisher"],"fr":["Lucy Maud Montgomery","Robert W. Service","Sir William Logan","Martin Frobisher"]},"answer":1}]},{"id":"regions-060","topic":"yukon","importance":3,"en":"The White Pass and Yukon Railway opened from Skagway in neighbouring Alaska to the territorial capital, Whitehorse in 1900 and provides a spectacular tourist excursion across precipitous passes and bridges. Yukon holds the record for the coldest temperature ever recorded in Canada (-63°C).","en_simple":"The White Pass and Yukon Railway opened in 1900. It runs from Skagway, Alaska to Whitehorse. The Yukon has the record for the coldest temperature in Canada: -63°C.","fr":"Le chemin de fer White Pass and Yukon, qui, à son ouverture en 1900, reliait Skagway – ville de l’État américain voisin, l’Alaska – à la capitale territoriale de Whitehorse, permet une excursion touristique spectaculaire parsemée de cols escarpés et de ponts vertigineux. Le Yukon détient le record de la température la plus froide jamais enregistrée au Canada (-63 °C).","tr":{"ar":"افتُتح خط سكة حديد وايت باس ويوكون (White Pass and Yukon Railway) عام 1900 من سكاغواي في ألاسكا المجاورة إلى عاصمة الإقليم وايتهورس، وهو يوفر رحلة سياحية مذهلة عبر ممرات وجسور شديدة الانحدار. ويحمل يوكون الرقم القياسي لأبرد درجة حرارة سُجلت في كندا (-63 درجة مئوية)."},"questions":[{"type":"mc","q":{"en":"In what year did the White Pass and Yukon Railway open?","fr":"En quelle année le chemin de fer White Pass and Yukon a-t-il été ouvert?"},"options":{"en":["1870","1885","1900","1999"],"fr":["1870","1885","1900","1999"]},"answer":2},{"type":"mc","q":{"en":"Which territory holds the record for the coldest temperature ever recorded in Canada (-63°C)?","fr":"Quel territoire détient le record de la température la plus froide jamais enregistrée au Canada (-63 °C)?"},"options":{"en":["Nunavut","Northwest Territories","Yukon","Labrador"],"fr":["Le Nunavut","Les Territoires du Nord-Ouest","Le Yukon","Le Labrador"]},"answer":2},{"type":"mc","q":{"en":"The White Pass and Yukon Railway connects Whitehorse to which town in Alaska?","fr":"Le chemin de fer White Pass and Yukon relie Whitehorse à quelle ville de l’Alaska?"},"options":{"en":["Juneau","Anchorage","Skagway","Resolute"],"fr":["Juneau","Anchorage","Skagway","Resolute"]},"answer":2}]},{"id":"regions-061","topic":"yukon","importance":2,"en":"Mount Logan, located in the Yukon, is the highest mountain in Canada. It is named in honour of Sir William Logan, a world-famous geologist, born in Montreal in 1798, who founded and directed the Geological Survey of Canada from 1842 to 1869.","en_simple":"Mount Logan in the Yukon is the highest mountain in Canada. It is named after Sir William Logan, a famous geologist who founded the Geological Survey of Canada.","fr":"Le mont Logan, situé au Yukon, est la plus haute montagne du Canada. Il est ainsi nommé en l’honneur de sir William Logan, un géologue de renommée mondiale, qui est né à Montréal en 1798 de parents immigrants écossais. M. Logan a fondé et dirigé la Commission géologique du Canada de 1842 à 1869, et il est considéré comme l’un des plus grands scientifiques du Canada.","tr":{"ar":"جبل لوغان (Mount Logan)، الواقع في يوكون، هو أعلى جبل في كندا. وقد سُمي تكريمًا للسير ويليام لوغان (Sir William Logan)، الجيولوجي ذي الشهرة العالمية، المولود في مونتريال عام 1798، الذي أسس هيئة المسح الجيولوجي الكندية وأدارها من 1842 إلى 1869."},"questions":[{"type":"mc","q":{"en":"What is the highest mountain in Canada?","fr":"Quelle est la plus haute montagne du Canada?"},"options":{"en":["Mount Robson","Mount Logan","Mount Royal","Mount Columbia"],"fr":["Le mont Robson","Le mont Logan","Le mont Royal","Le mont Columbia"]},"answer":1},{"type":"mc","q":{"en":"In which territory is Mount Logan located?","fr":"Dans quel territoire se trouve le mont Logan?"},"options":{"en":["Nunavut","Northwest Territories","Yukon","British Columbia"],"fr":["Le Nunavut","Les Territoires du Nord-Ouest","Le Yukon","La Colombie-Britannique"]},"answer":2},{"type":"mc","q":{"en":"Who was Sir William Logan?","fr":"Qui était sir William Logan?"},"options":{"en":["A world-famous geologist who founded the Geological Survey of Canada","A Gold Rush poet","An English explorer of the Arctic","The first premier of Yukon"],"fr":["Un géologue de renommée mondiale qui a fondé la Commission géologique du Canada","Un poète de la ruée vers l’or","Un explorateur anglais de l’Arctique","Le premier premier ministre du Yukon"]},"answer":0}]},{"id":"regions-062","topic":"northwest-territories","importance":3,"en":"The Northwest Territories (N.W.T.) were originally made up in 1870 from Rupert’s Land and the North-Western Territory. The capital, Yellowknife (population 20,000), is called the “diamond capital of North America.”","en_simple":"The Northwest Territories were created in 1870 from Rupert's Land and the North-Western Territory. Yellowknife (20,000 people) is called the “diamond capital of North America.”","fr":"En 1870, les Territoires du Nord-Ouest (T.N.-O.) ont été formés à partir de la Terre de Rupert et du Territoire du Nord-Ouest. La capitale, Yellowknife (20 000 habitants), est surnommée « capitale nord-américaine du diamant ».","tr":{"ar":"تشكّلت الأقاليم الشمالية الغربية في الأصل عام 1870 من أرض روبرت (Rupert’s Land) والإقليم الشمالي الغربي. وتُسمى العاصمة يلونايف (20,000 نسمة) «عاصمة الماس في أمريكا الشمالية»."},"questions":[{"type":"mc","q":{"en":"In what year were the Northwest Territories originally made up from Rupert’s Land and the North-Western Territory?","fr":"En quelle année les Territoires du Nord-Ouest ont-ils été formés à partir de la Terre de Rupert et du Territoire du Nord-Ouest?"},"options":{"en":["1867","1870","1885","1999"],"fr":["1867","1870","1885","1999"]},"answer":1},{"type":"mc","q":{"en":"Which city is called the “diamond capital of North America”?","fr":"Quelle ville est surnommée « capitale nord-américaine du diamant »?"},"options":{"en":["Whitehorse","Iqaluit","Yellowknife","Saskatoon"],"fr":["Whitehorse","Iqaluit","Yellowknife","Saskatoon"]},"answer":2}]},{"id":"regions-063","topic":"northwest-territories","importance":3,"en":"More than half the population of the Northwest Territories is Aboriginal (Dene, Inuit and Métis). The Mackenzie River, at 4,200 kilometres, is the second-longest river system in North America after the Mississippi and drains an area of 1.8 million square kilometres.","en_simple":"More than half of the people in the N.W.T. are Aboriginal (Dene, Inuit and Métis). The Mackenzie River is 4,200 km long. It is the 2nd longest river system in North America, after the Mississippi.","fr":"Plus de la moitié de la population est autochtone (Dénés, Inuits et Métis). À 4 200 kilomètres de longueur, le fleuve Mackenzie n’est surpassé en Amérique du Nord que par le Mississippi sur le plan de l’étendue, et son bassin hydrographique couvre plus de 1,8 million de kilomètres carrés.","tr":{"ar":"أكثر من نصف سكان الأقاليم الشمالية الغربية من السكان الأصليين (الدينيه والإنويت والميتيس). ونهر ماكنزي (Mackenzie River)، بطول 4,200 كيلومتر، هو ثاني أطول نظام نهري في أمريكا الشمالية بعد المسيسيبي، ويصرّف مساحة 1.8 مليون كيلومتر مربع."},"questions":[{"type":"mc","q":{"en":"What is the second-longest river system in North America?","fr":"Quel est le deuxième réseau hydrographique en importance de l’Amérique du Nord?"},"options":{"en":["The St. Lawrence River","The Mackenzie River","The Fraser River","The St. John River"],"fr":["Le fleuve Saint-Laurent","Le fleuve Mackenzie","Le fleuve Fraser","La rivière Saint-Jean"]},"answer":1},{"type":"mc","q":{"en":"How long is the Mackenzie River?","fr":"Quelle est la longueur du fleuve Mackenzie?"},"options":{"en":["1,800 kilometres","2,400 kilometres","4,200 kilometres","4,700 kilometres"],"fr":["1 800 kilomètres","2 400 kilomètres","4 200 kilomètres","4 700 kilomètres"]},"answer":2},{"type":"tf","q":{"en":"More than half the population of the Northwest Territories is Aboriginal.","fr":"Plus de la moitié de la population des Territoires du Nord-Ouest est autochtone."},"answer":true}]},{"id":"regions-064","topic":"nunavut","importance":3,"en":"Nunavut, meaning “our land” in Inuktitut, was established in 1999 from the eastern part of the Northwest Territories, including all of the former District of Keewatin.","en_simple":"Nunavut means “our land” in Inuktitut. It was created in 1999 from the eastern part of the Northwest Territories.","fr":"Le Nunavut (mot signifiant « notre terre » en inuktitut) a été créé en 1999 à partir de la section est des Territoires du Nord-Ouest, y compris tout l’ancien district de Keewatin.","tr":{"ar":"نونافوت، ومعناها «أرضنا» بلغة الإنوكتيتوت (Inuktitut)، أُنشئ عام 1999 من الجزء الشرقي للأقاليم الشمالية الغربية، بما في ذلك كامل مقاطعة كيواتين السابقة."},"questions":[{"type":"mc","q":{"en":"What does “Nunavut” mean in Inuktitut?","fr":"Que signifie « Nunavut » en inuktitut?"},"options":{"en":["Our land","Land of the Midnight Sun","The frozen north","Big water"],"fr":["Notre terre","La terre du soleil de minuit","Le nord gelé","Grande eau"]},"answer":0},{"type":"mc","q":{"en":"In what year was Nunavut established?","fr":"En quelle année le Nunavut a-t-il été créé?"},"options":{"en":["1870","1949","1982","1999"],"fr":["1870","1949","1982","1999"]},"answer":3},{"type":"mc","q":{"en":"Nunavut was created from the eastern part of which territory?","fr":"Le Nunavut a été créé à partir de la section est de quel territoire?"},"options":{"en":["Yukon","The Northwest Territories","Labrador","Rupert’s Land"],"fr":["Le Yukon","Les Territoires du Nord-Ouest","Le Labrador","La Terre de Rupert"]},"answer":1}]},{"id":"regions-065","topic":"nunavut","importance":3,"en":"The capital of Nunavut is Iqaluit, formerly Frobisher Bay, named after the English explorer Martin Frobisher, who penetrated the uncharted Arctic for Queen Elizabeth I in 1576.","en_simple":"Iqaluit, the capital of Nunavut, was formerly called Frobisher Bay. It was named after the English explorer Martin Frobisher, who explored the Arctic for Queen Elizabeth I in 1576.","fr":"La capitale, Iqaluit, s’appelait autrefois Frobisher Bay en l’honneur de l’explorateur anglais Martin Frobisher, qui, au nom de la reine Elizabeth 1re, s’est aventuré en 1576 dans cette région non cartographiée qu’était alors l’Arctique.","tr":{"ar":"عاصمة نونافوت هي إيكالويت، التي كانت تُسمى سابقًا خليج فروبيشر (Frobisher Bay)، تيمنًا بالمستكشف الإنجليزي مارتن فروبيشر (Martin Frobisher) الذي توغّل في القطب الشمالي غير المرسوم على الخرائط من أجل الملكة إليزابيث الأولى عام 1576."},"questions":[{"type":"mc","q":{"en":"What was the former name of Iqaluit?","fr":"Quel était l’ancien nom d’Iqaluit?"},"options":{"en":["K
