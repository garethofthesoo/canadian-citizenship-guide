sent-day Saskatchewan led to Riel’s trial and execution for high treason, a decision that was strongly opposed in Quebec. Riel is seen by many as a hero, a defender of Métis rights and the father of Manitoba.","en_simple":"In 1885, a second rebellion in Saskatchewan led to Riel's trial and execution for high treason. Quebec strongly opposed this. Many see Riel as a hero and the father of Manitoba.","fr":"En 1885, une deuxième révolte dans l’actuelle Saskatchewan mène au procès de Riel et à son exécution pour haute trahison, jugement auquel s’oppose fermement le Québec. Beaucoup voient en Riel un héros, un défenseur des droits des Métis et le père du Manitoba.","tr":{"ar":"أدى تمرد ثانٍ عام 1885 في ما يُعرف اليوم بساسكاتشوان إلى محاكمة رييل وإعدامه بتهمة الخيانة العظمى، وهو قرار عارضته كيبيك بشدة. ويرى كثيرون في رييل بطلًا ومدافعًا عن حقوق الميتيس وأبًا لمانيتوبا."},"questions":[{"type":"mc","q":{"en":"In what year did the second Métis rebellion, which led to Riel’s execution, take place?","fr":"En quelle année a eu lieu la deuxième révolte des Métis, qui a mené à l’exécution de Riel?"},"options":{"en":["1869","1870","1873","1885"],"fr":["1869","1870","1873","1885"]},"answer":3},{"type":"mc","q":{"en":"Louis Riel is seen by many as the father of which province?","fr":"Beaucoup voient en Louis Riel le père de quelle province?"},"options":{"en":["Manitoba","Saskatchewan","Alberta","Quebec"],"fr":["Le Manitoba","La Saskatchewan","L’Alberta","Le Québec"]},"answer":0},{"type":"mc","q":{"en":"For what crime was Louis Riel tried and executed?","fr":"Pour quel crime Louis Riel a-t-il été jugé et exécuté?"},"options":{"en":["Murder","High treason","Robbery","Desertion"],"fr":["Meurtre","Haute trahison","Vol","Désertion"]},"answer":1}]},{"id":"history2-019","topic":"nwmp","importance":3,"en":"After the first Métis uprising, Prime Minister Macdonald established the North West Mounted Police (NWMP) in 1873 to pacify the West and assist in negotiations with the Indians. The NWMP founded Fort Calgary, Fort MacLeod and other centres that today are cities and towns. Regina became its headquarters.","en_simple":"In 1873, Macdonald created the North West Mounted Police (NWMP) to bring peace to the West. The NWMP founded Fort Calgary and Fort MacLeod. Its headquarters was Regina.","fr":"En 1873, après la première révolte des Métis, le premier ministre Macdonald crée la Police à cheval du Nord-Ouest (PCNO) afin de pacifier l’Ouest et de faciliter les négociations avec les Indiens. La PCNO fonde Fort Calgary, Fort MacLeod et d’autres centres qui sont aujourd’hui devenus des villes et des municipalités. Regina devient son quartier général.","tr":{"ar":"بعد انتفاضة الميتيس الأولى، أسس رئيس الوزراء ماكدونالد شرطة الخيالة في الشمال الغربي (North West Mounted Police) عام 1873 لتهدئة الغرب والمساعدة في المفاوضات مع الهنود. وأسست هذه الشرطة فورت كالغاري وفورت ماكلويد ومراكز أخرى أصبحت اليوم مدنًا وبلدات. وأصبحت ريجاينا (Regina) مقرها الرئيسي."},"questions":[{"type":"mc","q":{"en":"In what year was the North West Mounted Police established?","fr":"En quelle année la Police à cheval du Nord-Ouest a-t-elle été créée?"},"options":{"en":["1867","1870","1873","1885"],"fr":["1867","1870","1873","1885"]},"answer":2},{"type":"mc","q":{"en":"Which city became the headquarters of the North West Mounted Police?","fr":"Quelle ville est devenue le quartier général de la Police à cheval du Nord-Ouest?"},"options":{"en":["Winnipeg","Regina","Calgary","Ottawa"],"fr":["Winnipeg","Regina","Calgary","Ottawa"]},"answer":1},{"type":"mc","q":{"en":"Why did Prime Minister Macdonald establish the North West Mounted Police?","fr":"Pourquoi le premier ministre Macdonald a-t-il créé la Police à cheval du Nord-Ouest?"},"options":{"en":["To guard the border with the United States","To pacify the West and assist in negotiations with the Indians","To build the railway","To fight in the Boer War"],"fr":["Pour garder la frontière avec les États-Unis","Pour pacifier l’Ouest et faciliter les négociations avec les Indiens","Pour construire le chemin de fer","Pour combattre dans la guerre des Boers"]},"answer":1}]},{"id":"history2-020","topic":"rcmp","importance":3,"en":"Today, the Royal Canadian Mounted Police (RCMP or “the Mounties”) are the national police force and one of Canada’s best-known symbols. Some of Canada’s most colourful heroes, such as Major General Sir Sam Steele, came from the ranks of the Mounties.","en_simple":"Today the Royal Canadian Mounted Police (RCMP, “the Mounties”) is Canada's national police force and a famous symbol. Sir Sam Steele was a hero from the Mounties.","fr":"Aujourd’hui, la Gendarmerie royale du Canada (GRC ou « police montée ») est la force nationale de police et l’un des symboles les plus connus de notre pays. Certains des héros les plus colorés du Canada, comme le major-général sir Sam Steele, sont issus des rangs de la police montée.","tr":{"ar":"اليوم، شرطة الخيالة الملكية الكندية (RCMP أو «الماونتيز») هي قوة الشرطة الوطنية وأحد أشهر رموز كندا. وقد خرج من صفوفها بعض أبرز أبطال كندا، مثل اللواء سير سام ستيل (Sir Sam Steele)."},"questions":[{"type":"mc","q":{"en":"What is the name of Canada’s national police force today?","fr":"Quel est le nom de la force nationale de police du Canada aujourd’hui?"},"options":{"en":["The Canadian Forces","The Royal Canadian Mounted Police","The Ontario Provincial Police","The Coast Guard"],"fr":["Les Forces canadiennes","La Gendarmerie royale du Canada","La Police provinciale de l’Ontario","La Garde côtière"]},"answer":1},{"type":"mc","q":{"en":"Who was Sir Sam Steele?","fr":"Qui était sir Sam Steele?"},"options":{"en":["A great frontier hero, Mounted Policeman and soldier of the Queen","The first Prime Minister of Canada","The Métis’ greatest military leader","The director of the Canadian Pacific Railway"],"fr":["Un grand héros de la conquête de l’Ouest, membre de la Police à cheval et soldat de la reine","Le premier premier ministre du Canada","Le plus grand chef militaire métis","L’administrateur du Chemin de fer Canadien Pacifique"]},"answer":0}]},{"id":"history2-021","topic":"dumont","importance":2,"en":"Métis Resistance: Gabriel Dumont was the Métis’ greatest military leader.","en_simple":"Gabriel Dumont was the greatest military leader of the Métis.","fr":"La résistance des Métis : Gabriel Dumont est le plus grand des chefs militaires métis.","tr":{"ar":"مقاومة الميتيس: كان غابرييل دومون (Gabriel Dumont) أعظم قائد عسكري للميتيس."},"questions":[{"type":"mc","q":{"en":"Who was the Métis’ greatest military leader?","fr":"Qui était le plus grand chef militaire des Métis?"},"options":{"en":["Louis Riel","Sir Sam Steele","Gabriel Dumont","Sir Arthur Currie"],"fr":["Louis Riel","Sir Sam Steele","Gabriel Dumont","Sir Arthur Currie"]},"answer":2}]},{"id":"history2-022","topic":"cpr","importance":3,"en":"British Columbia joined Canada in 1871 after Ottawa promised to build a railway to the West Coast.","en_simple":"British Columbia joined Canada in 1871 because Ottawa promised to build a railway to the West Coast.","fr":"La Colombie-Britannique intègre le Canada en 1871 après avoir reçu d’Ottawa la promesse de la construction d’un chemin de fer jusqu’à la côte Ouest.","tr":{"ar":"انضمت كولومبيا البريطانية إلى كندا عام 1871 بعد أن وعدت أوتاوا ببناء خط سكة حديد إلى الساحل الغربي."},"questions":[{"type":"mc","q":{"en":"What did Ottawa promise British Columbia so that it would join Canada in 1871?","fr":"Qu’est-ce qu’Ottawa a promis à la Colombie-Britannique pour qu’elle intègre le Canada en 1871?"},"options":{"en":["A new capital city","A railway to the West Coast","Its own navy","Free land for all settlers"],"fr":["Une nouvelle capitale","Un chemin de fer jusqu’à la côte Ouest","Sa propre marine","Des terres gratuites pour tous les colons"]},"answer":1},{"type":"tf","q":{"en":"British Columbia joined Canada in 1871.","fr":"La Colombie-Britannique a intégré le Canada en 1871."},"answer":true}]},{"id":"history2-023","topic":"cpr","importance":3,"en":"On November 7, 1885, a powerful symbol of unity was completed when Donald Smith (Lord Strathcona), the Scottish-born director of the Canadian Pacific Railway (CPR), drove the last spike. After many years of heroic work, the CPR’s “ribbons of steel” fulfilled a national dream.","en_simple":"On November 7, 1885, Donald Smith (Lord Strathcona), director of the Canadian Pacific Railway (CPR), drove the last spike. The railway was a symbol of unity and a national dream.","fr":"Le 7 novembre 1885, ce puissant symbole d’unité est achevé lorsque Donald Smith (lord Strathcona), administrateur du Chemin de fer Canadien Pacifique (CFCP) natif de l’Écosse, pose le dernier crampon. Après des années de travail héroïque, les « rubans d’acier » du CFCP concrétisent un rêve national.","tr":{"ar":"في 7 نوفمبر 1885، اكتمل رمز قوي للوحدة عندما دقّ دونالد سميث (اللورد ستراثكونا) (Donald Smith, Lord Strathcona)، مدير سكة حديد كندا والمحيط الهادئ (CPR) المولود في اسكتلندا، المسمار الأخير. وبعد سنوات من العمل البطولي، حققت «شرائط الفولاذ» حلمًا وطنيًا."},"questions":[{"type":"mc","q":{"en":"Who drove the last spike of the Canadian Pacific Railway on November 7, 1885?","fr":"Qui a posé le dernier crampon du Chemin de fer Canadien Pacifique le 7 novembre 1885?"},"options":{"en":["Sir John A. Macdonald","Sir George-Étienne Cartier","Donald Smith (Lord Strathcona)","Sir Wilfrid Laurier"],"fr":["Sir John A. Macdonald","Sir George-Étienne Cartier","Donald Smith (lord Strathcona)","Sir Wilfrid Laurier"]},"answer":2},{"type":"mc","q":{"en":"What did the Canadian Pacific Railway symbolize?","fr":"Que symbolisait le Chemin de fer Canadien Pacifique?"},"options":{"en":["Unity","Independence from Britain","Military strength","The end of immigration"],"fr":["L’unité","L’indépendance de la Grande-Bretagne","La puissance militaire","La fin de l’immigration"]},"answer":0},{"type":"mc","q":{"en":"When was the last spike of the CPR driven?","fr":"Quand le dernier crampon du CFCP a-t-il été posé?"},"options":{"en":["July 1, 1867","November 7, 1885","November 11, 1918","June 6, 1944"],"fr":["Le 1er juillet 1867","Le 7 novembre 1885","Le 11 novembre 1918","Le 6 juin 1944"]},"answer":1}]},{"id":"history2-024","topic":"head-tax","importance":3,"en":"The project was financed by British and American investors and built by both European and Chinese labour. Afterwards the Chinese were subject to discrimination, including the Head Tax, a race-based entry fee. The Government of Canada apologized in 2006 for this discriminatory policy.","en_simple":"The railway was paid for by British and American investors and built by European and Chinese workers. Later, Chinese people had to pay a Head Tax (a race-based entry fee). Canada apologized in 2006.","fr":"Le projet est financé par des investisseurs américains et britanniques et construit par des travailleurs européens et chinois. Plus tard, les Chinois seront victimes de discrimination, faisant notamment l’objet d’une taxe d’entrée fondée sur la race. En 2006, le gouvernement du Canada a présenté ses excuses pour cette politique discriminatoire.","tr":{"ar":"موّل المشروع مستثمرون بريطانيون وأمريكيون وبناه عمال أوروبيون وصينيون. وبعد ذلك تعرّض الصينيون للتمييز، بما في ذلك «ضريبة الرأس» (Head Tax)، وهي رسم دخول قائم على العرق. واعتذرت حكومة كندا عام 2006 عن هذه السياسة التمييزية."},"questions":[{"type":"mc","q":{"en":"What was the Head Tax?","fr":"Qu’était la taxe d’entrée imposée aux Chinois?"},"options":{"en":["A tax on railway tickets","A race-based entry fee imposed on Chinese immigrants","A tax on farmland in the West","A fee paid by British investors"],"fr":["Une taxe sur les billets de train","Une taxe d’entrée fondée sur la race imposée aux immigrants chinois","Une taxe sur les terres agricoles de l’Ouest","Des frais payés par les investisseurs britanniques"]},"answer":1},{"type":"mc","q":{"en":"In what year did the Government of Canada apologize for the Head Tax?","fr":"En quelle année le gouvernement du Canada a-t-il présenté ses excuses pour la taxe d’entrée?"},"options":{"en":["1988","1999","2006","2010"],"fr":["1988","1999","2006","2010"]},"answer":2},{"type":"tf","q":{"en":"The Canadian Pacific Railway was built by both European and Chinese labour.","fr":"Le Chemin de fer Canadien Pacifique a été construit par des travailleurs européens et chinois."},"answer":true}]},{"id":"history2-025","topic":"moving-westward","importance":3,"en":"Canada’s economy grew and became more industrialized during the economic boom of the 1890s and early 1900s. One million British and one million Americans immigrated to Canada at this time.","en_simple":"In the 1890s and early 1900s, Canada's economy boomed. 1 million British and 1 million Americans came to Canada.","fr":"L’économie du Canada se développe et s’industrialise durant le boom économique des années 1890 et du début du vingtième siècle. À cette époque, un million de Britanniques et un million d’Américains immigrent au Canada.","tr":{"ar":"نما اقتصاد كندا وأصبح أكثر تصنيعًا خلال الازدهار الاقتصادي في تسعينيات القرن التاسع عشر وأوائل القرن العشرين. وهاجر إلى كندا في ذلك الوقت مليون بريطاني ومليون أمريكي."},"questions":[{"type":"mc","q":{"en":"During the boom of the 1890s and early 1900s, about how many British and Americans immigrated to Canada?","fr":"Pendant le boom des années 1890 et du début des années 1900, combien de Britanniques et d’Américains ont immigré au Canada?"},"options":{"en":["100,000 of each","One million of each","Five million of each","10,000 of each"],"fr":["100 000 de chaque","Un million de chaque","Cinq millions de chaque","10 000 de chaque"]},"answer":1}]},{"id":"history2-026","topic":"laurier","importance":3,"en":"Sir Wilfrid Laurier became the first French-Canadian prime minister since Confederation and encouraged immigration to the West. His portrait is on the $5 bill.","en_simple":"Sir Wilfrid Laurier was the first French-Canadian prime minister since Confederation. He encouraged immigration to the West. His picture is on the $5 bill.","fr":"Sir Wilfrid Laurier est le premier Canadien français à devenir premier ministre depuis la Confédération et il encourage l’immigration vers l’Ouest. Son portrait figure sur les billets de cinq dollars.","tr":{"ar":"أصبح سير ويلفريد لورييه (Sir Wilfrid Laurier) أول رئيس وزراء كندي فرنسي منذ الكونفدرالية، وشجّع الهجرة إلى الغرب. وصورته موجودة على ورقة الـ5 دولارات."},"questions":[{"type":"mc","q":{"en":"Who was the first French-Canadian prime minister since Confederation?","fr":"Qui a été le premier Canadien français à devenir premier ministre depuis la Confédération?"},"options":{"en":["Sir George-Étienne Cartier","Sir Wilfrid Laurier","Louis Riel","Sir Robert Borden"],"fr":["Sir George-Étienne Cartier","Sir Wilfrid Laurier","Louis Riel","Sir Robert Borden"]},"answer":1},{"type":"mc","q":{"en":"Whose portrait is on the Canadian $5 bill?","fr":"Le portrait de qui figure sur le billet canadien de cinq dollars?"},"options":{"en":["Sir John A. Macdonald","Sir Robert Borden","Sir Wilfrid Laurier","Agnes Macphail"],"fr":["Sir John A. Macdonald","Sir Robert Borden","Sir Wilfrid Laurier","Agnes Macphail"]},"answer":2},{"type":"tf","q":{"en":"Sir Wilfrid Laurier discouraged immigration to the West.","fr":"Sir Wilfrid Laurier a découragé l’immigration vers l’Ouest."},"answer":false}]},{"id":"history2-027","topic":"immigration-west","importance":2,"en":"The railway made it possible for immigrants, including 170,000 Ukrainians, 115,000 Poles and tens of thousands from Germany, France, Norway and Sweden to settle in the West before 1914 and develop a thriving agricultural sector.","en_simple":"Before 1914, the railway brought 170,000 Ukrainians, 115,000 Poles and many Germans, French, Norwegians and Swedes to farm in the West.","fr":"Grâce au chemin de fer, 170 000 Ukrainiens, 115 000 Polonais et des dizaines de milliers d’Allemands, de Français, de Norvégiens, de Suédois et d’autres immigrants s’établissent dans l’Ouest canadien avant 1914 et y développent un secteur agricole prospère.","tr":{"ar":"أتاحت السكة الحديدية للمهاجرين، ومنهم 170,000 أوكراني و115,000 بولندي وعشرات الآلاف من ألمانيا وفرنسا والنرويج والسويد، الاستقرار في الغرب قبل عام 1914 وتطوير قطاع زراعي مزدهر."},"questions":[{"type":"mc","q":{"en":"About how many Ukrainians settled in the West before 1914?","fr":"Environ combien d’Ukrainiens se sont établis dans l’Ouest avant 1914?"},"options":{"en":["17,000","115,000","170,000","1,000,000"],"fr":["17 000","115 000","170 000","1 000 000"]},"answer":2},{"type":"mc","q":{"en":"About how many Poles settled in the West before 1914?","fr":"Environ combien de Polonais se sont établis dans l’Ouest avant 1914?"},"options":{"en":["115,000","170,000","8,000","600,000"],"fr":["115 000","170 000","8 000","600 000"]},"answer":0}]},{"id":"history2-028","topic":"boer-war","importance":3,"en":"Over 7,000 volunteered to fight in the South African War (1899–1902), popularly known as the Boer War, and over 260 died. In 1900, Canadians took part in the battles of Paardeberg (“Horse Mountain”) and Lillefontein, victories that strengthened national pride in Canada.","en_simple":"Over 7,000 Canadians volunteered for the South African War (Boer War, 1899–1902). Over 260 died. In 1900, Canadians won at Paardeberg and Lillefontein.","fr":"Plus de 7 000 se portent volontaires pour participer à la guerre d’Afrique du Sud (1899-1902), communément appelée la guerre des Boers, où plus de 260 d’entre eux trouvent la mort. En 1900, des Canadiens combattent dans les batailles de Paardeberg (« montagne aux chevaux ») et de Lillefontein, des victoires qui renforcent la fierté nationale au Canada.","tr":{"ar":"تطوّع أكثر من 7,000 كندي للقتال في حرب جنوب أفريقيا (1899–1902)، المعروفة شعبيًا بحرب البوير (Boer War)، وتوفي أكثر من 260 منهم. وفي عام 1900، شارك الكنديون في معركتي باردبيرغ («جبل الحصان») وليلفونتين، وهما انتصاران عززا الفخر الوطني في كندا."},"questions":[{"type":"mc","q":{"en":"The South African War (1899–1902) is popularly known as what?","fr":"Sous quel nom la guerre d’Afrique du Sud (1899-1902) est-elle communément connue?"},"options":{"en":["The Great War","The Boer War","The Crimean War","The Zulu War"],"fr":["La Grande Guerre","La guerre des Boers","La guerre de Crimée","La guerre des Zoulous"]},"answer":1},{"type":"mc","q":{"en":"About how many Canadians volunteered to fight in the Boer War?","fr":"Environ combien de Canadiens se sont portés volontaires pour la guerre des Boers?"},"options":{"en":["Over 260","Over 7,000","Over 60,000","Over 600,000"],"fr":["Plus de 260","Plus de 7 000","Plus de 60 000","Plus de 600 000"]},"answer":1},{"type":"tf","q":{"en":"In 1900, Canadians took part in the battles of Paardeberg and Lillefontein.","fr":"En 1900, des Canadiens ont combattu dans les batailles de Paardeberg et de Lillefontein."},"answer":true}]},{"id":"history2-029","topic":"wwi","importance":3,"en":"When Germany attacked Belgium and France in 1914 and Britain declared war, Ottawa formed the Canadian Expeditionary Force (later the Canadian Corps). More than 600,000 Canadians served in the war, most of them volunteers, out of a total population of eight million.","en_simple":"In 1914, Canada formed the Canadian Expeditionary Force (later the Canadian Corps). More than 600,000 Canadians served in the First World War, out of 8 million people.","fr":"Quand l’Allemagne attaque la Belgique et la France en 1914 et que la Grande-Bretagne déclare la guerre, Ottawa constitue le Corps expéditionnaire canadien (devenu plus tard le Corps canadien). Plus de 600 000 Canadiens participent à la guerre – la plupart volontairement – sur une population totale de huit millions.","tr":{"ar":"عندما هاجمت ألمانيا بلجيكا وفرنسا عام 1914 وأعلنت بريطانيا الحرب، شكّلت أوتاوا القوة الاستكشافية الكندية (Canadian Expeditionary Force) (التي أصبحت لاحقًا الفيلق الكندي). وخدم في الحرب أكثر من 600,000 كندي، معظمهم متطوعون، من إجمالي سكان يبلغ 8 ملايين."},"questions":[{"type":"mc","q":{"en":"What force did Ottawa form when the First World War began in 1914?","fr":"Quelle force Ottawa a-t-il constituée au début de la Première Guerre mondiale en 1914?"},"options":{"en":["The North West Mounted Police","The Royal Canadian Navy","The Canadian Expeditionary Force","The Canadian Militia"],"fr":["La Police à cheval du Nord-Ouest","La Marine royale du Canada","Le Corps expéditionnaire canadien","La milice canadienne"]},"answer":2},{"type":"mc","q":{"en":"How many Canadians served in the First World War?","fr":"Combien de Canadiens ont participé à la Première Guerre mondiale?"},"options":{"en":["More than 60,000","More than 170,000","More than 600,000","More than one million"],"fr":["Plus de 60 000","Plus de 170 000","Plus de 600 000","Plus d’un million"]},"answer":2},{"type":"mc","q":{"en":"What was Canada’s total population at the time of the First World War?","fr":"Quelle était la population totale du Canada à l’époque de la Première Guerre mondiale?"},"options":{"en":["Three million","Eight million","11.5 million","20 million"],"fr":["Trois millions","Huit millions","11,5 millions","20 millions"]},"answer":1}]},{"id":"history2-030","topic":"vimy","importance":3,"en":"The Canadian Corps captured Vimy Ridge in April 1917, with 10,000 killed or wounded, securing the Canadians’ reputation for valour as the “shock troops of the British Empire.” One Canadian officer said: “In those few minutes I witnessed the birth of a nation.” April 9 is celebrated as Vimy Day.","en_simple":"In April 1917, the Canadian Corps captured Vimy Ridge (10,000 killed or wounded). Canadians became known as the “shock troops of the British Empire.” An officer called it “the birth of a nation.” April 9 is Vimy Day.","fr":"Le Corps canadien s’empare de la crête de Vimy en avril 1917, au prix de 10 000 morts et blessés, solidifiant ainsi la réputation de bravoure des Canadiens en tant que « troupes de choc de l’Empire britannique ». Un officier canadien a affirmé : « Pendant ces quelques minutes, j’ai assisté à la naissance d’un pays. » Le 9 avril est le Jour de la bataille de Vimy.","tr":{"ar":"استولى الفيلق الكندي على مرتفع فيمي (Vimy Ridge) في أبريل 1917، بخسارة 10,000 قتيل وجريح، مما رسّخ سمعة الكنديين في الشجاعة بوصفهم «قوات الصدمة للإمبراطورية البريطانية». وقال ضابط كندي: «في تلك الدقائق القليلة شهدت ولادة أمة». ويُحتفل بيوم 9 أبريل بوصفه يوم فيمي."},"questions":[{"type":"mc","q":{"en":"When did the Canadian Corps capture Vimy Ridge?","fr":"Quand le Corps canadien s’est-il emparé de la crête de Vimy?"},"options":{"en":["August 1914","April 1917","August 1918","November 1918"],"fr":["Août 1914","Avril 1917","Août 1918","Novembre 1918"]},"answer":1},{"type":"mc","q":{"en":"What date is celebrated as Vimy Day?","fr":"Quelle date est le Jour de la bataille de Vimy?"},"options":{"en":["April 9","July 1","November 11","January 11"],"fr":["Le 9 avril","Le 1er juillet","Le 11 novembre","Le 11 janvier"]},"answer":0},{"type":"mc","q":{"en":"After Vimy Ridge, Canadians earned a reputation as the “shock troops” of what?","fr":"Après Vimy, les Canadiens ont acquis la réputation de « troupes de choc » de quoi?"},"options":{"en":["The United States","The French Army","The British Empire","The League of Nations"],"fr":["Des États-Unis","De l’armée française","De l’Empire britannique","De la Société des Nations"]},"answer":2}]},{"id":"history2-031","topic":"internment","importance":2,"en":"Regrettably, from 1914 to 1920, Ottawa interned over 8,000 former Austro-Hungarian subjects, mainly Ukrainian men, as “enemy aliens” in 24 labour camps across Canada, even though Britain advised against the policy.","en_simple":"From 1914 to 1920, Canada put over 8,000 former Austro-Hungarian subjects, mostly Ukrainian men, in 24 labour camps as “enemy aliens.” Britain had advised against it.","fr":"Malheureusement, de 1914 à 1920, Ottawa a interné plus de 8 000 anciens ressortissants austro-hongrois, principalement des Ukrainiens de sexe masculin, à titre de « ressortissants d’un pays ennemi », dans 24 camps de travail partout au pays, même si la Grande-Bretagne avait déconseillé au Canada de le faire.","tr":{"ar":"للأسف، من عام 1914 إلى 1920، اعتقلت أوتاوا أكثر من 8,000 من الرعايا النمساويين المجريين السابقين، معظمهم رجال أوكرانيون، بوصفهم «أجانب أعداء» في 24 معسكر عمل في أنحاء كندا، رغم أن بريطانيا نصحت بعدم اتباع هذه السياسة."},"questions":[{"type":"mc","q":{"en":"During the First World War, Ottawa interned over 8,000 “enemy aliens.” Who were most of them?","fr":"Pendant la Première Guerre mondiale, Ottawa a interné plus de 8 000 « ressortissants d’un pays ennemi ». Qui étaient-ils en majorité?"},"options":{"en":["Japanese men","Ukrainian men","German women","Chinese workers"],"fr":["Des hommes japonais","Des hommes ukrainiens","Des femmes allemandes","Des travailleurs chinois"]},"answer":1},{"type":"tf","q":{"en":"Britain advised Canada to intern former Austro-Hungarian subjects during the First World War.","fr":"La Grande-Bretagne a conseillé au Canada d’interner les anciens ressortissants austro-hongrois pendant la Première Guerre mondiale."},"answer":false}]},{"id":"history2-032","topic":"hundred-days","importance":3,"en":"In 1918, under the command of General Sir Arthur Currie, Canada’s greatest soldier, the Canadian Corps advanced alongside the French and British Empire troops in the last hundred days. These included the victorious Battle of Amiens on August 8, 1918 – which the Germans called “the black day of the German Army” – followed by Arras, Canal du Nord, Cambrai and Mons.","en_simple":"In 1918, General Sir Arthur Currie, Canada's greatest soldier, led the Canadian Corps in the last hundred days. The Battle of Amiens (August 8, 1918) was called “the black day of the German Army.”","fr":"En 1918, sous le commandement du général sir Arthur Currie, le plus grand soldat canadien, le Corps canadien progresse aux côtés des soldats français et britanniques durant les cent derniers jours du conflit. C’est alors qu’a lieu la bataille victorieuse d’Amiens, le 8 août 1918 – date que les Allemands ont baptisée « le jour noir de l’armée allemande » –, suivie de celles d’Arras, du Canal du Nord, de Cambrai et de Mons.","tr":{"ar":"في عام 1918، تحت قيادة الجنرال سير آرثر كوري (Sir Arthur Currie)، أعظم جندي كندي، تقدّم الفيلق الكندي إلى جانب القوات الفرنسية وقوات الإمبراطورية البريطانية في المئة يوم الأخيرة. وشملت معركة أميان المنتصرة في 8 أغسطس 1918 – التي سماها الألمان «اليوم الأسود للجيش الألماني» – تلتها أراس وكانال دو نور وكامبريه ومونس."},"questions":[{"type":"mc","q":{"en":"Who is described as Canada’s greatest soldier, commanding the Canadian Corps in 1918?","fr":"Qui est décrit comme le plus grand soldat canadien, commandant du Corps canadien en 1918?"},"options":{"en":["Sir Sam Steele","Sir Arthur Currie","Sir Robert Borden","John McCrae"],"fr":["Sir Sam Steele","Sir Arthur Currie","Sir Robert Borden","John McCrae"]},"answer":1},{"type":"mc","q":{"en":"Which battle on August 8, 1918 did the Germans call “the black day of the German Army”?","fr":"Quelle bataille du 8 août 1918 les Allemands ont-ils baptisée « le jour noir de l’armée allemande »?"},"options":{"en":["Vimy Ridge","Dieppe","Amiens","Mons"],"fr":["La crête de Vimy","Dieppe","Amiens","Mons"]},"answer":2}]},{"id":"history2-033","topic":"armistice","importance":3,"en":"With Germany and Austria’s surrender, the war ended in the Armistice on November 11, 1918. In total 60,000 Canadians were killed and 170,000 wounded. The war strengthened both national and imperial pride, particularly in English Canada.","en_simple":"The First World War ended with the Armistice on November 11, 1918. 60,000 Canadians were killed and 170,000 wounded.","fr":"Avec la capitulation de l’Allemagne et de l’Autriche, la guerre prend fin à l’Armistice, le 11 novembre 1918. Au total, 60 000 Canadiens ont été tués et 170 000, blessés. La guerre a renforcé à la fois la fierté nationale et la fierté impériale, surtout dans le Canada anglais.","tr":{"ar":"مع استسلام ألمانيا والنمسا، انتهت الحرب بالهدنة في 11 نوفمبر 1918. وفي المجموع، قُتل 60,000 كندي وجُرح 170,000. وعززت الحرب الفخر الوطني والإمبراطوري معًا، خاصة في كندا الإنجليزية."},"questions":[{"type":"mc","q":{"en":"On what date did the First World War end with the Armistice?","fr":"À quelle date la Première Guerre mondiale a-t-elle pris fin avec l’Armistice?"},"options":{"en":["April 9, 1917","August 8, 1918","November 11, 1918","May 8, 1945"],"fr":["Le 9 avril 1917","Le 8 août 1918","Le 11 novembre 1918","Le 8 mai 1945"]},"answer":2},{"type":"mc","q":{"en":"How many Canadians were killed in the First World War?","fr":"Combien de Canadiens ont été tués pendant la Première Guerre mondiale?"},"options":{"en":["10,000","44,000","60,000","170,000"],"fr":["10 000","44 000","60 000","170 000"]},"answer":2},{"type":"tf","q":{"en":"170,000 Canadians were wounded in the First World War.","fr":"170 000 Canadiens ont été blessés pendant la Première Guerre mondiale."},"answer":true}]},{"id":"history2-034","topic":"maple-leaf-badge","importance":1,"en":"Maple leaf cap badge from the First World War. Canada’s soldiers began using the maple leaf in the 1850s.","en_simple":"Canadian soldiers started using the maple leaf as a symbol in the 1850s.","fr":"Insigne de casquette de la Première Guerre mondiale. Les soldats canadiens commencent à utiliser la feuille d’érable dans les années 1850.","tr":{"ar":"شارة قبعة بورقة القيقب من الحرب العالمية الأولى. بدأ الجنود الكنديون استخدام ورقة القيقب في خمسينيات القرن التاسع عشر."},"questions":[{"type":"mc","q":{"en":"In what decade did Canada’s soldiers begin using the maple leaf?","fr":"Au cours de quelle décennie les soldats canadiens ont-ils commencé à utiliser la feuille d’érable?"},"options":{"en":["The 1850s","The 1860s","The 1910s","The 1960s"],"fr":["Les années 1850","Les années 1860","Les années 1910","Les années 1960"]},"answer":0}]},{"id":"history2-035","topic":"bluebirds","importance":2,"en":"More than 3,000 nurses, nicknamed “Bluebirds,” served in the Royal Canadian Army Medical Corps, 2,500 of them overseas.","en_simple":"More than 3,000 nurses, called “Bluebirds,” served in the Royal Canadian Army Medical Corps in the First World War. 2,500 served overseas.","fr":"Plus de 3 000 infirmières, surnommées les « oiseaux bleus », font partie du Corps de santé royal canadien, 2 500 d’entre elles travaillent outre-mer.","tr":{"ar":"خدمت أكثر من 3,000 ممرضة، لُقّبن بـ«الطيور الزرقاء» (Bluebirds)، في الفيلق الطبي للجيش الكندي الملكي، 2,500 منهن في الخارج."},"questions":[{"type":"mc","q":{"en":"Who were the “Bluebirds” of the First World War?","fr":"Qui étaient les « oiseaux bleus » de la Première Guerre mondiale?"},"options":{"en":["Canadian fighter pilots","Canadian nurses in the Royal Canadian Army Medical Corps","Canadian navy sailors","Women who worked in munitions factories"],"fr":["Les pilotes de chasse canadiens","Les infirmières canadiennes du Corps de santé royal canadien","Les marins de la marine canadienne","Les femmes travaillant dans les usines de munitions"]},"answer":1}]},{"id":"history2-036","topic":"womens-vote","importance":3,"en":"At the time of Confederation, the vote was limited to property-owning adult white males. The effort by women to achieve the right to vote is known as the women’s suffrage movement. Its founder in Canada was Dr. Emily Stowe, the first Canadian woman to practise medicine in Canada. In 1916, Manitoba became the first province to grant voting rights to women.","en_simple":"At Confederation, only adult white men who owned property could vote. Dr. Emily Stowe, the first Canadian woman doctor, founded the women's suffrage movement in Canada. In 1916, Manitoba was the first province to let women vote.","fr":"À l’époque de la Confédération, le droit de vote est limité aux hommes blancs adultes et propriétaires. Les efforts des femmes pour obtenir le droit de vote sont connus sous le nom de « mouvement des suffragettes ». La fondatrice de ce mouvement au Canada est la Dre Emily Stowe, première femme canadienne à pratiquer la médecine au Canada. En 1916, le Manitoba devient la première province à accorder le droit de vote aux femmes.","tr":{"ar":"في زمن الكونفدرالية، كان حق التصويت مقتصرًا على الرجال البيض البالغين من مالكي العقارات. ويُعرف جهد النساء للحصول على حق التصويت بحركة الاقتراع النسائي. ومؤسستها في كندا هي الدكتورة إميلي ستو (Dr. Emily Stowe)، أول امرأة كندية تمارس الطب في كندا. وفي عام 1916، أصبحت مانيتوبا أول مقاطعة تمنح النساء حق التصويت."},"questions":[{"type":"mc","q":{"en":"Who founded the women’s suffrage movement in Canada?","fr":"Qui a fondé le mouvement des suffragettes au Canada?"},"options":{"en":["Agnes Macphail","Thérèse Casgrain","Dr. Emily Stowe","Laura Secord"],"fr":["Agnes Macphail","Thérèse Casgrain","La Dre Emily Stowe","Laura Secord"]},"answer":2},{"type":"mc","q":{"en":"Which province was the first to grant voting rights to women, in 1916?","fr":"Quelle province a été la première à accorder le droit de vote aux femmes, en 1916?"},"options":{"en":["Ontario","Quebec","British Columbia","Manitoba"],"fr":["L’Ontario","Le Québec","La Colombie-Britannique","Le Manitoba"]},"answer":3},{"type":"mc","q":{"en":"At the time of Confederation, who was allowed to vote?","fr":"À l’époque de la Confédération, qui avait le droit de vote?"},"options":{"en":["All adult citizens","Property-owning adult white males","All men over 18","Men and women who paid taxes"],"fr":["Tous les citoyens adultes","Les hommes blancs adultes et propriétaires","Tous les hommes de plus de 18 ans","Les hommes et les femmes qui payaient des impôts"]},"answer":1}]},{"id":"history2-037","topic":"womens-vote","importance":3,"en":"In 1917, the federal government of Sir Robert Borden gave women the right to vote in federal elections — first to nurses at the battle front, then to women who were related to men in active wartime service. In 1918, most Canadian female citizens aged 21 and over were granted the right to vote in federal elections.","en_simple":"In 1917, Sir Robert Borden's government gave the federal vote to nurses at the front and to women related to soldiers. In 1918, most Canadian women aged 21 and over could vote in federal elections.","fr":"En 1917, grâce aux efforts mobilisateurs de femmes comme la Dre Stowe et d’autres suffragettes, le gouvernement fédéral de sir Robert Borden donne aux femmes le droit de vote aux élections fédérales – d’abord aux infirmières qui se trouvent au front, puis aux femmes ayant un lien de parenté avec des hommes en service militaire actif. En 1918, la plupart des citoyennes canadiennes d’au moins 21 ans ont le droit de voter aux élections fédérales.","tr":{"ar":"في عام 1917، منحت الحكومة الفيدرالية برئاسة سير روبرت بوردن (Sir Robert Borden) النساء حق التصويت في الانتخابات الفيدرالية — أولًا للممرضات في جبهة القتال، ثم للنساء اللواتي لهن أقارب من الرجال في الخدمة العسكرية الفعلية. وفي عام 1918، مُنحت معظم المواطنات الكنديات البالغات 21 عامًا فأكثر حق التصويت في الانتخابات الفيدرالية."},"questions":[{"type":"mc","q":{"en":"In what year were most Canadian female citizens aged 21 and over granted the right to vote in federal elections?","fr":"En quelle année la plupart des citoyennes canadiennes d’au moins 21 ans ont-elles obtenu le droit de vote aux élections fédérales?"},"options":{"en":["1916","1917","1918","1940"],"fr":["1916","1917","1918","1940"]},"answer":2},{"type":"mc","q":{"en":"Whose federal government first gave women the right to vote in federal elections in 1917?","fr":"Le gouvernement fédéral de qui a d’abord donné aux femmes le droit de vote aux élections fédérales en 1917?"},"options":{"en":["Sir Wilfrid Laurier","Sir Robert Borden","Sir John A. Macdonald","William Lyon Mackenzie King"],"fr":["Sir Wilfrid Laurier","Sir Robert Borden","Sir John A. Macdonald","William Lyon Mackenzie King"]},"answer":1},{"type":"tf","q":{"en":"In 1917, the first women to get the federal vote were nurses at the battle front.","fr":"En 1917, les premières femmes à obtenir le droit de vote fédéral ont été les infirmières au front."},"answer":true}]},{"id":"history2-038","topic":"macphail","importance":3,"en":"In 1921 Agnes Macphail, a farmer and teacher, became the first woman MP.","en_simple":"In 1921, Agnes Macphail, a farmer and teacher, became the first woman Member of Parliament.","fr":"En 1921, Agnes Macphail, fermière et enseignante, devient la première députée.","tr":{"ar":"في عام 1921، أصبحت أغنيس ماكفيل (Agnes Macphail)، وهي مزارعة ومعلمة، أول امرأة عضو في البرلمان."},"questions":[{"type":"mc","q":{"en":"Who became the first woman MP in Canada, in 1921?","fr":"Qui est devenue la première députée au Canada, en 1921?"},"options":{"en":["Dr. Emily Stowe","Thérèse Casgrain","Agnes Macphail","Laura Secord"],"fr":["La Dre Emily Stowe","Thérèse Casgrain","Agnes Macphail","Laura Secord"]},"answer":2},{"type":"mc","q":{"en":"In what year did Agnes Macphail become the first woman MP?","fr":"En quelle année Agnes Macphail est-elle devenue la première députée?"},"options":{"en":["1916","1918","1921","1940"],"fr":["1916","1918","1921","1940"]},"answer":2}]},{"id":"history2-039","topic":"casgrain","importance":3,"en":"Due to the work of Thérèse Casgrain and others, Quebec granted women the vote in 1940.","en_simple":"Thanks to Thérèse Casgrain and others, Quebec gave women the vote in 1940.","fr":"En raison du travail de Thérèse Casgrain et d’autres personnes, le Québec a accordé le droit de vote aux femmes en 1940.","tr":{"ar":"بفضل عمل تيريز كاسغران (Thérèse Casgrain) وآخرين، منحت كيبيك النساء حق التصويت عام 1940."},"questions":[{"type":"mc","q":{"en":"In what year did Quebec grant women the vote?","fr":"En quelle année le Québec a-t-il accordé le droit de vote aux femmes?"},"options":{"en":["1916","1918","1921","1940"],"fr":["1916","1918","1921","1940"]},"answer":3},{"type":"mc","q":{"en":"Whose work helped Quebec women win the vote in 1940?","fr":"Le travail de qui a aidé les Québécoises à obtenir le droit de vote en 1940?"},"options":{"en":["Thérèse Casgrain","Agnes Macphail","Dr. Emily Stowe","Sir Wilfrid Laurier"],"fr":["Thérèse Casgrain","Agnes Macphail","La Dre Emily Stowe","Sir Wilfrid Laurier"]},"answer":0}]},{"id":"history2-040","topic":"remembrance-day","importance":3,"en":"Canadians remember the sacrifices of our veterans and brave fallen in all wars up to the present day in which Canadians took part, each year on November 11: Remembrance Day. Canadians wear the red poppy and observe a moment of silence at the 11th hour of the 11th day of the 11th month to honour the sacrifices of over a million brave men and women who have served, and the 110,000 who have given their lives.","en_simple":"Remembrance Day is November 11. Canadians wear a red poppy and keep a moment of silence at 11 a.m. on the 11th day of the 11th month. Over 1 million Canadians have served and 110,000 have died in wars.","fr":"Chaque année, le 11 novembre, jour du Souvenir, les Canadiens se rappellent les sacrifices des anciens combattants et des braves qui sont morts au combat, et ce, dans toutes les guerres livrées jusqu’à aujourd’hui par le Canada. Les Canadiens portent le coquelicot rouge et observent un moment de silence à la 11e heure du 11e jour du 11e mois, pour honorer les sacrifices de plus d’un million de braves hommes et femmes qui ont servi le Canada, et des 110 000 qui ont donné leur vie.","tr":{"ar":"يتذكر الكنديون تضحيات قدامى المحاربين والشجعان الذين سقطوا في جميع الحروب التي شارك فيها الكنديون حتى يومنا هذا، كل عام في 11 نوفمبر: يوم الذكرى (Remembrance Day). ويرتدي الكنديون زهرة الخشخاش الحمراء ويلتزمون لحظة صمت في الساعة الحادية عشرة من اليوم الحادي عشر من الشهر الحادي عشر تكريمًا لتضحيات أكثر من مليون رجل وامرأة شجعان خدموا، و110,000 قدّموا أرواحهم."},"questions":[{"type":"mc","q":{"en":"What is the meaning of the Remembrance Day poppy?","fr":"Quelle est la signification du coquelicot du jour du Souvenir?"},"options":{"en":["To remember our Sovereign, Queen Elizabeth II","To celebrate Confederation","To honour prime ministers who have died","To remember the sacrifice of Canadians who have served or died in wars up to the present day"],"fr":["Se souvenir de notre souveraine, la reine Elizabeth II","Célébrer la Confédération","Honorer les premiers ministres décédés","Se souvenir du sacrifice des Canadiens qui ont servi ou qui sont morts à la guerre jusqu’à aujourd’hui"]},"answer":3},{"type":"mc","q":{"en":"When is Remembrance Day?","fr":"Quand a lieu le jour du Souvenir?"},"options":{"en":["April 9","July 1","November 11","June 6"],"fr":["Le 9 avril","Le 1er juillet","Le 11 novembre","Le 6 juin"]},"answer":2},{"type":"mc","q":{"en":"How many Canadians have given their lives in wars, according to the guide?","fr":"Selon le guide, combien de Canadiens ont donné leur vie à la guerre?"},"options":{"en":["44,000","60,000","110,000","Over a million"],"fr":["44 000","60 000","110 000","Plus d’un million"]},"answer":2}]},{"id":"history2-041","topic":"flanders-fields","importance":3,"en":"Canadian medical officer Lieutenant-Colonel John McCrae composed the poem “In Flanders Fields” in 1915; it is often recited on Remembrance Day.","en_simple":"Lieutenant-Colonel John McCrae, a Canadian medical officer, wrote the poem “In Flanders Fields” in 1915. People recite it on Remembrance Day.","fr":"Le lieutenant-colonel John McCrae, médecin militaire canadien, a composé en 1915 le poème « In Flanders Fields », souvent récité le jour du Souvenir.","tr":{"ar":"ألّف الضابط الطبي الكندي المقدم جون ماكراي (John McCrae) قصيدة «في حقول فلاندرز» (In Flanders Fields) عام 1915؛ وغالبًا ما تُتلى في يوم الذكرى."},"questions":[{"type":"mc","q":{"en":"Who composed the poem “In Flanders Fields”?","fr":"Qui a composé le poème « In Flanders Fields »?"},"options":{"en":["Sir Arthur Currie","John McCrae","Sir Robert Borden","Phil Edwards"],"fr":["Sir Arthur Currie","John McCrae","Sir Robert Borden","Phil Edwards"]},"answer":1},{"type":"mc","q":{"en":"In what year was “In Flanders Fields” written?","fr":"En quelle année « In Flanders Fields » a-t-il été écrit?"},"options":{"en":["1914","1915","1917","1918"],"fr":["1914","1915","1917","1918"]},"answer":1}]},{"id":"history2-042","topic":"phil-edwards","importance":1,"en":"Phil Edwards was a Canadian track and field champion. Born in British Guiana, he won bronze medals for Canada in the 1928, 1932, and 1936 Olympics, then graduated from McGill University Medical School. He served as a captain in the Canadian Army during the Second World War, and, as a Montreal doctor, became an expert in tropical diseases.","en_simple":"Phil Edwards was a Canadian track and field champion. He won bronze medals in the 1928, 1932 and 1936 Olympics, became a doctor at McGill, and was a captain in the Canadian Army in the Second World War.","fr":"Phil Edwards est un champion canadien d’athlétisme. Né en Guyane britannique, il remporte des médailles de bronze pour le Canada aux Jeux olympiques de 1928, 1932 et 1936, puis obtient son diplôme de la faculté de médecine de l’Université McGill. Il sert comme capitaine dans l’Armée canadienne pendant la Seconde Guerre mondiale et, médecin à Montréal, devient un expert des maladies tropicales.","tr":{"ar":"كان فيل إدواردز (Phil Edwards) بطلًا كنديًا في ألعاب القوى. وُلد في غيانا البريطانية، وفاز بميداليات برونزية لكندا في أولمبياد 1928 و1932 و1936، ثم تخرج من كلية الطب بجامعة ماكغيل. وخدم نقيبًا في الجيش الكندي خلال الحرب العالمية الثانية، وأصبح طبيبًا في مونتريال وخبيرًا في أمراض المناطق الاستوائية."},"questions":[{"type":"mc","q":{"en":"Who was Phil Edwards?","fr":"Qui était Phil Edwards?"},"options":{"en":["A Canadian track and field champion who won Olympic bronze medals and became a doctor","The commander of the Canadian Corps in 1918","The director of the Canadian Pacific Railway","The first French-Canadian prime minister"],"fr":["Un champion canadien d’athlétisme qui a remporté des médailles de bronze olympiques et est devenu médecin","Le commandant du Corps canadien en 1918","L’administrateur du Chemin de fer Canadien Pacifique","Le premier premier ministre canadien-français"]},"answer":0}]},{"id":"history2-043","topic":"commonwealth","importance":2,"en":"After the First World War, the British Empire evolved into a free association of states known as the British Commonwealth of Nations. Canada remains a leading member of the Commonwealth to this day, together with other successor states of the Empire such as India, Australia, New Zealand, and several African and Caribbean countries.","en_simple":"After the First World War, the British Empire became the British Commonwealth of Nations, a free association of states. Canada is still a leading member, with India, Australia, New Zealand and others.","fr":"Après la Première Guerre mondiale, l’Empire britannique se transforme en une association libre d’États connue sous le nom de Commonwealth britannique des nations. Le Canada demeure aujourd’hui l’un des principaux membres du Commonwealth, avec d’autres États successeurs de l’Empire comme l’Inde, l’Australie et la Nouvelle-Zélande, en plus de plusieurs pays d’Afrique et des Antilles.","tr":{"ar":"بعد الحرب العالمية الأولى، تطورت الإمبراطورية البريطانية إلى رابطة حرة من الدول تُعرف باسم الكومنولث البريطاني للأمم (British Commonwealth of Nations). ولا تزال كندا عضوًا بارزًا في الكومنولث حتى اليوم، إلى جانب دول أخرى خلفت الإمبراطورية مثل الهند وأستراليا ونيوزيلندا وعدة دول أفريقية وكاريبية."},"questions":[{"type":"mc","q":{"en":"After the First World War, the British Empire evolved into what?","fr":"Après la Première Guerre mondiale, en quoi l’Empire britannique s’est-il transformé?"},"options":{"en":["The United Nations","The British Commonwealth of Nations","The League of Nations","The European Union"],"fr":["Les Nations Unies","Le Commonwealth britannique des nations","La Société des Nations","L’Union européenne"]},"answer":1},{"type":"tf","q":{"en":"Canada is a leading member of the Commonwealth today.","fr":"Le Canada est aujourd’hui l’un des principaux membres du Commonwealth."},"answer":true}]},{"id":"history2-044","topic":"great-depression","importance":3,"en":"The “Roaring Twenties” were boom times, with prosperity for businesses and low unemployment. The stock market crash of 1929, however, led to the Great Depression or the “Dirty Thirties.” Unemployment reached 27% in 1933 and many businesses were wiped out. Farmers in Western Canada were hit hardest by low grain prices and a terrible drought.","en_simple":"The 1920s (“Roaring Twenties”) were good times. The stock market crash of 1929 caused the Great Depression (“Dirty Thirties”). Unemployment reached 27% in 1933. Western farmers were hit hardest.","fr":"On appelle les « Années folles » les années 1920, une période de grande prospérité économique et de faible chômage. Les Années folles se terminent toutefois par le krach boursier de 1929 et laissent place à la Grande Dépression, une décennie sombre durant laquelle le chômage atteint 27 pour 100 (en 1933) et de nombreuses entreprises sont anéanties. Les agriculteurs de l’Ouest canadien sont les plus durement touchés, en raison des prix faibles des grains et d’une terrible sécheresse.","tr":{"ar":"كانت «العشرينيات الصاخبة» فترة ازدهار، مع رخاء للأعمال وبطالة منخفضة. لكن انهيار سوق الأسهم عام 1929 أدى إلى الكساد الكبير أو «الثلاثينيات القذرة». وبلغت البطالة 27% عام 1933 وأُفلست شركات كثيرة. وكان مزارعو غرب كندا الأشد تضررًا بسبب انخفاض أسعار الحبوب والجفاف الرهيب."},"questions":[{"type":"mc","q":{"en":"What event led to the Great Depression?","fr":"Quel événement a mené à la Grande Dépression?"},"options":{"en":["The First World War","The stock market crash of 1929","The Boer War","The creation of the Bank of Canada"],"fr":["La Première Guerre mondiale","Le krach boursier de 1929","La guerre des Boers","La création de la Banque du Canada"]},"answer":1},{"type":"mc","q":{"en":"What level did unemployment reach in 1933 during the Great Depression?","fr":"Quel niveau le chômage a-t-il atteint en 1933 pendant la Grande Dépression?"},"options":{"en":["10%","15%","27%","50%"],"fr":["10 %","15 %","27 %","50 %"]},"answer":2},{"type":"mc","q":{"en":"The Great Depression is also known as what?","fr":"Sous quel autre nom la Grande Dépression est-elle connue?"},"options":{"en":["The Roaring Twenties","The Dirty Thirties","The Hungry Forties","The Quiet Revolution"],"fr":["Les Années folles","La décennie sombre des années trente","Les années de la faim","La Révolution tranquille"]},"answer":1}]},{"id":"history2-045","topic":"bank-of-canada","importance":3,"en":"There was growing demand for the government to create a social safety net with minimum wages, a standard work week and programs such as unemployment insurance. The Bank of Canada, a central bank to manage the money supply and bring stability to the financial system, was created in 1934.","en_simple":"People asked for a social safety net: minimum wages, a standard work week, unemployment insurance. The Bank of Canada, the central bank, was created in 1934.","fr":"On réclame de plus en plus du gouvernement qu’il crée un filet de sécurité sociale avec un salaire minimum, une semaine de travail normalisée et des programmes comme l’assurance-chômage. La Banque du Canada, une banque centrale chargée de gérer la masse monétaire et d’apporter la stabilité au système financier, est créée en 1934.","tr":{"ar":"تزايدت المطالبة بأن تنشئ الحكومة شبكة أمان اجتماعي مع حد أدنى للأجور وأسبوع عمل موحّد وبرامج مثل تأمين البطالة. وأُنشئ بنك كندا (Bank of Canada)، وهو بنك مركزي لإدارة المعروض النقدي وتحقيق الاستقرار في النظام المالي، عام 1934."},"questions":[{"type":"mc","q":{"en":"In what year was the Bank of Canada created?","fr":"En quelle année la Banque du Canada a-t-elle été créée?"},"options":{"en":["1929","1934","1939","1945"],"fr":["1929","1934","1939","1945"]},"answer":1},{"type":"mc","q":{"en":"What is the role of the Bank of Canada?","fr":"Quel est le rôle de la Banque du Canada?"},"options":{"en":["To collect income taxes","To manage the money supply and bring stability to the financial system","To lend money to farmers only","To print passports"],"fr":["Percevoir l’impôt sur le revenu","Gérer la masse monétaire et apporter la stabilité au système financier","Prêter de l’argent uniquement aux agriculteurs","Imprimer les passeports"]},"answer":1}]},{"id":"history2-046","topic":"refugees-1939","importance":2,"en":"Immigration dropped and many refugees were turned away, including Jews trying to flee Nazi Germany in 1939.","en_simple":"During the Depression, immigration dropped. Many refugees were turned away, including Jews fleeing Nazi Germany in 1939.","fr":"L’immigration diminue et beaucoup de réfugiés sont refusés, y compris des Juifs essayant de fuir l’Allemagne nazie en 1939.","tr":{"ar":"انخفضت الهجرة ورُفض كثير من اللاجئين، بمن فيهم اليهود الذين حاولوا الفرار من ألمانيا النازية عام 1939."},"questions":[{"type":"tf","q":{"en":"In 1939, Canada turned away Jewish refugees trying to flee Nazi Germany.","fr":"En 1939, le Canada a refusé des réfugiés juifs essayant de fuir l’Allemagne nazie."},"answer":true}]},{"id":"history2-047","topic":"wwii","importance":3,"en":"The Second World War began in 1939 when Adolf Hitler, the National Socialist (Nazi) dictator of Germany, invaded Poland and conquered much of Europe. Canada joined with its democratic allies in the fight to defeat tyranny by force of arms.","en_simple":"The Second World War began in 1939 when Adolf Hitler, the Nazi dictator of Germany, invaded Poland. Canada joined its democratic allies to fight tyranny.","fr":"La Seconde Guerre mondiale débute en 1939, quand Adolf Hitler, le dictateur national-socialiste (nazi) de l’Allemagne, envahit la Pologne et conquiert une grande partie de l’Europe. Le Canada s’unit à ses alliés démocratiques pour combattre et vaincre cette tyrannie par la force des armes.","tr":{"ar":"بدأت الحرب العالمية الثانية عام 1939 عندما غزا أدولف هتلر (Adolf Hitler)، الدكتاتور الاشتراكي القومي (النازي) لألمانيا، بولندا واحتل جزءًا كبيرًا من أوروبا. وانضمت كندا إلى حلفائها الديمقراطيين في القتال لهزيمة الطغيان بقوة السلاح."},"questions":[{"type":"mc","q":{"en":"In what year did the Second World War begin?","fr":"En quelle année la Seconde Guerre mondiale a-t-elle débuté?"},"options":{"en":["1914","1929","1939","1941"],"fr":["1914","1929","1939","1941"]},"answer":2},{"type":"mc","q":{"en":"The Second World War began when Hitler invaded which country?","fr":"La Seconde Guerre mondiale a débuté quand Hitler a envahi quel pays?"},"options":{"en":["France","Belgium","Poland","The Netherlands"],"fr":["La France","La Belgique","La Pologne","Les Pays-Bas"]},"answer":2}]},{"id":"history2-048","topic":"wwii","importance":3,"en":"More than one million Canadians and Newfoundlanders (Newfoundland was a separate British entity) served in the Second World War, out of a population of 11.5 million. This was a high proportion and of these, 44,000 were killed.","en_simple":"More than 1 million Canadians and Newfoundlanders served in the Second World War, out of 11.5 million people. 44,000 were killed.","fr":"Plus d’un million de Canadiens et de Terre-Neuviens (Terre-Neuve est à l’époque une entité britannique distincte) participent à la Seconde Guerre mondiale, soit une proportion élevée de la population de 11,5 millions d’habitants, et de ce nombre, 44 000 sont tués.","tr":{"ar":"خدم أكثر من مليون كندي ونيوفاوندلاندي (كانت نيوفاوندلاند كيانًا بريطانيًا منفصلًا) في الحرب العالمية الثانية، من إجمالي سكان يبلغ 11.5 مليون نسمة. وكانت هذه نسبة عالية، وقُتل منهم 44,000."},"questions":[{"type":"mc","q":{"en":"How many Canadians were killed in the Second World War?","fr":"Combien de Canadiens ont été tués pendant la Seconde Guerre mondiale?"},"options":{"en":["10,000","44,000","60,000","110,000"],"fr":["10 000","44 000","60 000","110 000"]},"answer":1},{"type":"mc","q":{"en":"How many Canadians and Newfoundlanders served in the Second World War?","fr":"Combien de Canadiens et de Terre-Neuviens ont participé à la Seconde Guerre mondiale?"},"options":{"en":["More than 600,000","More than one million","More than two million","More than 11.5 million"],"fr":["Plus de 600 000","Plus d’un million","Plus de deux millions","Plus de 11,5 millions"]},"answer":1},{"type":"tf","q":{"en":"During the Second World War, Newfoundland was already a province of Canada.","fr":"Pendant la Seconde Guerre mondiale, Terre-Neuve était déjà une province du Canada."},"answer":false}]},{"id":"history2-049","topic":"hong-kong-dieppe","importance":3,"en":"The Canadians fought bravely and suffered losses in the unsuccessful defence of Hong Kong (1941) from attack by Imperial Japan, and in a failed raid on Nazi-controlled Dieppe on the coast of France (1942).","en_simple":"Canadians suffered losses in the failed defence of Hong Kong against Japan (1941) and in the failed raid on Dieppe, France (1942).","fr":"Les Canadiens combattent bravement et subissent des pertes dans la défense infructueuse de Hong Kong (1941), attaquée par l’empire du Japon, et dans un raid raté contre les nazis à Dieppe, sur la côte française (1942).","tr":{"ar":"قاتل الكنديون بشجاعة وتكبدوا خسائر في الدفاع الفاشل عن هونغ كونغ (1941) ضد هجوم اليابان الإمبراطورية، وفي غارة فاشلة على دييب (Dieppe) الخاضعة للنازيين على الساحل الفرنسي (1942)."},"questions":[{"type":"mc","q":{"en":"In what year did Canadians take part in the failed raid on Dieppe?","fr":"En quelle année les Canadiens ont-ils participé au raid raté de Dieppe?"},"options":{"en":["1940","1941","1942","1944"],"fr":["1940","1941","1942","1944"]},"answer":2},{"type":"mc","q":{"en":"In 1941, Canadians suffered losses in the unsuccessful defence of which place against Imperial Japan?","fr":"En 1941, les Canadiens ont subi des pertes dans la défense infructueuse de quel endroit contre l’empire du Japon?"},"options":{"en":["Hong Kong","Singapore","Dieppe","Vancouver Island"],"fr":["Hong Kong","Singapour","Dieppe","L’île de Vancouver"]},"answer":0}]},{"id":"history2-050","topic":"d-day","importance":3,"en":"Canadians took part in the liberation of Italy in 1943–44. In the epic invasion of Normandy in northern France on June 6, 1944, known as D-Day, 15,000 Canadian troops stormed and captured Juno Beach from the German Army. Approximately one in ten Allied soldiers on D-Day was Canadian.","en_simple":"Canadians helped liberate Italy in 1943–44. On D-Day, June 6, 1944, 15,000 Canadian troops captured Juno Beach in Normandy. About 1 in 10 Allied soldiers on D-Day was Canadian.","fr":"Les Canadiens participent à la libération de l’Italie en 1943-1944. Le 6 juin 1944, date connue sous le nom de « jour J », prenant part dans le Nord de la France à l’invasion épique de la Normandie, 15 000 soldats canadiens se lancent à l’assaut de la plage Juno et l’arrachent à l’armée allemande. Ce jour-là, environ un soldat allié sur dix est canadien.","tr":{"ar":"شارك الكنديون في تحرير إيطاليا في 1943–44. وفي الغزو الملحمي لنورماندي في شمال فرنسا يوم 6 يونيو 1944، المعروف بيوم الإنزال (D-Day)، اقتحم 15,000 جندي كندي شاطئ جونو (Juno Beach) واستولوا عليه من الجيش الألماني. وكان نحو واحد من كل عشرة جنود من الحلفاء في ذلك اليوم كنديًا."},"questions":[{"type":"mc","q":{"en":"Which beach did Canadian troops capture on D-Day, June 6, 1944?","fr":"Quelle plage les soldats canadiens ont-ils prise le jour J, le 6 juin 1944?"},"options":{"en":["Omaha Beach","Juno Beach","Sword Beach","Utah Beach"],"fr":["La plage Omaha","La plage Juno","La plage Sword","La plage Utah"]},"answer":1},{"type":"mc","q":{"en":"What is the date of D-Day?","fr":"Quelle est la date du jour J?"},"options":{"en":["May 8, 1945","August 14, 1945","June 6, 1944","November 11, 1918"],"fr":["Le 8 mai 1945","Le 14 août 1945","Le 6 juin 1944","Le 11 novembre 1918"]},"answer":2},{"type":"mc","q":{"en":"How many Canadian troops stormed Juno Beach on D-Day?","fr":"Combien de soldats canadiens se sont lancés à l’assaut de la plage Juno le jour J?"},"options":{"en":["5,000","15,000","44,000","130,000"],"fr":["5 000","15 000","44 000","130 000"]},"answer":1},{"type":"tf","q":{"en":"Approximately one in ten Allied soldiers on D-Day was Canadian.","fr":"Environ un soldat allié sur dix le jour J était canadien."},"answer":true}]},{"id":"history2-051","topic":"netherlands-ve-day","importance":3,"en":"The Canadian Army liberated the Netherlands in 1944–45 and helped force the German surrender of May 8, 1945, bringing to an end six years of war in Europe.","en_simple":"The Canadian Army freed the Netherlands in 1944–45. Germany surrendered on May 8, 1945, ending 6 years of war in Europe.","fr":"L’Armée canadienne libère les Pays-Bas en 1944-1945 et c’est en partie grâce à elle que les Allemands sont forcés de se rendre le 8 mai 1945, mettant ainsi fin à six années de guerre en Europe.","tr":{"ar":"حرّر الجيش الكندي هولندا في 1944–45 وساعد في إجبار ألمانيا على الاستسلام في 8 مايو 1945، منهيًا ست سنوات من الحرب في أوروبا."},"questions":[{"type":"mc","q":{"en":"Which country did the Canadian Army liberate in 1944–45?","fr":"Quel pays l’Armée canadienne a-t-elle libéré en 1944-1945?"},"options":{"en":["Belgium","Poland","The Netherlands","Denmark"],"fr":["La Belgique","La Pologne","Les Pays-Bas","Le Danemark"]},"answer":2},{"type":"mc","q":{"en":"On what date did Germany surrender, ending the war in Europe?","fr":"À quelle date l’Allemagne s’est-elle rendue, mettant fin à la guerre en Europe?"},"options":{"en":["June 6, 1944","May 8, 1945","August 14, 1945","November 11, 1945"],"fr":["Le 6 juin 1944","Le 8 mai 1945","Le 14 août 1945","Le 11 novembre 1945"]},"answer":1}]},{"id":"history2-052","topic":"rcaf","importance":3,"en":"The Royal Canadian Air Force (RCAF) took part in the Battle of Britain and provided a high proportion of Commonwealth aircrew in bombers and fighter planes over Europe. Canada contributed more to the Allied air effort than any other Commonwealth country, with over 130,000 Allied air crew trained in Canada under the British Commonwealth Air Training Plan.","en_simple":"The Royal Canadian Air Force (RCAF) fought in the Battle of Britain. Over 130,000 Allied air crew were trained in Canada under the British Commonwealth Air Training Plan.","fr":"L’Aviation royale du Canada participe à la bataille d’Angleterre et fournit bon nombre des membres d’équipage du Commonwealth pour les bombardiers et les chasseurs en Europe. Le Canada contribue plus que tout autre pays du Commonwealth à l’effort aérien des Alliés; en effet, plus de 130 000 membres d’équipage alliés sont formés au Canada dans le cadre du Programme d’entraînement aérien du Commonwealth britannique.","tr":{"ar":"شارك سلاح الجو الملكي الكندي (RCAF) في معركة بريطانيا وقدّم نسبة عالية من أطقم طائرات الكومنولث في القاذفات والمقاتلات فوق أوروبا. وساهمت كندا في الجهد الجوي للحلفاء أكثر من أي دولة أخرى في الكومنولث، إذ تدرّب في كندا أكثر من 130,000 من أطقم الطائرات الحليفة ضمن خطة تدريب الطيران للكومنولث البريطاني."},"questions":[{"type":"mc","q":{"en":"How many Allied air crew were trained in Canada under the British Commonwealth Air Training Plan?","fr":"Combien de membres d’équipage alliés ont été formés au Canada dans le cadre du Programme d’entraînement aérien du Commonwealth britannique?"},"options":{"en":["Over 15,000","Over 44,000","Over 130,000","Over 600,000"],"fr":["Plus de 15 000","Plus de 44 000","Plus de 130 000","Plus de 600 000"]},"answer":2},{"type":"mc","q":{"en":"In which air battle did the Royal Canadian Air Force take part?","fr":"À quelle bataille aérienne l’Aviation royale du Canada a-t-elle participé?"},"options":{"en":["The Battle of the Atlantic","The Battle of Britain","The Battle of Amiens","The Battle of Vimy Ridge"],"fr":["La bataille de l’Atlantique","La bataille d’Angleterre","La bataille d’Amiens","La bataille de la crête de Vimy"]},"answer":1}]},{"id":"history2-053","topic":"rcn","importance":3,"en":"The Royal Canadian Navy (RCN) saw its finest hour in the Battle of the Atlantic, protecting convoys of merchant ships against German submarines. Canada’s Merchant Navy helped to feed, clothe and resupply Britain. At the end of the Second World War, Canada had the third-largest navy in the world.","en_simple":"The Royal Canadian Navy (RCN) fought in the Battle of the Atlantic, protecting convoys from German submarines. At the end of the Second World War, Canada had the 3rd-largest navy in the world.","fr":"La Marine royale du Canada connaît son moment de gloire dans la bataille de l’Atlantique, alors qu’elle protège des convois de navires marchands contre les sous-marins allemands. La marine marchande du Canada aide à nourrir, à vêtir et à réapprovisionner la Grande-Bretagne. À la fin de la Seconde Guerre mondiale, le Canada dispose de la troisième marine en importance au monde.","tr":{"ar":"شهدت البحرية الملكية الكندية (RCN) أعظم لحظاتها في معركة الأطلسي، بحماية قوافل السفن التجارية من الغواصات الألمانية. وساعدت البحرية التجارية الكندية في إطعام بريطانيا وكسوتها وإعادة تموينها. وفي نهاية الحرب العالمية الثانية، كانت لدى كندا ثالث أكبر بحرية في العالم."},"questions":[{"type":"mc","q":{"en":"In which battle did the Royal Canadian Navy see its finest hour?","fr":"Dans quelle bataille la Marine royale du Canada a-t-elle connu son moment de gloire?"},"options":{"en":["The Battle of Britain","The Battle of the Atlantic","The Battle of Hong Kong","The Battle of Dieppe"],"fr":["La bataille d’Angleterre","La bataille de l’Atlantique","La bataille de Hong Kong","La bataille de Dieppe"]},"answer":1},{"type":"mc","q":{"en":"At the end of the Second World War, how did Canada’s navy rank in the world?","fr":"À la fin de la Seconde Guerre mondiale, quel rang la marine du Canada occupait-elle dans le monde?"},"options":{"en":["The largest","The second-largest","The third-largest","The tenth-largest"],"fr":["La plus importante","La deuxième en importance","La troisième en importance","La dixième en importance"]},"answer":2},{"type":"tf","q":{"en":"In the Battle of the Atlantic, the Royal Canadian Navy protected convoys against German submarines.","fr":"Dans la bataille de l’Atlantique, la Marine royale du Canada protégeait les convois contre les sous-marins allemands."},"answer":true}]},{"id":"history2-054","topic":"pacific-war","importance":3,"en":"In the Pacific war, Japan invaded the Aleutian Islands, attacked a lighthouse on Vancouver Island, launched fire balloons over B.C. and the Prairies, and grossly maltreated Canadian prisoners of war captured at Hong Kong. Japan surrendered on August 14, 1945 — the end of four years of war in the Pacific.","en_simple":"Japan attacked a lighthouse on Vancouver Island and sent fire balloons over B.C. and the Prairies. Japan surrendered on August 14, 1945, after 4 years of war in the Pacific.","fr":"Durant la guerre du Pacifique, le Japon envahit les îles Aléoutiennes, attaque un phare sur l’île de Vancouver, lance des ballons piégés au-dessus de la Colombie-Britannique et des Prairies et maltraite gravement des prisonniers de guerre canadiens capturés à Hong Kong. Le Japon capitule le 14 août 1945, mettant ainsi fin à quatre années de guerre dans le Pacifique.","tr":{"ar":"في حرب المحيط الهادئ، غزت اليابان جزر ألوشيان، وهاجمت منارة في جزيرة فانكوفر، وأطلقت بالونات حارقة فوق كولومبيا البريطانية والبراري، وأساءت معاملة أسرى الحرب الكنديين الذين أُسروا في هونغ كونغ بشكل فظيع. واستسلمت اليابان في 14 أغسطس 1945 — نهاية أربع سنوات من الحرب في المحيط الهادئ."},"questions":[{"type":"mc","q":{"en":"On what date did Japan surrender in 1945?","fr":"À quelle date le Japon a-t-il capitulé en 1945?"},"options":{"en":["May 8, 1945","June 6, 1945","August 14, 1945","November 11, 1945"],"fr":["Le 8 mai 1945","Le 6 juin 1945","Le 14 août 1945","Le 11 novembre 1945"]},"answer":2},{"type":"tf","q":{"en":"During the Second World War, Japan attacked a lighthouse on Vancouver Island.","fr":"Pendant la Seconde Guerre mondiale, le Japon a attaqué un phare sur l’île de Vancouver."},"answer":true}]},{"id":"history2-055","topic":"japanese-canadians","importance":3,"en":"Regrettably, the state of war and public opinion in B.C. led to the forcible relocation of Canadians of Japanese origin by the federal government and the sale of their property without compensation. This occurred even though the military and the RCMP told Ottawa that they posed little danger to Canada. The Government of Canada apologized in 1988 for wartime wrongs and compensated the victims.","en_simple":"During the war, the federal government forced Canadians of Japanese origin to relocate and sold their property without paying them, even though the military and RCMP said they were little danger. Canada apologized in 1988 and paid compensation.","fr":"Malheureusement, compte tenu de l’état de guerre et sous la pression de l’opinion publique en Colombie-Britannique, le gouvernement fédéral déplace contre leur gré de nombreux Canadiens d’origine japonaise et procède à la vente de leurs biens sans les compenser, même si l’armée et la GRC soutiennent que ces personnes présentent peu de danger pour le pays. En 1988, le gouvernement du Canada a présenté ses excuses aux Canadiens d’origine japonaise pour les torts causés en temps de guerre et a indemnisé les victimes.","tr":{"ar":"للأسف، أدت حالة الحرب والرأي العام في كولومبيا البريطانية إلى قيام الحكومة الفيدرالية بالترحيل القسري للكنديين من أصل ياباني وبيع ممتلكاتهم دون تعويض. وحدث ذلك رغم أن الجيش وشرطة الخيالة الملكية أبلغا أوتاوا بأنهم لا يشكلون خطرًا يُذكر على كندا. واعتذرت حكومة كندا عام 1988 عن أخطاء زمن الحرب وعوّضت الضحايا."},"questions":[{"type":"mc","q":{"en":"In what year did the Government of Canada apologize for the wartime relocation of Japanese Canadians?","fr":"En quelle année le gouvernement du Canada a-t-il présenté ses excuses pour le déplacement des Canadiens d’origine japonaise en temps de guerre?"},"options":{"en":["1945","1971","1988","2006"],"fr":["1945","1971","1988","2006"]},"answer":2},{"type":"tf","q":{"en":"The military and the RCMP told Ottawa that Japanese Canadians posed a serious danger to Canada.","fr":"L’armée et la GRC ont dit à Ottawa que les Canadiens d’origine japonaise présentaient un grave danger pour le Canada."},"answer":false}]}]},{"unit":"modern","order":5,"title":{"en":"Modern Canada","fr":"Le Canada moderne"},"title_tr":{"ar":"كندا الحديثة"},"source":{"en":"08-modern-canada","fr":"08-canada-moderne"},"cards":[{"id":"modern-001","topic":"postwar-trade","importance":2,"en":"Postwar Canada enjoyed record prosperity and material progress. The world’s restrictive trading policies in the Depression era were opened up by such treaties as the General Agreement on Tariffs and Trade (GATT), now the World Trade Organization (WTO).","en_simple":"After World War II, Canada became very prosperous. The GATT trade treaty (now the WTO) opened up world trade after the Depression.","fr":"Le Canada d’après-guerre connaît une prospérité record et d’importants progrès. Des traités comme l’Accord général sur les tarifs douaniers et le commerce (GATT), aujourd’hui l’Organisation mondiale du commerce (OMC), permettent d’assouplir les politiques commerciales restrictives appliquées partout dans le monde pendant la Grande Dépression.","tr":{"ar":"شهدت كندا بعد الحرب ازدهارًا قياسيًا وتقدمًا ماديًا. وقد فُتحت السياسات التجارية التقييدية التي سادت العالم في عهد الكساد الكبير بفضل معاهدات مثل الاتفاقية العامة للتعريفات الجمركية والتجارة (GATT)، التي أصبحت اليوم منظمة التجارة العالمية (WTO)."},"questions":[{"type":"mc","q":{"en":"What is the General Agreement on Tariffs and Trade (GATT) now called?","fr":"Comment s’appelle aujourd’hui l’Accord général sur les tarifs douaniers et le commerce (GATT)?"},"options":{"en":["The United Nations (UN)","The World Trade Organization (WTO)","NORAD","La Francophonie"],"fr":["L’Organisation des Nations Unies (ONU)","L’Organisation mondiale du commerce (OMC)","NORAD","La Francophonie"]},"answer":1},{"type":"tf","q":{"en":"Postwar Canada enjoyed record prosperity and material progress.","fr":"Le Canada d’après-guerre a connu une prospérité record et d’importants progrès."},"answer":true}]},{"id":"modern-002","topic":"oil-alberta","importance":3,"en":"The discovery of oil in Alberta in 1947 began Canada’s modern energy industry.","en_simple":"Oil was discovered in Alberta in 1947. This started Canada's modern energy industry.","fr":"La découverte de gisements de pétrole en Alberta en 1947 lance l’industrie énergétique moderne du Canada.","tr":{"ar":"بدأت صناعة الطاقة الحديثة في كندا مع اكتشاف النفط في ألبرتا (Alberta) عام 1947."},"questions":[{"type":"mc","q":{"en":"In what year was oil discovered in Alberta, beginning Canada’s modern energy industry?","fr":"En quelle année a-t-on découvert du pétrole en Alberta, lançant l’industrie énergétique moderne du Canada?"},"options":{"en":["1927","1940","1947","1951"],"fr":["1927","1940","1947","1951"]},"answer":2},{"type":"mc","q":{"en":"The discovery of oil in which province began Canada’s modern energy industry?","fr":"La découverte de pétrole dans quelle province a lancé l’industrie énergétique moderne du Canada?"},"options":{"en":["Ontario","Alberta","Quebec","Nova Scotia"],"fr":["L’Ontario","L’Alberta","Le Québec","La Nouvelle-Écosse"]},"answer":1}]},{"id":"modern-003","topic":"1951-necessities","importance":3,"en":"In 1951, for the first time, a majority of Canadians were able to afford adequate food, shelter and clothing.","en_simple":"In 1951, for the first time, most Canadians could afford enough food, housing and clothing.","fr":"En 1951, pour la première fois, une majorité de Canadiens peuvent se nourrir, se loger et se vêtir de manière adéquate.","tr":{"ar":"في عام 1951، ولأول مرة، أصبح بإمكان غالبية الكنديين تحمّل تكاليف الغذاء والمأوى والملبس الكافية."},"questions":[{"type":"mc","q":{"en":"In what year, for the first time, could a majority of Canadians afford adequate food, shelter and clothing?","fr":"En quelle année, pour la première fois, une majorité de Canadiens ont-ils pu se nourrir, se loger et se vêtir de manière adéquate?"},"options":{"en":["1945","1951","1960","1970"],"fr":["1945","1951","1960","1970"]},"answer":1}]},{"id":"modern-004","topic":"strong-economy","importance":3,"en":"Between 1945 and 1970, as Canada drew closer to the United States and other trading partners, the country enjoyed one of the strongest economies among industrialized nations. Today, Canadians enjoy one of the world’s highest standards of living—maintained by the hard work of Canadians and by trade with other nations, in particular the United States.","en_simple":"From 1945 to 1970, Canada had one of the strongest economies in the industrialized world. Today Canadians have one of the highest standards of living, thanks to hard work and trade, especially with the United States.","fr":"Entre 1945 et 1970, le Canada se rapproche des États-Unis et d’autres partenaires commerciaux, et l’économie canadienne devient l’une des plus florissantes parmi les nations industrialisées. Aujourd’hui, le niveau de vie des Canadiens – maintenu par leur travail acharné et leurs échanges commerciaux avec d’autres pays, notamment les États-Unis – est l’un des plus élevés du monde.","tr":{"ar":"بين عامي 1945 و1970، ومع اقتراب كندا من الولايات المتحدة وشركاء تجاريين آخرين، تمتعت البلاد بواحد من أقوى الاقتصادات بين الدول الصناعية. واليوم يتمتع الكنديون بواحد من أعلى مستويات المعيشة في العالم، يحافظ عليه عملهم الجاد وتجارتهم مع الدول الأخرى، ولا سيما الولايات المتحدة."},"questions":[{"type":"mc","q":{"en":"Between which years did Canada enjoy one of the strongest economies among industrialized nations?","fr":"Entre quelles années l’économie canadienne est-elle devenue l’une des plus florissantes parmi les nations industrialisées?"},"options":{"en":["1914–1918","1929–1939","1945–1970","1980–1995"],"fr":["1914-1918","1929-1939","1945-1970","1980-1995"]},"answer":2},{"type":"mc","q":{"en":"Canada’s high standard of living is maintained by hard work and by trade with other nations, in particular which country?","fr":"Le niveau de vie élevé des Canadiens est maintenu par leur travail et leurs échanges commerciaux, notamment avec quel pays?"},"options":{"en":["The United Kingdom","France","The United States","Japan"],"fr":["Le Royaume-Uni","La France","Les États-Unis","Le Japon"]},"answer":2}]},{"id":"modern-005","topic":"canada-health-act","importance":2,"en":"As prosperity grew, so did the ability to support social assistance programs. The Canada Health Act ensures common elements and a basic standard of coverage.","en_simple":"As Canada got richer, it could pay for social programs. The Canada Health Act guarantees a basic standard of health coverage.","fr":"Plus la prospérité du Canada grandit, plus croît sa capacité de soutenir ses programmes d’aide sociale. On adopte la Loi canadienne sur la santé, qui garantit des éléments communs et une norme de protection de base.","tr":{"ar":"مع نمو الازدهار، نمت القدرة على دعم برامج المساعدة الاجتماعية. ويضمن قانون الصحة الكندي (Canada Health Act) عناصر مشتركة ومعيارًا أساسيًا للتغطية الصحية."},"questions":[{"type":"mc","q":{"en":"Which law ensures common elements and a basic standard of health coverage in Canada?","fr":"Quelle loi garantit des éléments communs et une norme de protection de base en matière de santé au Canada?"},"options":{"en":["The Official Languages Act","The Canada Health Act","The Citizenship Act","The Constitution Act"],"fr":["La Loi sur les langues officielles","La Loi canadienne sur la santé","La Loi sur la citoyenneté","La Loi constitutionnelle"]},"answer":1}]},{"id":"modern-006","topic":"employment-insurance","importance":3,"en":"Unemployment insurance (now called “employment insurance”) was introduced by the federal government in 1940.","en_simple":"The federal government started unemployment insurance in 1940. Today it is called employment insurance.","fr":"Le gouvernement fédéral crée, en 1940, l’assurance-chômage (maintenant appelée « assurance-emploi »).","tr":{"ar":"استحدثت الحكومة الفيدرالية تأمين البطالة (الذي يُسمّى الآن «تأمين العمل») عام 1940."},"questions":[{"type":"mc","q":{"en":"When was unemployment insurance introduced by the federal government?","fr":"En quelle année le gouvernement fédéral a-t-il créé l’assurance-chômage?"},"options":{"en":["1927","1940","1951","1965"],"fr":["1927","1940","1951","1965"]},"answer":1},{"type":"mc","q":{"en":"What is unemployment insurance now called?","fr":"Comment s’appelle maintenant l’assurance-chômage?"},"options":{"en":["Old Age Security","Employment insurance","The Canada Pension Plan","Welfare"],"fr":["La sécurité de la vieillesse","L’assurance-emploi","Le Régime de pensions du Canada","L’aide sociale"]},"answer":1}]},{"id":"modern-007","topic":"old-age-security","importance":3,"en":"Old Age Security was devised as early as 1927, and the Canada and Quebec Pension Plans in 1965.","en_simple":"Old Age Security started in 1927. The Canada Pension Plan and Quebec Pension Plan started in 1965.","fr":"Le Programme de la sécurité de la vieillesse remonte à 1927; le Régime de pensions du Canada et le Régime des rentes du Québec existent depuis 1965.","tr":{"ar":"وُضع برنامج ضمان الشيخوخة (Old Age Security) منذ عام 1927، وأُنشئ نظاما معاشات كندا وكيبيك عام 1965."},"questions":[{"type":"mc","q":{"en":"In what year was Old Age Security devised?","fr":"En quelle année le Programme de la sécurité de la vieillesse a-t-il été créé?"},"options":{"en":["1965","1940","1927","1947"],"fr":["1965","1940","1927","1947"]},"answer":2},{"type":"mc","q":{"en":"When were the Canada and Quebec Pension Plans introduced?","fr":"En quelle année le Régime de pensions du Canada et le Régime des rentes du Québec ont-ils été créés?"},"options":{"en":["1927","1940","1951","1965"],"fr":["1927","1940","1951","1965"]},"answer":3},{"type":"tf","q":{"en":"The Canada Pension Plan was introduced in 1927.","fr":"Le Régime de pensions du Canada a été créé en 1927."},"answer":false}]},{"id":"modern-008","topic":"public-education","importance":2,"en":"Publicly funded education is provided by the provinces and territories.","en_simple":"The provinces and territories provide public education.","fr":"De plus, les provinces et les territoires offrent une éducation subventionnée par l’État.","tr":{"ar":"تقدّم المقاطعات والأقاليم التعليم الممول من الدولة."},"questions":[{"type":"mc","q":{"en":"Who provides publicly funded education in Canada?","fr":"Qui offre l’éducation subventionnée par l’État au Canada?"},"options":{"en":["The federal government","The provinces and territories","The United Nations","Municipal police"],"fr":["Le gouvernement fédéral","Les provinces et les territoires","Les Nations Unies","La police municipale"]},"answer":1}]},{"id":"modern-009","topic":"cold-war","importance":2,"en":"The Cold War began when several liberated countries of eastern Europe became part of a Communist bloc controlled by the Soviet Union under the dictator Josef Stalin.","en_simple":"The Cold War began when countries in eastern Europe became part of a Communist bloc controlled by the Soviet Union, led by the dictator Josef Stalin.","fr":"La Guerre froide débute quand plusieurs pays libérés d’Europe de l’Est deviennent membres d’un bloc communiste contrôlé par l’Union soviétique sous la dictature de Joseph Staline.","tr":{"ar":"بدأت الحرب الباردة عندما أصبحت عدة دول محرَّرة في أوروبا الشرقية جزءًا من كتلة شيوعية يسيطر عليها الاتحاد السوفيتي بقيادة الديكتاتور جوزيف ستالين (Josef Stalin)."},"questions":[{"type":"mc","q":{"en":"Who was the dictator of the Soviet Union when the Cold War began?","fr":"Qui était le dictateur de l’Union soviétique au début de la Guerre froide?"},"options":{"en":["Adolf Hitler","Josef Stalin","Napoleon","Mao Zedong"],"fr":["Adolf Hitler","Joseph Staline","Napoléon","Mao Zedong"]},"answer":1}]},{"id":"modern-010","topic":"nato-norad","importance":3,"en":"Canada joined with other democratic countries of the West to form the North Atlantic Treaty Organization (NATO), a military alliance, and with the United States in the North American
