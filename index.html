eewatin","Frobisher Bay","Resolute","Fort Churchill"],"fr":["Keewatin","Frobisher Bay","Resolute","Fort Churchill"]},"answer":1},{"type":"mc","q":{"en":"Who was Martin Frobisher?","fr":"Qui était Martin Frobisher?"},"options":{"en":["A French fur trader","A Gold Rush poet","An English explorer who penetrated the uncharted Arctic for Queen Elizabeth I in 1576","The first premier of Nunavut"],"fr":["Un commerçant de fourrures français","Un poète de la ruée vers l’or","Un explorateur anglais qui s’est aventuré dans l’Arctique non cartographié pour la reine Elizabeth 1re en 1576","Le premier premier ministre du Nunavut"]},"answer":2}]},{"id":"regions-066","topic":"nunavut","importance":3,"en":"The 19-member Legislative Assembly of Nunavut chooses a premier and ministers by consensus. The population is about 85% Inuit, and Inuktitut is an official language and the first language in schools.","en_simple":"Nunavut's Legislative Assembly has 19 members. They choose the premier and ministers by consensus. About 85% of people in Nunavut are Inuit. Inuktitut is an official language and the first language in schools.","fr":"Les 19 membres de l’Assemblée législative choisissent un premier ministre et des ministres par consensus. La population est composée à environ 85 pour 100 d’Inuits. L’inuktitut y est une langue officielle et la principale langue d’enseignement.","tr":{"ar":"تختار الجمعية التشريعية لنونافوت المؤلفة من 19 عضوًا رئيس الوزراء والوزراء بالتوافق. ونحو 85% من السكان من الإنويت، والإنوكتيتوت لغة رسمية واللغة الأولى في المدارس."},"questions":[{"type":"mc","q":{"en":"How does Nunavut’s Legislative Assembly choose a premier and ministers?","fr":"Comment l’Assemblée législative du Nunavut choisit-elle un premier ministre et des ministres?"},"options":{"en":["By a vote of the whole population","By consensus","They are appointed by the Governor General","By party leadership conventions"],"fr":["Par un vote de toute la population","Par consensus","Ils sont nommés par le gouverneur général","Par des congrès de direction de parti"]},"answer":1},{"type":"mc","q":{"en":"Approximately what percentage of Nunavut’s population is Inuit?","fr":"Environ quel pourcentage de la population du Nunavut est inuit?"},"options":{"en":["15%","40%","50%","85%"],"fr":["15 pour 100","40 pour 100","50 pour 100","85 pour 100"]},"answer":3},{"type":"mc","q":{"en":"How many members does Nunavut’s Legislative Assembly have?","fr":"Combien de membres compte l’Assemblée législative du Nunavut?"},"options":{"en":["10","19","45","85"],"fr":["10","19","45","85"]},"answer":1},{"type":"tf","q":{"en":"Inuktitut is an official language in Nunavut and the first language in schools.","fr":"L’inuktitut est une langue officielle au Nunavut et la principale langue d’enseignement."},"answer":true}]},{"id":"regions-067","topic":"canadian-rangers","importance":2,"en":"The Canadian Rangers, part of the Canadian Forces Reserves (militia), play a key role in Canada’s vast north. Drawing on indigenous knowledge and experience, the Rangers travel by snowmobile in the winter and all-terrain vehicles in the summer from Resolute to the Magnetic North Pole, and keep the flag flying in Canada’s Arctic.","en_simple":"The Canadian Rangers are part of the Canadian Forces Reserves (militia). They patrol the North by snowmobile in winter and all-terrain vehicle in summer, from Resolute to the Magnetic North Pole.","fr":"Affrontant des conditions climatiques difficiles dans une région isolée, les Rangers canadiens – qui font partie de la Réserve (milice) des Forces canadiennes – y jouent un rôle clé. De Resolute jusqu’au pôle Nord magnétique, l’hiver en motoneige et l’été en véhicule tout-terrain, ils utilisent leur connaissance et leur expérience indigènes du territoire pour s’assurer que le drapeau du Canada ne cesse de flotter au-dessus de l’Arctique canadien.","tr":{"ar":"يؤدي الرينجرز الكنديون (Canadian Rangers)، وهم جزء من احتياطي القوات الكندية (الميليشيا)، دورًا رئيسيًا في شمال كندا الشاسع. وبالاعتماد على معرفة السكان الأصليين وخبرتهم، يتنقل الرينجرز بالزلاجات الآلية في الشتاء والمركبات لجميع التضاريس في الصيف من ريزولوت إلى القطب الشمالي المغناطيسي، ويُبقون العلم مرفوعًا في القطب الشمالي الكندي."},"questions":[{"type":"mc","q":{"en":"What are the Canadian Rangers?","fr":"Que sont les Rangers canadiens?"},"options":{"en":["A police force in the Yukon","Part of the Canadian Forces Reserves (militia) that patrols Canada’s north","A hockey team from Nunavut","Park wardens in Banff National Park"],"fr":["Un corps de police au Yukon","Une composante de la Réserve (milice) des Forces canadiennes qui patrouille le Nord du Canada","Une équipe de hockey du Nunavut","Des gardiens du parc national Banff"]},"answer":1},{"type":"mc","q":{"en":"How do the Canadian Rangers travel in winter?","fr":"Comment les Rangers canadiens se déplacent-ils en hiver?"},"options":{"en":["By snowmobile","By all-terrain vehicle","By dog sled","By helicopter"],"fr":["En motoneige","En véhicule tout-terrain","En traîneau à chiens","En hélicoptère"]},"answer":0}]}]}];

function isLearned(id){const c=S.cards[id];return !!c&&c.box>=1;}
function isMastered(id){const c=S.cards[id];return !!c&&c.box>=4;}
function isDue(id){const c=S.cards[id];return !!c&&c.seen>0&&c.box<5&&c.due<=Date.now();}
function mark(id,ok){const c=cs(id);c.seen++;if(ok){c.right++;c.box=Math.min(5,c.box+1);}else{c.wrong++;c.box=0;}
  c.due=ok?Date.now()+INTERVALS[c.box]*DAY:Date.now();S.xp+=ok?10:2;bumpDay(1);save();}
function unitStats(u){let learned=0,mastered=0,due=0;u.cards.forEach(c=>{if(isLearned(c.id))learned++;if(isMastered(c.id))mastered++;if(isDue(c.id))due++;});return {learned,mastered,due,total:u.cards.length,done:learned===u.cards.length};}
function allUnitsDone(){return DATA.every(u=>unitStats(u).done);}
function dueIds(){return ALL_IDS.filter(isDue);}

/* ---------- utils ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function seeded(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
let toastT;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1800);}
function applyLangUI(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById('langEN').setAttribute('aria-pressed',S.lang==='en');document.getElementById('langFR').setAttribute('aria-pressed',S.lang==='fr');document.documentElement.lang=S.lang;}
function setLang(l){S.lang=l;save();applyLangUI();render();}
function applyTheme(){document.documentElement.setAttribute('data-theme','light');}

/* ---------- speech ----------
   Audio sources, in order of preference:
   1. audio/manifest.json → real recordings (your own voice from the Studio page, or neural clips from tools/make_audio.py):
      cards[id] = sentence clip, slow[id] = slow reading, words[slug] = one clip per word (slow mode plays them one by one).
   2. The device's own speech voices, ranked so natural female English voices win; the learner can pick one in Settings. */
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices();}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(route.name==='settings')render();};}
const FEMALE=/samantha|karen|moira|tessa|fiona|victoria|allison|ava|susan|zoe|nicky|female|clara|jenny|aria|sonia|libby|michelle|emma|natasha|heather|linda|zira|hazel|amy|joanna|salli|kendra|kimberly|olivia|catherine|serena|martha/i;
const MALE=/male|daniel|alex|fred|tom|david|mark|george|james|ryan|guy|liam|brian|matthew|joey|justin|kevin|oliver|aaron|arthur|rishi|gordon|lee|thomas/i;
function englishVoices(){return voices.filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en');}
function scoreVoice(v){let s=0;const n=v.name;if(/natural|neural|online|premium|enhanced|siri/i.test(n))s+=40;if(/google/i.test(n))s+=25;if(FEMALE.test(n))s+=30;else if(!MALE.test(n))s+=8;if(/en[-_]CA/i.test(v.lang))s+=12;else if(/en[-_](US|GB)/i.test(v.lang))s+=6;if(/espeak|compact|novelty|bad news|bells|whisper|zarvox|trinoids|cellos|bubbles|boing|deranged|hysterical|organ|wobble|jester|junior|ralph|albert/i.test(n))s-=60;return s;}
function pickVoice(){const en=englishVoices();if(!en.length)return null;return en.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0];}
const AUD={manifest:null,playing:false,token:0,player:null};
(async()=>{try{const r=await fetch('audio/manifest.json',{cache:'no-store'});if(r.ok){const m=await r.json();AUD.manifest=m.cards?m:{cards:m,words:{},slow:{}};}}catch(e){AUD.manifest=null;}})();
function wordSlug(w){return w.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9'\-àâçéèêëîïôûùüÿœæ]/g,'');}
function setPlayingUI(on){AUD.playing=on;document.querySelectorAll('.audio .play').forEach(b=>{b.classList.toggle('playing',on);b.setAttribute('aria-label',on?t('stop'):t('play'));});}
function stopSpeech(){AUD.token++;try{speechSynthesis.cancel();}catch(e){}if(AUD.player){AUD.player.pause();AUD.player.ontimeupdate=null;AUD.player=null;}document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on'));setPlayingUI(false);}
const SPRITES={};// sprite file → Audio element (downloaded once, reused)
function spriteAudio(f){if(!SPRITES[f]){const a=new Audio('audio/'+f);a.preload='auto';SPRITES[f]=a;}return SPRITES[f];}
function clipDuration(entry){return typeof entry==='string'?null:(entry.e-entry.s);}
function playFile(entry,rate){return new Promise((res,rej)=>{rate=rate||1;
  if(typeof entry==='string'){const a=new Audio('audio/'+entry);a.playbackRate=rate;AUD.player=a;a.onended=()=>res(true);a.onerror=()=>rej(new Error('audio'));a.play().catch(rej);return;}
  const a=spriteAudio(entry.f);AUD.player=a;a.playbackRate=rate;let done=false;const finish=()=>{if(done)return;done=true;a.pause();a.ontimeupdate=null;res(true);};
  const start=()=>{try{a.currentTime=entry.s;}catch(e){}a.ontimeupdate=()=>{if(a.currentTime>=entry.e-0.03)finish();};a.onended=finish;a.onerror=()=>rej(new Error('audio'));
    a.play().then(()=>{setTimeout(()=>{if(!done&&AUD.player===a&&Math.abs(a.currentTime-entry.e)<0.5)finish();},((entry.e-entry.s)/rate)*1000+120);}).catch(rej);};
  if(a.readyState>=1)start();else{a.onloadedmetadata=start;a.onerror=()=>rej(new Error('audio'));a.load();}});}
function togglePlay(text,cardId){if(AUD.playing){stopSpeech();return;}speak(text,0,cardId);}
function toggleSlow(text,cardId){if(AUD.playing){stopSpeech();return;}speakSlow(text,cardId);}
function wordWeights(words){return words.map(w=>Math.max(2,w.replace(/[^A-Za-z0-9]/g,'').length+1.5));}
async function karaoke(spans,words,totalMs,my){const wts=wordWeights(words);const sum=wts.reduce((a,b)=>a+b,0);let t=0;for(let i=0;i<words.length;i++){if(my!==AUD.token)return;hilite(spans,i);await sleep(totalMs*wts[i]/sum);}if(my===AUD.token)hilite(spans,-1);}
async function speak(text,rate,cardId){stopSpeech();const my=AUD.token;const r=rate||S.rate||1;const m=AUD.manifest;const words=text.split(/\s+/).filter(Boolean);const spans=wrapWords(cardId,words);
  if(cardId&&m&&m.cards&&m.cards[cardId]){setPlayingUI(true);const entry=m.cards[cardId];try{
      let durMs;if(typeof entry==='string'){const a=new Audio('audio/'+entry);await new Promise((res,rej)=>{a.onloadedmetadata=res;a.onerror=rej;});durMs=a.duration*1000;}else durMs=(entry.e-entry.s)*1000;
      if(my!==AUD.token)return;karaoke(spans,words,durMs/r*0.97,my);await playFile(entry,r);}catch(e){if(my===AUD.token)speakTTS(text,r,my,spans,words);return;}
    if(my===AUD.token){hilite(spans,-1);setPlayingUI(false);}return;}
  speakTTS(text,r,my,spans,words);}
function speakTTS(text,rate,my,spans,words){if(!('speechSynthesis' in window)){toast(t('noVoice'));return;}
  try{const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v)u.voice=v;u.lang=(v&&v.lang)||'en-CA';u.rate=rate;u.pitch=1;setPlayingUI(true);
    let usedBoundary=false;if(spans&&spans.length){const starts=[];let pos=0;for(const w of words){const i=text.indexOf(w,pos);starts.push(i);pos=i+w.length;}
      u.onboundary=ev=>{if(ev.name&&ev.name!=='word')return;usedBoundary=true;let idx=0;for(let i=0;i<starts.length;i++){if(starts[i]<=ev.charIndex)idx=i;}hilite(spans,idx);};
      setTimeout(()=>{if(!usedBoundary&&my===AUD.token)karaoke(spans,words,words.length*380/rate,my);},250);}
    u.onend=u.onerror=()=>{if(my===AUD.token){if(spans)hilite(spans,-1);setPlayingUI(false);}};speechSynthesis.speak(u);}catch(e){toast(t('noVoice'));}}
function wrapWords(cardId,words){const el=cardId?document.querySelector('[data-fact="'+cardId+'"]'):null;return el?[...el.querySelectorAll('.w')]:[];}
function hilite(spans,i){spans.forEach(sp=>sp.classList.remove('on'));if(spans[i]){spans[i].classList.add('on');spans[i].scrollIntoView({block:'nearest'});}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function speakSlow(text,cardId){stopSpeech();const my=AUD.token;const words=text.split(/\s+/).filter(Boolean);const spans=wrapWords(cardId,words);const m=AUD.manifest;
  // a) a slow recording of this card (your own voice): play it and move the highlight evenly across its length
  if(m&&m.slow&&typeof m.slow[cardId]==='string'){setPlayingUI(true);try{const a=new Audio('audio/'+m.slow[cardId]);AUD.player=a;await new Promise((res,rej)=>{a.onloadedmetadata=res;a.onerror=rej;});const per=(a.duration*1000)/words.length;a.play().catch(()=>{});for(let i=0;i<words.length&&my===AUD.token;i++){hilite(spans,i);await sleep(per);}if(my===AUD.token){hilite(spans,-1);setPlayingUI(false);}return;}catch(e){if(my!==AUD.token)return;}}
  // b) real per-word clips
  const haveWords=m&&m.words&&words.every(w=>!wordSlug(w)||m.words[wordSlug(w)]);
  if(haveWords){setPlayingUI(true);for(let i=0;i<words.length;i++){if(my!==AUD.token)return;hilite(spans,i);const f=m.words[wordSlug(words[i])];if(f){try{await playFile(f,0.9);}catch(e){}}await sleep(450);}if(my===AUD.token){hilite(spans,-1);setPlayingUI(false);}return;}
  // c) device voice, one word at a time
  if(!('speechSynthesis' in window)){toast(t('noVoice'));return;}const v=pickVoice();setPlayingUI(true);
  const say=(i)=>{if(my!==AUD.token)return;hilite(spans,i);if(i>=words.length){setPlayingUI(false);return;}
    const u=new SpeechSynthesisUtterance(words[i].replace(/[“”"()]/g,''));if(v)u.voice=v;u.lang=(v&&v.lang)||'en-CA';u.rate=0.72;u.pitch=1;
    u.onend=()=>setTimeout(()=>say(i+1),520);u.onerror=()=>setTimeout(()=>say(i+1),300);try{speechSynthesis.speak(u);}catch(e){say(i+1);}};
  say(0);}
function previewVoice(){speak('Ottawa is the capital of Canada.',S.rate);}

function audioBar(card){const txt=JSON.stringify(card.en).replace(/"/g,'&quot;');return `<div class="audio"><button class="iconbtn play" title="${esc(t('play'))}" aria-label="${esc(t('play'))}" onclick="togglePlay(${txt},'${card.id}')"><span class="i-play">${ICON_PLAY}</span><span class="i-stop">${ICON_STOP}</span></button><button class="iconbtn" title="${esc(t('slow'))}" aria-label="${esc(t('slow'))}" onclick="toggleSlow(${txt},'${card.id}')">${ICON_TURTLE}</button><span class="small muted">${esc(t('play'))} · ${esc(t('slow'))}</span></div>`;}
function trBlock(card){const l=S.tr;if(!l||!card.tr||!card.tr[l])return '';const dir=(TR_LANGS[l]||{}).dir||'ltr';const open=S.trAlways;
  return `<button class="tr-toggle" aria-expanded="${open}" onclick="toggleTr(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg><span>${esc(open?t('hideTr'):t('showTr'))}</span></button><div class="tr" dir="${dir}" ${open?'':'hidden'}>${esc(card.tr[l])}</div>`;}

function wordsHTML(text,cardId){return text.split(/(\s+)/).map(tok=>/\s+/.test(tok)?tok:`<span class="w" data-s="${wordSlug(tok)}" onclick="wordTap(event,this)">${esc(tok)}</span>`).join('');}
function factHTML(card,showSimple=true){const fr=S.lang==='fr';const main=fr?card.fr:card.en;
  return `<div class="fact" lang="${fr?'fr':'en'}" ${fr?'':`data-fact="${card.id}"`}>${fr?esc(main):wordsHTML(main,card.id)}</div>${fr?`<div class="fact-simple" lang="en" data-fact="${card.id}">${wordsHTML(card.en,card.id)}</div>`:(showSimple&&card.en_simple!==card.en?`<div class="fact-simple">${wordsHTML(card.en_simple,card.id)}</div>`:'')}${audioBar(card)}${trBlock(card)}`;}
let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null;}}
document.addEventListener('click',e=>{if(popEl&&!e.target.closest('.w')&&!e.target.closest('.pop'))closePop();});
function wordTap(e,el){e.stopPropagation();closePop();const slug=el.dataset.s;if(!slug)return;const tr=(DICT[S.tr]||{})[slug]||'';
  const pop=document.createElement('div');pop.className='pop';pop.innerHTML=`<div class="pop-tr" dir="${(TR_LANGS[S.tr]||{}).dir||'ltr'}">${esc(tr||'—')}</div><div class="pop-en">${esc(el.textContent.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,''))}</div>`;
  document.body.appendChild(pop);popEl=pop;const r=el.getBoundingClientRect();const pw=pop.offsetWidth;let x=r.left+r.width/2-pw/2;x=Math.max(8,Math.min(innerWidth-pw-8,x));pop.style.left=x+'px';const below=r.top<pop.offsetHeight+70;pop.classList.toggle('below',below);pop.style.top=(below?r.bottom+scrollY+8:r.top+scrollY-pop.offsetHeight-8)+'px';
  el.classList.add('tapped');setTimeout(()=>el.classList.remove('tapped'),600);
  stopSpeech();const m=AUD.manifest;const f=m&&m.words&&m.words[slug];const txt=el.textContent.replace(/[“”"()]/g,'');
  if(f){setPlayingUI(true);playFile(f,0.9).catch(()=>speakTTS(txt,0.85,AUD.token)).then(()=>setPlayingUI(false));}else speakTTS(txt,0.85,AUD.token);}
function ring(pct,color){const r=22,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/></svg><div class="pct">${Math.round(pct*100)}%</div></div>`;}

/* ---------- LESSON ENGINE ---------- */
let L=null;// session
function buildSession(ids,newLimit){const due=ids.filter(isDue),fresh=ids.filter(id=>!(S.cards[id]&&S.cards[id].seen>0));
  const picksNew=fresh.slice(0,newLimit),picksDue=shuffle(due).slice(0,Math.max(6,16-picksNew.length));
  const queue=[];picksDue.forEach(id=>queue.push({k:'quiz',id}));
  // interleave: teach n1, teach n2, quiz n1, teach n3, quiz n2, ...
  const tq=[];picksNew.forEach((id,i)=>{tq.push({k:'teach',id});if(i>=1)tq.push({k:'quiz',id:picksNew[i-1]});});if(picksNew.length)tq.push({k:'quiz',id:picksNew[picksNew.length-1]});
  const merged=[];let a=tq.slice(),b=shuffle(queue);while(a.length||b.length){if(a.length)merged.push(a.shift());if(b.length)merged.push(b.shift());if(a.length)merged.push(a.shift());}
  return {queue:merged,done:0,total:merged.length,right:0,wrong:0,newCount:picksNew.length,revCount:picksDue.length,asked:{}};}
function lesson(v){const u=DATA.find(x=>x.unit===route.arg.unit);if(!L||L.unit!==u.unit||L.finished){const ids=u.cards.map(c=>c.id);L=buildSession(ids,8);L.unit=u.unit;L.title=u.title;L.back='home';
  if(!L.queue.length){/* everything learned & nothing due: quick review of 10 random */ L=buildSession([],0);L.unit=u.unit;L.title=u.title;L.back='home';shuffle(ids).slice(0,10).forEach(id=>L.queue.push({k:'quiz',id}));L.total=L.queue.length;L.revCount=L.total;}}
  step(v);}
function review(v){const ids=dueIds();if(!ids.length){v.innerHTML=`<div class="panel stack"><h2>${esc(t('tabReview'))}</h2><p class="muted">${esc(t('nothingDue'))}</p><button class="btn" onclick="go('home')">${esc(t('backHome'))}</button></div>`;return;}
  if(!L||L.unit!=='__review__'||L.finished){L=buildSession(ids,0);L.unit='__review__';L.title={en:t('tabReview'),fr:t('tabReview')};L.back='home';L.queue=shuffle(ids).slice(0,20).map(id=>({k:'quiz',id}));L.total=L.queue.length;L.revCount=L.total;}
  step(v);}
function weak(v){const ids=ALL_IDS.filter(id=>{const c=S.cards[id];return c&&c.wrong>0&&c.wrong>=c.right;}).sort((a,b)=>(S.cards[b].wrong-S.cards[b].right)-(S.cards[a].wrong-S.cards[a].right));
  if(!ids.length){v.innerHTML=`<div class="panel stack"><h2>${esc(t('weak'))}</h2><p class="muted">${esc(t('nothingDue'))}</p><button class="btn" onclick="go('home')">${esc(t('backHome'))}</button></div>`;return;}
  if(!L||L.unit!=='__weak__'||L.finished){L=buildSession([],0);L.unit='__weak__';L.title={en:t('weak'),fr:t('weak')};L.back='home';L.queue=ids.slice(0,15).map(id=>({k:'quiz',id}));L.total=L.queue.length;L.revCount=L.total;}
  step(v);}
function pickQuestion(card){const asked=L.asked[card.id]||0;const qs=card.questions;return qs[asked%qs.length];}
function step(v){if(!L.queue.length){L.finished=true;return summary(v);}
  const it=L.queue[0];const card=CARDS[it.id];const pct=L.done/Math.max(1,L.total);
  const head=`<div class="lesson-top"><button class="iconbtn" aria-label="${esc(t('quit'))}" onclick="go(L.back||'home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="progress"><i style="width:${pct*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${L.done}/${L.total}</span></div>`;
  if(it.k==='teach'){v.innerHTML=`<div class="stack">${head}<div class="eyebrow">${esc(t('newCard'))} · ${esc(L.title[S.lang])}</div><div class="card">${factHTML(card)}</div><button class="btn wide" onclick="teachDone()">${esc(t('gotIt'))}</button></div>`;
    if(S.autoplay)setTimeout(()=>speak(card.en,0,card.id),200);return;}
  const q=pickQuestion(card);L.asked[card.id]=(L.asked[card.id]||0)+1;
  renderQuestion(v,head,card,q,(ok,chosenLabel)=>{mark(card.id,ok);L.done++;L.queue.shift();if(ok){L.right++;}else{L.wrong++;const r=(it.retry||0)+1;if(r<=2){const pos=Math.min(L.queue.length,3);L.queue.splice(pos,0,{k:'quiz',id:card.id,retry:r});L.total++;}}});}
function teachDone(){L.done++;L.queue.shift();render();}
function renderQuestion(v,head,card,q,onAnswer,opts={}){const fr=S.lang==='fr';

  else{options=[t('trueLbl'),t('falseLbl')];answerIdx=q.answer?0:1;}

const TEST_DEFS=[1,2,3,4,5];
function buildTest(n){// deterministic: 100 distinct cards, stratified by unit size, one question each
  const rnd=seeded(0xC0FFEE+n*7919);const picks=[];const perUnit=DATA.map(u=>u.cards.length);const total=perUnit.reduce((a,b)=>a+b,0);
  let quota=DATA.map(u=>Math.floor(100*u.cards.length/total));let rem=100-quota.reduce((a,b)=>a+b,0);for(let i=0;rem>0;i=(i+1)%DATA.length,rem--)quota[i]++;
  DATA.forEach((u,i)=>{const cards=shuffle(u.cards,rnd).slice(0,quota[i]);cards.forEach(c=>{const qs=c.questions;picks.push({id:c.id,qi:Math.floor(rnd()*qs.length)});});});
  return shuffle(picks,rnd);}
function buildSim(){const rnd=Math.random;const picks=[];const cards=shuffle(ALL_IDS).slice(0,20);cards.forEach(id=>{const c=CARDS[id];picks.push({id,qi:Math.floor(rnd()*c.questions.length)});});return picks;}
function tests(v){const open=allUnitsDone();const left=DATA.filter(u=>!unitStats(u).done).length;
  v.innerHTML=`<div class="stack"><div class="panel"><h2>${esc(t('tests'))}</h2><p class="muted" style="margin:6px 0 0">${esc(open?t('testsUnlocked'):t('testsLocked'))}${open?'':` <span class="pill">${left} ${esc(t('unitsLeft'))}</span>`}</p></div>
  ${TEST_DEFS.map(n=>{const b=S.tests['mock'+n];return `<button class="testcard" ${open?'':'disabled'} onclick="startTest('mock',${n})"><div class="n ${open?'':'lock'}">${n}</div><div class="t"><b>${esc(t('mock'))} ${n}</b><span>${esc(t('q100'))}</span></div><span class="pill ${b?(b.best>=75?'ok':''):'grey'}">${b?esc(t('best'))+' '+b.best+'/100':esc(t('notTaken'))}</span></button>`;}).join('')}
  <button class="testcard" ${open?'':'disabled'} onclick="startTest('sim',0)"><div class="n ${open?'':'lock'}">⏱</div><div class="t"><b>${esc(t('sim'))}</b><span>${esc(t('simSub'))}</span></div><span class="pill ${S.tests.sim?(S.tests.sim.best>=15?'ok':''):'grey'}">${S.tests.sim?esc(t('best'))+' '+S.tests.sim.best+'/20':esc(t('notTaken'))}</span></button></div>`;}
let TEST=null,timer=null;
function startTest(kind,n){TEST={kind,n,items:kind==='mock'?buildTest(n):buildSim(),i:0,answers:[],start:Date.now(),limit:kind==='sim'?30*60:null};route={name:'testrun'};render();
  if(TEST.limit){timer=setInterval(()=>{const left=TEST.limit-Math.floor((Date.now()-TEST.start)/1000);const e=document.getElementById('timer');if(e){e.textContent=fmt(Math.max(0,left));e.classList.toggle('low',left<300);}if(left<=0){clearInterval(timer);timer=null;toast(t('timeUp'));finishTest();}},500);}}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function testrun(v){if(!TEST)return tests(v);const it=TEST.items[TEST.i];const card=CARDS[it.id];const q=card.questions[it.qi];const total=TEST.items.length;
  const head=`<div class="lesson-top"><button class="iconbtn" aria-label="${esc(t('quit'))}" onclick="TEST=null;go('tests')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="progress"><i style="width:${TEST.i/total*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${TEST.i+1}/${total}</span>${TEST.limit?`<span class="timer" id="timer">${fmt(TEST.limit-Math.floor((Date.now()-TEST.start)/1000))}</span>`:''}</div>`;
  const rnd=seeded(0xABCD+TEST.n*31+TEST.i);
  renderQuestion(v,head,card,q,(ok,chosen)=>{TEST.answers.push({id:it.id,qi:it.qi,ok,chosen});TEST.i++;if(TEST.i>=total)finishTest();else render();},{silent:true,rnd,eyebrow:(TEST.kind==='mock'?t('mock')+' '+TEST.n:t('sim'))+' · '+t('question')+' '+(TEST.i+1)+' '+t('of')+' '+total});}
function finishTest(){if(timer){clearInterval(timer);timer=null;}const score=TEST.answers.filter(a=>a.ok).length;const key=TEST.kind==='mock'?'mock'+TEST.n:'sim';const prev=S.tests[key]||{best:0,attempts:0};S.tests[key]={best:Math.max(prev.best,score),attempts:prev.attempts+1,last:score};
  TEST.answers.forEach(a=>{if(!a.ok)mark(a.id,false);});S.xp+=score;save();TEST.score=score;route={name:'testresult'};render();window.scrollTo({top:0});}
function testresult(v){if(!TEST)return tests(v);const total=TEST.items.length;const pass=TEST.kind==='sim'?TEST.score>=15:TEST.score>=75;const fr=S.lang==='fr';
  v.innerHTML=`<div class="stack"><div class="panel summary"><div class="eyebrow">${esc(TEST.kind==='mock'?t('mock')+' '+TEST.n:t('sim'))}</div><h2>${esc(t('score'))}</h2><div class="big">${TEST.score}/${total}</div><span class="pill ${pass?'ok':''}">${esc(pass?t('passed'):t('failed'))}</span>
   <div class="row" style="justify-content:center"><button class="btn" onclick="startTest('${TEST.kind}',${TEST.n})">${esc(t('retake'))}</button><button class="btn secondary" onclick="TEST=null;go('tests')">${esc(t('tests'))}</button></div></div>
  <h2 style="font-size:20px">${esc(t('reviewAnswers'))}</h2>
  ${TEST.answers.map((a,i)=>{const c=CARDS[a.id],q=c.questions[a.qi];const qt=fr?q.q.fr:q.q.en;const corr=q.type==='mc'?(fr?q.options.fr:q.options.en)[q.answer]:(q.answer?t('trueLbl'):t('falseLbl'));
    return `<div class="review-item ${a.ok?'right':'wrong'}"><div class="small muted">${i+1}.</div><b>${esc(qt)}</b>${a.ok?`<span class="small" style="color:var(--ok)">✓ ${esc(corr)}</span>`:`<span class="small" style="color:var(--bad)">✗ ${esc(t('yourAnswer'))}: ${esc(a.chosen)}</span><span class="small" style="color:var(--ok)">✓ ${esc(t('correctAnswer'))}: ${esc(corr)}</span><div class="small muted" style="margin-top:4px">${esc(fr?c.fr:c.en)}</div>`}</div>`;}).join('')}</div>`;}

const REC={db:null,i:0,media:null,chunks:[],kind:null,counts:{n:0,s:0},onlyMissing:true};
function recDB(){return new Promise((res,rej)=>{if(REC.db)return res(REC.db);const q=indexedDB.open('cc-rec',1);q.onupgradeneeded=()=>q.result.createObjectStore('rec');q.onsuccess=()=>{REC.db=q.result;res(REC.db);};q.onerror=()=>rej(q.error);});}
async function recGet(key){const db=await recDB();return new Promise((res,rej)=>{const r=db.transaction('rec').objectStore('rec').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}
async function recPut(key,val){const db=await recDB();return new Promise((res,rej)=>{const r=db.transaction('rec','readwrite').objectStore('rec').put(val,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
async function recDel(key){const db=await recDB();return new Promise((res,rej)=>{const r=db.transaction('rec','readwrite').objectStore('rec').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
async function recKeys(){const db=await recDB();return new Promise((res,rej)=>{const r=db.transaction('rec').objectStore('rec').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function recExt(type){return /mp4|aac/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm';}

async function recStart(id,slow){if(REC.media){recStop();return;}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast(t('noMic'));return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){toast(t('noMic'));return;}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus',''].find(x=>!x||MediaRecorder.isTypeSupported(x))||'';
  const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined);REC.media=mr;REC.chunks=[];REC.kind=slow?id+'-slow':id;
  mr.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data);};
  mr.onstop=async()=>{stream.getTracks().forEach(tr=>tr.stop());const blob=new Blob(REC.chunks,{type:mr.mimeType||type||'audio/webm'});await recPut(REC.kind,{blob,type:blob.type,at:Date.now()});REC.media=null;toast(t('saved'));render();};
  mr.start();const b=document.getElementById(slow?'recS':'recN');if(b)b.textContent='■ '+t('stopRec');document.getElementById('recStatus').innerHTML='<span class="pill">● REC</span>';}

async function recExport(){try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');}catch(e){toast('JSZip failed to load');return;}
  const keys=await recKeys();if(!keys.length){toast('0 '+t('recorded'));return;}const zip=new JSZip();const man={cards:{},slow:{},words:{},voice:'own'};
  for(const k of keys){const r=await recGet(k);if(!r)continue;const ext=recExt(r.type);const file=k+'.'+ext;zip.file('audio/'+file,r.blob);if(k.endsWith('-slow'))man.slow[k.slice(0,-5)]=file;else man.cards[k]=file;}
  zip.file('audio/manifest.json',JSON.stringify(man,null,1));zip.file('audio/README.txt','Unzip so that this audio folder sits next to index.html, then redeploy. If you also ran tools/make_audio.py, run: python3 tools/merge_audio.py  to combine your voice with the neural clips.');
  const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-voice-audio.zip';document.body.appendChild(a);a.click();a.remove();toast(keys.length+' '+t('recorded'));}

let resetArmed=false;function resetProgress(b){if(!resetArmed){resetArmed=true;b.textContent=t('resetConfirm');setTimeout(()=>{resetArmed=false;b.textContent=t('resetBtn');},3000);return;}
  const keep={lang:S.lang,tr:S.tr,trAlways:S.trAlways,autoplay:S.autoplay,rate:S.rate,flag:S.flag,theme:S.theme};S=Object.assign(defaults(),keep);save();resetArmed=false;L=null;go('home');}

/* ---------- 3D FLAG ---------- */
let flagState=null;
function flagTexture(){const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');x.fillStyle='#D52B1E';x.fillRect(0,0,2048,1024);x.fillStyle='#ffffff';x.fillRect(512,0,1024,1024);
  x.fillStyle='#D52B1E';x.save();x.scale(2048/9600,1024/4800);x.fill(new Path2D(LEAF_D));x.restore();return c;}
function setupFlag(){const canvas=document.getElementById('flag');const fb=document.getElementById('flagFallback');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(flagState){flagState.stop();flagState=null;}
  if(reduce||!window.THREE){canvas.hidden=true;fb.hidden=false;return;}
  try{
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
    const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.set(0,0,9);
    const geo=new THREE.PlaneGeometry(12,6,120,60);const tex=new THREE.CanvasTexture(flagTexture());tex.anisotropy=4;
    const uni={uTime:{value:0},uMap:{value:tex},uWind:{value:1},uDir:{value:new THREE.Vector2(1,.3)}};
    const mat=new THREE.ShaderMaterial({uniforms:uni,side:THREE.DoubleSide,
      vertexShader:`uniform float uTime;uniform float uWind;uniform vec2 uDir;varying vec2 vUv;varying float vShade;
        void main(){vUv=uv;vec3 p=position;float x=(p.x+6.0)/12.0;float amp=0.55*uWind*(0.15+x);
        float w=sin(p.x*1.1-uTime*2.2+p.y*0.6*uDir.y)*amp+sin(p.x*2.3-uTime*3.1+p.y*1.3)*amp*0.35;
        p.z+=w;float dz=cos(p.x*1.1-uTime*2.2+p.y*0.6*uDir.y)*amp*1.1;vShade=0.78+0.22*clamp(dz*0.9+0.5,0.0,1.0);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
      fragmentShader:`uniform sampler2D uMap;varying vec2 vUv;varying float vShade;void main(){vec4 c=texture2D(uMap,vUv);gl_FragColor=vec4(c.rgb*vShade,1.0);}`});
    const mesh=new THREE.Mesh(geo,mat);mesh.rotation.set(-.15,.25,.02);scene.add(mesh);
    let target={x:0,y:0},cur={x:0,y:0},wind=1,windT=1,raf;const clock=new THREE.Clock();
    function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();const visH=2*9*Math.tan(19*Math.PI/180),visW=visH*cam.aspect;mesh.scale.setScalar(Math.max(1.15,visW/12*1.12,visH/6*1.12));}
    resize();addEventListener('resize',resize);
    const onMove=e=>{const p=e.touches?e.touches[0]:e;target.x=(p.clientX/innerWidth-.5);target.y=(p.clientY/innerHeight-.5);windT=1+Math.abs(target.x)*1.6;};
    addEventListener('pointermove',onMove,{passive:true});addEventListener('touchmove',onMove,{passive:true});
    let visible=true;document.addEventListener('visibilitychange',()=>{visible=!document.hidden;});
    function loop(){raf=requestAnimationFrame(loop);if(!visible)return;cur.x+=(target.x-cur.x)*.04;cur.y+=(target.y-cur.y)*.04;wind+=(windT-wind)*.02;windT+=(1-windT)*.01;
      uni.uTime.value=clock.getElapsedTime();uni.uWind.value=wind;mesh.rotation.y=.25+cur.x*.35;mesh.rotation.x=-.15-cur.y*.25;cam.position.x=cur.x*.6;cam.position.y=-cur.y*.4;cam.lookAt(0,0,0);renderer.render(scene,cam);}
    loop();canvas.hidden=false;fb.hidden=true;
    flagState={stop(){cancelAnimationFrame(raf);removeEventListener('resize',resize);removeEventListener('pointermove',onMove);removeEventListener('touchmove',onMove);renderer.dispose();}};
  }catch(e){canvas.hidden=true;fb.hidden=false;}}

/* ---------- boot ---------- */
applyTheme();applyLangUI();setupFlag();
const h=(location.hash||'').replace('#','');go(['home','review','tests','mygov','settings','studio'].includes(h)?h:'home');
