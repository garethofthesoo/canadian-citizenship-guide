<body>
<title>Citizenship Coach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one-screen app shell. Fixed 3D flag canvas behind a frosted content column (max 720px),
   sticky top bar with language toggle, bottom tab bar on phones. */
:root{
  --red:#D52B1E; --red-deep:#A8231A; --red-soft:#FBE4E7;
  --bg:#F7F3F1; --panel:rgba(255,255,255,.86); --panel-solid:#FFFFFF;
  --fg:#1E1A1A; --muted:#6B5F60; --line:#E6DADB;
  --ok:#1E8E4E; --ok-soft:#DFF3E6; --bad:#C62828; --bad-soft:#FBE4E7; --warn:#B7791F;
  --shadow:0 10px 30px rgba(60,10,15,.12);
  --f-display:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Arial",sans-serif;
  --overlay:rgba(247,243,241,.56);
  --radius:18px;
  color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
#flag{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#flagFallback{position:fixed;inset:0;z-index:0;background:linear-gradient(90deg,#D52B1E 0 25%,#fff 25% 75%,#D52B1E 75%)}
#flagFallback svg{position:absolute;left:50%;top:50%;width:min(40vh,60vw);transform:translate(-50%,-50%)}
#overlay{position:fixed;inset:0;z-index:1;background:var(--overlay);backdrop-filter:blur(2px);pointer-events:none}
#app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0}
.brand .leaf{width:26px;height:26px;color:var(--red);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--panel-solid)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.iconbtn{border:1.5px solid var(--line);background:var(--panel-solid);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

/* content column */
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding-block:18px 96px;padding-inline:16px}
.panel{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-deep)}
.btn.secondary{background:var(--panel-solid);color:var(--fg);border:1.5px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.secondary:active{box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;padding:8px 10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid #2F80ED;outline-offset:2px}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero h1{font-size:28px;font-weight:900}
.stat{display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.stat b{font-size:26px;font-weight:900;line-height:1}
.stat span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--red)}
.unit .ring{flex:none;width:52px;height:52px;position:relative}
.unit .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.unit .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
.unit .t{min-width:0}
.unit .t b{display:block;font-size:15px;line-height:1.2}
.unit .t span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.unit.done{border-color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.grey{background:var(--line);color:var(--muted)}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .4s}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px}
.lesson-top .progress{flex:1}
.card{background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;gap:16px}
.fact{font-family:var(--f-display);font-size:clamp(22px,4.6vw,30px);font-weight:800;line-height:1.3;text-wrap:balance}
.w{scroll-margin-top:90px;cursor:pointer;border-radius:6px;padding:0 2px;transition:background .15s}
.w:hover,.w.tapped{background:var(--red-soft)}
.pop{position:absolute;z-index:20;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);text-align:center;max-width:70vw;pointer-events:none}
.pop:after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--fg);border-bottom:0}
.pop.below:after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid var(--fg)}
.pop-tr{font-family:var(--f-ar);font-size:15px;line-height:1.6}
.pop-en{font-size:11px;opacity:.75;letter-spacing:.04em}
.w.on{background:var(--red);color:#fff;border-radius:6px;padding:0 4px;box-decoration-break:clone}
.fact-simple{font-size:16px;color:var(--muted);border-left:3px solid var(--red);padding-left:10px}
.audio{display:flex;gap:8px;align-items:center}
.audio .iconbtn.play{background:var(--red);color:#fff;border-color:var(--red);width:48px;height:48px}
.audio .iconbtn.play svg{width:24px;height:24px}
.audio .play .i-stop{display:none}.audio .play.playing .i-stop{display:inline-flex}.audio .play.playing .i-play{display:none}.audio .play.playing{background:var(--fg);border-color:var(--fg)}
.tr-toggle{align-self:flex-start;border:0;background:transparent;color:var(--red);font-weight:800;cursor:pointer;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.tr-toggle svg{width:16px;height:16px;transition:transform .2s}
.tr-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.tr{font-family:var(--f-ar);font-size:15px;line-height:1.9;color:var(--muted);direction:rtl;text-align:right;border-top:1px dashed var(--line);padding-top:10px}
.tr[dir="ltr"]{direction:ltr;text-align:left;font-family:var(--f-body)}
.q{font-family:var(--f-display);font-size:clamp(19px,4vw,24px);font-weight:800;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel-solid);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:flex-start;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.opt:hover{border-color:var(--red)}
.opt.sel{border-color:var(--red)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-size:17px}
.feedback .again{color:var(--fg);font-weight:600}
.summary{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.summary .big{font-size:56px;font-weight:900;line-height:1;color:var(--red)}
.stats3{display:flex;gap:18px;justify-content:center}

/* tests */
.testcard{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--panel)}
.testcard .n{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.testcard .n.lock{background:var(--line);color:var(--muted)}
.testcard .t{flex:1;min-width:0}
.testcard .t b{display:block}
.testcard .t span{font-size:13px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px}
.timer.low{color:var(--bad)}
.review-item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel-solid)}
.review-item.wrong{border-color:var(--bad)}
.review-item.right{border-color:var(--ok)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:150px;border:0;background:transparent;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--red);background:var(--red-soft)}

/* forms */
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
input[type=text],select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-solid);color:var(--fg);width:100%}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:44px;height:24px;accent-color:var(--red)}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:480px){ .hero{grid-template-columns:1fr} .units{grid-template-columns:1fr 1fr} .unit{flex-direction:column;align-items:flex-start} }
@media (max-width:360px){ .units{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .opt,.btn,.progress i{transition:none} }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = [{"unit":"intro","order":0,"title":{"en":"The Test & the Oath","fr":"L’examen et le serment"},"title_tr":{"ar":"الامتحان والقَسَم"},"source":{"en":"02-oath, 03-message-to-readers, 04-applying-for-citizenship","fr":"02-04-serment-et-demande"},"cards":[{"id":"intro-001","topic":"who-takes-test","importance":3,"en":"Applicants who are 18-54 years of age when they apply are required to demonstrate an adequate knowledge of Canada and of the responsibilities and privileges of citizenship through a citizenship knowledge test in either English or French, and to demonstrate adequate knowledge of either English or French.","en_simple":"If you are 18 to 54 years old when you apply, you must pass the citizenship test (in English or French) and show you know enough English or French.","fr":"Les demandeurs qui sont âgés de 18 à 54 ans au moment de présenter leur demande devront démontrer qu’ils possèdent une connaissance adéquate du Canada et des responsabilités et privilèges liés à la citoyenneté par le biais d’un examen pour la citoyenneté, administré en anglais ou en français, et ils devront démontrer qu’ils possèdent une connaissance adéquate de l’anglais ou du français.","tr":{"ar":"يُطلب من المتقدمين الذين تتراوح أعمارهم بين 18 و54 عامًا وقت تقديم الطلب أن يُثبتوا معرفة كافية بكندا وبمسؤوليات المواطنة وامتيازاتها من خلال امتحان معرفي للمواطنة بالإنجليزية أو الفرنسية، وأن يُثبتوا معرفة كافية بالإنجليزية أو الفرنسية."},"questions":[{"type":"mc","q":{"en":"Applicants in which age range must take the citizenship knowledge test?","fr":"Les demandeurs de quelle tranche d’âge doivent passer l’examen pour la citoyenneté?"},"options":{"en":["16 to 65","18 to 54","21 to 60","18 to 65"],"fr":["16 à 65 ans","18 à 54 ans","21 à 60 ans","18 à 65 ans"]},"answer":1},{"type":"mc","q":{"en":"In which languages can the citizenship test be taken?","fr":"Dans quelles langues l’examen pour la citoyenneté peut-il être administré?"},"options":{"en":["Any language of your choice","English only","English or French","French only"],"fr":["Toute langue de votre choix","L’anglais seulement","L’anglais ou le français","Le français seulement"]},"answer":2},{"type":"tf","q":{"en":"Immigrants between the ages of 18 and 54 must have adequate knowledge of English or French to become Canadian citizens.","fr":"Les immigrants âgés de 18 à 54 ans doivent avoir une connaissance adéquate de l’anglais ou du français pour devenir citoyens canadiens."},"answer":true}]},{"id":"intro-002","topic":"not-language-test","importance":3,"en":"The citizenship test is not used to assess an applicant’s knowledge of English or French.","en_simple":"The citizenship test does NOT test your English or French. It tests your knowledge of Canada.","fr":"L’examen pour la citoyenneté ne sert pas à évaluer la connaissance du français ou de l’anglais du demandeur.","tr":{"ar":"لا يُستخدم امتحان المواطنة لتقييم معرفة المتقدم بالإنجليزية أو الفرنسية."},"questions":[{"type":"tf","q":{"en":"The citizenship test is used to assess your knowledge of English or French.","fr":"L’examen pour la citoyenneté sert à évaluer votre connaissance de l’anglais ou du français."},"answer":false}]},{"id":"intro-003","topic":"age-exemption","importance":3,"en":"Adult applicants 55 years of age and over do not need to write the citizenship test.","en_simple":"People 55 years old and older do not need to take the citizenship test.","fr":"Les candidats adultes qui ont 55 ans ou plus n’ont pas besoin de passer l’examen pour la citoyenneté.","tr":{"ar":"لا يحتاج المتقدمون البالغون الذين تبلغ أعمارهم 55 عامًا فأكثر إلى أداء امتحان المواطنة."},"questions":[{"type":"mc","q":{"en":"Adult applicants of what age do not need to write the citizenship test?","fr":"À partir de quel âge les candidats adultes n’ont-ils pas besoin de passer l’examen pour la citoyenneté?"},"options":{"en":["65 and over","60 and over","50 and over","55 and over"],"fr":["65 ans ou plus","60 ans ou plus","50 ans ou plus","55 ans ou plus"]},"answer":3},{"type":"tf","q":{"en":"A 60-year-old applicant must write the citizenship test.","fr":"Un demandeur de 60 ans doit passer l’examen pour la citoyenneté."},"answer":false}]},{"id":"intro-004","topic":"test-format","importance":3,"en":"The citizenship test is usually a written test, but it could be an interview.","en_simple":"The test is usually written, but it can be an interview.","fr":"L’examen pour la citoyenneté est en général un examen écrit, mais peut aussi se faire sous forme d’entrevue.","tr":{"ar":"امتحان المواطنة عادةً امتحان كتابي، لكنه قد يكون مقابلة."},"questions":[{"type":"mc","q":{"en":"What form does the citizenship test usually take?","fr":"Sous quelle forme l’examen pour la citoyenneté se fait-il en général?"},"options":{"en":["A written test","A speech in front of a judge","A group discussion","A home visit"],"fr":["Un examen écrit","Un discours devant un juge","Une discussion de groupe","Une visite à domicile"]},"answer":0},{"type":"tf","q":{"en":"The citizenship test could be an interview.","fr":"L’examen pour la citoyenneté peut se faire sous forme d’entrevue."},"answer":true}]},{"id":"intro-005","topic":"two-requirements","importance":3,"en":"You will be tested on two basic requirements for citizenship: 1) knowledge of Canada and of the rights and responsibilities of citizenship, and 2) adequate knowledge of English or French.","en_simple":"2 things are tested: (1) knowledge of Canada and the rights and responsibilities of citizenship, (2) enough English or French.","fr":"On évaluera si vous remplissez deux critères fondamentaux d’attribution de la citoyenneté, c’est-à-dire : 1) si vous connaissez le Canada ainsi que les droits et responsabilités liés à la citoyenneté; et 2) si vous connaissez suffisamment le français ou l’anglais.","tr":{"ar":"سيتم اختبارك في شرطين أساسيين للمواطنة: 1) المعرفة بكندا وبحقوق المواطنة ومسؤولياتها، و2) معرفة كافية بالإنجليزية أو الفرنسية."},"questions":[{"type":"mc","q":{"en":"What are the two basic requirements tested for citizenship?","fr":"Quels sont les deux critères fondamentaux évalués pour l’attribution de la citoyenneté?"},"options":{"en":["Knowledge of hockey and of Canadian music","Knowledge of Canada and of the rights and responsibilities of citizenship, and adequate knowledge of English or French","Knowledge of the tax system and of driving laws","Knowledge of the Constitution and of Canadian cooking"],"fr":["La connaissance du hockey et de la musique canadienne","La connaissance du Canada et des droits et responsabilités liés à la citoyenneté, et une connaissance suffisante du français ou de l’anglais","La connaissance du système fiscal et du code de la route","La connaissance de la Constitution et de la cuisine canadienne"]},"answer":1},{"type":"tf","q":{"en":"Knowledge of the rights and responsibilities of citizenship is one of the requirements tested.","fr":"La connaissance des droits et responsabilités liés à la citoyenneté est l’un des critères évalués."},"answer":true}]},{"id":"intro-006","topic":"test-source","importance":2,"en":"All the citizenship test questions are based on the subject areas noted in the Citizenship Regulations, and all required information is provided in this study guide.","en_simple":"All test questions come from the subjects in the Citizenship Regulations. Everything you need is in the study guide (Discover Canada).","fr":"Toutes les questions qui composent l’examen pour la citoyenneté ont été formulées à partir des thèmes abordés dans le Règlement sur la citoyenneté, et tous les renseignements nécessaires figurent dans le présent guide d’étude.","tr":{"ar":"تستند جميع أسئلة امتحان المواطنة إلى المجالات المذكورة في لوائح المواطنة (Citizenship Regulations)، وجميع المعلومات المطلوبة واردة في دليل الدراسة هذا."},"questions":[{"type":"mc","q":{"en":"Where is all the information needed for the citizenship test provided?","fr":"Où se trouvent tous les renseignements nécessaires pour l’examen pour la citoyenneté?"},"options":{"en":["In the daily newspaper","In the Criminal Code","In the study guide (Discover Canada)","In a provincial driver’s handbook"],"fr":["Dans le journal quotidien","Dans le Code criminel","Dans le guide d’étude (Découvrir le Canada)","Dans un manuel de conduite provincial"]},"answer":2},{"type":"tf","q":{"en":"The citizenship test questions are based on the subject areas noted in the Citizenship Regulations.","fr":"Les questions de l’examen pour la citoyenneté sont formulées à partir des thèmes abordés dans le Règlement sur la citoyenneté."},"answer":true}]},{"id":"intro-007","topic":"after-the-test","importance":3,"en":"If you pass the test and meet all the other requirements, you will receive a Notice to Appear to Take the Oath of Citizenship. This document tells you the date, time and place of your citizenship ceremony.","en_simple":"After you pass, you get a “Notice to Appear to Take the Oath of Citizenship”. It gives the date, time and place of your ceremony.","fr":"Si vous réussissez à l’examen et répondez à toutes les autres conditions, vous recevrez une lettre intitulée « Avis de convocation – Pour prêter le serment de citoyenneté ». Ce document vous indiquera la date, l’heure et le lieu de la cérémonie de citoyenneté.","tr":{"ar":"إذا اجتزت الامتحان واستوفيت جميع الشروط الأخرى، فستتلقى «إشعار الحضور لأداء قَسَم المواطنة» (Notice to Appear to Take the Oath of Citizenship). يُخبرك هذا المستند بتاريخ حفل المواطنة ووقته ومكانه."},"questions":[{"type":"mc","q":{"en":"What document do you receive after passing the test and meeting all other requirements?","fr":"Quel document recevez-vous après avoir réussi l’examen et rempli toutes les autres conditions?"},"options":{"en":["A Canadian passport","A Notice to Appear to Take the Oath of Citizenship","A permanent resident card","A Social Insurance Number"],"fr":["Un passeport canadien","Un Avis de convocation – Pour prêter le serment de citoyenneté","Une carte de résident permanent","Un numéro d’assurance sociale"]},"answer":1},{"type":"mc","q":{"en":"What information does the Notice to Appear give you?","fr":"Quels renseignements l’Avis de convocation vous donne-t-il?"},"options":{"en":["Your test score","The date, time and place of your citizenship ceremony","The name of your Member of Parliament","The questions on the test"],"fr":["Votre note à l’examen","La date, l’heure et le lieu de la cérémonie de citoyenneté","Le nom de votre député","Les questions de l’examen"]},"answer":1}]},{"id":"intro-008","topic":"ceremony","importance":3,"en":"At the ceremony, you will: take the Oath of Citizenship; sign the oath form; and receive your Canadian Citizenship Certificate.","en_simple":"At the ceremony you do 3 things: (1) take the Oath of Citizenship, (2) sign the oath form, (3) receive your Canadian Citizenship Certificate.","fr":"Au cours de cette cérémonie : vous prêterez le serment de citoyenneté; vous signerez le formulaire de ce serment; vous recevrez votre certificat de citoyenneté canadienne.","tr":{"ar":"في الحفل سوف: تؤدي قَسَم المواطنة؛ وتوقّع استمارة القَسَم؛ وتتسلّم شهادة المواطنة الكندية."},"questions":[{"type":"mc","q":{"en":"Which of the following happens at the citizenship ceremony?","fr":"Lequel des éléments suivants se produit lors de la cérémonie de citoyenneté?"},"options":{"en":["You write the citizenship test","You receive a passport","You take the Oath of Citizenship","You vote in an election"],"fr":["Vous passez l’examen pour la citoyenneté","Vous recevez un passeport","Vous prêtez le serment de citoyenneté","Vous votez à une élection"]},"answer":2},{"type":"mc","q":{"en":"What do you receive at the citizenship ceremony?","fr":"Que recevez-vous lors de la cérémonie de citoyenneté?"},"options":{"en":["Your Canadian Citizenship Certificate","Your permanent resident card","Your voter registration card","Your Notice to Appear"],"fr":["Votre certificat de citoyenneté canadienne","Votre carte de résident permanent","Votre carte d’électeur","Votre Avis de convocation"]},"answer":0},{"type":"tf","q":{"en":"At the ceremony, you sign the oath form.","fr":"Lors de la cérémonie, vous signez le formulaire du serment."},"answer":true}]},{"id":"intro-009","topic":"oath-content","importance":3,"en":"In the Oath of Citizenship, you swear (or affirm) that you will be faithful and bear true allegiance to His Majesty King Charles the Third, King of Canada, His Heirs and Successors, and that you will faithfully observe the laws of Canada, including the Constitution, which recognizes and affirms the Aboriginal and treaty rights of First Nations, Inuit and Métis peoples, and fulfil your duties as a Canadian citizen.","en_simple":"The Oath: be loyal to King Charles III, King of Canada, and his heirs; obey the laws of Canada including the Constitution (which recognizes the Aboriginal and treaty rights of First Nations, Inuit and Métis); and do your duties as a citizen.","fr":"Je jure (ou j'affirme solennellement) que je serai fidèle et porterai sincère allégeance à Sa Majesté le roi Charles Trois, Roi du Canada, à ses héritiers et successeurs, que j'observerai fidèlement les lois du Canada, y compris la Constitution, qui reconnaît et confirme les droits ancestraux ou issus de traités des Premières Nations, des Inuits et des Métis, et que je remplirai loyalement mes obligations de citoyen canadien.","tr":{"ar":"في قَسَم المواطنة، تُقسم (أو تؤكد) أنك ستكون مخلصًا وتحمل الولاء الصادق لجلالة الملك تشارلز الثالث (King Charles the Third)، ملك كندا، ولورثته وخلفائه، وأنك ستلتزم بأمانة بقوانين كندا، بما فيها الدستور الذي يعترف بالحقوق الأصلية وحقوق المعاهدات للأمم الأولى والإنويت والميتيس ويؤكدها، وأنك ستؤدي واجباتك كمواطن كندي."},"questions":[{"type":"mc","q":{"en":"To whom do you swear allegiance in the Oath of Citizenship?","fr":"À qui jurez-vous allégeance dans le serment de citoyenneté?"},"options":{"en":["The Prime Minister","The Governor General","His Majesty King Charles the Third, King of Canada","The Chief Justice of Canada"],"fr":["Le premier ministre","Le gouverneur général","Sa Majesté le roi Charles Trois, Roi du Canada","Le juge en chef du Canada"]},"answer":2},{"type":"mc","q":{"en":"Which peoples’ Aboriginal and treaty rights does the Constitution recognize and affirm, according to the Oath?","fr":"Selon le serment, la Constitution reconnaît et confirme les droits ancestraux ou issus de traités de quels peuples?"},"options":{"en":["English and French","First Nations, Inuit and Métis","Acadians and Loyalists","Québécois and Albertans"],"fr":["Les Anglais et les Français","Les Premières Nations, les Inuits et les Métis","Les Acadiens et les loyalistes","Les Québécois et les Albertains"]},"answer":1},{"type":"mc","q":{"en":"What do you promise to faithfully observe in the Oath of Citizenship?","fr":"Que promettez-vous d’observer fidèlement dans le serment de citoyenneté?"},"options":{"en":["The laws of Canada, including the Constitution","The rules of your province only","The laws of your country of origin","The traditions of the Church"],"fr":["Les lois du Canada, y compris la Constitution","Les règles de votre province seulement","Les lois de votre pays d’origine","Les traditions de l’Église"]},"answer":0},{"type":"tf","q":{"en":"In the Oath of Citizenship you promise to fulfil your duties as a Canadian citizen.","fr":"Dans le serment de citoyenneté, vous promettez de remplir vos obligations de citoyen canadien."},"answer":true}]},{"id":"intro-010","topic":"understanding-oath","importance":3,"en":"In Canada, we profess our loyalty to a person who represents all Canadians and not to a document such as a constitution, a banner such as a flag, or a geopolitical entity such as a country. In our constitutional monarchy, these elements are encompassed by the Sovereign (Queen or King).","en_simple":"Canadians promise loyalty to a person (the Sovereign: the King or Queen), not to a document, a flag, or a country. The Sovereign represents all of these.","fr":"Au Canada, nous jurons notre fidélité à une personne humaine qui nous représente tous, plutôt que de nous engager à servir un document, une oriflamme ou un territoire. Dans notre monarchie constitutionnelle, le souverain (reine ou roi) symbolise à la fois notre Constitution, notre drapeau et notre pays.","tr":{"ar":"في كندا، نُعلن ولاءنا لشخص يمثّل جميع الكنديين، لا لوثيقة مثل الدستور، ولا لراية مثل العلم، ولا لكيان جغرافي سياسي مثل البلد. وفي ملكيتنا الدستورية، يجسّد الملك أو الملكة (العاهل) هذه العناصر كلها."},"questions":[{"type":"mc","q":{"en":"In Canada, to whom or what do citizens profess their loyalty?","fr":"Au Canada, à qui ou à quoi les citoyens jurent-ils leur fidélité?"},"options":{"en":["The flag","The Constitution","The country as a geopolitical entity","A person who represents all Canadians (the Sovereign)"],"fr":["Le drapeau","La Constitution","Le pays en tant que territoire","Une personne qui nous représente tous (le souverain)"]},"answer":3},{"type":"tf","q":{"en":"In Canada, the Oath of Citizenship is sworn to the flag.","fr":"Au Canada, le serment de citoyenneté est prêté au drapeau."},"answer":false}]},{"id":"intro-011","topic":"sovereign-personifies-canada","importance":2,"en":"It is a remarkably simple yet powerful principle: Canada is personified by the Sovereign just as the Sovereign is personified by Canada. At the citizenship ceremony, you will repeat the Oath of Citizenship.","en_simple":"Canada is personified by the Sovereign (the King), and the Sovereign is personified by Canada. At the ceremony you repeat the Oath.","fr":"C’est un principe d’une remarquable simplicité, mais également d’une grande signification : le souverain personnifie le Canada tout comme le Canada personnifie le souverain. À la cérémonie de citoyenneté, vous devrez répéter le serment de citoyenneté.","tr":{"ar":"إنه مبدأ بسيط للغاية لكنه قوي: العاهل (الملك) يجسّد كندا كما تجسّد كندا العاهل. وفي حفل المواطنة، ستردّد قَسَم المواطنة."},"questions":[{"type":"mc","q":{"en":"According to the guide, who personifies Canada?","fr":"Selon le guide, qui personnifie le Canada?"},"options":{"en":["The Prime Minister","The Sovereign","The Speaker of the House","The Supreme Court"],"fr":["Le premier ministre","Le souverain","Le président de la Chambre","La Cour suprême"]},"answer":1}]},{"id":"intro-012","topic":"canada-system","importance":3,"en":"Canada is a constitutional monarchy, a parliamentary democracy and a federal state. Canadians are bound together by a shared commitment to the rule of law and to the institutions of parliamentary government.","en_simple":"Canada is 3 things: a constitutional monarchy, a parliamentary democracy, and a federal state. Canadians share a commitment to the rule of law.","fr":"Le Canada est une monarchie constitutionnelle, une démocratie parlementaire et un État fédéral. Les Canadiens sont unis par leur engagement commun à l’égard de la primauté du droit et des institutions de la démocratie parlementaire.","tr":{"ar":"كندا ملكية دستورية وديمقراطية برلمانية ودولة فيدرالية. ويرتبط الكنديون معًا بالتزام مشترك بسيادة القانون وبمؤسسات الحكم البرلماني."},"questions":[{"type":"mc","q":{"en":"What three terms describe Canada’s system of government?","fr":"Quels trois termes décrivent le système de gouvernement du Canada?"},"options":{"en":["A republic, a direct democracy and a unitary state","A constitutional monarchy, a parliamentary democracy and a federal state","An absolute monarchy, a federal state and a presidential system","A confederation, a republic and a parliamentary democracy"],"fr":["Une république, une démocratie directe et un État unitaire","Une monarchie constitutionnelle, une démocratie parlementaire et un État fédéral","Une monarchie absolue, un État fédéral et un régime présidentiel","Une confédération, une république et une démocratie parlementaire"]},"answer":1},{"type":"tf","q":{"en":"Canada is a republic.","fr":"Le Canada est une république."},"answer":false},{"type":"mc","q":{"en":"Canadians are bound together by a shared commitment to what?","fr":"Par quel engagement commun les Canadiens sont-ils unis?"},"options":{"en":["The rule of law and the institutions of parliamentary government","A single religion","A single language","Military service"],"fr":["La primauté du droit et les institutions de la démocratie parlementaire","Une seule religion","Une seule langue","Le service militaire"]},"answer":0}]},{"id":"intro-013","topic":"newcomers-400-years","importance":2,"en":"Canada has welcomed generations of newcomers to our shores to help us build a free, law-abiding and prosperous society. For 400 years, settlers and immigrants have contributed to the diversity and richness of our country.","en_simple":"For 400 years, settlers and immigrants have helped build Canada into a free, law-abiding and prosperous society.","fr":"Le Canada a accueilli des générations de nouveaux arrivants pour nous aider à bâtir une société libre, prospère et respectueuse des lois. Depuis 400 ans, les colons et les immigrants ont contribué à la diversité et à la richesse de notre pays.","tr":{"ar":"رحّبت كندا بأجيال من القادمين الجدد إلى شواطئها للمساعدة في بناء مجتمع حر ومزدهر يحترم القانون. ومنذ 400 عام، يساهم المستوطنون والمهاجرون في تنوّع بلدنا وثرائه."},"questions":[{"type":"mc","q":{"en":"For how many years have settlers and immigrants contributed to Canada, according to the guide?","fr":"Selon le guide, depuis combien d’années les colons et les immigrants contribuent-ils au Canada?"},"options":{"en":["100 years","200 years","400 years","800 years"],"fr":["100 ans","200 ans","400 ans","800 ans"]},"answer":2}]},{"id":"intro-014","topic":"what-to-learn","importance":2,"en":"You must also learn about voting procedures, Canada’s history, symbols, democratic institutions, geography, and the rights and responsibilities of citizenship.","en_simple":"You must learn 6 subjects: voting procedures, Canada's history, symbols, democratic institutions, geography, and the rights and responsibilities of citizenship.","fr":"Vous devrez également acquérir des connaissances sur le droit de vote, l’histoire du Canada, ses symboles, ses institutions démocratiques, sa géographie ainsi que sur les droits et responsabilités liés à la citoyenneté.","tr":{"ar":"يجب عليك أيضًا التعرّف على إجراءات التصويت، وتاريخ كندا، ورموزها، ومؤسساتها الديمقراطية، وجغرافيتها، وحقوق المواطنة ومسؤولياتها."},"questions":[{"type":"mc","q":{"en":"Which of the following is NOT one of the subjects the guide says you must learn about?","fr":"Lequel des sujets suivants n’est PAS un sujet que le guide vous demande d’apprendre?"},"options":{"en":["Voting procedures","Canada’s geography","Canada’s symbols","Canadian cooking"],"fr":["Le droit de vote","La géographie du Canada","Les symboles du Canada","La cuisine canadienne"]},"answer":3},{"type":"tf","q":{"en":"Applicants must learn about Canada’s democratic institutions and history.","fr":"Les demandeurs doivent acquérir des connaissances sur les institutions démocratiques et l’histoire du Canada."},"answer":true}]},{"id":"intro-015","topic":"practical-facts","importance":1,"en":"When you apply for citizenship, officials will check your status, verify that you are not prohibited from applying, and ensure that you meet the requirements. Your application may take several months; ensure that the Call Centre always has your correct address. If you do not pass the test, you will receive a notification indicating the next steps. The Government of Canada offers English or French language classes free of charge.","en_simple":"Officials check your status and requirements. The application can take several months, so keep your address up to date with the Call Centre. If you fail, you get a notice about next steps. Government English/French classes are free.","fr":"Lorsque vous demandez la citoyenneté, des fonctionnaires examinent votre statut, vérifient si vous avez le droit de présenter une demande et s’assurent que vous remplissez les exigences. L’étude de votre demande prendra plusieurs mois. Pendant ce temps, assurez-vous que le Télécentre a toujours votre adresse exacte. Si vous échouez à l’examen, vous recevrez un avis vous indiquant les étapes suivantes. Les cours de français ou d’anglais sont offerts gratuitement par le gouvernement du Canada.","tr":{"ar":"عند التقدم بطلب المواطنة، يتحقق الموظفون من وضعك، ويتأكدون من أنك غير ممنوع من التقديم، ومن استيفائك للشروط. قد يستغرق طلبك عدة أشهر؛ فتأكد من أن مركز الاتصال لديه عنوانك الصحيح دائمًا. وإذا لم تجتز الامتحان، فستتلقى إشعارًا يوضح الخطوات التالية. وتقدّم حكومة كندا دروس اللغة الإنجليزية أو الفرنسية مجانًا."},"questions":[{"type":"mc","q":{"en":"How long may your citizenship application take, according to the guide?","fr":"Selon le guide, combien de temps l’étude de votre demande de citoyenneté peut-elle prendre?"},"options":{"en":["One day","One week","Several months","Ten years"],"fr":["Une journée","Une semaine","Plusieurs mois","Dix ans"]},"answer":2},{"type":"tf","q":{"en":"The Government of Canada offers English or French language classes free of charge.","fr":"Le gouvernement du Canada offre gratuitement des cours de français ou d’anglais."},"answer":true},{"type":"mc","q":{"en":"What happens if you do not pass the citizenship test?","fr":"Que se passe-t-il si vous échouez à l’examen pour la citoyenneté?"},"options":{"en":["You are deported","You receive a notification indicating the next steps","You lose your permanent residence","You can never apply again"],"fr":["Vous êtes expulsé","Vous recevez un avis vous indiquant les étapes suivantes","Vous perdez votre résidence permanente","Vous ne pouvez plus jamais présenter de demande"]},"answer":1}]}]},{"unit":"rights","order":1,"title":{"en":"Rights and Responsibilities","fr":"Droits et responsabilités"},"title_tr":{"ar":"الحقوق والمسؤوليات"},"source":{"en":"05-rights-responsibilities","fr":"05-droits-responsabilites"},"cards":[{"id":"rights-001","topic":"sources-of-law","importance":2,"en":"Canadian law has several sources: laws passed by Parliament and the provincial legislatures, English common law, the civil code of France, and the unwritten constitution inherited from Great Britain.","en_simple":"Canadian law comes from 4 sources: Parliament's laws, English common law, the French civil code, and Britain's unwritten constitution.","fr":"Les règles juridiques du Canada proviennent des lois adoptées par le Parlement et les assemblées législatives provinciales, de la common law, du code civil de la France et de la tradition constitutionnelle héritée de la Grande-Bretagne.","tr":{"ar":"للقانون الكندي عدة مصادر: القوانين التي يسنّها البرلمان والمجالس التشريعية للمقاطعات، والقانون العام الإنجليزي، والقانون المدني الفرنسي، والدستور غير المكتوب الموروث من بريطانيا العظمى."},"questions":[{"type":"mc","q":{"en":"Which of the following is NOT a source of Canadian law?","fr":"Lequel des éléments suivants n’est PAS une source du droit canadien?"},"options":{"en":["English common law","The civil code of France","The American Constitution","Laws passed by Parliament"],"fr":["La common law britannique","Le code civil de la France","La Constitution américaine","Les lois adoptées par le Parlement"]},"answer":2}]},{"id":"rights-002","topic":"magna-carta","importance":3,"en":"Canada’s tradition of ordered liberty is 800 years old and dates back to the signing of Magna Carta in 1215 in England, also known as the Great Charter of Freedoms.","en_simple":"Magna Carta (the Great Charter of Freedoms) was signed in England in 1215. Canada's freedoms come from this 800-year-old tradition.","fr":"La tradition de liberté ordonnée du Canada est vieille de 800 ans et remonte à 1215, année de la signature de la Magna Carta (aussi appelée Grande Charte des libertés) en Angleterre.","tr":{"ar":"يعود تقليد الحرية المنظّمة في كندا إلى 800 عام، إلى توقيع «ماغنا كارتا» (الميثاق الأعظم للحريات) في إنجلترا عام 1215."},"questions":[{"type":"mc","q":{"en":"When was Magna Carta signed?","fr":"En quelle année la Magna Carta a-t-elle été signée?"},"options":{"en":["1215","1867","1982","1763"],"fr":["1215","1867","1982","1763"]},"answer":0},{"type":"mc","q":{"en":"What is another name for Magna Carta?","fr":"Quel est l’autre nom de la Magna Carta?"},"options":{"en":["The Great Charter of Freedoms","The Charter of Rights and Freedoms","The British North America Act","The Quebec Act"],"fr":["La Grande Charte des libertés","La Charte des droits et libertés","L’Acte de l’Amérique du Nord britannique","L’Acte de Québec"]},"answer":0}]},{"id":"rights-003","topic":"fundamental-freedoms","importance":3,"en":"Canadians enjoy four fundamental freedoms: freedom of conscience and religion; freedom of thought, belief, opinion and expression, including freedom of speech and of the press; freedom of peaceful assembly; and freedom of association.","en_simple":"The 4 fundamental freedoms: (1) conscience and religion, (2) thought, belief, opinion and expression, (3) peaceful assembly, (4) association.","fr":"Les Canadiens jouissent de quatre libertés fondamentales : la liberté de conscience et de religion; la liberté de pensée, de croyance, d’opinion et d’expression, y compris la liberté de la presse; la liberté de réunion pacifique; et la liberté d’association.","tr":{"ar":"يتمتع الكنديون بأربع حريات أساسية: حرية الضمير والدين؛ وحرية الفكر والمعتقد والرأي والتعبير بما فيها حرية الصحافة؛ وحرية التجمع السلمي؛ وحرية تكوين الجمعيات."},"questions":[{"type":"mc","q":{"en":"Which of the following is one of the four fundamental freedoms?","fr":"Laquelle des libertés suivantes est l’une des quatre libertés fondamentales?"},"options":{"en":["Freedom of peaceful assembly","Freedom to own property","Freedom from taxation","Freedom to carry weapons"],"fr":["La liberté de réunion pacifique","La liberté de posséder des biens","La liberté de ne pas payer d’impôts","La liberté de porter des armes"]},"answer":0},{"type":"tf","q":{"en":"Freedom of association is one of the fundamental freedoms in Canada.","fr":"La liberté d’association est l’une des libertés fondamentales au Canada."},"answer":true},{"type":"mc","q":{"en":"Name four fundamental freedoms that Canadians enjoy.","fr":"Nommez quatre libertés fondamentales dont jouissent les Canadiens."},"options":{"en":["Conscience and religion; thought, belief, opinion and expression; peaceful assembly; association","Voting; owning land; free health care; free education","Speech; travel; employment; housing","Religion; hunting; fishing; driving"],"fr":["Conscience et religion; pensée, croyance, opinion et expression; réunion pacifique; association","Vote; propriété foncière; soins de santé gratuits; éducation gratuite","Parole; voyage; emploi; logement","Religion; chasse; pêche; conduite automobile"]},"answer":0}]},{"id":"rights-004","topic":"habeas-corpus","importance":2,"en":"Habeas corpus, the right to challenge unlawful detention by the state, comes from English common law.","en_simple":"Habeas corpus = the right to challenge being held by the state unlawfully. It comes from English common law.","fr":"L’habeas corpus, ou droit de contester une détention illégale par l’État, est emprunté à la common law britannique.","tr":{"ar":"«هابياس كوربوس» هو حق الطعن في الاحتجاز غير القانوني من قِبل الدولة، وهو مستمد من القانون العام الإنجليزي."},"questions":[{"type":"mc","q":{"en":"What is habeas corpus?","fr":"Qu’est-ce que l’habeas corpus?"},"options":{"en":["The right to challenge unlawful detention by the state","The right to vote in elections","The right to a passport","The right to free education"],"fr":["Le droit de contester une détention illégale par l’État","Le droit de voter aux élections","Le droit à un passeport","Le droit à l’éducation gratuite"]},"answer":0}]},{"id":"rights-005","topic":"charter","importance":3,"en":"The Constitution of Canada was amended in 1982 to entrench the Canadian Charter of Rights and Freedoms.","en_simple":"The Canadian Charter of Rights and Freedoms became part of the Constitution in 1982.","fr":"La Constitution du Canada a été modifiée en 1982 afin d’inclure la Charte canadienne des droits et libertés.","tr":{"ar":"عُدِّل دستور كندا عام 1982 لترسيخ الميثاق الكندي للحقوق والحريات."},"questions":[{"type":"mc","q":{"en":"In what year was the Canadian Charter of Rights and Freedoms entrenched in the Constitution?","fr":"En quelle année la Charte canadienne des droits et libertés a-t-elle été incluse dans la Constitution?"},"options":{"en":["1982","1867","1965","1215"],"fr":["1982","1867","1965","1215"]},"answer":0},{"type":"mc","q":{"en":"Name two key documents that contain our rights and freedoms.","fr":"Nommez deux documents importants qui énoncent nos droits et libertés."},"options":{"en":["Magna Carta and the Canadian Charter of Rights and Freedoms","The Quebec Act and the Indian Act","The Official Languages Act and the Canada Health Act","The Citizenship Act and the Elections Act"],"fr":["La Magna Carta et la Charte canadienne des droits et libertés","L’Acte de Québec et la Loi sur les Indiens","La Loi sur les langues officielles et la Loi canadienne sur la santé","La Loi sur la citoyenneté et la Loi électorale"]},"answer":0}]},{"id":"rights-006","topic":"charter","importance":2,"en":"The Charter begins with the words: “Whereas Canada is founded upon principles that recognize the supremacy of God and the rule of law.”","en_simple":"The Charter's first words recognize the supremacy of God and the rule of law.","fr":"La Charte commence par ces mots : « Attendu que le Canada est fondé sur des principes qui reconnaissent la suprématie de Dieu et la primauté du droit ».","tr":{"ar":"يبدأ الميثاق بعبارة: «حيث إن كندا قائمة على مبادئ تعترف بسيادة الله وسيادة القانون»."},"questions":[{"type":"mc","q":{"en":"The Canadian Charter of Rights and Freedoms begins by recognizing the supremacy of God and…","fr":"La Charte canadienne des droits et libertés commence en reconnaissant la suprématie de Dieu et…"},"options":{"en":["the rule of law","the Prime Minister","the provinces","the economy"],"fr":["la primauté du droit","le premier ministre","les provinces","l’économie"]},"answer":0}]},{"id":"rights-007","topic":"charter-rights","importance":3,"en":"The Charter sets out additional rights, including Mobility Rights: Canadians can live and work anywhere they choose in Canada, enter and leave the country freely, and apply for a passport.","en_simple":"Mobility Rights: live and work anywhere in Canada, enter and leave freely, apply for a passport.","fr":"La Charte ajoute d’autres droits, dont la liberté de circulation et d’établissement : les Canadiens peuvent vivre et travailler n’importe où au Canada, entrer au Canada et en sortir librement, et demander un passeport canadien.","tr":{"ar":"يحدد الميثاق حقوقًا إضافية، منها حقوق التنقل: يستطيع الكنديون العيش والعمل في أي مكان يختارونه في كندا، ودخول البلاد ومغادرتها بحرية، والتقدم بطلب جواز سفر."},"questions":[{"type":"mc","q":{"en":"Which right lets Canadians live and work anywhere in Canada and apply for a passport?","fr":"Quel droit permet aux Canadiens de vivre et de travailler n’importe où au Canada et de demander un passeport?"},"options":{"en":["Mobility Rights","Aboriginal Peoples’ Rights","Official Language Rights","Multiculturalism"],"fr":["La liberté de circulation et d’établissement","Les droits des peuples autochtones","Les droits relatifs aux langues officielles","Le multiculturalisme"]},"answer":0},{"type":"mc","q":{"en":"Identify four rights that Canadians enjoy.","fr":"Énumérez quatre droits dont jouissent les Canadiens."},"options":{"en":["Mobility rights; Aboriginal peoples’ rights; official language and minority language educational rights; multiculturalism","Free housing; free cars; free food; free travel","The right to a job; the right to a pension; the right to a car; the right to land","Hunting rights; fishing rights; mining rights; logging rights"],"fr":["Liberté de circulation; droits des peuples autochtones; droits relatifs aux langues officielles et à l’instruction dans la langue de la minorité; multiculturalisme","Logement gratuit; voitures gratuites; nourriture gratuite; voyages gratuits","Droit à un emploi; droit à une pension; droit à une voiture; droit à une terre","Droits de chasse; droits de pêche; droits miniers; droits forestiers"]},"answer":0}]},{"id":"rights-008","topic":"charter-rights","importance":2,"en":"Aboriginal Peoples’ Rights: the rights guaranteed in the Charter will not adversely affect any treaty or other rights or freedoms of Aboriginal peoples.","en_simple":"The Charter does not take away any treaty or other rights of Aboriginal peoples.","fr":"Les droits des peuples autochtones : les droits garantis dans la Charte ne portent atteinte en aucun cas aux droits et libertés (acquis par traité ou autres) des peuples autochtones.","tr":{"ar":"حقوق الشعوب الأصلية: الحقوق التي يضمنها الميثاق لا تمسّ بأي حقوق أو حريات ناشئة عن المعاهدات أو غيرها للشعوب الأصلية."},"questions":[{"type":"tf","q":{"en":"The Charter can cancel treaty rights of Aboriginal peoples.","fr":"La Charte peut annuler les droits issus de traités des peuples autochtones."},"answer":false}]},{"id":"rights-009","topic":"charter-rights","importance":3,"en":"Official Language Rights and Minority Language Educational Rights: French and English have equal status in Parliament and throughout the government.","en_simple":"French and English have equal status in Parliament and the government.","fr":"Les droits relatifs aux langues officielles et les droits à l’instruction dans la langue de la minorité : le français et l’anglais ont un statut égal au Parlement et dans l’ensemble du gouvernement.","tr":{"ar":"حقوق اللغات الرسمية وحقوق التعليم بلغة الأقلية: للفرنسية والإنجليزية مكانة متساوية في البرلمان وفي الحكومة كلها."},"questions":[{"type":"mc","q":{"en":"Which two languages have equal status in Parliament and throughout the government?","fr":"Quelles deux langues ont un statut égal au Parlement et dans l’ensemble du gouvernement?"},"options":{"en":["French and English","English and Spanish","French and Inuktitut","English and Chinese"],"fr":["Le français et l’anglais","L’anglais et l’espagnol","Le français et l’inuktitut","L’anglais et le chinois"]},"answer":0}]},{"id":"rights-010","topic":"charter-rights","importance":2,"en":"Multiculturalism is a fundamental characteristic of the Canadian heritage and identity. Canadians celebrate the gift of one another’s presence and work hard to respect pluralism and live in harmony.","en_simple":"Multiculturalism is a fundamental part of Canadian identity.","fr":"Le multiculturalisme est une caractéristique fondamentale de l’identité et du patrimoine canadiens. Les Canadiens sont heureux de vivre ensemble et s’efforcent de respecter le pluralisme et de vivre en harmonie.","tr":{"ar":"التعددية الثقافية سمة أساسية من سمات التراث والهوية الكنديين. يحتفي الكنديون بوجود بعضهم بعضًا ويحرصون على احترام التعددية والعيش في وئام."},"questions":[{"type":"mc","q":{"en":"What is described as a fundamental characteristic of the Canadian heritage and identity?","fr":"Qu’est-ce qui est décrit comme une caractéristique fondamentale de l’identité et du patrimoine canadiens?"},"options":{"en":["Multiculturalism","Military service","Hockey","Farming"],"fr":["Le multiculturalisme","Le service militaire","Le hockey","L’agriculture"]},"answer":0}]},{"id":"rights-011","topic":"equality","importance":3,"en":"In Canada, men and women are equal under the law. Canada’s openness and generosity do not extend to barbaric cultural practices that tolerate spousal abuse, “honour killings,” female genital mutilation, forced marriage or other gender-based violence. Those guilty of these crimes are severely punished under Canada’s criminal laws.","en_simple":"Men and women are equal under the law. Spousal abuse, “honour killings,” female genital mutilation and forced marriage are crimes in Canada and are severely punished.","fr":"Au Canada, les hommes et les femmes sont égaux devant la loi. L’ouverture et la générosité du Canada excluent les pratiques culturelles barbares qui tolèrent la violence conjugale, les « meurtres d’honneur », la mutilation sexuelle des femmes, les mariages forcés ou d’autres actes de violence fondée sur le sexe. Les personnes coupables de tels crimes sont sévèrement punies en vertu des lois pénales du Canada.","tr":{"ar":"في كندا، الرجال والنساء متساوون أمام القانون. انفتاح كندا وكرمها لا يشملان الممارسات الثقافية الهمجية التي تتسامح مع العنف الزوجي أو «جرائم الشرف» أو تشويه الأعضاء التناسلية للإناث أو الزواج القسري أو غير ذلك من العنف القائم على النوع الاجتماعي. ويُعاقب مرتكبو هذه الجرائم بشدة بموجب القوانين الجنائية الكندية."},"questions":[{"type":"mc","q":{"en":"What is meant by the equality of women and men?","fr":"Que signifie l’égalité entre les femmes et les hommes?"},"options":{"en":["Men and women are equal under the law","Men and women must do the same jobs","Women must earn more than men","Only women can vote"],"fr":["Les hommes et les femmes sont égaux devant la loi","Les hommes et les femmes doivent faire les mêmes emplois","Les femmes doivent gagner plus que les hommes","Seules les femmes peuvent voter"]},"answer":0},{"type":"tf","q":{"en":"In Canada, forced marriage and “honour killings” are severely punished under criminal law.","fr":"Au Canada, les mariages forcés et les « meurtres d’honneur » sont sévèrement punis par le droit pénal."},"answer":true}]},{"id":"rights-012","topic":"responsibilities","importance":3,"en":"In Canada, rights come with responsibilities. These include: obeying the law; taking responsibility for oneself and one’s family; serving on a jury; voting in elections; helping others in the community; and protecting and enjoying our heritage and environment.","en_simple":"The 6 responsibilities of citizenship: obey the law, take responsibility for yourself and your family, serve on a jury, vote in elections, help others in the community, protect heritage and environment.","fr":"Au Canada, les droits s’accompagnent de responsabilités : respecter les lois; répondre à ses propres besoins et à ceux de sa famille; faire partie d’un jury; voter aux élections; offrir de l’aide aux membres de la communauté; protéger notre patrimoine et notre environnement.","tr":{"ar":"في كندا، تأتي الحقوق مقترنة بمسؤوليات، ومنها: احترام القانون؛ وتحمّل المسؤولية عن النفس والأسرة؛ والخدمة في هيئة المحلفين؛ والتصويت في الانتخابات؛ ومساعدة الآخرين في المجتمع؛ وحماية تراثنا وبيئتنا والاستمتاع بهما."},"questions":[{"type":"mc","q":{"en":"What are three responsibilities of citizenship?","fr":"Quelles sont les trois responsabilités liées à la citoyenneté?"},"options":{"en":["Obeying the law, taking responsibility for oneself and one’s family, serving on a jury","Being loyal to Canada, recycling newspapers, serving in the navy, army or air force","Learning both official languages, voting in elections, belonging to a union","Buying Canadian products, owning your own business, using less water"],"fr":["Respecter les lois, répondre à ses propres besoins et à ceux de sa famille, faire partie d’un jury","Être fidèle au Canada, recycler le papier journal, s’enrôler dans la marine, l’armée ou les forces aériennes","Apprendre les deux langues officielles, voter aux élections, faire partie d’un syndicat","Acheter des produits canadiens, exploiter sa propre entreprise, utiliser moins d’eau potable"]},"answer":0},{"type":"mc","q":{"en":"Which of the following is a responsibility of Canadian citizenship?","fr":"Lequel des éléments suivants est une responsabilité liée à la citoyenneté canadienne?"},"options":{"en":["Serving on a jury","Joining a political party","Owning a home","Learning to ski"],"fr":["Faire partie d’un jury","Adhérer à un parti politique","Posséder une maison","Apprendre à skier"]},"answer":0},{"type":"tf","q":{"en":"Voting in elections is a responsibility of citizenship.","fr":"Voter aux élections est une responsabilité liée à la citoyenneté."},"answer":true}]},{"id":"rights-013","topic":"responsibilities","importance":3,"en":"Obeying the law: one of Canada’s founding principles is the rule of law. Individuals and governments are regulated by laws and not by arbitrary actions. No person or group is above the law.","en_simple":"The rule of law: everyone, including governments, must follow the law. No one is above the law.","fr":"Respecter les lois : l’un des principes fondateurs du Canada est la primauté du droit. Les individus et les gouvernements sont régis par des lois et non par des mesures arbitraires. Aucune personne ni aucun groupe n’est au-dessus des lois.","tr":{"ar":"احترام القانون: من المبادئ المؤسِّسة لكندا سيادة القانون. يخضع الأفراد والحكومات للقوانين لا للإجراءات التعسفية. ولا يوجد شخص أو جماعة فوق القانون."},"questions":[{"type":"mc","q":{"en":"What is one of Canada’s founding principles?","fr":"Quel est l’un des principes fondateurs du Canada?"},"options":{"en":["The rule of law","Military service","Free trade","Republicanism"],"fr":["La primauté du droit","Le service militaire","Le libre-échange","Le républicanisme"]},"answer":0},{"type":"tf","q":{"en":"In Canada, the Prime Minister is above the law.","fr":"Au Canada, le premier ministre est au-dessus des lois."},"answer":false}]},{"id":"rights-014","topic":"responsibilities","importance":2,"en":"Taking responsibility for oneself and one’s family: getting a job, taking care of one’s family and working hard in keeping with one’s abilities are important Canadian values.","en_simple":"Taking responsibility for yourself and your family means getting a job, caring for your family, and working hard.","fr":"Répondre à ses propres besoins et à ceux de sa famille : il est important pour les Canadiens d’avoir un emploi, de prendre soin de leur famille et de mettre leurs habiletés à contribution.","tr":{"ar":"تحمّل المسؤولية عن النفس والأسرة: الحصول على عمل، ورعاية الأسرة، والعمل بجد وفق القدرات، هي قيم كندية مهمة."},"questions":[{"type":"mc","q":{"en":"What are some examples of taking responsibility for yourself and your family?","fr":"Donnez des exemples de ce qu’on entend par « répondre à ses propres besoins et à ceux de sa famille »."},"options":{"en":["Getting a job, taking care of one’s family, working hard","Buying a large house and two cars","Moving to a big city","Serving in the army"],"fr":["Avoir un emploi, prendre soin de sa famille, travailler fort","Acheter une grande maison et deux voitures","Déménager dans une grande ville","Servir dans l’armée"]},"answer":0}]},{"id":"rights-015","topic":"responsibilities","importance":3,"en":"Serving on a jury: when called to do so, you are legally required to serve. Serving on a jury is a privilege that makes the justice system work, as it depends on impartial juries made up of citizens.","en_simple":"If you are called for jury duty, the law requires you to serve. Juries of citizens make the justice system work.","fr":"Faire partie d’un jury : lorsqu’on vous le demande, la loi vous oblige à le faire. Être membre d’un jury est un privilège et la participation des citoyens à des jurys impartiaux est essentielle au bon fonctionnement du système judiciaire.","tr":{"ar":"الخدمة في هيئة المحلفين: عندما تُستدعى لذلك، يُلزمك القانون بالخدمة. الخدمة في هيئة المحلفين امتياز يجعل نظام العدالة يعمل، لأنه يعتمد على هيئات محلفين محايدة مكوّنة من المواطنين."},"questions":[{"type":"tf","q":{"en":"When called to serve on a jury, you are legally required to serve.","fr":"Lorsqu’on vous demande de faire partie d’un jury, la loi vous oblige à le faire."},"answer":true}]},{"id":"rights-016","topic":"responsibilities","importance":2,"en":"Helping others in the community: millions of volunteers freely donate their time to help others without pay. Volunteering is an excellent way to gain useful skills and develop friends and contacts.","en_simple":"Volunteering (helping others without pay) is a good way to gain skills and make friends.","fr":"Offrir de l’aide aux membres de la communauté : des millions de bénévoles donnent de leur temps aux autres sans être payés. Le bénévolat est un excellent moyen d’acquérir des compétences utiles et de se faire des amis et des relations.","tr":{"ar":"مساعدة الآخرين في المجتمع: ملايين المتطوعين يتبرعون بوقتهم لمساعدة الآخرين دون أجر. التطوع وسيلة ممتازة لاكتساب مهارات مفيدة وتكوين صداقات وعلاقات."},"questions":[{"type":"mc","q":{"en":"Which of the following is an example of helping others in the community?","fr":"Lequel des exemples suivants illustre l’aide offerte aux membres de la communauté?"},"options":{"en":["Volunteering at a food bank","Paying your taxes","Buying a car","Watching hockey"],"fr":["Faire du bénévolat dans une banque d’alimentation","Payer ses impôts","Acheter une voiture","Regarder le hockey"]},"answer":0}]},{"id":"rights-017","topic":"responsibilities","importance":2,"en":"Protecting and enjoying our heritage and environment: every citizen has a role to play in avoiding waste and pollution while protecting Canada’s natural, cultural and architectural heritage for future generations.","en_simple":"Every citizen should avoid waste and pollution and protect Canada's natural, cultural and architectural heritage.","fr":"Protéger notre patrimoine et notre environnement : tous les citoyens ont la responsabilité d’éviter le gaspillage et la pollution, ainsi que de protéger le patrimoine naturel, culturel et architectural du pays pour les générations à venir.","tr":{"ar":"حماية تراثنا وبيئتنا والاستمتاع بهما: لكل مواطن دور في تجنّب الهدر والتلوث وحماية التراث الطبيعي والثقافي والمعماري لكندا للأجيال القادمة."},"questions":[{"type":"tf","q":{"en":"Protecting the environment is a responsibility of Canadian citizens.","fr":"Protéger l’environnement est une responsabilité des citoyens canadiens."},"answer":true}]},{"id":"rights-018","topic":"defending-canada","importance":3,"en":"There is no compulsory military service in Canada. However, serving in the regular Canadian Forces (navy, army and air force) is a noble way to contribute to Canada and an excellent career choice.","en_simple":"Military service is NOT compulsory in Canada, but serving in the Canadian Forces (navy, army, air force) is a noble way to contribute.","fr":"Le Canada n’impose pas le service militaire obligatoire. Toutefois, travailler dans les Forces canadiennes (la Marine, l’Armée de terre et la Force aérienne) est une noble façon d’apporter sa contribution au Canada et un excellent choix de carrière.","tr":{"ar":"لا توجد خدمة عسكرية إلزامية في كندا. ومع ذلك، فإن الخدمة في القوات الكندية النظامية (البحرية والجيش والقوات الجوية) طريقة نبيلة للمساهمة في كندا وخيار مهني ممتاز."},"questions":[{"type":"tf","q":{"en":"Military service is compulsory in Canada.","fr":"Le service militaire est obligatoire au Canada."},"answer":false},{"type":"mc","q":{"en":"What are the three branches of the regular Canadian Forces?","fr":"Quelles sont les trois composantes des Forces canadiennes?"},"options":{"en":["Navy, army and air force","Police, firefighters and paramedics","Coast Guard, cadets and militia","Marines, rangers and reserves"],"fr":["La Marine, l’Armée de terre et la Force aérienne","La police, les pompiers et les ambulanciers","La Garde côtière, les cadets et la milice","Les marines, les rangers et les réserves"]},"answer":0}]},{"id":"rights-019","topic":"defending-canada","importance":1,"en":"You may also serve in the Coast Guard or emergency services in your community such as a police force or fire department. Young people can learn discipline, responsibility, and skills by getting involved in the cadets.","en_simple":"You can also serve in the Coast Guard, police, or fire department. Young people can join the cadets.","fr":"Vous pouvez aussi faire partie de la Garde côtière ou des services d’urgence de votre communauté, comme le service de police ou les pompiers. Les jeunes peuvent acquérir une discipline, le sens des responsabilités et des compétences en s’engageant dans les Cadets.","tr":{"ar":"يمكنك أيضًا الخدمة في خفر السواحل أو خدمات الطوارئ في مجتمعك مثل الشرطة أو الإطفاء. ويستطيع الشباب تعلّم الانضباط والمسؤولية والمهارات بالانضمام إلى الكاديت (الطلائع)."},"questions":[{"type":"mc","q":{"en":"How can young people learn discipline, responsibility and skills, according to the guide?","fr":"Selon le guide, comment les jeunes peuvent-ils acquérir discipline, sens des responsabilités et compétences?"},"options":{"en":["By getting involved in the cadets","By running for Parliament","By buying a business","By moving abroad"],"fr":["En s’engageant dans les Cadets","En se présentant au Parlement","En achetant une entreprise","En déménageant à l’étranger"]},"answer":0}]}]},{"unit":"who","order":2,"title":{"en":"Who We Are","fr":"Qui sommes-nous"},"title_tr":{"ar":"من نحن"},"source":{"en":"06-who-we-are","fr":"06-qui-sommes-nous"},"cards":[{"id":"who-001","topic":"constitutional-tradition","importance":3,"en":"Canadians have inherited the oldest continuous constitutional tradition in the world.","en_simple":"Canada has the oldest continuous constitutional tradition in the world.","fr":"Nous avons hérité de la plus ancienne tradition constitutionnelle continue du monde.","tr":{"ar":"ورث الكنديون أقدم تقليد دستوري متواصل في العالم."},"questions":[{"type":"mc","q":{"en":"What have Canadians inherited, according to Discover Canada?","fr":"Selon Découvrir le Canada, de quoi les Canadiens ont-ils hérité?"},"options":{"en":["The largest army in the world","The oldest continuous constitutional tradition in the world","The newest constitution in the world","The oldest republic in the world"],"fr":["La plus grande armée du monde","La plus ancienne tradition constitutionnelle continue du monde","La constitution la plus récente du monde","La plus ancienne république du monde"]},"answer":1},{"type":"tf","q":{"en":"Canada has the oldest continuous constitutional tradition in the world.","fr":"Le Canada a la plus ancienne tradition constitutionnelle continue du monde."},"answer":true}]},{"id":"who-002","topic":"constitutional-monarchy","importance":3,"en":"Canada is the only constitutional monarchy in North America.","en_simple":"Canada is the only constitutional monarchy in North America.","fr":"Nous sommes la seule monarchie constitutionnelle d’Amérique du Nord.","tr":{"ar":"كندا هي الملكية الدستورية الوحيدة في أمريكا الشمالية."},"questions":[{"type":"mc","q":{"en":"Canada is the only ________ in North America.","fr":"Le Canada est la seule ________ d’Amérique du Nord."},"options":{"en":["republic","federation","constitutional monarchy","dictatorship"],"fr":["république","fédération","monarchie constitutionnelle","dictature"]},"answer":2},{"type":"tf","q":{"en":"Canada is a republic.","fr":"Le Canada est une république."},"answer":false}]},{"id":"who-003","topic":"peace-order-good-government","importance":3,"en":"Our institutions uphold a commitment to Peace, Order, and Good Government, a key phrase in Canada’s original constitutional document in 1867, the British North America Act.","en_simple":"“Peace, Order, and Good Government” is a key phrase from the British North America Act of 1867, Canada's first constitutional document.","fr":"Nos institutions préservent un engagement envers les valeurs de la paix, de l’ordre et de bon gouvernement, énoncées en 1867 dans le premier document constitutionnel du Canada, l’Acte de l’Amérique du Nord britannique.","tr":{"ar":"تحافظ مؤسساتنا على التزام بـ«السلام والنظام والحكم الرشيد»، وهي عبارة أساسية في الوثيقة الدستورية الأصلية لكندا عام 1867، قانون أمريكا الشمالية البريطانية (British North America Act)."},"questions":[{"type":"mc","q":{"en":"What key phrase from the British North America Act of 1867 do Canada’s institutions uphold?","fr":"Quelle expression clé de l’Acte de l’Amérique du Nord britannique de 1867 les institutions canadiennes préservent-elles?"},"options":{"en":["Life, Liberty and the Pursuit of Happiness","Peace, Order and Good Government","Liberty, Equality, Fraternity","Strong and Free"],"fr":["La vie, la liberté et la recherche du bonheur","La paix, l’ordre et le bon gouvernement","Liberté, égalité, fraternité","Fort et libre"]},"answer":1},{"type":"mc","q":{"en":"What was Canada’s original constitutional document in 1867?","fr":"Quel était le premier document constitutionnel du Canada, en 1867?"},"options":{"en":["The Quebec Act","Magna Carta","The British North America Act","The Charter of Rights and Freedoms"],"fr":["L’Acte de Québec","La Magna Carta","L’Acte de l’Amérique du Nord britannique","La Charte des droits et libertés"]},"answer":2},{"type":"mc","q":{"en":"In what year was the British North America Act passed?","fr":"En quelle année l’Acte de l’Amérique du Nord britannique a-t-il été adopté?"},"options":{"en":["1763","1867","1982","1604"],"fr":["1763","1867","1982","1604"]},"answer":1}]},{"id":"who-004","topic":"founding-peoples","importance":3,"en":"To understand what it means to be Canadian, it is important to know about our three founding peoples—Aboriginal, French and British.","en_simple":"Canada has 3 founding peoples: Aboriginal, French and British.","fr":"Pour comprendre ce que signifie être Canadien, il faut connaître nos trois peuples fondateurs : les Autochtones, les Français et les Britanniques.","tr":{"ar":"لفهم معنى أن تكون كنديًا، من المهم معرفة شعوبنا المؤسِّسة الثلاثة: الشعوب الأصلية والفرنسيون والبريطانيون."},"questions":[{"type":"mc","q":{"en":"Who were the founding peoples of Canada?","fr":"Qui sont les peuples fondateurs du Canada?"},"options":{"en":["Aboriginal, French and British","French, British and American","Aboriginal, Spanish and British","Métis, Inuit and French"],"fr":["Les Autochtones, les Français et les Britanniques","Les Français, les Britanniques et les Américains","Les Autochtones, les Espagnols et les Britanniques","Les Métis, les Inuits et les Français"]},"answer":0},{"type":"tf","q":{"en":"Canada has four founding peoples.","fr":"Le Canada compte quatre peuples fondateurs."},"answer":false}]},{"id":"who-005","topic":"aboriginal-origins","importance":3,"en":"The ancestors of Aboriginal peoples are believed to have migrated from Asia many thousands of years ago. They were well established here long before explorers from Europe first came to North America.","en_simple":"The ancestors of Aboriginal peoples came from Asia thousands of years ago, long before European explorers arrived.","fr":"On croit que les ancêtres des peuples autochtones sont venus d’Asie il y a plusieurs milliers d’années. Ils étaient établis ici bien avant l’arrivée des premiers explorateurs européens en Amérique du Nord.","tr":{"ar":"يُعتقد أن أسلاف الشعوب الأصلية هاجروا من آسيا قبل آلاف السنين، وكانوا مستقرين هنا قبل وصول المستكشفين الأوروبيين إلى أمريكا الشمالية بوقت طويل."},"questions":[{"type":"mc","q":{"en":"From where are the ancestors of Aboriginal peoples believed to have migrated?","fr":"D’où croit-on que les ancêtres des peuples autochtones sont venus?"},"options":{"en":["Europe","Africa","Asia","South America"],"fr":["D’Europe","D’Afrique","D’Asie","D’Amérique du Sud"]},"answer":2},{"type":"tf","q":{"en":"Aboriginal peoples were well established in Canada long before European explorers arrived.","fr":"Les peuples autochtones étaient établis au Canada bien avant l’arrivée des explorateurs européens."},"answer":true}]},{"id":"who-006","topic":"first-nations-culture","importance":1,"en":"Diverse, vibrant First Nations cultures were rooted in religious beliefs about their relationship to the Creator, the natural environment and each other.","en_simple":"First Nations cultures were based on religious beliefs about the Creator, nature and each other.","fr":"Les cultures vivantes et diversifiées des Premières Nations étaient enracinées dans des croyances religieuses liées à leur relation avec le Créateur, avec leur milieu naturel et avec les autres Autochtones.","tr":{"ar":"كانت ثقافات الأمم الأولى المتنوعة والنابضة بالحياة متجذرة في معتقدات دينية حول علاقتها بالخالق وبالبيئة الطبيعية وببعضها بعضًا."},"questions":[{"type":"mc","q":{"en":"First Nations cultures were rooted in religious beliefs about their relationship to the Creator, the natural environment and…","fr":"Les cultures des Premières Nations étaient enracinées dans des croyances religieuses liées à leur relation avec le Créateur, le milieu naturel et…"},"options":{"en":["the King","each other","the Church","the railway"],"fr":["le roi","les autres Autochtones","l’Église","le chemin de fer"]},"answer":1}]},{"id":"who-007","topic":"royal-proclamation","importance":3,"en":"Aboriginal and treaty rights are in the Canadian Constitution. Territorial rights were first guaranteed through the Royal Proclamation of 1763 by King George III, and established the basis for negotiating treaties with the newcomers—treaties that were not always fully respected.","en_simple":"The Royal Proclamation of 1763 by King George III first guaranteed Aboriginal territorial rights. It was the basis for treaties. Aboriginal and treaty rights are in the Constitution.","fr":"Les droits autochtones et les droits découlant de traités sont énoncés dans la Constitution canadienne. Les droits territoriaux ont été garantis pour la première fois par la Proclamation royale de 1763, du roi George III, qui établissait les bases de la négociation des traités avec les nouveaux arrivants – traités qui n’ont pas toujours été respectés.","tr":{"ar":"حقوق الشعوب الأصلية وحقوق المعاهدات منصوص عليها في الدستور الكندي. وقد ضُمنت الحقوق الإقليمية لأول مرة بالإعلان الملكي لعام 1763 الصادر عن الملك جورج الثالث (King George III)، الذي أرسى أساس التفاوض على المعاهدات مع الوافدين الجدد، وهي معاهدات لم تُحترم دائمًا بالكامل."},"questions":[{"type":"mc","q":{"en":"Which document first guaranteed Aboriginal territorial rights?","fr":"Quel document a garanti pour la première fois les droits territoriaux des Autochtones?"},"options":{"en":["The British North America Act of 1867","The Royal Proclamation of 1763","The Charter of Rights and Freedoms of 1982","Magna Carta of 1215"],"fr":["L’Acte de l’Amérique du Nord britannique de 1867","La Proclamation royale de 1763","La Charte des droits et libertés de 1982","La Magna Carta de 1215"]},"answer":1},{"type":"mc","q":{"en":"Who issued the Royal Proclamation of 1763?","fr":"Qui a émis la Proclamation royale de 1763?"},"options":{"en":["Queen Victoria","King George III","King Louis XIV","Queen Elizabeth II"],"fr":["La reine Victoria","Le roi George III","Le roi Louis XIV","La reine Elizabeth II"]},"answer":1},{"type":"tf","q":{"en":"Aboriginal and treaty rights are in the Canadian Constitution.","fr":"Les droits autochtones et les droits découlant de traités sont énoncés dans la Constitution canadienne."},"answer":true}]},{"id":"who-008","topic":"residential-schools","importance":3,"en":"From the 1800s until the 1980s, the federal government placed many Aboriginal children in residential schools to educate and assimilate them into mainstream Canadian culture. The schools were poorly funded and inflicted hardship on the students; some were physically abused. Aboriginal languages and cultural practices were mostly prohibited.","en_simple":"From the 1800s to the 1980s, the federal government put many Aboriginal children in residential schools to assimilate them. The schools were poorly funded, students suffered, and Aboriginal languages were mostly banned.","fr":"Des années 1800 jusqu’aux années 1980, le gouvernement fédéral a placé de nombreux enfants autochtones dans des pensionnats afin de les instruire et de les assimiler à la culture canadienne dominante. Ces écoles étaient mal financées et les élèves y vivaient dans la misère, certains étant même maltraités physiquement. Les langues et les pratiques culturelles autochtones y étaient pour la plupart interdites.","tr":{"ar":"من القرن التاسع عشر (1800s) حتى ثمانينيات القرن العشرين، وضعت الحكومة الفيدرالية كثيرًا من أطفال الشعوب الأصلية في مدارس داخلية لتعليمهم ودمجهم في الثقافة الكندية السائدة. كانت المدارس ضعيفة التمويل وسببت معاناة للطلاب، وتعرض بعضهم للإيذاء الجسدي. وكانت لغات الشعوب الأصلية وممارساتها الثقافية محظورة في معظمها."},"questions":[{"type":"mc","q":{"en":"During what period did the federal government place Aboriginal children in residential schools?","fr":"Pendant quelle période le gouvernement fédéral a-t-il placé des enfants autochtones dans des pensionnats?"},"options":{"en":["From the 1600s until the 1700s","From the 1800s until the 1980s","From 1945 until 2008","From 1763 until 1867"],"fr":["Des années 1600 jusqu’aux années 1700","Des années 1800 jusqu’aux années 1980","De 1945 jusqu’en 2008","De 1763 jusqu’en 1867"]},"answer":1},{"type":"mc","q":{"en":"What was the purpose of residential schools?","fr":"Quel était le but des pensionnats?"},"options":{"en":["To teach Aboriginal languages","To train soldiers","To educate and assimilate Aboriginal children into mainstream Canadian culture","To prepare children for farming"],"fr":["Enseigner les langues autochtones","Former des soldats","Instruire les enfants autochtones et les assimiler à la culture canadienne dominante","Préparer les enfants à l’agriculture"]},"answer":2},{"type":"tf","q":{"en":"In residential schools, Aboriginal languages and cultural practices were encouraged.","fr":"Dans les pensionnats, les langues et les pratiques culturelles autochtones étaient encouragées."},"answer":false}]},{"id":"who-009","topic":"residential-schools","importance":3,"en":"In 2008, Ottawa formally apologized to the former students of residential schools.","en_simple":"In 2008, the federal government (Ottawa) officially apologized to former residential school students.","fr":"En 2008, Ottawa a présenté des excuses officielles à tous les anciens élèves des pensionnats indiens.","tr":{"ar":"في عام 2008، قدّمت أوتاوا اعتذارًا رسميًا للطلاب السابقين في المدارس الداخلية."},"questions":[{"type":"mc","q":{"en":"In what year did Ottawa formally apologize to former residential school students?","fr":"En quelle année Ottawa a-t-il présenté des excuses officielles aux anciens élè
